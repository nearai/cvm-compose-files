name: Validate Compose Files

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy deploy-time values so `${VAR:?...}` guards do not trip `docker compose config`.
  HOST_IP: 127.0.0.1
  MONITORING_INGEST_TOKEN: ci-dummy
  CVM_NAME: compose-manager
  CVM_HOST: ci
  DD_HOSTNAME: ci-compose-manager
  ENV: prod
  HUGGING_FACE_HUB_TOKEN: ci-dummy
  CLOUD_API_USAGE_TOKEN: ci-dummy
  MODEL_PROXY_TOKEN: ci-dummy
  PROXY_TOKEN: ci-dummy
  WEB_CONTEXT_SEARCH_URL: http://ci-dummy
  WEB_CONTEXT_SEARCH_API_KEY: ci-dummy
  FUSION_ENABLED: "true"
  FUSION_INTERNAL_BEARER_TOKEN: ci-dummy

jobs:
  validate:
    # Same-repo pushes/PRs use the dedicated runner; fork PRs fall back to GitHub-hosted.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","ci-cvm-validate"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ruby contract validators
        run: |
          set -e
          for script in validate_otel_labels validate_proxy_dependencies validate_proxy_environment \
                        validate_registrar_auth validate_rotate_compose_manager_token validate_glm53_dcgm_metrics; do
            echo "::group::$script"
            docker run --rm -v "$PWD:/repo:ro" -w /repo ruby:3.3-alpine ruby "scripts/$script.rb"
            echo "::endgroup::"
          done

      - name: Validate public metrics isolation
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo python:3.12-slim \
            python3 scripts/validate_public_metrics.py

      # Runs on the host so it can start its pinned nginx sibling container.
      - name: Validate streaming HTTP/2 keepalive contracts
        run: python3 scripts/validate_streaming_keepalive.py

      - name: Validate docker compose files
        run: |
          exit_code=0
          for file in prod/*.yaml; do
            if docker compose -f "$file" config --format=yaml > /dev/null 2>&1; then
              echo "$file OK"
            else
              echo "::error file=$file::Invalid compose file"
              docker compose -f "$file" config --format=yaml || true
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Validate embedded OTel collector configs
        run: |
          set -euo pipefail
          for file in prod/*.yaml; do
            rendered="$(docker compose -f "$file" config --format=json)"
            config="$(jq -r '.configs.otelcol_app_config.content // empty' <<<"$rendered")"
            [ -n "$config" ] || continue
            image="$(jq -r '.services["otelcol-contrib"].image' <<<"$rendered")"
            echo "Validating embedded OTel config in $file with $image..."
            printf '%s' "$config" | docker run --rm -i "$image" validate --config=/dev/stdin
          done
