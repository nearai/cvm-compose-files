name: Validate Qwen multimodal CPU mitigation
on:
  push:
    paths:
      - 'docker/sglang-qwen36-mm-cpu/**'
      - 'scripts/qwen_qualify.py'
      - '.github/workflows/validate-qwen-mm-cpu.yaml'
  pull_request:
    paths:
      - 'docker/sglang-qwen36-mm-cpu/**'
      - 'scripts/qwen_qualify.py'
      - '.github/workflows/validate-qwen-mm-cpu.yaml'
permissions:
  contents: read
jobs:
  preprocessing:
    runs-on: [self-hosted, infra]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build pinned image and run exact-source regressions
        run: |
          set -euo pipefail
          docker build --network none \
            --iidfile "$RUNNER_TEMP/qwen-mm-image.id" \
            docker/sglang-qwen36-mm-cpu
      - name: Real processor and concurrent decoder smoke without GPUs
        run: |
          set -euo pipefail
          qwen_mm_image=$(< "$RUNNER_TEMP/qwen-mm-image.id")
          qwen_mm_cache=$(mktemp -d "$RUNNER_TEMP/qwen-mm-cache.XXXXXX")
          docker run --rm --read-only --cpus 4 --memory 8g \
            --tmpfs /tmp:rw,size=1g --tmpfs /root/.cache:rw,size=1g \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e TRITON_CACHE_DIR=/tmp/triton \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$qwen_mm_cache:/root/.cache/huggingface" \
            --entrypoint python3 "$qwen_mm_image" \
            /repo/docker/sglang-qwen36-mm-cpu/test_media.py
