name: Publish Qwen SGLang admin key images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant to build
        required: true
        type: choice
        options:
          - qwen36-v0516
          - qwen38-c4271c3f
      source_revision:
        description: Exact merged commit on main containing the build context
        required: true
        type: string

concurrency:
  group: publish-sglang-qwen-admin-auth-${{ inputs.variant }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_REPOSITORY: nearaidev/sglang
  BUILD_CONTEXT: docker/sglang-qwen-admin-auth

jobs:
  publish:
    runs-on: [self-hosted, infra]
    timeout-minutes: 120
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve variant
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            qwen36-v0516)
              echo 'BASE_IMAGE=lmsysorg/sglang:v0.5.16-cu129@sha256:984699c298a95b73c469b2191403ddc85fd780506e13c39c4afff3845e27bc6c' >> "$GITHUB_ENV"
              echo 'BASE_DIGEST=sha256:984699c298a95b73c469b2191403ddc85fd780506e13c39c4afff3845e27bc6c' >> "$GITHUB_ENV"
              echo 'PATCH_FILE=admin-auth-redaction-v0.5.16.diff' >> "$GITHUB_ENV"
              echo 'SGLANG_SOURCE_REVISION=fdebc938f7f4d16fe6b9f55dcd9a767cf0899ea1' >> "$GITHUB_ENV"
              echo 'IMAGE_TAG=qwen36-v0516-admin-auth-v1' >> "$GITHUB_ENV"
              ;;
            qwen38-c4271c3f)
              echo 'BASE_IMAGE=lmsysorg/sglang@sha256:febfb971c7352570fc445c466ebd6ffc9d896024958e544a60f2137fd85856b1' >> "$GITHUB_ENV"
              echo 'BASE_DIGEST=sha256:febfb971c7352570fc445c466ebd6ffc9d896024958e544a60f2137fd85856b1' >> "$GITHUB_ENV"
              echo 'PATCH_FILE=admin-auth-redaction-c4271c3f.diff' >> "$GITHUB_ENV"
              echo 'SGLANG_SOURCE_REVISION=c4271c3fe1262fc2adbd162c33b25de5255251c5' >> "$GITHUB_ENV"
              echo 'IMAGE_TAG=qwen38-c4271c3f-admin-auth-v1' >> "$GITHUB_ENV"
              ;;
            *) echo 'Unknown variant' >&2; exit 1 ;;
          esac

      - name: Check out merged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0

      - name: Validate inputs and checksums
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          REGISTRY_USER: ${{ vars.DOCKER_REGISTRY_USER }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          test "$REGISTRY_USER" = nearaidev
          (cd "$BUILD_CONTEXT" && sha256sum --check --strict SHA256SUMS)
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push with provenance and SBOM
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          docker buildx build --pull --platform linux/amd64 \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "PATCH_FILE=$PATCH_FILE" \
            --build-arg "BUILD_SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SGLANG_SOURCE_REVISION=$SGLANG_SOURCE_REVISION" \
            --provenance=mode=max --sbom=true \
            --metadata-file build-metadata.json --tag "$IMAGE_REF" --push "$BUILD_CONTEXT"
          DIGEST=$(jq -r '."containerimage.digest" // empty' build-metadata.json)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_IMMUTABLE_REF=${REGISTRY}/${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Verify published image identity
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_IMMUTABLE_REF"
          docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE_IMMUTABLE_REF" > image-config.json
          jq -e --arg source_revision "$SOURCE_REVISION" --arg base_image "$BASE_IMAGE" \
            --arg sglang_revision "$SGLANG_SOURCE_REVISION" '
              .config.Labels["org.opencontainers.image.revision"] == $source_revision and
              .config.Labels["org.opencontainers.image.base.name"] == $base_image and
              .config.Labels["nearai.build.recipe"] == "docker/sglang-qwen-admin-auth/Dockerfile" and
              .config.Labels["nearai.build.source_revision"] == $source_revision and
              .config.Labels["nearai.sglang.source_revision"] == $sglang_revision and
              .config.Labels["nearai.sglang.admin_auth_redaction"] == "v1-upstream-41322-48518"' image-config.json

      - name: Verify BuildKit provenance and SBOM
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --format '{{json .Provenance.SLSA}}' "$IMAGE_IMMUTABLE_REF" > buildkit-provenance.json
          jq -e --arg revision "$SOURCE_REVISION" --arg digest "${BASE_DIGEST#sha256:}" --arg context "$BUILD_CONTEXT" '
            .buildType == "https://mobyproject.org/buildkit@v1" and
            .metadata.buildStartedOn != null and .metadata.buildFinishedOn != null and
            .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs["sourc\u0065"] == "https://github.com/nearai/cvm-compose-files" and
            .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.revision == $revision and
            .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs["localdir:context"] == $context and
            any(.materials[]; .digest.sha256 == $digest and (.uri | contains("lmsysorg/sglang")))' buildkit-provenance.json
          docker buildx imagetools inspect --format '{{json .SBOM.SPDX}}' "$IMAGE_IMMUTABLE_REF" > sbom.spdx.json
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | length > 0)' sbom.spdx.json

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Install pinned GitHub CLI
        env:
          GH_CLI_VERSION: 2.100.0
          GH_CLI_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" --output "$archive"
          echo "$GH_CLI_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Verify GitHub build attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_ID"
          test -s "$ATTESTATION_BUNDLE"
          gh attestation verify "oci://$IMAGE_IMMUTABLE_REF" --repo nearai/cvm-compose-files > github-attestation-verification.txt
          cp "$ATTESTATION_BUNDLE" github-attestation.bundle.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify immutable digest
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_IMMUTABLE_REF"
          for attempt in $(seq 1 30); do
            if cosign verify --certificate-identity \
              'https://github.com/nearai/cvm-compose-files/.github/workflows/publish-sglang-qwen-admin-auth.yaml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$IMAGE_IMMUTABLE_REF" > cosign-verification.json; then
              exit 0
            fi
            test "$attempt" -lt 30 || exit 1
            sleep 10
          done

      - name: Retain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.variant }}-image-evidence
          path: |
            build-metadata.json
            image-config.json
            buildkit-provenance.json
            sbom.spdx.json
            github-attestation.bundle.json
            github-attestation-verification.txt
            cosign-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        run: |
          {
            echo '## Qwen SGLang admin key image'
            echo "- Tag: $IMAGE_REF"
            echo "- Immutable image: $IMAGE_IMMUTABLE_REF"
            echo "- SGLang revision: $SGLANG_SOURCE_REVISION"
            echo '- Pin the digest in a separate change to deploy it.'
          } >> "$GITHUB_STEP_SUMMARY"
