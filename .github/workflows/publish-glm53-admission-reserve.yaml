name: Publish GLM-5.3 admission-reserve engine images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which derivative to build
        required: true
        type: choice
        options:
          - base
          - hicache
          - base-clamp
          - hicache-clamp
          - w4afp8
          - hicache-w4afp8
      tag:
        description: Docker Hub tag; empty derives the per-variant default (glm53-admission-reserve-v10, glm53-hicache-admission-reserve-v10, glm53-pool-clamp-v1, glm53-hicache-pool-clamp-v1, glm53-w4afp8-pool-clamp-v1, glm53-hicache-w4afp8-v4)
        required: false
        type: string
        default: ''
      source_revision:
        description: Exact merged commit on main containing the build context
        required: true
        type: string
      resume_digest:
        description: Existing digest for a failed post-build run; must match the tag
        required: false
        type: string
        default: ''

concurrency:
  group: publish-glm53-admission-reserve-${{ inputs.variant }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_REPOSITORY: ${{ vars.DOCKER_REGISTRY_USER }}/sglang

jobs:
  publish:
    name: Build, scan, attest, and publish
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    runs-on: [self-hosted, infra]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve variant
        env:
          VARIANT: ${{ inputs.variant }}
          IMAGE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_TAG_INPUT" == *$'\n'* || "$IMAGE_TAG_INPUT" == *$'\r'* ]]; then
            echo "Docker tag must not contain newlines" >&2
            exit 1
          fi
          if [[ -n "$IMAGE_TAG_INPUT" && ! "$IMAGE_TAG_INPUT" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $IMAGE_TAG_INPUT" >&2
            exit 1
          fi
          case "$VARIANT" in
            base)
              echo "BUILD_CONTEXT=docker/sglang-glm53-admission-reserve" >> "$GITHUB_ENV"
              echo "BASE_DIGEST=sha256:a7b7136abcf5e07522289d96e96fec9b42a1a30f9dfda57e957f142680d2d67b" >> "$GITHUB_ENV"
              echo "EXPECTED_DOCKERFILE_SHA256=7dbfd0d4c5e0d08e3475123cd33ee229b02e1f32424b9c6b780dc930775481ce" >> "$GITHUB_ENV"
              echo "EXPECTED_PROVENANCE_SHA256=75b09bf384bd4cc1227cc117e142465b5d858340dc0093e27c398337a173c74b" >> "$GITHUB_ENV"
              echo "EXPECTED_SHA256SUMS_SHA256=98ac47b1d578fb4fa010ff00288c7a5abc48dfaf76551a219bc941fb1cdf4ebc" >> "$GITHUB_ENV"
              echo "TEST_SCRIPT=/usr/share/nearai/glm53-admission-reserve/test-cpu.sh" >> "$GITHUB_ENV"
              echo "EVIDENCE_PREFIX=glm53-admission-reserve-base" >> "$GITHUB_ENV"
              DEFAULT_TAG=glm53-admission-reserve-v10
              ;;
            hicache)
              echo "BUILD_CONTEXT=docker/sglang-glm53-hicache-admission-reserve" >> "$GITHUB_ENV"
              echo "BASE_DIGEST=sha256:01f44c790d43b3eae136f5f3bc930599947bd37fcea081d2dbd3271ff4fc3f8a" >> "$GITHUB_ENV"
              echo "EXPECTED_DOCKERFILE_SHA256=60ef2a36afad8582f1fb93a86aba620878bbc204c94ec41f6d56ff942368d12d" >> "$GITHUB_ENV"
              echo "EXPECTED_PROVENANCE_SHA256=dc9422da220cd68306218182eaafaea04148f27acbfddd6f02eba5917ce01ffc" >> "$GITHUB_ENV"
              echo "EXPECTED_SHA256SUMS_SHA256=56f51d583d52cce64c33121b99cfb751f22bc6db35d530aed60f376948c0a487" >> "$GITHUB_ENV"
              echo "TEST_SCRIPT=/usr/share/nearai/glm53-hicache-admission-reserve/test-cpu.sh" >> "$GITHUB_ENV"
              echo "EVIDENCE_PREFIX=glm53-admission-reserve-hicache" >> "$GITHUB_ENV"
              DEFAULT_TAG=glm53-hicache-admission-reserve-v10
              ;;
            base-clamp)
              echo "BUILD_CONTEXT=docker/sglang-glm53-pool-clamp" >> "$GITHUB_ENV"
              echo "BASE_DIGEST=sha256:e9d29a1cb1cd65284392c4d62d5f2a36669628057e15c60fe93ea40cfe4fc7e7" >> "$GITHUB_ENV"
              echo "EXPECTED_DOCKERFILE_SHA256=2437f0f7e82c4c61de2cc58e05f6354938c2ec498c1cc4eed45eb395393ab3c3" >> "$GITHUB_ENV"
              echo "EXPECTED_PROVENANCE_SHA256=b989f6d60ac41e73b586dfee6833549bd4f970c7bd0110d53d54b0d1d4b6331a" >> "$GITHUB_ENV"
              echo "EXPECTED_SHA256SUMS_SHA256=d477167eef5ecc19df03caae450a291492720f84e8f6c8c0ab2f7bfc74573b55" >> "$GITHUB_ENV"
              echo "TEST_SCRIPT=/usr/share/nearai/glm53-pool-clamp/test-cpu.sh" >> "$GITHUB_ENV"
              echo "EVIDENCE_PREFIX=glm53-pool-clamp-base" >> "$GITHUB_ENV"
              DEFAULT_TAG=glm53-pool-clamp-v1
              ;;
            hicache-clamp)
              echo "BUILD_CONTEXT=docker/sglang-glm53-hicache-pool-clamp" >> "$GITHUB_ENV"
              echo "BASE_DIGEST=sha256:3eccc30709f5719c81084d1264f03ca5354b3059ec4cff62f0c5ff88c309680c" >> "$GITHUB_ENV"
              echo "EXPECTED_DOCKERFILE_SHA256=a875e5177283fbb35d3742fc3d4b99d06299775bd68299cc42818f3701dda820" >> "$GITHUB_ENV"
              echo "EXPECTED_PROVENANCE_SHA256=1ea054b27f0501962a35077318018a562e226430668a5d8c0255be1d86f7ad73" >> "$GITHUB_ENV"
              echo "EXPECTED_SHA256SUMS_SHA256=8f3562ac2455e9735d15f7440690f47da4e5c7143c4d190beb0ec8f8b32aaedf" >> "$GITHUB_ENV"
              echo "TEST_SCRIPT=/usr/share/nearai/glm53-hicache-pool-clamp/test-cpu.sh" >> "$GITHUB_ENV"
              echo "EVIDENCE_PREFIX=glm53-pool-clamp-hicache" >> "$GITHUB_ENV"
              DEFAULT_TAG=glm53-hicache-pool-clamp-v1
              ;;
            w4afp8)
              echo "BUILD_CONTEXT=docker/sglang-glm53-w4afp8" >> "$GITHUB_ENV"
              echo "BASE_DIGEST=sha256:e9d29a1cb1cd65284392c4d62d5f2a36669628057e15c60fe93ea40cfe4fc7e7" >> "$GITHUB_ENV"
              echo "EXPECTED_DOCKERFILE_SHA256=00264d7171eb3600ef1186930a514b81c5a00f735e430190fffc6efa4fe742e5" >> "$GITHUB_ENV"
              echo "EXPECTED_PROVENANCE_SHA256=6aafde8fb4d86505994c9732546f50b29de10454e7d806bc3ddb0e79d38433f3" >> "$GITHUB_ENV"
              echo "EXPECTED_SHA256SUMS_SHA256=a1cb2cfb616cc732912ec445a37805e8aa47bdbe1542ec0d2c4b9688434a4343" >> "$GITHUB_ENV"
              echo "TEST_SCRIPT=/usr/share/nearai/glm53-w4afp8/test-cpu.sh" >> "$GITHUB_ENV"
              echo "EVIDENCE_PREFIX=glm53-w4afp8-pool-clamp" >> "$GITHUB_ENV"
              DEFAULT_TAG=glm53-w4afp8-pool-clamp-v1
              ;;
            hicache-w4afp8)
              echo "BUILD_CONTEXT=docker/sglang-glm53-hicache-w4afp8" >> "$GITHUB_ENV"
              echo "BASE_DIGEST=sha256:3eccc30709f5719c81084d1264f03ca5354b3059ec4cff62f0c5ff88c309680c" >> "$GITHUB_ENV"
              echo "EXPECTED_DOCKERFILE_SHA256=327e2f627a9559b2a27caef196b2bf67efbe11f334f3c16231593d3a9b9528aa" >> "$GITHUB_ENV"
              echo "EXPECTED_PROVENANCE_SHA256=e17879fd6d3a07634d96e7f4584fe31d38145cfea6e6e9cb54f3acf5966aed92" >> "$GITHUB_ENV"
              echo "EXPECTED_SHA256SUMS_SHA256=d739f5552bf77d4aba224015fc6652601e2f5cb41165fa9cad58914bb56de3b2" >> "$GITHUB_ENV"
              echo "TEST_SCRIPT=/usr/share/nearai/glm53-hicache-w4afp8/test-cpu.sh" >> "$GITHUB_ENV"
              echo "EVIDENCE_PREFIX=glm53-hicache-w4afp8" >> "$GITHUB_ENV"
              DEFAULT_TAG=glm53-hicache-w4afp8-v4
              ;;
            *)
              echo "Unknown variant: $VARIANT" >&2
              exit 1
              ;;
          esac
          if [[ -n "$IMAGE_TAG_INPUT" ]]; then
            echo "IMAGE_TAG=$IMAGE_TAG_INPUT" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$DEFAULT_TAG" >> "$GITHUB_ENV"
          fi

      - name: Check out the merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0

      - name: Validate release inputs and pinned provenance
        env:
          RESUME_DIGEST: ${{ inputs.resume_digest }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $IMAGE_TAG" >&2
            exit 1
          fi
          if [[ -n "$RESUME_DIGEST" && ! "$RESUME_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid resume digest: $RESUME_DIGEST" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Source revision must be an exact 40-character commit" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main

          test "$(sha256sum "$BUILD_CONTEXT/Dockerfile" | awk '{print $1}')" = "$EXPECTED_DOCKERFILE_SHA256"
          test "$(sha256sum "$BUILD_CONTEXT/PROVENANCE" | awk '{print $1}')" = "$EXPECTED_PROVENANCE_SHA256"
          test "$(sha256sum "$BUILD_CONTEXT/SHA256SUMS" | awk '{print $1}')" = "$EXPECTED_SHA256SUMS_SHA256"

          echo "IMAGE_REF=${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push with provenance and SBOM
        if: inputs.resume_digest == ''
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --build-arg "BUILD_SOURCE_REVISION=$SOURCE_REVISION" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file build-metadata.json \
            --tag "$IMAGE_REF" \
            --push \
            "$BUILD_CONTEXT"
          DIGEST=$(jq -r '."containerimage.digest" // empty' build-metadata.json)
          test -n "$DIGEST"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_IMMUTABLE_REF=${REGISTRY}/${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Resume exact published digest
        if: inputs.resume_digest != ''
        env:
          RESUME_DIGEST: ${{ inputs.resume_digest }}
        run: |
          set -euo pipefail
          TAG_DIGEST="sha256:$(docker buildx imagetools inspect \
            --raw \
            "$IMAGE_REF" | sha256sum | awk '{print $1}')"
          if [[ "$TAG_DIGEST" != "$RESUME_DIGEST" ]]; then
            echo "Tag digest $TAG_DIGEST does not match requested resume digest $RESUME_DIGEST" >&2
            exit 1
          fi
          jq -n \
            --arg digest "$RESUME_DIGEST" \
            '{"containerimage.digest": $digest, "nearai.resume": true}' \
            > build-metadata.json
          echo "IMAGE_DIGEST=$RESUME_DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_IMMUTABLE_REF=${REGISTRY}/${IMAGE_REPOSITORY}@${RESUME_DIGEST}" >> "$GITHUB_ENV"

      - name: Verify published image identity
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_IMMUTABLE_REF"
          docker buildx imagetools inspect \
            --format '{{json .Image}}' \
            "$IMAGE_IMMUTABLE_REF" > image-config.json

          LABEL_CHECK='.config.Labels["org.opencontainers.image.source"] == "https://github.com/nearai/cvm-compose-files" and
             .config.Labels["org.opencontainers.image.revision"] == $source_revision and
             .config.Labels["org.opencontainers.image.base.digest"] == $base_digest and
             .config.Labels["nearai.build.recipe"] == ($build_context + "/Dockerfile") and
             .config.Labels["nearai.build.source_revision"] == $source_revision and
             .config.Labels["nearai.sglang.source_revision"] == "fc91d2403cc210a86bd5fc715c6609f58c932e5a" and
             .config.Labels["nearai.sglang.admission_reserve"] == "v10" and
             .config.Labels["nearai.sglang.admission_reserve_revision"] == "fb944723035d6c8b8135fd3c6ffbdc21a4615409"'
          if [[ "$VARIANT" == "hicache" || "$VARIANT" == "hicache-clamp" || "$VARIANT" == "hicache-w4afp8" ]]; then
            LABEL_CHECK="$LABEL_CHECK"' and
             .config.Labels["nearai.sglang.hicache_fix_revision"] == "230102db838cbbe6eca7952c729518ee6d93c3a9" and
             .config.Labels["nearai.sglang.pooled_transfers"] == "v1-opt-in" and
             .config.Labels["nearai.sglang.hcc_host_memory"] == "v4-cuda-hostalloc-opt-in" and
             .config.Labels["nearai.sglang.hcc_managed_memory"] == "v3-host-prefetch-opt-in"'
          fi
          if [[ "$VARIANT" == "base-clamp" || "$VARIANT" == "hicache-clamp" || "$VARIANT" == "w4afp8" || "$VARIANT" == "hicache-w4afp8" ]]; then
            LABEL_CHECK="$LABEL_CHECK"' and
             .config.Labels["nearai.sglang.chunked_prefill_pool_clamp"] == "v1"'
          fi
          if [[ "$VARIANT" == "w4afp8" || "$VARIANT" == "hicache-w4afp8" ]]; then
            LABEL_CHECK="$LABEL_CHECK"' and
             .config.Labels["nearai.sglang.w4afp8_loader_patch"] == "modules-to-not-convert-v1"'
          fi

          jq -e --arg source_revision "$SOURCE_REVISION" \
            --arg base_digest "$BASE_DIGEST" \
            --arg build_context "$BUILD_CONTEXT" \
            "$LABEL_CHECK" \
            image-config.json

      - name: Run CPU admission-reserve regressions in the published image
        run: |
          set -euo pipefail
          docker run --rm --runtime=runc --network=none --memory=16g \
            --entrypoint=bash "$IMAGE_IMMUTABLE_REF" \
            "$TEST_SCRIPT" | tee cpu-tests.txt

      - name: Verify embedded BuildKit provenance and SBOM
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            --format '{{json .Provenance.SLSA}}' \
            "$IMAGE_IMMUTABLE_REF" > buildkit-provenance.json
          BASE_DIGEST_HEX="${BASE_DIGEST#sha256:}"
          jq -e --arg source_revision "$SOURCE_REVISION" \
            --arg base_digest_hex "$BASE_DIGEST_HEX" \
            --arg build_context "$BUILD_CONTEXT" \
            '.buildType == "https://mobyproject.org/buildkit@v1" and
             .metadata.buildStartedOn != null and
             .metadata.buildFinishedOn != null and
             .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.source == "https://github.com/nearai/cvm-compose-files" and
             .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.revision == $source_revision and
             .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs["localdir:context"] == $build_context and
             any(.materials[];
               .digest.sha256 == $base_digest_hex and
               (.uri | contains("nearaidev/sglang")))' \
            buildkit-provenance.json

          docker buildx imagetools inspect \
            --format '{{json .SBOM.SPDX}}' \
            "$IMAGE_IMMUTABLE_REF" > sbom.spdx.json
          jq -e \
            '(.spdxVersion | startswith("SPDX-")) and (.packages | length > 0)' \
            sbom.spdx.json

      - name: Scan the published digest
        env:
          TRIVY_USERNAME: ${{ vars.DOCKER_REGISTRY_USER }}
          TRIVY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/glm53-trivy-cache"
          TRIVY_CONTAINER="glm53-trivy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TRIVY_BINARY="$RUNNER_TEMP/glm53-trivy-cache/trivy"
          trap 'docker rm -f "$TRIVY_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker create \
            --name "$TRIVY_CONTAINER" \
            docker.io/aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            >/dev/null
          docker cp "$TRIVY_CONTAINER:/usr/local/bin/trivy" "$TRIVY_BINARY"
          docker rm "$TRIVY_CONTAINER" >/dev/null
          trap - EXIT
          test "$(sha256sum "$TRIVY_BINARY" | awk '{print $1}')" = \
            379d59f24a4a828c55de5f0b91b6805cc35d13580180b658820e648611256166
          TRIVY_NO_PROGRESS=true "$TRIVY_BINARY" image \
            --cache-dir "$RUNNER_TEMP/glm53-trivy-cache" \
            --scanners vuln \
            --timeout 20m \
            --skip-version-check \
            --format json \
            --output "$GITHUB_WORKSPACE/trivy-results.json" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            "$IMAGE_IMMUTABLE_REF"

      - name: Summarize vulnerability scan
        run: |
          set -euo pipefail
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          echo "TRIVY_HIGH=$HIGH" >> "$GITHUB_ENV"
          echo "TRIVY_CRITICAL=$CRITICAL" >> "$GITHUB_ENV"

      - name: Retain pre-signing supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.EVIDENCE_PREFIX }}-image-evidence
          path: |
            build-metadata.json
            buildkit-provenance.json
            image-config.json
            sbom.spdx.json
            trivy-results.json
            cpu-tests.txt
          if-no-files-found: error
          retention-days: 30

      - name: Reject fixable critical vulnerabilities
        run: |
          set -euo pipefail
          if (( TRIVY_CRITICAL > 0 )); then
            echo "Refusing to attest or sign an image with $TRIVY_CRITICAL fixable critical vulnerabilities" >&2
            exit 1
          fi

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Install pinned GitHub CLI with attestation support
        env:
          GH_CLI_VERSION: 2.100.0
          GH_CLI_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$GH_CLI_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" version
          echo "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Verify GitHub build attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_ID"
          test -s "$ATTESTATION_BUNDLE"
          gh attestation verify \
            "oci://$IMAGE_IMMUTABLE_REF" \
            --repo nearai/cvm-compose-files \
            > github-attestation-verification.txt
          cp "$ATTESTATION_BUNDLE" github-attestation.bundle.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the immutable digest
        run: cosign sign --yes "$IMAGE_IMMUTABLE_REF"

      - name: Verify signature
        run: |
          set -euo pipefail
          verification_file="$(mktemp)"
          trap 'rm -f "$verification_file"' EXIT
          for attempt in $(seq 1 30); do
            if cosign verify \
              --certificate-identity \
              'https://github.com/nearai/cvm-compose-files/.github/workflows/publish-glm53-admission-reserve.yaml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$IMAGE_IMMUTABLE_REF" > "$verification_file"; then
              mv "$verification_file" cosign-verification.json
              trap - EXIT
              exit 0
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Signature was not visible after 30 verification attempts" >&2
              exit 1
            fi
            echo "Signature not visible yet; retrying in 10 seconds ($attempt/30)" >&2
            sleep 10
          done

      - name: Retain verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.EVIDENCE_PREFIX }}-verification
          path: |
            cosign-verification.json
            github-attestation.bundle.json
            github-attestation-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          {
            echo '## GLM-5.3 admission-reserve engine image'
            echo
            echo "- variant: \`${{ inputs.variant }}\`"
            echo "- tag: \`$IMAGE_REF\`"
            echo "- immutable: \`$IMAGE_IMMUTABLE_REF\`"
