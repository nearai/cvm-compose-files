name: Publish DS4.1-Flash LoRA vLLM image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Hub tag; production must use the resulting digest
        required: true
        type: string
        default: dsv41-lora-v0.33.0-near-v1
      source_revision:
        description: Exact merged commit on main containing the build context
        required: true
        type: string
      resume_digest:
        description: Existing digest for a failed post-build run; must match the tag
        required: false
        type: string
        default: ''

concurrency:
  group: publish-vllm-dsv41-v033-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_REPOSITORY: ${{ vars.DOCKER_REGISTRY_USER }}/vllm
  BUILD_CONTEXT: docker/vllm-dsv41-v033

jobs:
  publish:
    name: Build, scan, attest, and publish
    permissions:
      contents: read
      attestations: write
      id-token: write
    runs-on: ubuntu_large_x64
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0

      - name: Validate tag and source provenance
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          RESUME_DIGEST: ${{ inputs.resume_digest }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $IMAGE_TAG" >&2
            exit 1
          fi
          if [[ -n "$RESUME_DIGEST" && ! "$RESUME_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid resume digest: $RESUME_DIGEST" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Source revision must be an exact 40-character commit: $SOURCE_REVISION" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          test "$(sha256sum "$BUILD_CONTEXT/Dockerfile" | awk '{print $1}')" = \
            a4664c64a5a7204260ad4d116da1876e0ffb4a1b9246e38a6ad98abab15a5b57
          (cd "$BUILD_CONTEXT" && grep '^patch=' PROVENANCE | while read -r l; do
            f=${l#patch=}; f=${f%% *}; h=${l##*sha256:}
            echo "$h  $f"; done | sha256sum --check --strict)
          grep -Fxq \
            'base_image=vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e' \
            "$BUILD_CONTEXT/PROVENANCE"
          grep -Fxq \
            'model_revision=1bae0e1088993b9b82de08f59de5be5a34e42170' \
            "$BUILD_CONTEXT/PROVENANCE"
          grep -Fxq \
            'adapter_revision=196c06e3c2aad43e9688d16fa993b4333f69358a' \
            "$BUILD_CONTEXT/PROVENANCE"
          grep -Fxq \
            'security_upgrades=linux-libc-dev 6.8.0-149.149 (noble-security); python packages none (base certifi 2026.10.23, pip 26.2.2, uv 0.13.6)' \
            "$BUILD_CONTEXT/PROVENANCE"
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push with SBOM
        if: inputs.resume_digest == ''
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --provenance=mode=max,version=v0.2 \
            --sbom=true \
            --metadata-file build-metadata.json \
            --tag "$IMAGE_REF" \
            --push \
            "$BUILD_CONTEXT"
          DIGEST=$(jq -r '."containerimage.digest" // empty' build-metadata.json)
          test -n "$DIGEST"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_IMMUTABLE_REF=${REGISTRY}/${IMAGE_REPOSITORY}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Resume exact published digest
        if: inputs.resume_digest != ''
        env:
          RESUME_DIGEST: ${{ inputs.resume_digest }}
        run: |
          set -euo pipefail
          TAG_DIGEST="sha256:$(docker buildx imagetools inspect \
            --raw \
            "$IMAGE_REF" | sha256sum | awk '{print $1}')"
          if [[ "$TAG_DIGEST" != "$RESUME_DIGEST" ]]; then
            echo "Tag digest $TAG_DIGEST does not match requested resume digest $RESUME_DIGEST" >&2
            exit 1
          fi
          jq -n \
            --arg digest "$RESUME_DIGEST" \
            '{"containerimage.digest": $digest, "nearai.resume": true}' \
            > build-metadata.json
          echo "IMAGE_DIGEST=$RESUME_DIGEST" >> "$GITHUB_ENV"
          echo "IMAGE_IMMUTABLE_REF=${REGISTRY}/${IMAGE_REPOSITORY}@${RESUME_DIGEST}" >> "$GITHUB_ENV"

      - name: Verify published manifest and labels
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_IMMUTABLE_REF"
          docker buildx imagetools inspect \
            --format '{{json .Image}}' \
            "$IMAGE_IMMUTABLE_REF" > image-config.json
          jq -e \
            '.config.Labels["nearai.vllm.base"] == "vllm/vllm-openai:v0.33.0" and
             .config.Labels["nearai.vllm.dsv41_supports_lora_patch_sha256"] == "a4ff8a08bd1aade5bb108af3b15fb163a0edd3f80af1dff81eca414c33bd988f" and
             .config.Labels["nearai.vllm.moe_lora_only_when_targeted_patch_sha256"] == "60374d690ace180c8084ef22f489419dfc98edb720f224afd5c648c41ba07899" and
             .config.Labels["nearai.vllm.decoder_replay_lora_rows_patch_sha256"] == "065be72658ef5a9b58f2f76b5d7aef49c63aa0e51ba785b2854411dd11ae6640" and
             .config.Labels["nearai.security.linux_libc_dev"] == "6.8.0-149.149"' \
            image-config.json

      # Normalize current SLSA v1 and older v0.2 provenance so resume_digest
      # keeps the same source, revision, context, and base-image policy.
      - name: Verify embedded BuildKit provenance
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            --format '{{json .Provenance.SLSA}}' \
            "$IMAGE_IMMUTABLE_REF" > buildkit-provenance.json
          jq -e --arg source_revision "$SOURCE_REVISION" \
            '(if has("buildDefinition") or has("runDetails") then
               if has("buildType") or has("metadata") or has("materials") or
                  .buildDefinition.buildType != "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md" or
                  (.runDetails.metadata | type) != "object" or
                  (.buildDefinition.resolvedDependencies | type) != "array"
               then error("Unsupported or mixed BuildKit provenance schema")
               else {
                 buildType: "https://mobyproject.org/buildkit@v1",
                 metadata: {
                   buildStartedOn: .runDetails.metadata.startedOn,
                   buildFinishedOn: .runDetails.metadata.finishedOn,
                   "https://mobyproject.org/buildkit@v1#metadata": .runDetails.metadata.buildkit_metadata
                 },
                 materials: .buildDefinition.resolvedDependencies
               } end
             else . end) |
             .buildType == "https://mobyproject.org/buildkit@v1" and
             .metadata.buildStartedOn != null and
             .metadata.buildFinishedOn != null and
             .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.source == "https://github.com/nearai/cvm-compose-files" and
             .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs.revision == $source_revision and
             .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs["localdir:context"] == "docker/vllm-dsv41-v033" and
             .metadata["https://mobyproject.org/buildkit@v1#metadata"].vcs["localdir:dockerfile"] == "docker/vllm-dsv41-v033" and
             any(.materials[];
               .digest.sha256 == "d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e" and
               (.uri | contains("vllm/vllm-openai")))' \
            buildkit-provenance.json

      - name: Scan the published digest
        env:
          TRIVY_USERNAME: ${{ vars.DOCKER_REGISTRY_USER }}
          TRIVY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vllm-dsv41-v033-trivy-cache"
          # The runner DNS listener is in the job namespace, so bridge and Docker-host
          # network modes cannot reach it. Extract the scanner from the pinned image and
          # run it as the unprivileged Actions user with the runner's working resolver.
          TRIVY_CONTAINER="vllm-dsv41-v033-trivy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TRIVY_BINARY="$RUNNER_TEMP/vllm-dsv41-v033-trivy-cache/trivy"
          trap 'docker rm -f "$TRIVY_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker create \
            --name "$TRIVY_CONTAINER" \
            docker.io/aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            >/dev/null
          docker cp "$TRIVY_CONTAINER:/usr/local/bin/trivy" "$TRIVY_BINARY"
          docker rm "$TRIVY_CONTAINER" >/dev/null
          trap - EXIT
          test "$(sha256sum "$TRIVY_BINARY" | awk '{print $1}')" = \
            379d59f24a4a828c55de5f0b91b6805cc35d13580180b658820e648611256166
          TRIVY_NO_PROGRESS=true "$TRIVY_BINARY" image \
            --cache-dir "$RUNNER_TEMP/vllm-dsv41-v033-trivy-cache" \
            --scanners vuln \
            --timeout 20m \
            --skip-version-check \
            --format json \
            --output "$GITHUB_WORKSPACE/trivy-results.json" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --show-suppressed \
            --exit-code 0 \
            "$IMAGE_IMMUTABLE_REF"

      - name: Summarize vulnerability scan
        run: |
          set -euo pipefail
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          SUPPRESSED_CRITICAL=$(jq '[.Results[]?.ExperimentalModifiedFindings[]? | select(.Status == "ignored" and .Finding.Severity == "CRITICAL")] | length' trivy-results.json)
          echo "TRIVY_HIGH=$HIGH" >> "$GITHUB_ENV"
          echo "TRIVY_CRITICAL=$CRITICAL" >> "$GITHUB_ENV"
          echo "TRIVY_SUPPRESSED_CRITICAL=$SUPPRESSED_CRITICAL" >> "$GITHUB_ENV"
          printf 'Trivy fixed-vulnerability findings: high=%s critical=%s suppressed-critical=%s\n' \
            "$HIGH" "$CRITICAL" "$SUPPRESSED_CRITICAL"

      - name: Retain pre-promotion scan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vllm-dsv41-v033-image-evidence
          path: |
            build-metadata.json
            buildkit-provenance.json
            image-config.json
            trivy-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject fixable critical vulnerabilities
        run: |
          set -euo pipefail
          if (( TRIVY_CRITICAL > 0 )); then
            echo "Refusing to attest or sign an image with $TRIVY_CRITICAL fixable critical vulnerabilities" >&2
            exit 1
          fi
          if (( TRIVY_SUPPRESSED_CRITICAL != 0 )); then
            echo "No suppressions are configured, got $TRIVY_SUPPRESSED_CRITICAL" >&2
            exit 1
          fi

      - name: Attest build provenance
        if: inputs.resume_digest == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the immutable digest
        run: cosign sign --yes "$IMAGE_IMMUTABLE_REF"

      - name: Verify signature
        run: |
          set -euo pipefail
          verification_file="$(mktemp)"
          trap 'rm -f "$verification_file"' EXIT

          # Docker Hub can acknowledge the OCI 1.1 signature referrer before it
          # becomes visible through the referrers API used by cosign verify.
          for attempt in $(seq 1 30); do
            if cosign verify \
              --certificate-identity \
              'https://github.com/nearai/cvm-compose-files/.github/workflows/publish-vllm-dsv41-v033.yaml@refs/heads/main' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$IMAGE_IMMUTABLE_REF" > "$verification_file"; then
              mv "$verification_file" cosign-verification.json
              trap - EXIT
              exit 0
            fi

            if [[ "$attempt" -eq 30 ]]; then
              echo "Signature was not visible after 30 verification attempts" >&2
              exit 1
            fi

            echo "Signature not visible yet; retrying in 10 seconds ($attempt/30)" >&2
            sleep 10
          done

      - name: Retain signature verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vllm-dsv41-v033-signature-verification
          path: cosign-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        run: |
          {
            echo '## DS4.1-Flash LoRA vLLM image'
            echo
            echo "- tag: \`$IMAGE_REF\`"
            echo "- immutable: \`$IMAGE_IMMUTABLE_REF\`"
            echo "- base: \`vllm/vllm-openai:v0.33.0\` (d825baf9)"
            echo "- patches: 01-07 (docker/vllm-dsv41-v033/PROVENANCE), incl. the VLLM_NEAR_ENGRAM_PEER_READS kill switch"
            echo "- embedded BuildKit provenance: verified"
            echo "- Trivy fixed HIGH findings: $TRIVY_HIGH"
            echo "- Trivy fixed CRITICAL findings: $TRIVY_CRITICAL"
            echo "- Sigstore: https://search.sigstore.dev/?hash=$IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
