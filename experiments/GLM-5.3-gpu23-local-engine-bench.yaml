# GLM-5.3 (not Flash) engine comparison on the gpu23 8xH200 PPCIe CVM.
#
# Experiment only. This stack intentionally has no inference-proxy, nginx, or
# model-proxy-registrar. The engines expose token-protected direct endpoints for
# internal replay and are launched one at a time through compose-manager:
#   SGLang W4AFP8 control:            host port 8002
#   vLLM FP8 fallback:                host port 8003
#   SGLang W4AFP8 HiCache candidate:  host port 8004
# SGLang follows the PhalaCloud W4AFP8 recipe plus SGLang's long-input Hopper
# recommendations (32K chunked prefill, FP8 sparse prefill/KV kernels). vLLM
# follows the official GLM-5.3 FP8 recipe with BF16 KV (the Hopper sparse MLA
# backends reject FP8 KV) and uses a 500K cap. Prefix caching remains enabled
# for the agentic replay; clean synthetic runs are recorded separately.
# DeepGEMM JIT is disabled identically on the SGLang control and HiCache arms:
# the stock first-start precompile did not expose an API after two hours. The
# model's W4AFP8 MoE path remains the revision's CUTLASS W4A8 implementation.

name: glm53-gpu23-bench

x-logging-conf: &logging-conf
  driver: json-file
  options:
    max-size: "200m"
    max-file: "5"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

services:
  host-probe-gpu23:
    <<: *nvidia
    image: lmsysorg/sglang@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    container_name: host-probe-gpu23
    pid: host
    user: "0:0"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        echo "probe_version=glm53-hicache-v1"
        date -u +"timestamp=%Y-%m-%dT%H:%M:%SZ"
        uname -a
        echo "section=guest_meminfo"
        grep -E '^(MemTotal|MemFree|MemAvailable|Buffers|Cached|SReclaimable|Shmem|Mlocked|Unevictable|SwapTotal|SwapFree|HugePages_Total|HugePages_Free|Hugepagesize):' /hostfs/proc/meminfo
        echo "section=guest_cgroup_root"
        for field in memory.current memory.max memory.high memory.swap.current memory.swap.max pids.current pids.max; do
          if [ -r "/hostfs/sys/fs/cgroup/$$field" ]; then
            printf '%s=' "$$field"
            cat "/hostfs/sys/fs/cgroup/$$field"
          fi
        done
        echo "section=guest_numa"
        for node in /hostfs/sys/devices/system/node/node[0-9]*; do
          [ -d "$$node" ] || continue
          printf 'node=%s cpulist=' "$${node##*/}"
          cat "$$node/cpulist"
          grep -E '^(Node [0-9]+ (MemTotal|MemFree|MemUsed|FilePages|Mlocked|Active|Inactive)):' "$$node/meminfo" || true
          if [ -r "$$node/distance" ]; then
            printf 'distance='
            cat "$$node/distance"
          fi
        done
        echo "section=guest_filesystems"
        df -B1 /hostfs /hostfs/data 2>/dev/null || df -B1 /hostfs
        echo "section=limits"
        printf 'memlock_kib='
        ulimit -l
        echo "section=gpu_inventory"
        nvidia-smi --query-gpu=index,uuid,name,pci.bus_id,memory.total,memory.used,utilization.gpu,power.draw,temperature.gpu,clocks.sm --format=csv,noheader,nounits
        echo "section=gpu_topology"
        nvidia-smi topo -m
        echo "section=model_process_memory"
        for status in /hostfs/proc/[0-9]*/status; do
          [ -r "$$status" ] || continue
          name=$$(awk '/^Name:/{print $$2}' "$$status")
          case "$$name" in
            python|python3|sglang)
              pid=$${status#/hostfs/proc/}; pid=$${pid%/status}
              printf 'pid=%s name=%s ' "$$pid" "$$name"
              awk '/^(VmRSS|VmHWM|VmLck|VmPin|RssAnon|RssFile|VmSwap|Threads):/{printf "%s=%s%s ", $$1, $$2, $$3} END{print ""}' "$$status"
              ;;
          esac
        done
    volumes:
      - /:/hostfs:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"host-probe","service":"host-probe","tags":["model:z-ai/glm-5.3","deployment:glm53-gpu23-local-bench","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  hicache-cuda-host-probe-gpu23:
    <<: *nvidia
    image: lmsysorg/sglang@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
    container_name: hicache-cuda-host-probe-gpu23
    user: "0:0"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import torch

        from sglang.srt.mem_cache.pool_host.common import (
            HostTensorAllocator,
            alloc_with_host_register,
        )

        torch.cuda.set_device(0)
        result = {
            "probe_version": "gpu23-cuda-host-v1",
            "device": torch.cuda.get_device_name(0),
            "bytes": 64 * 1024 * 1024,
        }
        registered = None
        try:
            registered = alloc_with_host_register(
                (result["bytes"],),
                torch.uint8,
                "cpu",
                True,
                HostTensorAllocator(),
                registration_granularity_bytes=2 * 1024 * 1024,
            )
            registered[:4096].copy_(torch.arange(4096, dtype=torch.int64).to(torch.uint8))
            copied = registered[:4096].to("cuda", non_blocking=True).cpu()
            result["cuda_host_register"] = {
                "ok": bool(torch.equal(copied, registered[:4096])),
                "error_type": None,
            }
        except Exception as exc:
            result["cuda_host_register"] = {
                "ok": False,
                "error_type": type(exc).__name__,
                "error": str(exc),
            }
        finally:
            del registered

        pinned = None
        try:
            pinned = torch.empty(result["bytes"], dtype=torch.uint8, pin_memory=True)
            pinned[:4096].copy_(torch.arange(4096, dtype=torch.int64).to(torch.uint8))
            copied = pinned[:4096].to("cuda", non_blocking=True).cpu()
            result["cuda_malloc_host"] = {
                "ok": bool(torch.equal(copied, pinned[:4096])),
                "error_type": None,
            }
        except Exception as exc:
            result["cuda_malloc_host"] = {
                "ok": False,
                "error_type": type(exc).__name__,
                "error": str(exc),
            }
        finally:
            del pinned
        print(json.dumps(result, sort_keys=True), flush=True)
        PY
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: "no"
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"host-probe","service":"host-probe","tags":["model:z-ai/glm-5.3","deployment:glm53-gpu23-hicache-bench","probe:cuda-host","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  download-glm53-w4afp8:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: download-glm53-w4afp8
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "Downloading PhalaCloud/GLM-5.3-W4AFP8 at the pinned revision"
        uvx --from 'huggingface_hub[hf_xet]' hf download \
          PhalaCloud/GLM-5.3-W4AFP8 \
          --revision 03179e95916f9f79a92536e76da63f9251d93d4f
        echo "W4AFP8 download complete"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:PhalaCloud/GLM-5.3-W4AFP8","served_model:z-ai/glm-5.3","deployment:glm53-gpu23-local-bench","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  download-glm53-fp8:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: download-glm53-fp8
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
