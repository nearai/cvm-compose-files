      EVAL_ENDPOINT: ${EVAL_ENDPOINT:-http://model-sg-glm53-w4afp8-tp8-hicache:8000}
      EVAL_PHASES: ${EVAL_PHASES:-smoke,full,restore}
      EVAL_TIMEOUT_SECONDS: "2400"
    restart: "no"
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"hicache-verifier","service":"hicache-verifier","tags":["model:z-ai/glm-5.3","deployment:glm53-gpu23-hicache-bench","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  hicache-host-exporter:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: hicache-host-exporter
    pid: host
    user: "0:0"
