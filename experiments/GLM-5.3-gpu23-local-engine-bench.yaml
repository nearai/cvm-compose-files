      nearai.otel.source: "hicache-host-exporter"
      nearai.otel.container_name: "hicache-host-exporter"
      nearai.otel.port: "9101"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3"
      nearai.otel.deployment: "glm53-gpu23-hicache-bench"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  dcgm-glm53-gpu23-bench:
    image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:613ab03c11d442fd960ff515f547e9921537454a712d08160bc8f677f89f1c35
    container_name: dcgm-glm53-gpu23-bench
    command: ["-f", "/etc/dcgm-exporter/nearai-h200.csv"]
    runtime: nvidia
    cap_add: [SYS_ADMIN]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    configs:
      - source: dcgm_h200_metrics
        target: /etc/dcgm-exporter/nearai-h200.csv
        mode: 0444
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"dcgm-exporter","service":"dcgm-exporter","tags":["model:z-ai/glm-5.3","deployment:glm53-gpu23-local-bench","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "dcgm"
      nearai.otel.service: "dcgm-exporter"
      nearai.otel.source: "dcgm-exporter"
      nearai.otel.container_name: "dcgm-glm53-gpu23-bench"
      nearai.otel.port: "9400"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3"
      nearai.otel.deployment: "glm53-gpu23-local-bench"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  otelcol-contrib:
    image: otel/opentelemetry-collector-contrib@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    container_name: otelcol-glm53-gpu23-bench
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0:0"
    mem_limit: "768m"
    environment:
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      - CVM_NAME=${CVM_NAME:-unknown}
      - CVM_HOST=${CVM_HOST:-unknown}
      - DD_HOSTNAME=${DD_HOSTNAME:-unknown}
      - ENV=${ENV:-unknown}
      - HOST_IP=${HOST_IP:-unknown}
      - CVM_HOSTMETRICS_ROOT_PATH=/hostfs
    volumes:
      - otelcol_app_storage:/var/lib/otelcol-contrib
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: otelcol_app_config
        target: /etc/otelcol-contrib/config.yaml
        mode: 0444
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"otelcol-contrib","service":"otelcol-contrib","tags":["model:z-ai/glm-5.3","deployment:glm53-gpu23-local-bench","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

networks:
  default:
    external: true
    name: dstack_default

volumes:
  # Stable names let compose-manager's pre-download project hand the immutable
  # artifacts to the default experiment project without copying hundreds of GB.
  huggingface_cache:
    name: glm53-gpu23-bench_huggingface_cache
  sglang_cache:
    name: glm53-gpu23-bench_sglang_cache
  sglang_compile_cache:
    name: glm53-gpu23-bench_sglang_compile_cache
  vllm_cache:
    name: glm53-gpu23-bench_vllm_cache
  otelcol_app_storage:
    name: glm53-gpu23-bench_otelcol_app_storage

configs:
  hicache_host_exporter_script:
    content: |
      import http.client
      import http.server
      import json
      import os
      import socket

      HOST_PROC = "/hostfs/proc"
      DOCKER_SOCKET = "/var/run/docker.sock"
      TARGETS = (
          "model-sg-glm53-w4afp8-tp8",
          "model-sg-glm53-w4afp8-tp8-hicache",
      )

      class UnixConnection(http.client.HTTPConnection):
          def connect(self):
              self.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              self.sock.connect(DOCKER_SOCKET)

      def docker_json(path):
          connection = UnixConnection("localhost", timeout=2)
          try:
              connection.request("GET", path)
              response = connection.getresponse()
              if response.status != 200:
                  raise RuntimeError(f"Docker API returned {response.status}")
              return json.loads(response.read())
          finally:
              connection.close()

      def read_meminfo():
          values = {}
          with open(f"{HOST_PROC}/meminfo", encoding="ascii") as handle:
              for line in handle:
                  key, raw = line.split(":", 1)
                  fields = raw.split()
                  if fields:
                      values[key] = int(fields[0]) * 1024
          return values

      def process_totals(container_id):
          totals = {
              "rss": 0, "high_water": 0, "locked": 0, "pinned": 0,
              "anon": 0, "file": 0, "swap": 0, "minor": 0, "major": 0,
              "threads": 0, "processes": 0,
          }
          marker = container_id[:12]
          for entry in os.listdir(HOST_PROC):
              if not entry.isdigit():
                  continue
              base = f"{HOST_PROC}/{entry}"
              try:
                  with open(f"{base}/cgroup", encoding="ascii") as handle:
                      if marker not in handle.read():
                          continue
                  status = {}
                  with open(f"{base}/status", encoding="ascii") as handle:
                      for line in handle:
                          if ":" not in line:
                              continue
                          key, raw = line.split(":", 1)
                          fields = raw.split()
                          if fields and fields[0].isdigit():
                              status[key] = int(fields[0])
                  with open(f"{base}/stat", encoding="ascii") as handle:
                      fields = handle.read().rsplit(")", 1)[1].split()
                  totals["rss"] += status.get("VmRSS", 0) * 1024
                  totals["high_water"] += status.get("VmHWM", 0) * 1024
                  totals["locked"] += status.get("VmLck", 0) * 1024
                  totals["pinned"] += status.get("VmPin", 0) * 1024
                  totals["anon"] += status.get("RssAnon", 0) * 1024
                  totals["file"] += status.get("RssFile", 0) * 1024
                  totals["swap"] += status.get("VmSwap", 0) * 1024
                  totals["threads"] += status.get("Threads", 0)
                  totals["minor"] += int(fields[7])
                  totals["major"] += int(fields[9])
                  totals["processes"] += 1
              except (FileNotFoundError, PermissionError, ProcessLookupError, ValueError):
                  continue
          return totals

      def collect():
          lines = ["# TYPE nearai_hicache_probe_up gauge", "nearai_hicache_probe_up 1"]
          meminfo = read_meminfo()
          memory_states = {
              "total": "MemTotal", "free": "MemFree", "available": "MemAvailable",
              "cached": "Cached", "mlocked": "Mlocked", "unevictable": "Unevictable",
              "slab_reclaimable": "SReclaimable", "shmem": "Shmem",
          }
          lines.append("# TYPE nearai_hicache_guest_memory_bytes gauge")
          for state, key in memory_states.items():
              lines.append(f'nearai_hicache_guest_memory_bytes{{state="{state}"}} {meminfo.get(key, 0)}')
          for target in TARGETS:
              try:
                  metadata = docker_json(f"/v1.44/containers/{target}/json")
              except Exception:
                  continue
              if not metadata.get("State", {}).get("Running"):
                  continue
              totals = process_totals(metadata["Id"])
              label = f'container="{target}"'
              for state in ("rss", "high_water", "locked", "pinned", "anon", "file", "swap"):
                  lines.append(f'nearai_hicache_model_process_memory_bytes{{{label},state="{state}"}} {totals[state]}')
              for kind in ("minor", "major"):
                  lines.append(f'nearai_hicache_model_process_page_faults_total{{{label},type="{kind}"}} {totals[kind]}')
              lines.append(f"nearai_hicache_model_process_threads{{{label}}} {totals['threads']}")
              lines.append(f"nearai_hicache_model_processes{{{label}}} {totals['processes']}")
          return "\n".join(lines) + "\n"

      class Handler(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path != "/metrics":
                  self.send_error(404)
                  return
              try:
                  body = collect().encode()
                  status = 200
              except Exception:
                  body = b"nearai_hicache_probe_up 0\n"
                  status = 500
              self.send_response(status)
              self.send_header("Content-Type", "text/plain; version=0.0.4")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def log_message(self, _format, *_args):
              return

      http.server.ThreadingHTTPServer(("0.0.0.0", 9101), Handler).serve_forever()

  dcgm_h200_metrics:
    content: |
      DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency in MHz.
      DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency in MHz.
      DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature in C.
      DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature in C.
      DCGM_FI_DEV_POWER_USAGE, gauge, GPU board power draw in W.
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, GPU board energy consumed since boot in mJ.
      DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization in percent.
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory copy utilization in percent.
      DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free in MiB.
      DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used in MiB.
      DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved in MiB.
      DCGM_FI_PROF_PCIE_TX_BYTES, gauge, PCIe transmit throughput in bytes per second.
      DCGM_FI_PROF_PCIE_RX_BYTES, gauge, PCIe receive throughput in bytes per second.
      DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total PCIe replay events.
      DCGM_FI_DEV_XID_ERRORS, gauge, Last XID error encountered.
      DCGM_EXP_XID_ERRORS_COUNT, gauge, XID records observed in the configured window.
      DCGM_EXP_XID_ERRORS_TOTAL, counter, XID records observed since exporter start.
      DCGM_EXP_CLOCK_EVENTS_COUNT, gauge, Clock events observed in the configured window.
      DCGM_EXP_CLOCK_EVENTS_TOTAL, counter, Clock event transitions observed since exporter start.
      DCGM_FI_DEV_POWER_VIOLATION, counter, Throttling duration due to power constraints in ns.
      DCGM_FI_DEV_THERMAL_VIOLATION, counter, Throttling duration due to thermal constraints in ns.
      DCGM_FI_DEV_SYNC_BOOST_VIOLATION, counter, Throttling duration due to sync boost constraints in ns.
      DCGM_FI_DEV_BOARD_LIMIT_VIOLATION, counter, Throttling duration due to board constraints in ns.
      DCGM_FI_DEV_LOW_UTIL_VIOLATION, counter, Throttling duration due to low utilization in ns.
      DCGM_FI_DEV_RELIABILITY_VIOLATION, counter, Throttling duration due to reliability constraints in ns.
      DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Total volatile single-bit ECC errors.
      DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Total volatile double-bit ECC errors.
      DCGM_FI_DEV_ECC_SBE_AGG_TOTAL, counter, Total aggregate single-bit ECC errors.
      DCGM_FI_DEV_ECC_DBE_AGG_TOTAL, counter, Total aggregate double-bit ECC errors.
      DCGM_FI_DEV_RETIRED_SBE, counter, Total pages retired due to single-bit errors.
      DCGM_FI_DEV_RETIRED_DBE, counter, Total pages retired due to double-bit errors.
      DCGM_FI_DEV_RETIRED_PENDING, counter, Pages pending retirement.
      DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Total uncorrectable remapped rows.
      DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Total correctable remapped rows.
      DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether row remapping has failed.
      DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, Aggregate NVLink traffic rate across all lanes.
      DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL, counter, Total NVLink flow-control CRC errors.
      DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL, counter, Total NVLink data CRC errors.
      DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL, counter, Total NVLink replay errors.
      DCGM_FI_DEV_NVLINK_RECOVERY_ERROR_COUNT_TOTAL, counter, Total NVLink recovery errors.
      DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active.
      DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor pipe is active.
      DCGM_FI_PROF_DRAM_ACTIVE, gauge, Ratio of time the device memory interface is active.
      DCGM_FI_DRIVER_VERSION, label, NVIDIA driver version.
      DCGM_FI_NVML_VERSION, label, NVML version.
      DCGM_FI_DEV_BRAND, label, GPU product brand.
      DCGM_FI_DEV_VBIOS_VERSION, label, GPU VBIOS version.

  otelcol_app_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        hostmetrics/hicache:
          collection_interval: 5s
          root_path: $${env:CVM_HOSTMETRICS_ROOT_PATH}
          scrapers:
            cpu: {}
            memory: {}
            load: {}
            paging: {}
            network: {}
            disk: {}
            filesystem:
              exclude_mount_points:
                mount_points: ["^/dev(/.*)?$", "^/proc(/.*)?$", "^/sys(/.*)?$", "^/run(/.*)?$", "^/var/lib/docker(/.*)?$"]
                match_type: regexp

        docker_stats/hicache:
          endpoint: unix:///var/run/docker.sock
          collection_interval: 5s
          timeout: 4s
          api_version: "1.44"
          container_labels_to_metric_labels:
            com.docker.compose.service: compose_service
            com.docker.compose.project: compose_project

        prometheus/apps:
          config:
            scrape_configs:
              - job_name: sglang-glm53-gpu23
                scrape_interval: 5s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-sg-glm53-w4afp8-tp8:8000']
                    labels:
                      service: sglang
                      source: sglang
                      container_name: model-sg-glm53-w4afp8-tp8
                      model: z-ai/glm-5.3
                      model_path: PhalaCloud/GLM-5.3-W4AFP8
                      precision: w4afp8-fp8kv
                      deployment: glm53-gpu23-local-bench
                      config_variant: sglang-v0.5.19-w4afp8-tp8-long-prefill
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "8002"
              - job_name: vllm-glm53-gpu23
                scrape_interval: 5s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-vllm-glm53-fp8-tp8:8000']
                    labels:
                      service: vllm
                      source: vllm
                      container_name: model-vllm-glm53-fp8-tp8
                      model: z-ai/glm-5.3
                      model_path: zai-org/GLM-5.3
                      precision: fp8-bf16kv
                      deployment: glm53-${CVM_HOST}-local-bench
                      config_variant: vllm-v0.29.0-fp8-tp8-long-prefill-bf16kv
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "8003"
              - job_name: sglang-glm53-gpu23-hicache
                scrape_interval: 5s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-sg-glm53-w4afp8-tp8-hicache:8000']
                    labels:
                      service: sglang
                      source: sglang
                      container_name: model-sg-glm53-w4afp8-tp8-hicache
                      model: z-ai/glm-5.3
                      model_path: PhalaCloud/GLM-5.3-W4AFP8
                      precision: w4afp8-fp8kv
                      deployment: glm53-gpu23-hicache-bench
                      config_variant: sglang-v0.5.19-w4afp8-tp8-hicache-r1.5-direct-pfd-wt
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "8004"
              - job_name: hicache-host-gpu23
                scrape_interval: 5s
                scrape_timeout: 4s
                metrics_path: /metrics
                static_configs:
                  - targets: ['hicache-host-exporter:9101']
                    labels:
                      service: hicache-host-exporter
                      source: hicache-host-exporter
                      container_name: hicache-host-exporter
                      model: z-ai/glm-5.3
                      deployment: glm53-gpu23-hicache-bench
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "9101"
              - job_name: dcgm-glm53-gpu23
                scrape_interval: 5s
                scrape_timeout: 4s
                metrics_path: /metrics
                static_configs:
                  - targets: ['dcgm-glm53-gpu23-bench:9400']
                    labels:
                      service: dcgm-exporter
                      source: dcgm-exporter
                      container_name: dcgm-glm53-gpu23-bench
                      model: z-ai/glm-5.3
                      deployment: glm53-gpu23-local-bench
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "9400"
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 512
          spike_limit_mib: 128
        resource:
          attributes:
            - key: host.name
              value: $${env:DD_HOSTNAME}
              action: upsert
            - key: cvm.name
              value: $${env:CVM_NAME}
              action: upsert
            - key: host.machine
              value: $${env:CVM_HOST}
              action: insert
            - key: deployment.environment
              value: $${env:ENV}
              action: upsert
            - key: service.namespace
              value: near-ai
              action: insert
        batch:
          send_batch_size: 1024
          send_batch_max_size: 2048
          timeout: 5s

      exporters:
        otlphttp/gateway:
          endpoint: https://telemetry.infra.near.ai
          headers:
            Authorization: "Bearer $${env:MONITORING_INGEST_TOKEN}"
          sending_queue:
            num_consumers: 1
            queue_size: 128
            storage: file_storage

      extensions:
        file_storage:
          directory: /var/lib/otelcol-contrib/storage
          create_directory: true

      service:
        extensions: [file_storage]
        pipelines:
          metrics:
            receivers: [prometheus/apps, hostmetrics/hicache, docker_stats/hicache]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
        telemetry:
          logs:
            level: info
