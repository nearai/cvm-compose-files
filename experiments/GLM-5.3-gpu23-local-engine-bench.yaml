      NCCL_DEBUG: INFO
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
      TRITON_CACHE_DIR: /root/.cache/sglang/triton
      SGLANG_ENABLE_JIT_DEEPGEMM: "0"
    deploy:
      resources:
        reservations:
          devices:
