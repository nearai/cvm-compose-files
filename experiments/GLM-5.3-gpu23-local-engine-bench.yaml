        uvx --from 'huggingface_hub[hf_xet]' hf download \
          zai-org/GLM-5.3 \
          --revision aca966e4e02791568aa6a4ced368624b3d897f42
        echo "FP8 download complete"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:zai-org/GLM-5.3","served_model:z-ai/glm-5.3","deployment:glm53-${CVM_HOST}-local-bench","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  model-sg-glm53-w4afp8-tp8:
