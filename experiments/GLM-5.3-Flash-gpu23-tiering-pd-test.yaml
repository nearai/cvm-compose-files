  pd-router:
    image: docker.io/nearaidev/sglang@sha256:a7b7136abcf5e07522289d96e96fec9b42a1a30f9dfda57e957f142680d2d67b
    container_name: glm53flash-pd-router
    profiles: ["pd"]
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: void
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        exec python3 -m sglang_router.launch_router --pd-disaggregation \
          --prefill http://glm53-prefill:8000 8998 --decode http://glm53-decode:8000 \
          --prefill-policy cache_aware --decode-policy power_of_two \
          --host 0.0.0.0 --port 8000
    depends_on:
      - glm53-prefill
      - glm53-decode
    logging: *logging-conf

  # --- v9 admission-reserve scheduler arm (profile v9): patched scheduler files in a volume ---
  patch-init:
    image: docker.io/nearaidev/sglang@sha256:a7b7136abcf5e07522289d96e96fec9b42a1a30f9dfda57e957f142680d2d67b
    container_name: glm53flash-patch-init
    profiles: ["v9"]
    restart: "no"
    environment:
      NVIDIA_VISIBLE_DEVICES: void
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        rm -rf /overlay/* && cp -a /sgl-workspace/sglang/python/sglang/srt/managers/. /overlay/
        python3 /patch/patch_admission_reserve.py /overlay
        python3 -m py_compile /overlay/scheduler.py /overlay/schedule_policy.py
        echo PATCH-OK
    volumes:
      - sglang_managers_v9:/overlay
    configs:
      - source: patch_admission_reserve
        target: /patch/patch_admission_reserve.py
        mode: 0444
    logging: *logging-conf

