# STATUS: EXPERIMENT. GLM-5.3 Flash pool-topology comparison on the gpu23 8xH200 PPCIe CVM:
# identical replicas (prod routing) vs long-context-dedicated replicas (length-tiered routing)
# vs prefill-only + decode-only replicas (SGLang P/D disaggregation, mooncake TCP transport).
#
# Experiment only. No inference-proxy, nginx, model-proxy-registrar, otel or dcgm: nothing in this
# file registers with production or ships telemetry. Engines expose token-protected direct
# endpoints (--api-key = PROXY_TOKEN) on the ACL-covered host ports 8001-8008 and are deployed
# ONLY as explicit service subsets of the compose project "glm53flash-gpu23-bd" through
# compose-manager (never against the serving "work" project). The lab router and load driver
# (nearai/inference-optimizer) run on the gpu23 host against the forwarded ports.
#
# Engines a/b are the production r1 configuration verbatim (image, flags) plus --api-key and a
# persisted tilelang JIT cache. Profiles: ops (disk check), probe (topology/CC evidence),
# pd (prefill/decode workers + sgl-router), v9 (admission-reserve scheduler patch arm).

name: glm53flash-gpu23-bd

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-engine-env: &engine-env
  HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  OPENBLAS_L2_SIZE: "2097152"
  NCCL_DEBUG: WARN
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
  TRITON_CACHE_DIR: /root/.cache/triton
  # tilelang (DSA attention) JIT cache: ~22 kernels at 8-9 s each with the engine frozen; persist it.
  TILELANG_CACHE_DIR: /root/.cache/tilelang
  SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE: "1"
  PROXY_TOKEN: ${PROXY_TOKEN}

x-engine-base: &engine-base
  <<: *nvidia
  init: true
  image: docker.io/nearaidev/sglang@sha256:a7b7136abcf5e07522289d96e96fec9b42a1a30f9dfda57e957f142680d2d67b
  entrypoint: ["/bin/bash", "-lc"]
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Downloading zai-org/GLM-5.3-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
        echo "Downloading corrected GLM-5.3-Flash chat template..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash chat_template.jinja --revision 3f1971b7b5f7a528c9c4ef6212c8785298a8c24a
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf

  # One-shot disk report, served on host port 8006 until brought down (compose-manager has no exec).
  diskcheck:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: glm53flash-diskcheck
    profiles: ["ops"]
    restart: "no"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - engine_logs:/logs
    entrypoint: ["sh", "-c"]
    command:
      - |
        { date -u; echo "== df / (CVM root disk)"; df -h /; echo "== df hf volume"; df -h /root/.cache/huggingface; echo "== hub contents"; du -sh /root/.cache/huggingface/hub/* 2>/dev/null || echo none; } > /logs/diskcheck.txt 2>&1
        cat /logs/diskcheck.txt
    logging: *logging-conf

  # Serves the shared /logs volume (engine stdout/stderr, probe and disk reports) on host port 8006:
  # compose-manager's logs endpoint is not project-scoped on this host, so this is the only log path.
  logserver:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: glm53flash-logserver
    profiles: ["ops"]
    restart: unless-stopped
    ports:
      - "8006:8000"
    volumes:
      - engine_logs:/logs:ro
    entrypoint: ["sh", "-c"]
    command:
      - exec python3 -m http.server 8000 --directory /logs
    logging: *logging-conf

  # Topology and confidential-compute evidence (all 8 GPUs), served on host port 8007.
  probe:
    <<: *nvidia
    image: docker.io/nearaidev/sglang@sha256:a7b7136abcf5e07522289d96e96fec9b42a1a30f9dfda57e957f142680d2d67b
    container_name: glm53flash-probe
    profiles: ["probe"]
    restart: "no"
    volumes:
      - engine_logs:/logs
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        {
          echo "== nvidia-smi -L"; nvidia-smi -L
          echo "== nvidia-smi topo -m"; nvidia-smi topo -m
          echo "== nvidia-smi topo -p2p r"; nvidia-smi topo -p2p r
          echo "== conf-compute"; nvidia-smi conf-compute -q 2>&1 || true
          echo "== nvidia-smi -q (CC / protected PCIe lines)"; nvidia-smi -q 2>/dev/null | grep -i -B1 -A3 "confidential\|protected pcie\|cc mode\|multi.gpu" || true
          echo "== driver"; nvidia-smi --query-gpu=index,pci.bus_id,driver_version,memory.total --format=csv
          echo "== clocks/power/throttle (now)"; nvidia-smi --query-gpu=index,pstate,clocks.sm,clocks.max.sm,clocks.mem,power.draw,power.limit,enforced.power.limit,temperature.gpu,utilization.gpu,clocks_throttle_reasons.active,ecc.mode.current --format=csv
          echo "== nvidia-smi -q PERFORMANCE/CLOCK (GPU 0)"; nvidia-smi -i 0 -q -d PERFORMANCE,CLOCK,POWER 2>/dev/null | head -80
          echo "== nvidia-smi -q -d COMPUTE / MIG / persistence"; nvidia-smi -q | grep -i -A1 "persistence\|compute mode\|mig mode" | head -12
          echo "== cpu"; nproc; lscpu | grep -i "model name\|mhz\|numa" | head -6; cat /proc/loadavg
          echo "== torch"; python3 -c "import torch; print(torch.__version__, torch.cuda.device_count())"
        } > /logs/probe.txt 2>&1
        cat /logs/probe.txt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3", "4", "5", "6", "7"]
              capabilities: [gpu]
    logging: *logging-conf

  # --- Identical replicas: production r1 configuration verbatim ---
  glm53-a:
    <<: *engine-base
    container_name: glm53-a
    ports:
      - "8001:8000"
    volumes:
      - kernel_cache_a:/root/.cache
      - huggingface_cache:/root/.cache/huggingface
      - engine_logs:/logs
    environment:
      <<: *engine-env
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    command:
      - |
        exec sglang serve > >(tee -a /logs/$$HOSTNAME.log) 2>&1 \
          --model-path /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/84c6a6aa9497188e15a635ba793b0f95a79b1033 \
          --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033 \
          --served-model-name z-ai/glm-5.3-flash \
          --tp-size 4 \
          --ep-size 4 \
          --mem-fraction-static 0.80 \
          --max-running-requests 32 \
          --max-queued-requests 32 \
          --chunked-prefill-size 4096 \
          --cuda-graph-max-bs-decode 32 \
          --dsa-prefill-backend tilelang \
          --dsa-decode-backend tilelang \
          --kv-cache-dtype bfloat16 \
          --moe-runner-backend deep_gemm \
          --speculative-algorithm EAGLE \
          --speculative-num-steps 5 \
          --speculative-eagle-topk 1 \
          --speculative-num-draft-tokens 6 \
          --speculative-adaptive \
          --reasoning-parser glm45 \
          --enable-strict-thinking \
          --grammar-backend xgrammar \
          --tool-call-parser glm47 \
          --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja \
          --context-length 1048576 \
          --dist-init-addr 127.0.0.1:29510 \
          --watchdog-timeout 1800 \
          --host 0.0.0.0 \
          --port 8000 \
          --enable-metrics \
          --enable-cache-report \
          --log-requests-level 0 \
          --disable-fast-image-processor \
          --limit-mm-data-per-request '{"image": 64}' \
          --api-key "$$PROXY_TOKEN"

  glm53-b:
    <<: *engine-base
    container_name: glm53-b
    ports:
      - "8002:8000"
    volumes:
      - kernel_cache_b:/root/.cache
      - huggingface_cache:/root/.cache/huggingface
