# STATUS: EXPERIMENT host, PRODUCTION traffic: bare-metal (non-TEE) OpenRouter capacity on gpu31; not deployable through
# compose-manager/KMS.
#
# 4x gpt-oss-120b, one TP1 replica per GPU (GPUs 4-7), on the gpu31 lab host (180.94.16.204, CC off). GPUs 0-3 are left
# to other work (1-GPU CVMs, experiments) and are never referenced here. OpenRouter traffic only, through the OpenRouter
# gateway: gpt-oss-120b runs non-TEE because it is only for OpenRouter users.
#
# Same layout as the gpu32 OpenRouter pack (cvm-compose-files #347; gpt-oss ran there until 2026-10-08):
# model-downloader, one engine per GPU pinned by device_ids, ONE inference-proxy pooling the
# replicas (VLLM_BACKEND_URLS + conversation affinity), nginx with one plain HTTP port (8002, the gateway's backend and
# probe port), one dcgm exporter and otelcol-contrib. Differences from a prod pack, all because this is a non-TEE
# bare-metal host:
#   - No model-proxy-registrar, on purpose: registering would put a non-TEE backend into cloud-api's private-inference
#     rotation. The OpenRouter gateway lists this host directly.
#   - The proxy runs with DEV / GPU_NO_HW_MODE / NON_TEE_DEPLOYMENT (no dstack socket, no attestation, not privileged)
#     and accepts only the gateway's trusted bearer (TOKEN); the gateway bills, so no CLOUD_API_USAGE_TOKEN here.
#   - The gateway reaches port 8002 over the WireGuard tunnel `wg-openrouter` (nearai/cvm-ansible-playbooks,
#     docs/openrouter-gateway-wireguard.md; gpu31 = 10.90.0.31). gpu31 sits behind the same site NAT as gpu32, so the
#     host firewall admits 8002 on the tunnel interface only. No certbot / TLS vhost.
#   - nginx uses network_mode: host (so the host firewall applies; Docker-published ports would bypass it) and reaches
#     the proxy on a loopback-only published port, 127.0.0.1:18002.
#   - Plain `docker compose` with a hand-kept .env (0600): PROXY_TOKEN, HUGGING_FACE_HUB_TOKEN, MONITORING_INGEST_TOKEN,
#     ENV, HOST_IP, CVM_HOST=gpu31, CVM_NAME=none, HF_DIR.
#
# Engine config: FP8 KV + 32K batched tokens (tee-bench exp 31) plus the EAGLE3-v3 draft (3 tokens, cvm-compose-files
# #355), on vLLM v0.31.0 and without #355's CPU KV offload; the reasons are next to the engine command below.
#
#   cd /data/gpu31-openrouter && sudo docker compose --env-file .env -f compose.yaml -p openrouter up -d

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-downloader-common: &downloader-common
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  entrypoint: ["sh", "-c"]
  restart: "no"
  logging: *logging-conf

x-engine-common: &engine-common
  <<: *nvidia
  init: true
  restart: unless-stopped
  shm_size: 32g
  logging: *logging-conf
  depends_on:
    model-downloader:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 900s

x-gptoss-engine: &gptoss-engine
  <<: *engine-common
  # vLLM v0.31.0, the image of the Qwen3.8 replicas on gpu32. Not 0.26 (the gpu32 pack's gpt-oss image): with the EAGLE3
  # draft on, 0.26 corrupts json_schema output (xgrammar "Failed to advance FSM"; 2 of 24 valid on 2026-10-14, answers
  # start with `{"{`), and 0.31 does not (all valid).
  image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3  # vLLM v0.31.0
  volumes:
    - ${HF_DIR:-/data/gpu31-openrouter/hf}:/root/.cache/huggingface
    - vllm_cache:/root/.cache/vllm
  environment:
    - HF_HUB_OFFLINE=1
    - VLLM_LOGGING_LEVEL=INFO
    - VLLM_CACHE_ROOT=/root/.cache/vllm/gptoss-120b-v031
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  command:
    - openai/gpt-oss-120b
    - --revision=b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    - --served-model-name=openai/gpt-oss-120b
    - --tensor-parallel-size=1
    - --async-scheduling
    - --kv-cache-dtype=fp8
    - --gpu-memory-utilization=0.93
    - --max-num-seqs=1024
    - --max-num-batched-tokens=32768
    # EAGLE3-v3 draft, 3 tokens (NVIDIA Dynamo H200 recipe; cvm-compose-files #355, tee-bench exp 44 on this host: time per
    # output token -55% at 4x live load; GSM8K-200 0.965 vs 0.970). With speculative decoding on, vLLM answers 400 to
    # min_p and logit_bias, so the catalog row does not declare them.
    # No CPU KV offload (#355 adds 100 GiB): on 0.31 the native offload backend held 70+ of 96 requests "Deferred" at
    # 0.3% GPU KV use (median first token 7.2 s on ShareGPT). The GPU pool alone is 2.18M tokens per replica.
    # ShareGPT per replica, this config vs 0.26 + EAGLE3 + offload: output tok/s 1,667 / 2,698 / 4,214 vs 2,007 / 3,128 /
    # 4,350 at 32 / 96 / 192 concurrent, median TPOT within 6%, 0 failures.
    - '--speculative-config={"method":"eagle3","model":"nvidia/gpt-oss-120b-Eagle3-v3","revision":"975baaffe27cc031ba21ae370602735d8e3df052","num_speculative_tokens":3}'
    # Report cached prompt tokens in usage (prompt_tokens_details.cached_tokens), so cache reads are billed at the cache price.
    - --enable-prompt-tokens-details
    # With tool_choice "none" the tools are left out of the prompt, so the model answers in text. Without it the model
    # still writes a tool call and the caller gets an empty message (same flag as the Qwen3.8 replicas).
    - --exclude-tools-when-tool-choice-none
    - --enable-auto-tool-choice
    - --tool-call-parser=openai
    - --host=0.0.0.0
    - --port=8000

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:d61357da39918a57126864a451eaf054f06a6989c03fe9a1666f7e6374ba6907
  # Same fd limits as the prod proxies. Without them one pooled proxy hits EMFILE at ~500 concurrent streams.
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  restart: unless-stopped
  logging: *logging-conf

x-proxy-env: &proxy-env
  LOG_FORMAT: json
  TOKEN: ${PROXY_TOKEN}
  DEV: "1"
  GPU_NO_HW_MODE: "1"
  NON_TEE_DEPLOYMENT: "1"
  VLLM_BACKEND_HEALTH_PATH: /health
  # Keep append-only conversations on the replica that already holds their prefix cache (inference-proxy #227).
  VLLM_BACKEND_CONVERSATION_AFFINITY: "1"
  VLLM_PROXY_MAX_REQUEST_SIZE: "104857600"
  # vLLM's uvicorn closes idle keep-alive after 5 s; drop pooled connections first (same as the prod packs).
  VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS: "3"
  # Per-client-IP limiter (default 100 req/s, burst 200). Every request here comes from the OpenRouter gateway over the
  # tunnel, so the default would cap the whole lane at 100 req/s; the gateway's admission budget is the real limit.
  RATE_LIMIT_PER_SECOND: "1000"
  RATE_LIMIT_BURST_SIZE: "2000"

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:ed594cf53fe6942e84b07b0740cdcbb249fa4b39cb21feeebf93881ae51f0b5e
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  restart: unless-stopped
  logging: *logging-conf

services:
  model-downloader:
    <<: *downloader-common
    container_name: model-downloader
    command:
      - |
        set -e
        uvx --from 'huggingface_hub[hf_xet]' hf download openai/gpt-oss-120b --revision b5c939de8f754692c1647ca79fbf85e8c1e70f8a --exclude 'original/*' --exclude 'metal/*'
        uvx --from 'huggingface_hub[hf_xet]' hf download nvidia/gpt-oss-120b-Eagle3-v3 --revision 975baaffe27cc031ba21ae370602735d8e3df052 --exclude 'assets/*'
        echo "Downloads complete."
    volumes:
      - ${HF_DIR:-/data/gpu31-openrouter/hf}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:multi","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  proxy-gptoss-120b:
    <<: *vllm-proxy-common
    container_name: proxy-gptoss-120b
    ports: ["127.0.0.1:18002:8000"]
    environment: {<<: *proxy-env, MODEL_NAME: openai/gpt-oss-120b, VLLM_BACKEND_URLS: "http://model-vllm-gptoss-120b-mxfp4-tp1-r1:8000,http://model-vllm-gptoss-120b-mxfp4-tp1-r2:8000,http://model-vllm-gptoss-120b-mxfp4-tp1-r3:8000,http://model-vllm-gptoss-120b-mxfp4-tp1-r4:8000"}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:openai/gpt-oss-120b","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-gptoss-120b"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "openai/gpt-oss-120b"
      nearai.otel.deployment: "gptoss-openrouter-gpu31"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.public_port: "8002"

  model-vllm-gptoss-120b-mxfp4-tp1-r1:
    <<: *gptoss-engine
    container_name: model-vllm-gptoss-120b-mxfp4-tp1-r1
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["4"], capabilities: [gpu]}]}}}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:openai/gpt-oss-120b","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-gptoss-120b-mxfp4-tp1-r1"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "openai/gpt-oss-120b"
      nearai.otel.deployment: "gptoss-openrouter-gpu31"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.gpu: "4"

  model-vllm-gptoss-120b-mxfp4-tp1-r2:
    <<: *gptoss-engine
    container_name: model-vllm-gptoss-120b-mxfp4-tp1-r2
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["5"], capabilities: [gpu]}]}}}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:openai/gpt-oss-120b","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-gptoss-120b-mxfp4-tp1-r2"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "openai/gpt-oss-120b"
      nearai.otel.deployment: "gptoss-openrouter-gpu31"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.gpu: "5"

  model-vllm-gptoss-120b-mxfp4-tp1-r3:
    <<: *gptoss-engine
    container_name: model-vllm-gptoss-120b-mxfp4-tp1-r3
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["6"], capabilities: [gpu]}]}}}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:openai/gpt-oss-120b","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-gptoss-120b-mxfp4-tp1-r3"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "openai/gpt-oss-120b"
      nearai.otel.deployment: "gptoss-openrouter-gpu31"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.gpu: "6"

  model-vllm-gptoss-120b-mxfp4-tp1-r4:
    <<: *gptoss-engine
    container_name: model-vllm-gptoss-120b-mxfp4-tp1-r4
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["7"], capabilities: [gpu]}]}}}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:openai/gpt-oss-120b","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-gptoss-120b-mxfp4-tp1-r4"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "openai/gpt-oss-120b"
      nearai.otel.deployment: "gptoss-openrouter-gpu31"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.gpu: "7"

  dcgm-gptoss-120b:
    <<: *dcgm-common
    container_name: dcgm-gptoss-120b
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["4", "5", "6", "7"], capabilities: [gpu]}]}}}
    labels:
      com.datadoghq.ad.logs: '[{"source":"dcgm-exporter","service":"dcgm-exporter","tags":["model:openai/gpt-oss-120b","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "dcgm"
      nearai.otel.service: "dcgm-exporter"
      nearai.otel.source: "dcgm-exporter"
      nearai.otel.container_name: "dcgm-gptoss-120b"
      nearai.otel.port: "9400"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "openai/gpt-oss-120b"
      nearai.otel.deployment: "gptoss-openrouter-gpu31"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.gpus: "4-7"

  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-gptoss-120b
    # Host network so the host firewall (ufw INPUT) governs 8002: Docker-published ports bypass it on this host.
    # ufw admits 8002 only on wg-openrouter from the gateway hosts' tunnel addresses.
    network_mode: host
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:multi","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  otelcol-contrib:
    image: otel/opentelemetry-collector-contrib@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    container_name: otelcol-contrib
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0:0"
    mem_limit: "768m"
    environment:
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      - CVM_NAME=${CVM_NAME:-unknown}
      - CVM_HOST=${CVM_HOST:-unknown}
      - DD_HOSTNAME=${DD_HOSTNAME:-unknown}
      - ENV=${ENV:-unknown}
      - HOST_IP=${HOST_IP:-unknown}
    expose:
      - "4317"
      - "4318"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol_app_storage:/var/lib/otelcol-contrib
    configs:
      - source: otelcol_app_config
        target: /etc/otelcol-contrib/config.yaml
        mode: 0444
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      com.datadoghq.ad.logs: '[{"source":"otelcol-contrib","service":"otelcol-contrib","tags":["model:multi","deployment:gptoss-openrouter-gpu31","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'



volumes:
  otelcol_app_storage:
  vllm_cache:

configs:
  otelcol_app_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        filelog/docker_containers:
          include: [/var/lib/docker/containers/*/*-json.log]
          start_at: end
          storage: file_storage
          include_file_path: true
          operators:
            - type: json_parser
              parse_from: body
              parse_to: attributes
              timestamp:
                parse_from: attributes.time
                layout_type: gotime
                layout: '2006-01-02T15:04:05.999999999Z07:00'
              on_error: send_quiet
            - type: move
              from: attributes.log
              to: body
              if: 'attributes.log != nil'
            - type: move
              from: attributes.stream
              to: attributes["log.iostream"]
              if: 'attributes.stream != nil'
            - type: remove
              field: attributes.time
              if: 'attributes.time != nil'
            - type: regex_parser
              parse_from: attributes["log.file.path"]
              regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]{12})[a-f0-9]*/'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model:(?P<model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'served_model:(?P<served_model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'deployment:(?P<deployment>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ip:(?P<ip>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'port:(?P<port>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'env:(?P<env>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'host:(?P<host>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'instance:(?P<instance>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'gpu_pair:(?P<gpu_pair>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ppcie:(?P<ppcie>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'config_variant:(?P<config_variant>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'quantization:(?P<quantization>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'eagle:(?P<eagle>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'eagle_prefill_fairness:(?P<eagle_prefill_fairness>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'sglang_revision:(?P<sglang_revision>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
