volumes:
  otelcol_app_storage:

configs:
  otelcol_app_config:
    content: |
      receivers:
        prometheus/apps:
          config:
            scrape_configs:
              - job_name: sglang-r1
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [model-sg-dsv4-flash-fp4-tp2-r1:8000]
                    labels: {service: sglang, source: sglang, container_name: model-sg-dsv4-flash-fp4-tp2-r1, model: deepseek-ai/DeepSeek-V4-Flash, model_path: deepseek-ai/DeepSeek-V4-Flash, precision: fp4, deployment: gpu31-dsv4-flash-bare, env: "${ENV}", host: "${CVM_HOST}", host_machine: "${CVM_HOST}", cvm_name: "${CVM_NAME}", ip: "${HOST_IP}", port: "30001", instance: "1"}
              - job_name: sglang-r2
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [model-sg-dsv4-flash-fp4-tp2-r2:8000]
                    labels: {service: sglang, source: sglang, container_name: model-sg-dsv4-flash-fp4-tp2-r2, model: deepseek-ai/DeepSeek-V4-Flash, model_path: deepseek-ai/DeepSeek-V4-Flash, precision: fp4, deployment: gpu31-dsv4-flash-bare, env: "${ENV}", host: "${CVM_HOST}", host_machine: "${CVM_HOST}", cvm_name: "${CVM_NAME}", ip: "${HOST_IP}", port: "30002", instance: "2"}
              - job_name: sglang-r3
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [model-sg-dsv4-flash-fp4-tp2-r3:8000]
                    labels: {service: sglang, source: sglang, container_name: model-sg-dsv4-flash-fp4-tp2-r3, model: deepseek-ai/DeepSeek-V4-Flash, model_path: deepseek-ai/DeepSeek-V4-Flash, precision: fp4, deployment: gpu31-dsv4-flash-bare, env: "${ENV}", host: "${CVM_HOST}", host_machine: "${CVM_HOST}", cvm_name: "${CVM_NAME}", ip: "${HOST_IP}", port: "30003", instance: "3"}
              - job_name: sglang-r4
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [model-sg-dsv4-flash-fp4-tp2-r4:8000]
                    labels: {service: sglang, source: sglang, container_name: model-sg-dsv4-flash-fp4-tp2-r4, model: deepseek-ai/DeepSeek-V4-Flash, model_path: deepseek-ai/DeepSeek-V4-Flash, precision: fp4, deployment: gpu31-dsv4-flash-bare, env: "${ENV}", host: "${CVM_HOST}", host_machine: "${CVM_HOST}", cvm_name: "${CVM_NAME}", ip: "${HOST_IP}", port: "30004", instance: "4"}
              - job_name: dcgm
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: [dcgm-dsv4-flash:9400]
                    labels: {service: dcgm-exporter, source: dcgm-exporter, container_name: dcgm-dsv4-flash, model: deepseek-ai/DeepSeek-V4-Flash, deployment: gpu31-dsv4-flash-bare, env: "${ENV}", host: "${CVM_HOST}", host_machine: "${CVM_HOST}", cvm_name: "${CVM_NAME}", ip: "${HOST_IP}", port: "9400"}

      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 512
          spike_limit_mib: 128
        resource:
          attributes:
            - {key: host.name, value: "$${env:DD_HOSTNAME}", action: upsert}
            - {key: cvm.name, value: "$${env:CVM_NAME}", action: upsert}
            - {key: host.machine, value: "$${env:CVM_HOST}", action: insert}
            - {key: deployment.environment, value: "$${env:ENV}", action: upsert}
            - {key: service.namespace, value: near-ai, action: insert}
        batch:
          send_batch_size: 1024
          send_batch_max_size: 2048
          timeout: 5s

      exporters:
        otlphttp/gateway:
          endpoint: https://telemetry.infra.near.ai
          headers:
            Authorization: "Bearer $${env:MONITORING_INGEST_TOKEN}"
          sending_queue:
            queue_size: 128
            storage: file_storage

      extensions:
        file_storage:
          directory: /var/lib/otelcol-contrib/storage
          create_directory: true

      service:
        extensions: [file_storage]
        pipelines:
          metrics/app:
            receivers: [prometheus/apps]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
        telemetry:
          metrics:
            address: localhost:8888
          logs:
            level: info
