# STATUS: EXPERIMENT — private gpu31 bare-metal validation only.
# Four independent TP2 replicas, no EAGLE, no inference-proxy, no registrar,
# no dstack socket, and no public listener. Promotion requires a separate
# production design; this experiment requires a 60-minute validation soak.

x-logging-conf: &logging-conf
  driver: json-file
  options:
    max-size: 100m
    max-file: "10"
    labels: com.datadoghq.ad.logs,com.docker.compose.service

x-dsv4-common: &dsv4-common
  image: lmsysorg/sglang@sha256:6bb5fee34b6c4537c09a4775e2292ac40350d5ad1218fcc835b2692142f443b1
  init: true
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535
  volumes:
    - /data/models/huggingface:/root/.cache/huggingface
    - /data/cache/sglang:/root/.cache/deep_gemm
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - SGLANG_DSV4_FP4_EXPERTS=1
    - SGLANG_ENABLE_UNIFIED_RADIX_TREE=1
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-dsv4-command: &dsv4-command
  - /bin/bash
  - -lc
  - |
    set -euo pipefail
    command -v numactl >/dev/null
    exec numactl --membind="$${GPU_NUMA_NODE}" \
      sglang serve \
      --trust-remote-code \
      --model-path deepseek-ai/DeepSeek-V4-Flash \
      --revision 553034d7dd9e06c2eeaee68cf85a17d6d4754cf0 \
      --tp 2 \
      --moe-runner-backend marlin \
      --cuda-graph-max-bs 64 \
      --mem-fraction-static 0.83 \
      --max-running-requests 64 \
      --max-queued-requests 16 \
      --schedule-conservativeness 1.3 \
      --enable-mixed-chunk \
      --chunked-prefill-size 8192 \
      --watchdog-timeout 1800 \
      --disable-custom-all-reduce \
      --tool-call-parser deepseekv4 \
      --reasoning-parser deepseek-v4 \
      --port 8000 \
      --host 0.0.0.0 \
      --enable-cache-report \
      --enable-metrics \
      --log-requests-level 0 \
      --served-model-name deepseek-ai/DeepSeek-V4-Flash

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        uvx --from 'huggingface_hub[hf_xet]' hf download \
          deepseek-ai/DeepSeek-V4-Flash \
          --revision 553034d7dd9e06c2eeaee68cf85a17d6d4754cf0
    volumes:
      - /data/models/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    logging: *logging-conf
    labels:
