                      precision: "fp8"
                      deployment: "glm53-flash-dsv4-flash"
                      config_variant: "vllm-tp4-mtp5-kpool-tail-v3"
                      patch_set: "kpool-target-draft-inplace-mamba-copy-race-slot-bounds-greedy-thinking-budget"
                      thinking_budget_policy: "max8192-quarter-output"
                      request_logging: "full-length-metadata"
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
