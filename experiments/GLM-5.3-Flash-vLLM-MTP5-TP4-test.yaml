configs:
  glm53_request_defaults:
    content: |
      #!/usr/bin/env python3
      """Apply a bounded GLM thinking budget without overriding client values."""

      from __future__ import annotations

      import json
      import os
      from typing import Awaitable, Callable


      CHAT_COMPLETIONS_PATH = "/v1/chat/completions"


      def _budget_from_env() -> int:
          raw = os.environ.get("NEARAI_DEFAULT_THINKING_TOKEN_BUDGET", "8192")
          try:
              budget = int(raw)
          except ValueError as exc:
              raise RuntimeError(
                  "NEARAI_DEFAULT_THINKING_TOKEN_BUDGET must be an integer"
              ) from exc
          if budget < 0:
              raise RuntimeError(
                  "NEARAI_DEFAULT_THINKING_TOKEN_BUDGET must be non-negative"
              )
          return budget


      def _bounded_default_budget(payload: dict, configured_budget: int) -> int:
          """Reserve at least three quarters of an explicit limit for output."""

          max_output_tokens = payload.get("max_completion_tokens")
          if not isinstance(max_output_tokens, int) or isinstance(
              max_output_tokens, bool
          ):
              max_output_tokens = payload.get("max_tokens")
          if not isinstance(max_output_tokens, int) or isinstance(
              max_output_tokens, bool
          ):
              return configured_budget
          return min(configured_budget, max(0, max_output_tokens // 4))


      class RequestDefaultsMiddleware:
          """Set a thinking budget only when the client omitted the field."""

          def __init__(self, app: Callable[..., Awaitable[None]]) -> None:
              self.app = app
              self.default_thinking_token_budget = _budget_from_env()

          async def __call__(
              self, scope: dict, receive: Callable, send: Callable
          ) -> None:
              if (
                  scope.get("type") != "http"
                  or scope.get("method") != "POST"
                  or scope.get("path") != CHAT_COMPLETIONS_PATH
              ):
                  await self.app(scope, receive, send)
                  return

              parts: list[bytes] = []
              terminal_message: dict | None = None
              while True:
                  message = await receive()
                  if message.get("type") != "http.request":
                      terminal_message = message
                      break
                  parts.append(message.get("body", b""))
                  if not message.get("more_body", False):
                      break

              original_body = b"".join(parts)
              effective_body = original_body
              try:
                  payload = json.loads(original_body)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  payload = None
              if (
                  isinstance(payload, dict)
                  and "thinking_token_budget" not in payload
              ):
                  payload["thinking_token_budget"] = (
                      _bounded_default_budget(
                          payload, self.default_thinking_token_budget
                      )
                  )
                  effective_body = json.dumps(
                      payload,
                      ensure_ascii=False,
                      separators=(",", ":"),
                  ).encode("utf-8")

              if effective_body is not original_body:
                  headers = [
                      (name, value)
                      for name, value in scope.get("headers", [])
                      if name.lower() != b"content-length"
                  ]
                  headers.append(
                      (b"content-length", str(len(effective_body)).encode())
                  )
                  scope = {**scope, "headers": headers}

              delivered = False

              async def receive_wrapper() -> dict:
                  nonlocal delivered
                  if not delivered:
                      delivered = True
                      return {
                          "type": "http.request",
                          "body": effective_body,
                          "more_body": False,
                      }
                  if terminal_message is not None:
                      return terminal_message
                  return await receive()

              await self.app(scope, receive_wrapper, send)

  otelcol_app_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        filelog/docker_containers:
          include: [/var/lib/docker/containers/*/*-json.log]
          start_at: end
          storage: file_storage
          include_file_path: true
          operators:
            - type: json_parser
              parse_from: body
              parse_to: attributes
              timestamp:
                parse_from: attributes.time
                layout_type: gotime
                layout: '2006-01-02T15:04:05.999999999Z07:00'
              on_error: send_quiet
            - type: move
              from: attributes.log
              to: body
              if: 'attributes.log != nil'
            - type: move
              from: attributes.stream
              to: attributes["log.iostream"]
              if: 'attributes.stream != nil'
            - type: remove
              field: attributes.time
              if: 'attributes.time != nil'
            - type: regex_parser
              parse_from: attributes["log.file.path"]
              regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]{12})[a-f0-9]*/'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model:(?P<model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'served_model:(?P<served_model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model_path:(?P<model_path>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'precision:(?P<precision>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'deployment:(?P<deployment>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ip:(?P<ip>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'port:(?P<port>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'env:(?P<env>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'host:(?P<host>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'instance:(?P<instance>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'replica:(?P<replica>[^",\]]+)'
              on_error: send_quiet
            - type: add
              field: attributes["service.name"]
              value: cvm-docker

        prometheus/apps:
          config:
            scrape_configs:
              - job_name: vllm-model-vllm-glm53-fp8-tp4
