# STATUS: EXPERIMENT — gpu31 root-cause candidate, not yet qualified on gpu30.
# Keep the live SGLang pack as the rollback and do not promote this file to
# prod/ until gpu30 repeats finite-logit correctness, text/tools/stream/image
# gates, full-context coverage, and a 30-minute zero-failure soak.
#
x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

# gpu30 retry layout (2026-08-29): DeepSeek-V4-Flash-0731 remains unchanged
# on GPUs 0-3. GLM-5.3-Flash uses GPUs 4-7 as one complete NVLink island.
#
# The GLM arm is the exact runtime configuration exercised on a four-H200 gpu31
# dev arm: pinned vLLM base plus seven fail-loud patched files, native FP8 weights,
# BF16 KV cache on Hopper, TP4, normal CUDA graphs and custom all-reduce,
# official MTP5, the corrected chat template, full 1,048,576-token context,
# 0.82 GPU-memory utilization, 32 sequences, and an 8,192-token batch ceiling.
# The patched arm exposes 2,120,753 aggregate KV-cache tokens.
#
# Production-specific additions are intentionally narrow: retain the stable
# served name z-ai/glm-5.3-flash, report cached prompt tokens for billing, and
# mount the dev-qualified request middleware that defaults an omitted
# thinking_token_budget to the smaller of 8,192 or one quarter of an explicit
# output-token limit. This keeps hidden reasoning from consuming a short
# response budget while preserving every explicit client value (including JSON
# null). clear_thinking=true is supplied to the pinned template.
# This experiment intentionally enables full-length request metadata logging
# and targeted synchronous CUDA/KPool/sampler/NCCL/C++ diagnostics while
# qualification is in progress. CUDA_LAUNCH_BLOCKING is temporary: a TP4
# qualification boot reached sampler warmup after graph capture, where all four
# ranks reported a ScatterGatherKernel index assertion. A synchronous rerun
# localized it to unchecked top-k indices in the MTP rejection sampler.
# Remove the verbose request logging after the stable config is selected.
#
# gpu31 isolated the startup/CUDA corruption to KPool-tail metadata in the
# pinned vLLM image: target and MTP-draft metadata both dropped `positions`,
# the generic slot kernel indexed the one-block tail table with raw positions,
# and the specialized rewrite cloned a transient tensor that CUDA graphs could
# not retain. The inline build applies the KPool fix from vLLM #53906 to both
# target and MTP-draft paths, rewrites the persistent slot tensor in place,
# backports the overlapping Mamba state-copy fix (vLLM #50729), and
# bounds-checks the generic slot-table loads (#54296). It also backports the
# MRV2 greedy-sampling guard from vLLM #52284: without it, a request whose only
# logits processor is thinking_token_budget bypasses budget enforcement.
# The targeted assertion remains enabled so any missed KPool caller fails at
# startup instead of becoming an asynchronous CUDA fault.
#
# This complete pack is derived from prod/glm53-flash-dsv4-flash.yaml at
# v0.0.377. DeepSeek, proxy security, nginx, registrar, DCGM, and OTel plumbing
# stay unchanged except for the GLM engine identity/scrape target. The live
# SGLang pack at v0.0.377 is the immutable rollback target.

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:b183677a5d32267539b9b21ec45327a4f3be0a013afeb608c68c4d76e9472e36
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

