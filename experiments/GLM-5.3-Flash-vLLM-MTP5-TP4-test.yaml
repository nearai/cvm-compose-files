x-vllm-glm53-flash-common: &vllm-glm53-flash-common
  <<: *nvidia
  init: true
  # Exact image and capacity settings from the healthy dev MTP5 arm. The
  # model and corrected template revisions are already fetched by the shared
  # downloader. A fresh compile-cache namespace prevents reuse of gpu30's
  # earlier baseline artifacts without changing the runtime implementation.
  image: nearai/glm53-vllm-mtp5:kpool-tail-v2
  build: *vllm-glm53-flash-build
  command: >
      /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/84c6a6aa9497188e15a635ba793b0f95a79b1033
      --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
      --served-model-name z-ai/glm-5.3-flash
      --tensor-parallel-size 4
      --no-enable-flashinfer-autotune
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja
      --chat-template-content-format openai
      --default-chat-template-kwargs '{"clear_thinking":true}'
      --speculative-config '{"method":"mtp","num_speculative_tokens":5}'
      --middleware glm53_request_defaults.RequestDefaultsMiddleware
      --gpu-memory-utilization 0.82
      --max-model-len 1048576
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --enable-prompt-tokens-details
      --enable-log-requests
      --max-log-len 0
      --host 0.0.0.0
      --port 8000
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - vllm_cache:/root/.cache/vllm
  configs:
    - source: glm53_request_defaults
      target: /opt/nearai/glm53_request_defaults.py
      mode: 0444
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - HF_HUB_DISABLE_TELEMETRY=1
    - DO_NOT_TRACK=1
    - VLLM_ENABLE_CUDA_COMPATIBILITY=0
    - VLLM_ENGINE_READY_TIMEOUT_S=3600
    - VLLM_CACHE_ROOT=/root/.cache/vllm/glm53-flash-tp4-mtp5-kpool-tail-v3
    # DEBUG turns on a breakable-CUDA-graph pointer invariant in this exact
    # vLLM build; warmup legitimately changes the top-level 3 -> 2 inputs for
    # batch 224, so that diagnostic mode is not a valid serving gate.
    - VLLM_LOGGING_LEVEL=INFO
    - NEARAI_GLM53_KPOOL_ASSERT=1
    - NEARAI_GLM53_SAMPLER_DEBUG=1
    - CUDA_LAUNCH_BLOCKING=1
    - TORCH_SHOW_CPP_STACKTRACES=1
    # PyTorch otherwise launches addr2line for expected compile-probe
    # exceptions and can stall graph-memory profiling indefinitely.
    - TORCH_DISABLE_ADDR2LINE=1
    - TORCH_CPP_LOG_LEVEL=INFO
    - NCCL_DEBUG=INFO
    - NCCL_DEBUG_SUBSYS=INIT,COLL
    - PYTHONPATH=/opt/nearai
    - NEARAI_DEFAULT_THINKING_TOKEN_BUDGET=8192
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  cap_add:
    - SYS_NICE
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-distroless
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  restart: unless-stopped
  logging: *logging-conf

x-dsv4-flash-common: &dsv4-flash-common
  <<: *nvidia
  init: true
  # DeepSeek-V4-Flash-0731 target-only TP4 sparse-prefill-on configuration.
  # The single replica consumes four H200 GPUs; mixed 8192-token prefill, one
  # continuous decode step, and a 4096-token admission reserve bound
  # long-prefill interference. This pinned nightly includes the upstream
  # overlap-scheduler WAR-fence alignment from sgl-project/sglang#33587.
  # DSPARK remains disabled because it is not qualified for this mixed workload.
  # gpu04 uses the same DeepSeek serving settings, with different GPU placement.
  image: docker.io/nearaidev/sglang@sha256:5bc4bc0dfd3629af7e57168098b5e76b4206dcb02b8ed8a872aebfd153ff240b
  command: >
      sglang serve
      --trust-remote-code
      --model-path deepseek-ai/DeepSeek-V4-Flash-0731
      --revision 7872f01b1d1fe23eabc4c98b48bffcef5a386062
      --tp-size 4
      --kv-cache-dtype fp8_e4m3
      --moe-runner-backend marlin
      --cuda-graph-max-bs 64
      --mem-fraction-static 0.83
      --max-running-requests 64
      --max-queued-requests 16
      --schedule-conservativeness 1.3
      --num-continuous-decode-steps 1
      --enable-mixed-chunk
      --chunked-prefill-size 8192
      --max-prefill-tokens 16384
      --swa-full-tokens-ratio 0.1
      --watchdog-timeout 1800
      --disable-custom-all-reduce
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --json-model-override-args '{"dsv4_reasoning_effort_profile":"official"}'
      --port 8000
      --host 0.0.0.0
      --enable-cache-report
      --enable-metrics
      --log-requests-level 0
      --served-model-name deepseek-ai/DeepSeek-V4-Flash
      ${DSV4_RETURN_HIDDEN_STATES:+--enable-return-hidden-states}
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - kernel_cache:/root/.cache/deep_gemm
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - SGLANG_ENABLE_SPEC_V2=1
    - SGLANG_CHUNKED_PREFILL_ADMISSION_RESERVE=4096
    - SGLANG_DSV4_FP4_EXPERTS=1
    # Matched H200 A/B: 10.47M -> 11.53M KV tokens per TP4 replica (+10%).
    - SGLANG_DSV4_COMPRESS_STATE_DTYPE=bf16
    # Containment for sgl-project/sglang#34718: avoid TopK v2's 65K-131K
    # streaming band until its long-context illegal-address failure is fixed.
    - SGLANG_OPT_USE_TOPK_V2=0
    - SGLANG_ENABLE_UNIFIED_RADIX_TREE=1
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    - SGLANG_OPT_FLASHMLA_SPARSE_PREFILL=1
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Downloading zai-org/GLM-5.3-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
        echo "Downloading corrected GLM-5.3-Flash chat template..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash chat_template.jinja --revision 3f1971b7b5f7a528c9c4ef6212c8785298a8c24a
        echo "Downloading deepseek-ai/DeepSeek-V4-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4-Flash --revision 553034d7dd9e06c2eeaee68cf85a17d6d4754cf0
        echo "Downloading deepseek-ai/DeepSeek-V4-Flash-0731..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4-Flash-0731 --revision 7872f01b1d1fe23eabc4c98b48bffcef5a386062
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:zai-org/GLM-5.3-Flash","served_model:z-ai/glm-5.3-flash","deployment:glm53-flash-dsv4-flash","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Dormant during normal deploys. Target this service explicitly with the
  # maintenance profile when one model's shared HF cache must be evicted.
  # Inlined copy of the root cleanup-hf-model.yaml service: compose-manager's
  # compose/up fetches only the requested file, so cross-file `extends:` /
  # `include:` must not be used here (they fail at config load).
  hf-cleanup:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: hf-cleanup
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        : "$${MODEL_NAME:?MODEL_NAME env var is required (e.g. zai-org/GLM-5-FP8)}"

        echo "=== Disk usage ==="
        df -h /root/.cache 2>/dev/null || df -h /

        echo ""
        echo "=== Cached model weights ==="
        HUB=/root/.cache/huggingface/hub
        if ls "$$HUB"/models--* >/dev/null 2>&1; then
          du -sh "$$HUB"/models--* | sort -rh
        else
          echo "(none)"
        fi
        echo ""
        echo "Total HF cache: $$(du -sh $$HUB 2>/dev/null | cut -f1)"

        echo ""
        echo "=== Cleanup ==="
        SAFE=$$(printf '%s' "$$MODEL_NAME" | sed 's|/|--|g')
        TARGET="$$HUB/models--$$SAFE"
        echo "MODEL_NAME=$$MODEL_NAME"
        echo "TARGET=$$TARGET"
        if [ ! -d "$$TARGET" ]; then
          echo "Not found — nothing to remove."
          exit 0
        fi
        echo "Removing $$(du -sh "$$TARGET" | cut -f1) ..."
        rm -rf "$$TARGET"
        echo "Removed $$TARGET"
        echo "Disk after: $$(df -h /root/.cache 2>/dev/null | tail -1 || df -h / | tail -1)"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - MODEL_NAME=${MODEL_NAME}
    # Verbatim from cleanup-hf-model.yaml (not the file-wide *logging-conf) so the
    # rendered service is unchanged from the previous `extends` result.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.datadoghq.ad.logs"

  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-glm53
      - proxy-dsv4-flash
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8444:443"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-dsv4-flash","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000"]}]'

  model-proxy-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    healthcheck:
      # Unhealthy if the registration loop hasn't ticked in 3m (e.g. wedged
      # before the loop, or the loop died). Surfaces silent registrar failures
      # in `docker ps` / Datadog. See cvm-compose-files#57.
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    environment:
      - HOST_IP=${HOST_IP}
      - HTTP_PORT=${HTTP_PORT:-8000}
      - TLS_PORT=${TLS_PORT:-8444}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-dsv4-flash","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # --- GLM-5.3-Flash proxy ---
  proxy-glm53:
    <<: *vllm-proxy-common
    container_name: proxy-glm53
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
