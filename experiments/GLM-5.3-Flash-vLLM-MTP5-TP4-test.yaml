                      max_queued_requests: "16"
                      schedule_conservativeness: "1.3"
                      sglang_revision: "nightly-c0b6474-near-v1"
                      engine_image: "5bc4bc0dfd36"
              - job_name: dcgm-dcgm-glm53
                scrape_interval: 15s
