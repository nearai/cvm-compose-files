                      instance: "1"
                      config_variant: "dsv4-0731-tp4-target-only-sparse-on"
                      decode_mode: "target_only"
                      sparse_prefill: "on"
                      chunk_size: "8192"
                      ab_arm: "tp4-target-only-sparse-on-gpu30"
