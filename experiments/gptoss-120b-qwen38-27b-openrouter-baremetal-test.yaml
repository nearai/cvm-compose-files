  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-qwen38-27b
    # Host network so ufw (INPUT) governs 8002/8006: Docker-published ports bypass ufw on this host
    # (empty DOCKER-USER chain). ufw admits them only from the openrouter-gateway hosts.
    network_mode: host
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:multi","deployment:gptoss-qwen38-openrouter-gpu32","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  certbot:
    image: certbot/dns-cloudflare@sha256:742dbd2e61c8709b930712c38958386c3cb3928e09eeb1f1e490600c127e2edb  # = cvm-ansible-playbooks certbot_image
    container_name: certbot
    # Host network: HTTP-01 standalone answers on :80 (ufw: 80/tcp open for ACME).
    network_mode: host
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
    volumes:
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        if [ -n "$$CERTBOT_EMAIL" ]; then acct="--email $$CERTBOT_EMAIL --no-eff-email"; else acct=--register-unsafely-without-email; fi
        while :; do
          if [ ! -f /etc/letsencrypt/live/gpu32.hosts.near.ai/fullchain.pem ]; then
            # Only try once DNS points here: Let's Encrypt allows 5 failed validations per hostname per hour.
            ip=$$(python3 -c "import socket; print(socket.gethostbyname('gpu32.hosts.near.ai'))" 2>/dev/null)
            if [ "$$ip" = "180.94.16.206" ]; then
            certbot certonly --standalone --http-01-port 80 --non-interactive --agree-tos $$acct \
              --key-type ecdsa --elliptic-curve secp256r1 --cert-name gpu32.hosts.near.ai -d gpu32.hosts.near.ai \
              || echo "certbot failed; retrying in 5 min"
            else echo "gpu32.hosts.near.ai does not resolve to 180.94.16.206 yet ($${ip:-none}); waiting"; fi
            sleep 300 & wait $${!}
          else
            certbot renew --standalone --http-01-port 80 --non-interactive
            sleep 12h & wait $${!}
          fi
        done
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"certbot","service":"certbot","tags":["model:multi","deployment:gptoss-qwen38-openrouter-gpu32","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  nginx-tls:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx-tls
    depends_on:
      - proxy-qwen38-27b
    # Host network for the same ufw reason as nginx. Waits for the cert, then serves TLS; reloads when it changes.
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cert=/etc/letsencrypt/live/gpu32.hosts.near.ai/fullchain.pem
        until [ -f "$$cert" ]; do echo "waiting for $$cert"; sleep 30; done
        last=$$(stat -L -c %Y "$$cert")
        (while :; do sleep 60; cur=$$(stat -L -c %Y "$$cert" 2>/dev/null); if [ -n "$$cur" ] && [ "$$cur" != "$$last" ]; then last=$$cur; echo "$$cert changed, reloading nginx"; nginx -s reload; fi; done) &
        exec nginx -g "daemon off;"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    configs:
      - source: nginx_tls_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:multi","deployment:gptoss-qwen38-openrouter-gpu32","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  otelcol-contrib:
    image: otel/opentelemetry-collector-contrib@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    container_name: otelcol-contrib
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0:0"
    mem_limit: "768m"
    environment:
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      - CVM_NAME=${CVM_NAME:-unknown}
      - CVM_HOST=${CVM_HOST:-unknown}
      - DD_HOSTNAME=${DD_HOSTNAME:-unknown}
      - ENV=${ENV:-unknown}
      - HOST_IP=${HOST_IP:-unknown}
    expose:
      - "4317"
      - "4318"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol_app_storage:/var/lib/otelcol-contrib
    configs:
      - source: otelcol_app_config
        target: /etc/otelcol-contrib/config.yaml
        mode: 0444
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      com.datadoghq.ad.logs: '[{"source":"otelcol-contrib","service":"otelcol-contrib","tags":["model:multi","deployment:gptoss-qwen38-openrouter-gpu32","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'


volumes:
  otelcol_app_storage:
  vllm_cache:
  letsencrypt:

configs:
  otelcol_app_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        filelog/docker_containers:
          include: [/var/lib/docker/containers/*/*-json.log]
          start_at: end
          storage: file_storage
          include_file_path: true
          operators:
            - type: json_parser
              parse_from: body
              parse_to: attributes
              timestamp:
                parse_from: attributes.time
                layout_type: gotime
                layout: '2006-01-02T15:04:05.999999999Z07:00'
              on_error: send_quiet
            - type: move
              from: attributes.log
              to: body
              if: 'attributes.log != nil'
            - type: move
              from: attributes.stream
              to: attributes["log.iostream"]
              if: 'attributes.stream != nil'
            - type: remove
              field: attributes.time
              if: 'attributes.time != nil'
            - type: regex_parser
              parse_from: attributes["log.file.path"]
              regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]{12})[a-f0-9]*/'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model:(?P<model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'served_model:(?P<served_model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'deployment:(?P<deployment>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ip:(?P<ip>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'port:(?P<port>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'env:(?P<env>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'host:(?P<host>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'instance:(?P<instance>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'gpu_pair:(?P<gpu_pair>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ppcie:(?P<ppcie>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'config_variant:(?P<config_variant>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'quantization:(?P<quantization>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'eagle:(?P<eagle>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
