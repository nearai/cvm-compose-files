              - job_name: vllm-model-vllm-qwen38-27b-fp8-tp1-r6
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-vllm-qwen38-27b-fp8-tp1-r6:8000']
                    labels:
                      service: "vllm"
                      source: "vllm"
                      container_name: "model-vllm-qwen38-27b-fp8-tp1-r6"
                      model: "Qwen/Qwen3.8-27B-FP8"
                      deployment: "gptoss-qwen38-openrouter-gpu32"
                      env: "${ENV}"
