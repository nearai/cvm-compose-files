# STATUS: EXPERIMENT — bare-metal (non-TEE) OpenRouter capacity on gpu31: no dstack CVM, nginx, registrar or dcgm; otelcol optional.
#
# 4x gpt-oss-120b + 3x Qwen3.8-27B, one TP1 replica per GPU, on the gpu31 lab host (180.94.16.204, CC off). Served to OpenRouter
# only, through the OpenRouter gateway (cvm-ansible-playbooks vars/openrouter_gateway*.yaml), never to private-
# inference users: Pierre (2026-10-07): "for gpt oss 120b, it can run in non TEE. as it will be only for OpenRouter
# users". GPUs 0-6 only: GPU 7 is kept free for the Sage deployment (Pranav, 2026-10-07); do not add it.
#
# Engine configs are the winners of tee-bench exp 31 (gpu31, bare, input+output tokens/s at the plateau, unique
# prompts per point, A/A within ~1.5%; nearai/tee-bench evidence/gpu31-gptoss-qwen38-tuning):
#   gpt-oss-120b: vLLM 0.26 + FP8 KV + 32K batched tokens. Prod-like 32K:670 22.9K tok/s (+5% vs BF16 KV, TTFT p50 at
#                 64 running 4.0 vs 12.4 s), chat 2K:500 27.9K at 1024 running (+16-18%), decode-heavy 9.4K (+12%).
#                 GSM8K-200 0.975. vLLM v0.31 and the FlashInfer MXFP4 MoE path were no faster; SGLang v0.5.21 was slower.
#   Qwen3.8-27B:  vLLM v0.31, BF16 KV. Prod-like 11.0-11.1K tok/s vs 9.1-9.3K on the SGLang prod digest (+20%),
#                 GSM8K-200 0.975 (SGLang 0.970). FP8 KV was slower and scored 0.960; 32K batched tokens tied 16K.
#
# Topology: one inference-proxy per replica (not one per model as in the CVM packs) so the OpenRouter gateway lists
# every replica as its own backend and sees that replica's queue on /v1/metrics; with one proxy per model the
# gateway is not replica-aware and 429s while replicas sit idle (Lloyd, 2026-09-24). Proxies run in non-TEE mode
# (DEV, GPU_NO_HW_MODE, NON_TEE_DEPLOYMENT: no dstack socket, no attestation) and accept only the gateway's trusted
# bearer (TOKEN = the fleet PROXY_TOKEN); usage is billed by the gateway, not here.
#   gpt-oss r1..r4 -> host :8101-8104 (GPUs 0-3)      Qwen3.8 r1..r3 -> host :8201-8203 (GPUs 4-6)
# The host firewall (ufw) allows these ports only from the openrouter-gateway inventory hosts (cpu01/02/03).
#
# Deploy (plain docker compose on gpu31; compose-manager/KMS are CVM-only):
#   cd /data/gpu31-openrouter && docker compose --env-file .env -f <this file> -p openrouter up -d
#   .env (mode 600): PROXY_TOKEN=..., GPTOSS_HF_DIR=..., QWEN38_HF_DIR=...
# Weights are pre-staged on the host (no model-downloader; gpu31's IP is rate-limited by Hugging Face) and the
# engines run HF offline. Qwen3.8's cache is the host's shared /data/models/huggingface, mounted read-only.
# Soak (exp 31b): 0 failures over 30 min, all 7 replicas at once. Runbook + gateway hand-off: nearai/tee-bench plans/gpu31-openrouter-gptoss-qwen38/.

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-engine-common: &engine-common
  <<: *nvidia
  init: true
  restart: unless-stopped
  shm_size: 32g
  logging: *logging-conf
  volumes:
    - vllm_cache:/root/.cache/vllm
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 900s

x-gptoss-engine: &gptoss-engine
  <<: *engine-common
  image: vllm/vllm-openai@sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b  # vLLM 0.26.0
  volumes:
    - ${GPTOSS_HF_DIR:-/data/token-capacity-20261006/hf}:/root/.cache/huggingface
    - vllm_cache:/root/.cache/vllm
  environment:
    - HF_HUB_OFFLINE=1
    - VLLM_LOGGING_LEVEL=INFO
    - VLLM_CACHE_ROOT=/root/.cache/vllm/gptoss-120b
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  command:
    - openai/gpt-oss-120b
    - --revision=b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    - --served-model-name=openai/gpt-oss-120b
    - --tensor-parallel-size=1
    - --async-scheduling
    - --kv-cache-dtype=fp8
    - --gpu-memory-utilization=0.93
    - --max-num-seqs=1024
    - --max-num-batched-tokens=32768
    - --enable-auto-tool-choice
    - --tool-call-parser=openai
    - --host=0.0.0.0
    - --port=8000

x-qwen38-engine: &qwen38-engine
  <<: *engine-common
  image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3  # vLLM v0.31.0
  volumes:
    - ${QWEN38_HF_DIR:-/data/models/huggingface}:/root/.cache/huggingface:ro
    - vllm_cache:/root/.cache/vllm
  environment:
    - HF_HUB_OFFLINE=1
    - VLLM_LOGGING_LEVEL=INFO
    - VLLM_CACHE_ROOT=/root/.cache/vllm/qwen38-27b
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  command:
    - Qwen/Qwen3.8-27B-FP8
    - --revision=017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    - --served-model-name=Qwen/Qwen3.8-27B
    - --tensor-parallel-size=1
    - --async-scheduling
    - --gpu-memory-utilization=0.90
    - --max-num-seqs=256
    - --max-num-batched-tokens=16384
    - --reasoning-parser=qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - --host=0.0.0.0
    - --port=8000

x-proxy-common: &proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:d61357da39918a57126864a451eaf054f06a6989c03fe9a1666f7e6374ba6907
  restart: unless-stopped
  logging: *logging-conf

x-proxy-env: &proxy-env
  LOG_FORMAT: json
  TOKEN: ${PROXY_TOKEN}
  DEV: "1"
  GPU_NO_HW_MODE: "1"
  NON_TEE_DEPLOYMENT: "1"
  VLLM_BACKEND_HEALTH_PATH: /health
  VLLM_PROXY_MAX_REQUEST_SIZE: "104857600"
  # Engines' uvicorn closes idle keep-alive after 5 s; drop pooled connections first (same as the CVM packs).
  VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS: "3"

