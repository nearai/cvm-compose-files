              regex: 'eagle_prefill_fairness:(?P<eagle_prefill_fairness>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'sglang_revision:(?P<sglang_revision>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'engine_image:(?P<engine_image>[^",\]]+)'
              on_error: send_quiet
            - type: add
              field: attributes["service.name"]
              value: cvm-docker

        prometheus/apps:
          config:
            scrape_configs:
              - job_name: inference-proxy-proxy-qwen38-27b
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['proxy-qwen38-27b:8000']
                    labels:
                      service: "vllm-proxy"
                      source: "vllm-proxy"
                      container_name: "proxy-qwen38-27b"
