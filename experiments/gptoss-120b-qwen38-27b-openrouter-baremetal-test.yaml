# STATUS: EXPERIMENT — bare-metal (non-TEE) OpenRouter capacity on gpu32; not deployable through compose-manager/KMS.
#
# 7x Qwen3.8-27B, one TP1 replica per GPU (GPUs 0-6), on the gpu32 lab host (CC off). GPU 7 belongs to another
# workload and is never referenced here. OpenRouter traffic only, through the OpenRouter gateway.
# Until 2026-10-08 GPUs 0-3 ran 4x gpt-oss-120b; those replicas, their proxy and their exporter were removed
# (the x-gptoss-engine block and the downloader's gpt-oss line are kept so they can come back).
#
# Layout follows the prod packs (prod/qwen36-qwen38.yaml): model-downloader, one engine per GPU pinned by device_ids,
# ONE inference-proxy for the model pooling its replicas (VLLM_BACKEND_URLS + conversation affinity), nginx with one
# plain HTTP port (8006, the gateway's backend and probe port), one dcgm exporter and otelcol-contrib.
# Differences, all because this is a non-TEE bare-metal host:
#   - No model-proxy-registrar, on purpose: registering would put a non-TEE backend into cloud-api's
#     private-inference rotation for this model domain. The OpenRouter gateway lists this host directly.
#   - The proxy runs with DEV / GPU_NO_HW_MODE / NON_TEE_DEPLOYMENT (no dstack socket, no attestation, not privileged)
#     and accepts only the gateway's trusted bearer (TOKEN); the gateway bills, so no CLOUD_API_USAGE_TOKEN here.
#   - The gateway reaches port 8006 over a WireGuard tunnel (nearai/cvm-ansible-playbooks,
#     docs/openrouter-gateway-wireguard.md); the host firewall admits it on the tunnel interface only. The certbot and
#     nginx-tls services below predate the tunnel and are unused (no certificate was ever issued).
#   - nginx uses network_mode: host (so the host firewall applies; Docker-published ports would bypass it on this host)
#     and reaches the proxy on a loopback-only published port, 127.0.0.1:18006.
#   - Plain `docker compose` with a hand-kept .env (0600): PROXY_TOKEN, HUGGING_FACE_HUB_TOKEN, MONITORING_INGEST_TOKEN,
#     ENV, HOST_IP, CVM_HOST=gpu32, CVM_NAME=none, HF_DIR.
#
# Engine config: vLLM v0.31, BF16 KV (11.1K tok/s per replica in tee-bench exp 31; GSM8K-200 0.975).
# Usage reports cached prompt tokens (--enable-prompt-tokens-details), so cache reads can be billed at the cache price.
#
#   cd /data/gpu32-openrouter && sudo docker compose --env-file .env -f compose.yaml -p openrouter up -d

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-downloader-common: &downloader-common
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  entrypoint: ["sh", "-c"]
  restart: "no"
  logging: *logging-conf

x-engine-common: &engine-common
  <<: *nvidia
  init: true
  restart: unless-stopped
  shm_size: 32g
  logging: *logging-conf
  depends_on:
    model-downloader:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 900s

x-gptoss-engine: &gptoss-engine
  <<: *engine-common
  image: vllm/vllm-openai@sha256:770fe65b2c73ee74a5c42165cf3433de4048cc2cd9c57a937ca4e35aba5aa87b  # vLLM 0.26.0
  volumes:
    - ${HF_DIR:-/data/gpu32-openrouter/hf}:/root/.cache/huggingface
    - vllm_cache:/root/.cache/vllm
  environment:
    - HF_HUB_OFFLINE=1
    - VLLM_LOGGING_LEVEL=INFO
    - VLLM_CACHE_ROOT=/root/.cache/vllm/gptoss-120b
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  command:
    - openai/gpt-oss-120b
    - --revision=b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    - --served-model-name=openai/gpt-oss-120b
    - --tensor-parallel-size=1
    - --async-scheduling
    - --kv-cache-dtype=fp8
    - --gpu-memory-utilization=0.93
    - --max-num-seqs=1024
    - --max-num-batched-tokens=32768
    # Report cached prompt tokens in usage (prompt_tokens_details.cached_tokens), so cache reads are billed at the cache price.
    - --enable-prompt-tokens-details
    - --enable-auto-tool-choice
    - --tool-call-parser=openai
    - --host=0.0.0.0
    - --port=8000

x-qwen38-engine: &qwen38-engine
  <<: *engine-common
  image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3  # vLLM v0.31.0
  volumes:
    - ${HF_DIR:-/data/gpu32-openrouter/hf}:/root/.cache/huggingface
    - vllm_cache:/root/.cache/vllm
  environment:
    - HF_HUB_OFFLINE=1
    - VLLM_LOGGING_LEVEL=INFO
    - VLLM_CACHE_ROOT=/root/.cache/vllm/qwen38-27b
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  command:
    - Qwen/Qwen3.8-27B-FP8
    - --revision=017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    - --served-model-name=Qwen/Qwen3.8-27B
    - --tensor-parallel-size=1
    - --async-scheduling
    - --gpu-memory-utilization=0.90
    - --max-num-seqs=256
    - --max-num-batched-tokens=16384
    # Report cached prompt tokens in usage (prompt_tokens_details.cached_tokens), so cache reads are billed at the cache price.
    - --enable-prompt-tokens-details
    # With tool_choice "none" the tools are left out of the prompt, so the model answers in text. Without this it
    # still writes a tool call, the parser drops it, and the caller gets an empty message.
    - --exclude-tools-when-tool-choice-none
    - --reasoning-parser=qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - --host=0.0.0.0
    - --port=8000

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:d61357da39918a57126864a451eaf054f06a6989c03fe9a1666f7e6374ba6907
  # Same fd limits as the prod proxies (they inherit x-nvidia's ulimits). Without them one pooled proxy hits
  # EMFILE ("Too many open files") at ~500 concurrent streams (client + upstream socket each).
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  restart: unless-stopped
  logging: *logging-conf

x-proxy-env: &proxy-env
  LOG_FORMAT: json
  TOKEN: ${PROXY_TOKEN}
  DEV: "1"
  GPU_NO_HW_MODE: "1"
  NON_TEE_DEPLOYMENT: "1"
  VLLM_BACKEND_HEALTH_PATH: /health
  # Keep append-only conversations on the replica that already holds their prefix cache (inference-proxy #227).
  VLLM_BACKEND_CONVERSATION_AFFINITY: "1"
  VLLM_PROXY_MAX_REQUEST_SIZE: "104857600"
  # vLLM's uvicorn closes idle keep-alive after 5 s; drop pooled connections first (same as the prod packs).
  VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS: "3"
  # Per-client-IP limiter (default 100 req/s, burst 200). Every request here comes from the one OpenRouter gateway IP
  # (ufw admits nothing else), so the default would cap the whole model lane at 100 req/s; the gateway's admission
  # budget is the real limit. Raised for this host only.
  RATE_LIMIT_PER_SECOND: "1000"
  RATE_LIMIT_BURST_SIZE: "2000"

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:ed594cf53fe6942e84b07b0740cdcbb249fa4b39cb21feeebf93881ae51f0b5e
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  restart: unless-stopped
  logging: *logging-conf

services:
  model-downloader:
    <<: *downloader-common
    container_name: model-downloader
    command:
      - |
        set -e
        uvx --from 'huggingface_hub[hf_xet]' hf download openai/gpt-oss-120b --revision b5c939de8f754692c1647ca79fbf85e8c1e70f8a --exclude 'original/*' --exclude 'metal/*'
        uvx --from 'huggingface_hub[hf_xet]' hf download Qwen/Qwen3.8-27B-FP8 --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
        echo "Downloads complete."
    volumes:
      - ${HF_DIR:-/data/gpu32-openrouter/hf}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:multi","deployment:gptoss-qwen38-openrouter-gpu32","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  proxy-qwen38-27b:
    <<: *vllm-proxy-common
    container_name: proxy-qwen38-27b
    ports: ["127.0.0.1:18006:8000"]
    environment: {<<: *proxy-env, MODEL_NAME: Qwen/Qwen3.8-27B, VLLM_BACKEND_URLS: "http://model-vllm-qwen38-27b-fp8-tp1-r1:8000,http://model-vllm-qwen38-27b-fp8-tp1-r2:8000,http://model-vllm-qwen38-27b-fp8-tp1-r3:8000,http://model-vllm-qwen38-27b-fp8-tp1-r4:8000,http://model-vllm-qwen38-27b-fp8-tp1-r5:8000,http://model-vllm-qwen38-27b-fp8-tp1-r6:8000,http://model-vllm-qwen38-27b-fp8-tp1-r7:8000"}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:Qwen/Qwen3.8-27B","deployment:gptoss-qwen38-openrouter-gpu32","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-qwen38-27b"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "Qwen/Qwen3.8-27B"
      nearai.otel.deployment: "gptoss-qwen38-openrouter-gpu32"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.public_port: "8006"

