# Qwen/Qwen3.6-35B-A3B | SGLang | tp1
services:
  model-downloader:
    image: ghcr.io/astral-sh/uv@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        uvx --from 'huggingface_hub[hf_xet]' hf download Qwen/Qwen3.6-35B-A3B-FP8 --revision 95a723d08a9490559dae23d0cff1d9466213d989
    environment:
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN:?required}
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: "no"

  model-sg-qwen36-35b-a3b-tp1:
    image: docker.io/nearaidev/sglang@sha256:6de632a5e9422be4b6e84e32cf475679c0f29c4bb6d58984d873ff9f7ba92a65
    container_name: model-sg-qwen36-35b-a3b-tp1
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    command:
      - sglang
      - serve
      - --model-path
      - /root/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B-FP8/snapshots/95a723d08a9490559dae23d0cff1d9466213d989
      - --served-model-name
      - Qwen/Qwen3.6-35B-A3B
      - --tp
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enable-metrics
      - --log-requests-level
      - "0"
    environment:
      HF_HUB_OFFLINE: "1"
    labels:
      served_model: Qwen/Qwen3.6-35B-A3B
      model_path: Qwen/Qwen3.6-35B-A3B-FP8
      deployment: template-sglang
      engine_image: nearaidev/sglang
      instance: ${INSTANCE_LABEL:-default}
      config_variant: r1
    shm_size: 16g
    volumes:
      - hf-cache:/root/.cache/huggingface:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:

networks:
  default:
    name: dstack_default
    external: true
