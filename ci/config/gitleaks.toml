title = "cvm-compose-files"

[extend]
useDefault = true

# Known test values, matched by file and exact value rather than line number.
[[allowlists]]
description = "Dummy API key in the admin-auth redaction tests"
condition = "AND"
regexTarget = "match"
paths = [
  '''(^|/)docker/sglang-glm53-hicache-w4afp8/test_admin_auth_redaction\.py$''',
  '''(^|/)docker/sglang-(glm53-v0523|v0523-secure)/tests/test_admin_auth_redaction\.py$''',
]
regexes = ['''test-api-key-0123456789''']

[[allowlists]]
description = "SHA-256 of a patch file in the patch table"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)docker/sglang-glm53-hicache-w4afp8/apply-patches\.py$''']
regexes = ['''563d9d30ba47e8afc6570857d7d94f964d08a0a97ff8e2479dd59eece137753e''']
