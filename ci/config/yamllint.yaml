# Syntax, duplicate keys and anchors only; layout is left to the templates.
extends: default
ignore: |
  docker/
rules:
  braces: disable
  brackets: disable
  colons: disable
  commas: disable
  comments: disable
  comments-indentation: disable
  document-start: disable
  empty-lines: disable
  hyphens: disable
  indentation: disable
  line-length: disable
  new-line-at-end-of-file: enable
  new-lines: enable
  trailing-spaces: disable
  truthy: disable
  key-duplicates: enable
  anchors: enable
