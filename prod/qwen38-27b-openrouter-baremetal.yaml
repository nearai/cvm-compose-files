# Qwen3.8-27B for OpenRouter on a bare-metal (non-TEE) 8x H200 host: seven TP1 replicas (GPUs 0-6), two pooled
# proxies (one active, one standby) and nginx on :8006. Deployed with plain `docker compose -p openrouter` and a local
# .env, not compose-manager; no registrar, so it never joins the private-inference rotation.

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-downloader-common: &downloader-common
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  entrypoint: ["sh", "-c"]
  restart: "no"
  logging: *logging-conf

x-engine-common: &engine-common
  <<: *nvidia
  init: true
  restart: unless-stopped
  shm_size: 32g
  logging: *logging-conf
  depends_on:
    model-downloader:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 900s

x-qwen38-engine: &qwen38-engine
  <<: *engine-common
  image: vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e  # vLLM v0.33.0
  volumes:
    - ${HF_DIR:-/data/openrouter/hf}:/root/.cache/huggingface
    - vllm_cache:/root/.cache/vllm
  environment:
    - HF_HUB_OFFLINE=1
    - VLLM_LOGGING_LEVEL=INFO
    - VLLM_CACHE_ROOT=/root/.cache/vllm/qwen38-27b-v033
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  command:
    - Qwen/Qwen3.8-27B-FP8
    - --revision=017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    - --served-model-name=Qwen/Qwen3.8-27B
    - --tensor-parallel-size=1
    - --async-scheduling
    - --gpu-memory-utilization=0.90
    - --max-num-seqs=256
    - --max-num-batched-tokens=16384
    - --enable-prompt-tokens-details
    # Without this, tool_choice "none" still yields a tool call that the parser drops (empty message).
    - --exclude-tools-when-tool-choice-none
    - --reasoning-parser=qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - --host=0.0.0.0
    - --port=8000
    - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
    - --prefix-match-unit=16
    - --enable-mamba-shared-prefix-checkpoint
    - --kv-offloading-size=100
    - --kv-offloading-backend=native
    - --mamba-ssm-cache-dtype=bfloat16
    - --max-cudagraph-capture-size=1024

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:31ac94956077df3b48a3773a1530319aa415d1a8cd8ac2ed2e97b43f7d3836b3
  # Without raised fd limits a pooled proxy hits EMFILE at ~500 concurrent streams.
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  restart: unless-stopped
  logging: *logging-conf

x-proxy-env: &proxy-env
  LOG_FORMAT: json
  TOKEN: ${PROXY_TOKEN}
  DEV: "1"
  GPU_NO_HW_MODE: "1"
  NON_TEE_DEPLOYMENT: "1"
  VLLM_BACKEND_HEALTH_PATH: /health
  VLLM_BACKEND_CONVERSATION_AFFINITY: "1"
  VLLM_PROXY_MAX_REQUEST_SIZE: "104857600"
  VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS: "3"
  # All traffic comes from one gateway IP; the gateway's admission budget is the real limit.
  RATE_LIMIT_PER_SECOND: "1000"
  RATE_LIMIT_BURST_SIZE: "2000"

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:ed594cf53fe6942e84b07b0740cdcbb249fa4b39cb21feeebf93881ae51f0b5e
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  restart: unless-stopped
  logging: *logging-conf

services:
  model-downloader:
    <<: *downloader-common
    container_name: model-downloader
    command:
      - |
        set -e
        uvx --from 'huggingface_hub[hf_xet]' hf download Qwen/Qwen3.8-27B-FP8 --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
        echo "Downloads complete."
    volumes:
      - ${HF_DIR:-/data/openrouter/hf}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:multi","deployment:qwen38-openrouter-baremetal","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  proxy-qwen38-27b:
    <<: *vllm-proxy-common
    container_name: proxy-qwen38-27b
    ports: ["127.0.0.1:18006:8000"]
    environment: {<<: *proxy-env, MODEL_NAME: Qwen/Qwen3.8-27B, VLLM_BACKEND_URLS: "http://model-vllm-qwen38-27b-fp8-tp1-r1:8000,http://model-vllm-qwen38-27b-fp8-tp1-r2:8000,http://model-vllm-qwen38-27b-fp8-tp1-r3:8000,http://model-vllm-qwen38-27b-fp8-tp1-r4:8000,http://model-vllm-qwen38-27b-fp8-tp1-r5:8000,http://model-vllm-qwen38-27b-fp8-tp1-r6:8000,http://model-vllm-qwen38-27b-fp8-tp1-r7:8000", VLLM_PROXY_IMAGE_VALIDATION_DISABLED: "1"}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:Qwen/Qwen3.8-27B","deployment:qwen38-openrouter-baremetal","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-qwen38-27b"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "Qwen/Qwen3.8-27B"
      nearai.otel.deployment: "qwen38-openrouter-baremetal"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.public_port: "8006"

  # Standby proxy (nginx `backup`): recreate one proxy at a time and swap roles with `nginx -s reload`.
  proxy-qwen38-27b-b:
    <<: *vllm-proxy-common
    container_name: proxy-qwen38-27b-b
    ports: ["127.0.0.1:18016:8000"]
    environment: {<<: *proxy-env, MODEL_NAME: Qwen/Qwen3.8-27B, VLLM_BACKEND_URLS: "http://model-vllm-qwen38-27b-fp8-tp1-r1:8000,http://model-vllm-qwen38-27b-fp8-tp1-r2:8000,http://model-vllm-qwen38-27b-fp8-tp1-r3:8000,http://model-vllm-qwen38-27b-fp8-tp1-r4:8000,http://model-vllm-qwen38-27b-fp8-tp1-r5:8000,http://model-vllm-qwen38-27b-fp8-tp1-r6:8000,http://model-vllm-qwen38-27b-fp8-tp1-r7:8000", VLLM_PROXY_IMAGE_VALIDATION_DISABLED: "1"}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:Qwen/Qwen3.8-27B","deployment:qwen38-openrouter-baremetal","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-qwen38-27b-b"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "Qwen/Qwen3.8-27B"
      nearai.otel.deployment: "qwen38-openrouter-baremetal"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.public_port: "8006"

  model-vllm-qwen38-27b-fp8-tp1-r1:
    <<: *qwen38-engine
    container_name: model-vllm-qwen38-27b-fp8-tp1-r1
    deploy: {resources: {reservations: {devices: [{driver: nvidia, device_ids: ["4"], capabilities: [gpu]}]}}}
