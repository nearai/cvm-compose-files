# Isolated gpu04 GPU 7 soak project. No host-facing ports or serving registration.
name: coloc-soak

x-logging-conf: &logging-conf
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-qwen38: &qwen38
  <<: *nvidia
  init: true
  cap_add: [SYS_NICE]
  image: lmsysorg/sglang@sha256:febfb971c7352570fc445c466ebd6ffc9d896024958e544a60f2137fd85856b1
  # 0.50 instead of 0.85 leaves headroom for the filter and non-static growth.
  # Mamba cache 128 instead of 320 reduces persistent GPU memory.
  # Running 32 and queued 64 instead of 64/128 bound request admission.
  # Prefill chunks and maximum prefill 4096 instead of 8192 bound activations.
  # CUDA graphs stop at batch 32, matching the running-request ceiling.
  command: >
    sglang serve
    --trust-remote-code
    --model-path Qwen/Qwen3.8-27B-FP8
    --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    --served-model-name Qwen/Qwen3.8-27B
    --tp 1
    --mem-fraction-static 0.50
    --attention-backend flashinfer
    --mm-attention-backend fa3
    --chunked-prefill-size 4096
    --max-prefill-tokens 4096
    --enable-mixed-chunk
    --max-mamba-cache-size 128
    --max-running-requests 32
    --max-queued-requests 64
    --cuda-graph-max-bs 32
    --reasoning-parser qwen3
    --tool-call-parser qwen3_coder
    --port 8000
    --host 0.0.0.0
    --enable-cache-report
    --enable-metrics
    --log-requests-level 0
  volumes:
    - hf_cache:/root/.cache/huggingface
    - qwen38_kernel_cache:/root/.cache/sglang
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    # Reduce PyTorch allocator fragmentation under long mixed loads.
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-downloader: &downloader
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  entrypoint: ["sh", "-c"]
  restart: "no"
  logging: *logging-conf

x-privacy-filter: &privacy-filter
  <<: *nvidia
  init: true
  image: coloc-soak-privacy-filter-hf
  build:
    context: .
    dockerfile_inline: |
      # syntax=docker/dockerfile:1.4
      FROM pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
      # transformers 5.20+ needs PyTorch >=2.6; this 2.5.1 base crash-loops on fresh builds.
      # 5.16.1 matches gpu13's working image built on 2026-09-02.
      RUN pip install --no-cache-dir \
          "transformers==5.16.1" \
          accelerate \
          fastapi \
          "uvicorn[standard]"
      WORKDIR /app
      COPY <<'PYEOF' /app/server.py
      import copy
      import json
      import os
      import sys
      import threading
      import time
      import torch
      from fastapi import FastAPI, HTTPException
      from fastapi.responses import JSONResponse
      from pydantic import BaseModel, Field
      from transformers import AutoTokenizer, pipeline

      MODEL_ID = "openai/privacy-filter"
      MODEL_REVISION = "7ffa9a043d54d1be65afb281eddf0ffbe629385b"


      def _env(name, default, cast):
          # Tolerate absent/blank/garbage env so a typo can't crash-loop the boot.
          try:
              return cast(os.environ[name])
          except (KeyError, ValueError):
              return default


      # Dedicated GPU 0 has served privacy-filter since 33b77d5. Left unbounded,
      # the HF pipeline's CUDA caching allocator ratchets its reserved memory up
      # under traffic and never releases it, eventually filling the card.
      # Defence in depth (all tunable via env, no rebuild):
      #   * PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True (set in compose) is the
      #     root-cause fix — reserved segments can shrink again instead of ratcheting.
      #   * A watchdog returns idle cached blocks to the driver on an interval (never
      #     per request: empty_cache() is a synchronizing cudaFree that would stall
      #     the GPU) and hard-restarts the container if this process exceeds its VRAM
      #     budget — a real restart (clean reclaim) rather than silently serving 500s
      #     behind a still-healthy /v1/models probe.
      #   * An acute CUDA-OOM in a request also exits, for the same clean recycle.
      # Soak hardening below replaces that production OOM exit with one bounded retry.
      # The model's sliding_window is 128, so a non-eager attention implementation
      # makes attention cost linear in sequence length, not quadratic. That permits a
      # single 131072-token pass at batch 1. Eager attention measured ~13 GB over
      # baseline at only 16k tokens and cannot safely use the full window, so explicit
      # eager mode or a rejected non-eager implementation clamps MAX_LENGTH to 4096
      # and retains STRIDE-token overlapping chunks without truncating the document.
      BATCH_SIZE = max(1, _env("PRIVACY_BATCH_SIZE", 8, int))
      MAX_LENGTH = max(8, _env("PRIVACY_MAX_LENGTH", 4096, int))
      STRIDE = max(0, min(_env("PRIVACY_STRIDE", 256, int), MAX_LENGTH - 1))
      ATTN_IMPL = _env("PRIVACY_ATTN_IMPL", "sdpa", str)
      GPU_MEM_LIMIT_GB = max(1.0, _env("GPU_MEM_LIMIT_GB", 36.0, float))
      WATCHDOG_INTERVAL_S = max(1.0, _env("WATCHDOG_INTERVAL_S", 30.0, float))
      FILTER_GPU_MEM_FRACTION = min(1.0, max(0.01, _env("FILTER_GPU_MEM_FRACTION", 0.25, float)))
      OOM_RETRY_MAX_LENGTH = max(8, _env("FILTER_OOM_RETRY_MAX_LENGTH", 16384, int))

      USE_CUDA = torch.cuda.is_available()
      if USE_CUDA:
          # Per-process ceiling includes live tensors and the caching allocator.
          torch.cuda.set_per_process_memory_fraction(FILTER_GPU_MEM_FRACTION)

      if ATTN_IMPL == "eager":
          MAX_LENGTH = 4096
          clf = pipeline(
              "token-classification",
              model=MODEL_ID,
              revision=MODEL_REVISION,
              aggregation_strategy="simple",
              device=0 if USE_CUDA else -1,
              torch_dtype=torch.bfloat16,
              trust_remote_code=True,
          )
      else:
          try:
              clf = pipeline(
                  "token-classification",
                  model=MODEL_ID,
                  revision=MODEL_REVISION,
                  aggregation_strategy="simple",
                  device=0 if USE_CUDA else -1,
                  torch_dtype=torch.bfloat16,
                  trust_remote_code=True,
                  model_kwargs={"attn_implementation": ATTN_IMPL},
              )
              cfg = getattr(getattr(clf, "model", None), "config", None)
              # The private field may change; try the public form too, and safely
              # clamp below if neither is available.
              effective_attn_impl = (
                  getattr(cfg, "_attn_implementation", None)
                  or getattr(cfg, "attn_implementation", None)
              )
              if effective_attn_impl is None:
                  MAX_LENGTH = 4096
                  sys.stderr.write(
                      "privacy-filter: requested=%s attention implementation could not "
                      "be confirmed; clamping MAX_LENGTH=%d\n"
                      % (ATTN_IMPL, MAX_LENGTH)
                  )
                  sys.stderr.flush()
              elif effective_attn_impl != ATTN_IMPL:
                  MAX_LENGTH = 4096
                  sys.stderr.write(
                      "privacy-filter: requested=%s effective=%s attention implementation "
                      "mismatch; falling back to eager + MAX_LENGTH=%d\n"
                      % (ATTN_IMPL, effective_attn_impl, MAX_LENGTH)
                  )
                  sys.stderr.flush()
                  clf = pipeline(
                      "token-classification",
                      model=MODEL_ID,
                      revision=MODEL_REVISION,
                      aggregation_strategy="simple",
                      device=0 if USE_CUDA else -1,
                      torch_dtype=torch.bfloat16,
                      trust_remote_code=True,
                  )
          except Exception as exc:
              error_text = str(exc).lower()
              is_attention_rejection = "attn_implementation" in error_text or (
                  "attention" in error_text
                  and any(
                      marker in error_text
                      for marker in ("reject", "not supported", "does not support", "unsupported")
                  )
              )
              if not is_attention_rejection:
                  sys.stderr.write(
                      "privacy-filter: non-attention initialization failure (%s); "
                      "treating as transient and restarting\n" % exc
                  )
                  sys.stderr.flush()
                  raise

              MAX_LENGTH = 4096
              sys.stderr.write(
                  "privacy-filter: attn_implementation=%s rejected (%s); "
                  "falling back to eager + MAX_LENGTH=%d\n"
                  % (ATTN_IMPL, exc, MAX_LENGTH)
              )
              sys.stderr.flush()
              # Let failures in the eager rebuild propagate for a clean restart.
              clf = pipeline(
                  "token-classification",
                  model=MODEL_ID,
                  revision=MODEL_REVISION,
                  aggregation_strategy="simple",
                  device=0 if USE_CUDA else -1,
                  torch_dtype=torch.bfloat16,
                  trust_remote_code=True,
              )
      STRIDE = max(0, min(STRIDE, MAX_LENGTH - 1))
      # Cap the pipeline's per-forward window. The pipeline chunks inputs longer than
      # this into model_max_length-token windows (see the classify() stride= arg below).
      clf.tokenizer.model_max_length = MAX_LENGTH
      # The retry has its own tokenizer window but shares the same model weights.
      retry_max_length = min(MAX_LENGTH, OOM_RETRY_MAX_LENGTH)
      retry_tokenizer = copy.deepcopy(clf.tokenizer)
      retry_tokenizer.model_max_length = retry_max_length
      clf_retry = pipeline(
          "token-classification",
          model=clf.model,
          tokenizer=retry_tokenizer,
          aggregation_strategy="simple",
          device=0 if USE_CUDA else -1,
      )
      # Separate tokenizer for usage counts only — left UNBOUNDED so input_tokens stays
      # accurate for the full text (it never truncates: truncation defaults to False).
      tokenizer = AutoTokenizer.from_pretrained(MODEL_ID, revision=MODEL_REVISION, trust_remote_code=True)


      def _gpu_watchdog():
          while True:
              time.sleep(WATCHDOG_INTERVAL_S)
              torch.cuda.empty_cache()
              reserved_gb = torch.cuda.memory_reserved(0) / 1024 ** 3
              max_reserved_gb = torch.cuda.max_memory_reserved(0) / 1024 ** 3
              allocated_gb = torch.cuda.memory_allocated(0) / 1024 ** 3
              print(json.dumps({"event": "filter_mem", "reserved_gb": reserved_gb,
                                "max_reserved_gb": max_reserved_gb, "allocated_gb": allocated_gb}), flush=True)
              if reserved_gb > GPU_MEM_LIMIT_GB:
                  sys.stderr.write(
                      "privacy-filter: reserved %.1f GB > %.1f GB limit; "
                      "exiting for a clean restart\n" % (reserved_gb, GPU_MEM_LIMIT_GB)
                  )
                  sys.stderr.flush()
                  os._exit(1)


      if USE_CUDA:
          threading.Thread(target=_gpu_watchdog, daemon=True).start()

      app = FastAPI()


      class ClassifyRequest(BaseModel):
          input: str | list[str]
          threshold: float = Field(default=0.0, ge=0.0, le=1.0)


      @app.get("/v1/models")
      def models():
          return {"object": "list", "data": [{"id": MODEL_ID, "object": "model"}]}

      def _merge_adjacent_spans(spans):
          if not spans:
              return spans

          merged = [spans[0]]
          for span in spans[1:]:
              prev = merged[-1]
              if span["category"] == prev["category"] and span["start"] == prev["end"]:
                  prev["end"] = span["end"]
                  prev["text"] = prev["text"] + span["text"]
                  prev["score"] = min(prev["score"], span["score"])
                  continue

              merged.append(span)
          return merged


      @app.post("/v1/privacy/classify")
      def classify(req: ClassifyRequest):
          texts = [req.input] if isinstance(req.input, str) else req.input
          if not texts or any(not isinstance(t, str) for t in texts):
              raise HTTPException(400, "input must be a non-empty string or list of strings")

          # The pipeline runs the forward under torch.no_grad() internally.
          # No classify lock: production allows concurrent requests to expose peaks.
          try:
              raw = clf(texts, batch_size=BATCH_SIZE, stride=STRIDE)
          except torch.cuda.OutOfMemoryError:
              # Production baseline, replaced by this soak's bounded retry:
              # Don't 500-storm behind a healthy /v1/models probe: recycle the
              # container so restart:unless-stopped reclaims the VRAM cleanly.
              # Soak hardening: retry smaller windows without mutating shared state.
              print(json.dumps({"event": "filter_oom", "retry_max_length": retry_max_length}), flush=True)
              torch.cuda.empty_cache()
              try:
                  raw = clf_retry(texts, batch_size=BATCH_SIZE, stride=min(STRIDE, retry_max_length - 1))
              except torch.cuda.OutOfMemoryError:
                  torch.cuda.empty_cache()
                  return JSONResponse(status_code=503, headers={"Retry-After": "2"},
                                      content={"error": "gpu_memory_pressure"})

          # Single batched tokenize for usage counts instead of N sequential calls.
          tok_lens = [len(ids) for ids in tokenizer(texts).input_ids]

          data = []
          for i, spans in enumerate(raw):
              kept = [
                  {
                      "category": s["entity_group"],
                      "score": float(s["score"]),
                      "text": s["word"],
                      "start": int(s["start"]),
                      "end": int(s["end"]),
                  }
                  for s in spans
                  if float(s["score"]) >= req.threshold
              ]
              data.append(
                  {
                      "index": i,
                      "spans": _merge_adjacent_spans(kept),
                      "usage": {"input_tokens": tok_lens[i]},
                  }
              )

          return {"model": MODEL_ID, "data": data}
      PYEOF
      EXPOSE 8000
      CMD ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
  volumes:
    - hf_cache:/root/.cache/huggingface
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # The watchdog still cleanly restarts a process above this backstop.
    - GPU_MEM_LIMIT_GB=36
    # Cap all PyTorch allocations to about 35 GiB on the 139.4 GiB H200.
    - FILTER_GPU_MEM_FRACTION=0.25
    # On OOM retry once with 16K-token overlapping pipeline windows.
    - FILTER_OOM_RETRY_MAX_LENGTH=16384
    - PRIVACY_BATCH_SIZE=1
    - PRIVACY_MAX_LENGTH=131072
    - PRIVACY_STRIDE=256
    - PRIVACY_ATTN_IMPL=sdpa
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

services:
  coloc-soak-downloader:
    <<: *downloader
    container_name: coloc-soak-downloader
    command:
      - |
        set -e
        uvx --from 'huggingface_hub[hf_xet]' hf download Qwen/Qwen3.8-27B-FP8 --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
        uvx --from 'huggingface_hub[hf_xet]' hf download openai/privacy-filter --revision 7ffa9a043d54d1be65afb281eddf0ffbe629385b
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:coloc-soak","deployment:coloc-soak","env:${ENV}","host:gpu04","ip:${HOST_IP}"]}]'

  coloc-soak-qwen38:
    <<: *qwen38
    container_name: coloc-soak-qwen38
    depends_on:
      coloc-soak-downloader:
        condition: service_completed_successfully
    # Half-card static pool leaves room for filter and engine non-static growth.
    # 128 mamba slots, 32 running/64 queued bound admission and graph size;
    # 4096-token prefill chunks bound peak activation workspace.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-85a29d2c-5a46-97a9-f08d-5f916e6509db"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang","service":"sglang","tags":["model:Qwen/Qwen3.8-27B-FP8","deployment:coloc-soak","env:${ENV}","host:gpu04","ip:${HOST_IP}","port:8000"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "sglang"
      nearai.otel.service: "sglang"
      nearai.otel.source: "sglang"
      nearai.otel.container_name: "coloc-soak-qwen38"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "Qwen/Qwen3.8-27B-FP8"
      nearai.otel.deployment: "coloc-soak"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "gpu04"
      nearai.otel.host_machine: "gpu04"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  coloc-soak-privacy-filter:
    <<: *privacy-filter
    container_name: coloc-soak-privacy-filter
    depends_on:
      coloc-soak-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-85a29d2c-5a46-97a9-f08d-5f916e6509db"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"privacy-filter","service":"privacy-filter","tags":["model:openai/privacy-filter","deployment:coloc-soak","env:${ENV}","host:gpu04","ip:${HOST_IP}","port:8000"]}]'

  coloc-soak-loadgen:
    image: coloc-soak-loadgen
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
        RUN uv pip install --system --no-cache httpx==0.28.1 prometheus-client==0.21.1
        WORKDIR /app
        COPY <<'PYEOF' /app/loadgen.py
        import asyncio
        import json
        import math
        import os
        import random
        import time
        from datetime import datetime, timezone

        import httpx
        from prometheus_client import Counter, Gauge, Histogram, start_http_server

        QWEN_URL = "http://coloc-soak-qwen38:8000/v1/chat/completions"
        FILTER_URL = "http://coloc-soak-privacy-filter:8000/v1/privacy/classify"
        WORDS = ("the", "and", "oak", "sun", "map", "red", "sky", "bay", "ash", "elm")
        NAMES = ("Alex Rowan", "Taylor Vale", "Morgan Reed", "Casey Lane")
        RNG = random.Random(int(os.getenv("SOAK_SEED", "20261023")))
        REQUESTS = Counter("coloc_soak_requests_total", "Requests", ["target", "status"])
        LATENCY = Histogram("coloc_soak_latency_seconds", "Request latency", ["target"])
        TTFT = Histogram("coloc_soak_ttft_seconds", "Time to first streamed token", ["target"])
        FILTER_OOM = Counter("coloc_soak_filter_oom_503_total", "Filter 503 responses")
        PHASE = Gauge("coloc_soak_phase", "Active load phase", ["phase"])


        def setting(name, default, cast):
            return cast(os.getenv(name, str(default)))


        CYCLE_S = setting("SOAK_CYCLE_SECONDS", 3600, int)
        BURST_START_S = setting("SOAK_BURST_START_SECONDS", 1800, int)
        BURST_S = setting("SOAK_BURST_SECONDS", 900, int)
        STEADY_CONCURRENCY = setting("SOAK_STEADY_CONCURRENCY", 4, int)
        BURST_CONCURRENCY = setting("SOAK_BURST_CONCURRENCY", 30, int)
        FILTER_RATE = setting("SOAK_FILTER_RATE_PER_SECOND", 0.05, float)
        LONG_INTERVAL_S = setting("SOAK_LONG_INTERVAL_SECONDS", 7200, int)
        STEADY_PROMPT_MIN = setting("SOAK_STEADY_PROMPT_MIN", 1000, int)
        STEADY_PROMPT_MAX = setting("SOAK_STEADY_PROMPT_MAX", 8000, int)
        STEADY_OUTPUT_MIN = setting("SOAK_STEADY_OUTPUT_MIN", 256, int)
        STEADY_OUTPUT_MAX = setting("SOAK_STEADY_OUTPUT_MAX", 1024, int)
        LONG_PROMPT_MIN = setting("SOAK_LONG_PROMPT_MIN", 32000, int)
        LONG_PROMPT_MAX = setting("SOAK_LONG_PROMPT_MAX", 120000, int)
        LONG_CONTEXT_CONCURRENCY = setting("SOAK_LONG_CONTEXT_CONCURRENCY", 3, int)
        LONG_OUTPUT_CONCURRENCY = setting("SOAK_LONG_OUTPUT_CONCURRENCY", 4, int)
        LONG_OUTPUT_TOKENS = setting("SOAK_LONG_OUTPUT_TOKENS", 8192, int)
        FILTER_PROMPT_MIN = setting("SOAK_FILTER_PROMPT_MIN", 1000, int)
        FILTER_PROMPT_MAX = setting("SOAK_FILTER_PROMPT_MAX", 131000, int)
        WORD_CHARS_PER_TOKEN = setting("SOAK_CHARS_PER_TOKEN", 4, int)


        def synthetic_text(tokens):
            target_chars = tokens * WORD_CHARS_PER_TOKEN
            text = " ".join(RNG.choice(WORDS) for _ in range(max(1, target_chars // 14)))
            pii = f" {RNG.choice(NAMES)} alex{RNG.randrange(100000)}@example.test +1-202-555-{RNG.randrange(10000):04d} "
            sample = text + pii + text
            return (sample * (target_chars // len(sample) + 1))[:target_chars]


        def log_result(target, status, started, ttft, tokens, error):
            latency = time.monotonic() - started
            REQUESTS.labels(target, str(status)).inc()
            LATENCY.labels(target).observe(latency)
            if ttft is not None:
                TTFT.labels(target).observe(ttft)
            if target == "filter" and status == 503:
                FILTER_OOM.inc()
            print(json.dumps({"ts": datetime.now(timezone.utc).isoformat(), "target": target,
                              "status": status, "latency_s": round(latency, 3),
                              "ttft_s": None if ttft is None else round(ttft, 3),
                              "prompt_tokens_approx": tokens, "error": error}), flush=True)


        async def qwen_request(client, tokens, max_tokens):
            started = time.monotonic()
            status, ttft, error = 0, None, None
            try:
                payload = {"model": "Qwen/Qwen3.8-27B", "stream": True, "max_tokens": max_tokens,
                           "messages": [{"role": "user", "content": synthetic_text(tokens)}]}
                async with client.stream("POST", QWEN_URL, json=payload) as response:
                    status = response.status_code
                    if status != 200:
                        error = (await response.aread())[:200].decode("utf-8", "replace")
                    else:
                        async for line in response.aiter_lines():
                            if line.startswith("data: ") and line != "data: [DONE]":
                                event = json.loads(line[6:])
                                choices = event.get("choices") or []
                                delta = choices[0].get("delta", {}) if choices else {}
                                if (delta.get("content") or delta.get("reasoning_content")) and ttft is None:
                                    ttft = time.monotonic() - started
            except (httpx.HTTPError, ValueError) as exc:
                error = str(exc)
            log_result("qwen", status, started, ttft, tokens, error)


        async def filter_request(client, tokens):
            started = time.monotonic()
            status, error = 0, None
            try:
                response = await client.post(FILTER_URL, json={"input": synthetic_text(tokens)})
                status = response.status_code
                if status != 200:
                    error = response.text[:200]
            except httpx.HTTPError as exc:
                error = str(exc)
            log_result("filter", status, started, None, tokens, error)


        async def qwen_workers(client, epoch):
            async def worker(index):
                while True:
                    phase_s = (time.monotonic() - epoch) % CYCLE_S
                    burst = BURST_START_S <= phase_s < BURST_START_S + BURST_S
                    if index >= (BURST_CONCURRENCY if burst else STEADY_CONCURRENCY):
                        await asyncio.sleep(1)
                        continue
                    await qwen_request(client, RNG.randint(STEADY_PROMPT_MIN, STEADY_PROMPT_MAX),
                                       RNG.randint(STEADY_OUTPUT_MIN, STEADY_OUTPUT_MAX))

            await asyncio.gather(*(worker(index) for index in range(BURST_CONCURRENCY)))


        async def filter_arrivals(client):
            while True:
                await asyncio.sleep(RNG.expovariate(FILTER_RATE))
                tokens = int(math.exp(RNG.uniform(math.log(FILTER_PROMPT_MIN), math.log(FILTER_PROMPT_MAX))))
                asyncio.create_task(filter_request(client, tokens))


        async def special_load(client, epoch):
            cycle = -1
            long_cycle = -1
            while True:
                elapsed = time.monotonic() - epoch
                current_cycle = int(elapsed // CYCLE_S)
                phase_s = elapsed % CYCLE_S
                phase = "burst" if BURST_START_S <= phase_s < BURST_START_S + BURST_S else "steady"
                for label in ("steady", "burst"):
                    PHASE.labels(label).set(int(label == phase))
                if current_cycle != cycle and phase_s >= BURST_START_S:
                    cycle = current_cycle
                    asyncio.create_task(filter_request(client, FILTER_PROMPT_MAX))
                current_long_cycle = int(elapsed // LONG_INTERVAL_S)
                if current_long_cycle > 0 and current_long_cycle != long_cycle:
                    long_cycle = current_long_cycle
                    for _ in range(LONG_CONTEXT_CONCURRENCY):
                        asyncio.create_task(qwen_request(client, RNG.randint(LONG_PROMPT_MIN, LONG_PROMPT_MAX),
                                                         STEADY_OUTPUT_MAX))
                    for _ in range(LONG_OUTPUT_CONCURRENCY):
                        asyncio.create_task(qwen_request(client, RNG.randint(STEADY_PROMPT_MIN, STEADY_PROMPT_MAX),
                                                         LONG_OUTPUT_TOKENS))
                await asyncio.sleep(1)


        async def main():
            start_http_server(9100, addr="0.0.0.0")
            epoch = time.monotonic()
            limits = httpx.Limits(max_connections=64, max_keepalive_connections=32)
            async with httpx.AsyncClient(timeout=httpx.Timeout(1800.0), limits=limits) as client:
                await asyncio.gather(qwen_workers(client, epoch), filter_arrivals(client), special_load(client, epoch))


        if __name__ == "__main__":
            asyncio.run(main())
        PYEOF
        CMD ["python3", "/app/loadgen.py"]
