volumes:
  hf_cache:
  qwen38_kernel_cache:
  otelcol_app_storage:

configs:
  otelcol_app_config:
    content: |
      receivers:
        prometheus/apps:
          config:
            scrape_configs:
              - job_name: coloc-soak-qwen38
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['coloc-soak-qwen38:8000']
                    labels:
                      service: "sglang"
                      source: "sglang"
                      container_name: "coloc-soak-qwen38"
                      model: "Qwen/Qwen3.8-27B-FP8"
                      deployment: "coloc-soak"
                      env: "${ENV}"
                      host: "gpu04"
                      host_machine: "gpu04"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "8000"
              - job_name: coloc-soak-loadgen
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['coloc-soak-loadgen:9100']
                    labels:
                      service: "coloc-soak-loadgen"
                      source: "coloc-soak-loadgen"
                      container_name: "coloc-soak-loadgen"
                      model: "coloc-soak"
                      deployment: "coloc-soak"
                      env: "${ENV}"
                      host: "gpu04"
                      host_machine: "gpu04"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "9100"
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 512
          spike_limit_mib: 128
        resource:
          attributes:
            - key: host
              value: gpu04
              action: upsert
            - key: deployment
              value: coloc-soak
              action: upsert
            - key: host.name
              value: $${env:DD_HOSTNAME}
              action: upsert
            - key: cvm.name
              value: $${env:CVM_NAME}
              action: upsert
            - key: service.namespace
              value: near-ai
              action: insert
        batch:
          send_batch_size: 1024
          send_batch_max_size: 2048
          timeout: 5s
      exporters:
        otlphttp/gateway:
          endpoint: https://telemetry.infra.near.ai
          headers:
            Authorization: "Bearer $${env:MONITORING_INGEST_TOKEN}"
          sending_queue:
            num_consumers: 1
            queue_size: 128
            storage: file_storage
      extensions:
        file_storage:
          directory: /var/lib/otelcol-contrib/storage
          create_directory: true
      service:
        extensions: [file_storage]
        pipelines:
          metrics/app:
            receivers: [prometheus/apps]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
