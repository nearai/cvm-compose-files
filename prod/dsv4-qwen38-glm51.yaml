# GPU02 DS4F + GLM-5.3-Flash capacity pack (legacy filename retained).
# DS4F r1: GPUs 0-1; DS4F r2: GPUs 2-3; GLM-5.3-Flash TP4: GPUs 4-7.
# The two TP4 islands are 0-3 and 4-7. Never split GLM across those islands.
# Qwen3.6 and Qwen3.8 now each have one TP1 replica in small-models.yaml.
# Follow docs/qwen-glm53-capacity-migration.md; do not apply this whole stack
# before relocating Qwen3.8 and draining the removed/moved engine containers.
# GLM reuses the source-pinned inline build and serving envelope of the qualified
# GLM-5.3-Flash-SGL-TP4-Canary.yaml. Pre-build and validate it before registration.
# Set REGISTER_GLM53=true only after the new replica passes direct qualification.
# No DS4F engine/runtime change; r1 keeps its existing allocation and service key.
x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:b0c5cd0786b19dfa46144107be15e340b7a338b1c341d02ffa994c9f1ea77dfd
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-dsv4-flash-common: &dsv4-flash-common
  <<: *nvidia
  init: true
  # Published fairness image; the reserve is opt-in through the environment.
  image: docker.io/nearaidev/sglang@sha256:ec518148762ea02c23aa8615f69ca79b0c18bcd59b3c21c10229db3df323c615
  command: >
      sglang serve
      --trust-remote-code
      --model-path deepseek-ai/DeepSeek-V4-Flash-0731
      --revision 7872f01b1d1fe23eabc4c98b48bffcef5a386062
      --tp-size 2
      --kv-cache-dtype fp8_e4m3
      --moe-runner-backend marlin
      --cuda-graph-max-bs 64
      --mem-fraction-static 0.83
      --max-running-requests 64
      --max-queued-requests 16
      --schedule-conservativeness 1.3
      --num-continuous-decode-steps 1
      --enable-mixed-chunk
      --chunked-prefill-size 4096
      --max-prefill-tokens 16384
      --swa-full-tokens-ratio 0.1
      --watchdog-timeout 1800
      --disable-custom-all-reduce
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --json-model-override-args '{"dsv4_reasoning_effort_profile":"official"}'
      --port 8000
      --host 0.0.0.0
      --enable-cache-report
      --enable-metrics
      --log-requests-level 0
      --served-model-name deepseek-ai/DeepSeek-V4-Flash
      ${DSV4_RETURN_HIDDEN_STATES:+--enable-return-hidden-states}
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - kernel_cache:/root/.cache/deep_gemm
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - SGLANG_ENABLE_SPEC_V2=1
    - SGLANG_CHUNKED_PREFILL_ADMISSION_RESERVE=4096
    - SGLANG_DSV4_FP4_EXPERTS=1
    - SGLANG_ENABLE_UNIFIED_RADIX_TREE=1
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-downloader-common: &downloader-common
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  entrypoint: ["sh", "-c"]
  restart: "no"
  logging: *logging-conf

x-glm53-build: &glm53-build
  context: .
  dockerfile_inline: |
    FROM lmsysorg/sglang@sha256:eb090e39434085f713d39421cb2e5b6d342424aa95c3d9ecdfe8cadd4289e99b
    ADD https://github.com/PierreLeGuen/sglang-upstream/archive/fc91d2403cc210a86bd5fc715c6609f58c932e5a.tar.gz /tmp/sglang.tar.gz
    RUN printf '%s  %s\n' \
          '1e4340ed7e476696f36f4094e027f2c7648bcca98934f0df3220b307bdcd1673' \
          '/tmp/sglang.tar.gz' \
        | sha256sum -c -
    RUN rm -rf /sgl-workspace/sglang \
        && mkdir -p /sgl-workspace/sglang \
        && tar -xzf /tmp/sglang.tar.gz --strip-components=1 -C /sgl-workspace/sglang \
        && rm /tmp/sglang.tar.gz
    WORKDIR /sgl-workspace/sglang
    RUN python3 -m pip install setuptools-rust==1.13.0 setuptools-scm==10.2.3 pytest-asyncio==1.4.0
    RUN --mount=type=cache,target=/sgl-workspace/sglang/rust/target \
        --mount=type=cache,target=/sgl-workspace/sglang/rust/sglang-radix-tree/target \
        CARGO_BUILD_JOBS=8 SETUPTOOLS_SCM_PRETEND_VERSION=0.5.16.dev20260904 \
        python3 -m pip install --no-deps --no-build-isolation -e python
    LABEL org.opencontainers.image.source="https://github.com/PierreLeGuen/sglang-upstream" \
          org.opencontainers.image.revision="fc91d2403cc210a86bd5fc715c6609f58c932e5a"
    RUN python3 -c "import sglang; from sglang.srt.entrypoints.openai.protocol import ChatCompletionRequest; print(sglang.__file__)"

x-sg-glm53-flash-common: &sg-glm53-flash-common
  <<: *nvidia
  init: true
  image: nearai/glm53-sglang-upstream-fc91d24:local
  build: *glm53-build
  command: >
      sglang serve
      --model-path /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/84c6a6aa9497188e15a635ba793b0f95a79b1033
      --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
      --served-model-name z-ai/glm-5.3-flash
      --tp-size 4
      --ep-size 4
      --mem-fraction-static 0.80
      --max-running-requests 32
      --max-queued-requests 32
      --chunked-prefill-size 4096
      --cuda-graph-max-bs-decode 32
      --dsa-prefill-backend tilelang
      --dsa-decode-backend tilelang
      --kv-cache-dtype bfloat16
      --moe-runner-backend deep_gemm
      --speculative-algorithm EAGLE
      --speculative-num-steps 5
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 6
      --speculative-adaptive
      --reasoning-parser glm45
      --enable-strict-thinking
      --grammar-backend xgrammar
      --tool-call-parser glm47
      --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja
      --context-length 1048576
      --dist-init-addr 127.0.0.1:29510
      --watchdog-timeout 1800
      --host 0.0.0.0
      --port 8000
      --enable-metrics
      --enable-cache-report
      --log-requests-level 0
      --disable-fast-image-processor
      --limit-mm-data-per-request '{"image": 64}'
  volumes:
    - glm53_kernel_cache:/root/.cache
    - huggingface_cache:/root/.cache/huggingface
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    # Local snapshot path; nothing is fetched at engine start.
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - HF_HUB_DISABLE_TELEMETRY=1
    - DO_NOT_TRACK=1
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
    - TRITON_CACHE_DIR=/root/.cache/triton
    - SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE=1
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:ed594cf53fe6942e84b07b0740cdcbb249fa4b39cb21feeebf93881ae51f0b5e
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  restart: unless-stopped
  logging: *logging-conf

services:
  model-downloader:
    <<: *downloader-common
    container_name: model-downloader
    command:
      - |
        set -e
        echo "Downloading deepseek-ai/DeepSeek-V4-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4-Flash --revision 553034d7dd9e06c2eeaee68cf85a17d6d4754cf0
        echo "Downloading deepseek-ai/DeepSeek-V4-Flash-0731..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4-Flash-0731 --revision 7872f01b1d1fe23eabc4c98b48bffcef5a386062
        echo "Downloads complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:multi","deployment:dsv4-qwen38-glm51-gpu02","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:gpu02-capacity-v3"]}]'

  model-downloader-glm53:
    <<: *downloader-common
    container_name: model-downloader-glm53
    command:
      - |
        set -e
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash chat_template.jinja --revision 3f1971b7b5f7a528c9c4ef6212c8785298a8c24a
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-sgl-tp4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-dsv4-flash
      - proxy-glm53
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8001:8001"
      - "8000:8000"
      - "8444:443"
      - "8008:8008"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:multi","deployment:dsv4-qwen38-glm51-gpu02","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:gpu02-capacity-v3"]}]'

  model-proxy-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    environment:
      - HOST_IP=${HOST_IP}
      - TLS_PORT=${TLS_PORT:-8444}
      - TLS_PORT_GLM53=${TLS_PORT_GLM53:-8008}
      - REGISTER_GLM53=${REGISTER_GLM53:-false}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:multi","deployment:dsv4-qwen38-glm51-gpu02","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:gpu02-capacity-v3"]}]'

  proxy-dsv4-flash:
    <<: *vllm-proxy-common
    container_name: proxy-dsv4-flash
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_PROXY_STREAM_IDLE_TIMEOUT_SECS=20
      - CLOUD_API_URL=https://cloud-api.near.ai
