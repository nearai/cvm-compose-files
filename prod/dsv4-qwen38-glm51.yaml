# GPU02 DeepSeek-V4-Flash + Qwen3.8-27B + Qwen3.6 capacity pack.
#
# Runtime topology:
# - one TDX CVM launched with PPCIe and all eight H200 GPUs/NVSwitches attached;
# - two DeepSeek-V4-Flash TP2 replicas use guest GPUs 0-1 and 6-7;
# - two independent Qwen3.8-27B FP8 TP1 replicas use guest GPUs 2 and 3;
# - all inference proxies collect NVIDIA attestation from the PPCIe-attached CVM.
#
# The DeepSeek replica uses the qualified DeepSeek-V4-Flash-0731 target-only TP2
# configuration: SGLang 0.5.16, FP4 Marlin, FP8 KV, 8192-token mixed prefill,
# 16384 max prefill tokens, one continuous decode step, graph max batch 64,
# memory 0.83, running/queued 64/16, and scheduler conservativeness 1.3.
# The legacy -r1 service name is retained intentionally to avoid an unnecessary
# engine recreation during rollout; the new -r2 replica uses the free GPUs 6-7.
#
# The Qwen replicas use the gpu31-qualified H200 recipe: pinned FP8 checkpoint
# and SGLang image, FlashInfer with FA3 multimodal attention, 8192-token mixed
# prefill, Mamba cache 320, and running/queued limits of 64/128. Direct engine
# qualification completed a 30-minute 9000/9000-request soak plus strict SSE,
# tool-call, vision, and 250K-input checks. Full proxy/attestation canaries remain
# a deployment-time gate. The Qwen proxy deliberately leaves stream-idle timeout
# disabled so long-context prefills are not terminated before the first token.
#
x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:b0c5cd0786b19dfa46144107be15e340b7a338b1c341d02ffa994c9f1ea77dfd
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-dsv4-flash-common: &dsv4-flash-common
  <<: *nvidia
  init: true
  # Published fairness image; the reserve is opt-in through the environment.
  image: docker.io/nearaidev/sglang@sha256:ec518148762ea02c23aa8615f69ca79b0c18bcd59b3c21c10229db3df323c615
  command: >
      sglang serve
      --trust-remote-code
      --model-path deepseek-ai/DeepSeek-V4-Flash-0731
      --revision 7872f01b1d1fe23eabc4c98b48bffcef5a386062
      --tp-size 2
      --kv-cache-dtype fp8_e4m3
      --moe-runner-backend marlin
      --cuda-graph-max-bs 64
      --mem-fraction-static 0.83
      --max-running-requests 64
      --max-queued-requests 16
      --schedule-conservativeness 1.3
      --num-continuous-decode-steps 1
      --enable-mixed-chunk
      --chunked-prefill-size 4096
      --max-prefill-tokens 16384
      --swa-full-tokens-ratio 0.1
      --watchdog-timeout 1800
      --disable-custom-all-reduce
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --json-model-override-args '{"dsv4_reasoning_effort_profile":"official"}'
      --port 8000
      --host 0.0.0.0
      --enable-cache-report
      --enable-metrics
      --log-requests-level 0
      --served-model-name deepseek-ai/DeepSeek-V4-Flash
      ${DSV4_RETURN_HIDDEN_STATES:+--enable-return-hidden-states}
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - kernel_cache:/root/.cache/deep_gemm
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - SGLANG_ENABLE_SPEC_V2=1
    - SGLANG_CHUNKED_PREFILL_ADMISSION_RESERVE=4096
    - SGLANG_DSV4_FP4_EXPERTS=1
    - SGLANG_ENABLE_UNIFIED_RADIX_TREE=1
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-qwen3-8-27b-common: &qwen3-8-27b-common
  <<: *nvidia
  init: true
  cap_add:
    - SYS_NICE
  image: lmsysorg/sglang@sha256:febfb971c7352570fc445c466ebd6ffc9d896024958e544a60f2137fd85856b1
  command: >
      sglang serve
      --trust-remote-code
      --model-path Qwen/Qwen3.8-27B-FP8
      --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
      --served-model-name Qwen/Qwen3.8-27B
      --tp 1
      --mem-fraction-static 0.85
      --attention-backend flashinfer
      --mm-attention-backend fa3
      --chunked-prefill-size 8192
      --max-prefill-tokens 8192
      --enable-mixed-chunk
      --max-mamba-cache-size 320
      --max-running-requests 64
      --max-queued-requests 128
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --port 8000
      --host 0.0.0.0
      --enable-cache-report
      --enable-metrics
      --log-requests-level 0
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - qwen38_kernel_cache:/root/.cache/sglang
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-downloader-common: &downloader-common
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  entrypoint: ["sh", "-c"]
  restart: "no"
  logging: *logging-conf

x-sglang-env:
  environment: &sglang-env
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN

x-qwen3-6-35b-a3b-common: &qwen3-6-35b-a3b-common
  <<: *nvidia
  init: true
  image: lmsysorg/sglang:v0.5.16-cu129@sha256:984699c298a95b73c469b2191403ddc85fd780506e13c39c4afff3845e27bc6c
  command: >
      sglang serve
      --model-path Qwen/Qwen3.6-35B-A3B-FP8
      --tp 1
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --mamba-radix-cache-strategy no_buffer
      --disable-overlap-schedule
      --disable-prefill-cuda-graph
      --mm-feature-transport cpu
      --mem-fraction-static 0.85
      --max-running-requests 128
      --context-length 262144
      --num-continuous-decode-steps 5
      --model-loader-extra-config '{"enable_multithread_load": "true", "num_threads": 64}'
      --enable-mixed-chunk
      --chunked-prefill-size 16384
      --port 8000
      --host 0.0.0.0
      --enable-cache-report
      --enable-metrics
      --trust-remote-code
      --log-requests-level 0
      --served-model-name Qwen/Qwen3.6-35B-A3B-FP8
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - kernel_cache:/root/.cache/deep_gemm
  environment: *sglang-env
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:ed594cf53fe6942e84b07b0740cdcbb249fa4b39cb21feeebf93881ae51f0b5e
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  restart: unless-stopped
  logging: *logging-conf

services:
  model-downloader:
    <<: *downloader-common
    container_name: model-downloader
    command:
      - |
        set -e
        echo "Downloading deepseek-ai/DeepSeek-V4-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4-Flash --revision 553034d7dd9e06c2eeaee68cf85a17d6d4754cf0
        echo "Downloading deepseek-ai/DeepSeek-V4-Flash-0731..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4-Flash-0731 --revision 7872f01b1d1fe23eabc4c98b48bffcef5a386062
        echo "Downloading Qwen/Qwen3.8-27B-FP8..."
        uvx --from 'huggingface_hub[hf_xet]' hf download Qwen/Qwen3.8-27B-FP8 --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
        echo "Downloading Qwen/Qwen3.6-35B-A3B-FP8..."
        uvx --from 'huggingface_hub[hf_xet]' hf download Qwen/Qwen3.6-35B-A3B-FP8
        echo "Downloads complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:multi","deployment:dsv4-qwen38-glm51-gpu02","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:gpu02-capacity-v3"]}]'

  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-dsv4-flash
      - proxy-qwen38-27b
      - proxy-qwen36-35b-a3b
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8444:443"
      - "8003:8003"
      - "8006:8006"
      - "8007:8007"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:multi","deployment:dsv4-qwen38-glm51-gpu02","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:gpu02-capacity-v3"]}]'

  model-proxy-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    environment:
      - HOST_IP=${HOST_IP}
      - TLS_PORT=${TLS_PORT:-8444}
      - TLS_PORT_2=${TLS_PORT_2:-8003}
      - TLS_PORT_QWEN36_35B=${TLS_PORT_QWEN36_35B:-8007}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:multi","deployment:dsv4-qwen38-glm51-gpu02","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:gpu02-capacity-v3"]}]'

