                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "9400"
                      gpu_pair: "0-1"
                      ppcie: "true"
                      config_variant: "gpu02-capacity-v1"
              - job_name: dcgm-dcgm-dsv4-flash-r2
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['dcgm-dsv4-flash-r2:9400']
                    labels:
                      service: "dcgm-exporter"
                      source: "dcgm-exporter"
                      container_name: "dcgm-dsv4-flash-r2"
                      model: "deepseek-ai/DeepSeek-V4-Flash"
                      deployment: "dsv4-flash-gpu02"
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
