# Temporary bridge: GLM5.1 TP4 on 0-3, two DS4F TP2 replicas on 4-5 and 6-7.
# One PPCIe GPU CVM. Drain/remove GLM5.1 r2 BEFORE applying this file.
# Start ds4f-migration-registrar explicitly only after qualification.
# Reuses GLM5.1 v0.0.344 and DS4F v0.0.385; do not whole-stack apply.
---
services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    entrypoint:
      - sh
      - "-c"
    restart: "no"
    logging: &1
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"
        labels: com.datadoghq.ad.logs,com.docker.compose.service
    container_name: model-downloader
    command:
      - |
        set -e
        echo "Downloading QuantTrio/GLM-5.1-AWQ..."
        uvx --from 'huggingface_hub[hf_xet]' hf download QuantTrio/GLM-5.1-AWQ --revision 8f60817aa28023f2607850d1a1e51d21aa34817a
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:QuantTrio/GLM-5.1-AWQ","deployment:GLM-5.1-SGL-AWQ-TP4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
  migration-disk-preflight:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: migration-disk-preflight
    profiles: [migration-preflight]
    entrypoint: [python3, -B, -c]
    command:
      - |
        import json, shutil
        disk = shutil.disk_usage('/cache')
        print(json.dumps(dict(zip(('total_bytes', 'used_bytes', 'free_bytes'), disk))))
    volumes:
      - huggingface_cache:/cache:ro
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    logging: *1
  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-glm51
      - proxy-dsv4-flash
    command:
      /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon
      off;"'
    ports:
      - 8000:80
      - 8444:443
      - 8001:8001
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 420
    restart: unless-stopped
    logging: *1
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:QuantTrio/GLM-5.1-AWQ","deployment:GLM-5.1-SGL-AWQ-TP4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000"]}]'
  model-proxy-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint:
      - sh
      - "/register.sh"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0)
          )) -lt 180 ]"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    environment:
      - HOST_IP=${HOST_IP}
      - HTTP_PORT=${HTTP_PORT:-8000}
      - TLS_PORT=${TLS_PORT:-8444}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: "/register.sh"
        mode: 493
    logging: *1
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:QuantTrio/GLM-5.1-AWQ","deployment:GLM-5.1-SGL-AWQ-TP4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
  proxy-glm51:
    image: nearaidev/vllm-proxy-rs@sha256:b183677a5d32267539b9b21ec45327a4f3be0a013afeb608c68c4d76e9472e36
    user: root
    privileged: true
    runtime: nvidia
    ipc: host
    ulimits: &2
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - compose-manager:host-gateway
    volumes:
      - "/var/run/dstack.sock:/var/run/dstack.sock"
      - certs:/etc/letsencrypt:ro
    restart: unless-stopped
    logging: *1
    container_name: proxy-glm51
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=zai-org/GLM-5.1-FP8
      - OHTTP_ENABLED=true
      - TOKEN=${PROXY_TOKEN}
      - FUSION_ENABLED=${FUSION_ENABLED}
      - FUSION_INTERNAL_BEARER_TOKEN=${FUSION_INTERNAL_BEARER_TOKEN}
      - VLLM_BACKEND_URLS=http://model-sg-glm51-awq-tp4-r1:8000
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:zai-org/GLM-5.1-FP8","deployment:GLM-5.1-SGL-AWQ-TP4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: inference-proxy
      nearai.otel.service: vllm-proxy
      nearai.otel.source: vllm-proxy
      nearai.otel.container_name: proxy-glm51
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: zai-org/GLM-5.1-FP8
      nearai.otel.deployment: GLM-5.1-SGL-AWQ-TP4
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
  model-sg-glm51-awq-tp4-r1:
    runtime: nvidia
    ipc: host
    ulimits: *2
    init: true
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    image: glm51-sgl-awq-tp4-patched:local
    build:
      dockerfile_inline: |
        FROM lmsysorg/sglang:dev-cu12@sha256:aac6b242680daeb74d2ab1d85f70575357552d7d165d2e5d30eb362797db54a1
        RUN python3 - <<'PYEOF'
        import re
        f = "/sgl-workspace/sglang/python/sglang/srt/models/deepseek_common/deepseek_weight_loader.py"
        s = open(f).read()
        pat = re.compile(r"(?P<i> +)cat_dim = 1\n\n(?P<j> +)fused_weight = torch\.cat\(")
        def repl(m):
            j = m.group("j")
            return (
                m.group("i") + "cat_dim = 1\n\n"
                + j + "if (\n"
                + j + "    q_a_proj_weight.dim() == 2\n"
                + j + "    and q_a_proj_weight.shape[1 - cat_dim]\n"
                + j + "    != kv_a_proj_weight.shape[1 - cat_dim]\n"
                + j + "):\n"
                + j + "    cat_dim = 1 - cat_dim\n\n"
                + j + "fused_weight = torch.cat("
            )
        s2, n = pat.subn(repl, s, count=1)
        assert n == 1, "sglang#28305 cat_dim patch anchor not found (loader changed)"
        open(f, "w").write(s2)
        print("[sglang#28305] fused qkv_a_proj cat_dim fix applied")
        PYEOF
    container_name: model-sg-glm51-awq-tp4-r1
    command:
      "sglang serve --model-path QuantTrio/GLM-5.1-AWQ --revision 8f60817aa28023f2607850d1a1e51d21aa34817a
      --served-model-name zai-org/GLM-5.1-FP8 --tp 4 --dist-init-addr 127.0.0.1:29500
      --disable-shared-experts-fusion --kv-cache-dtype fp8_e4m3 --reasoning-parser
      glm45 --tool-call-parser glm47 --log-requests-level 0 --mem-fraction-static
      0.85 --max-running-requests 128 --max-queued-requests 16 --speculative-algorithm
      EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens
      4 --watchdog-timeout 1800 --port 8000 --host 0.0.0.0 --enable-cache-report --enable-metrics
      --trust-remote-code

      "
    volumes:
      - compile_cache_a:/root/.cache
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: "${HUGGING_FACE_HUB_TOKEN}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OPENBLAS_L2_SIZE: "2097152"
      NCCL_DEBUG: WARN
      SGLANG_ENABLE_SPEC_V2: "1"
      TORCHINDUCTOR_CACHE_DIR: "/root/.cache/torchinductor"
      TRITON_CACHE_DIR: "/root/.cache/triton"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"
                - "1"
                - "2"
                - "3"
              capabilities:
                - gpu
    restart: unless-stopped
    stop_grace_period: 5m
    logging: *1
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang","service":"sglang","tags":["model:QuantTrio/GLM-5.1-AWQ","deployment:GLM-5.1-SGL-AWQ-TP4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000","instance:1"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: sglang
      nearai.otel.service: sglang
      nearai.otel.source: sglang
      nearai.otel.container_name: model-sg-glm51-awq-tp4-r1
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: QuantTrio/GLM-5.1-AWQ
      nearai.otel.deployment: GLM-5.1-SGL-AWQ-TP4
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
