      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.model_path: "graphistry/GLM-5.3-Flash-W4AFP8"
      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm53-flash-sgl-tp2x4"
      nearai.otel.config_variant: "hicache-w4afp8-qsplit-selective325-mamba330-bf16state-memopt086-mr48-c8192-admission-reserve-v10-pdi2-h200-tp2-ep2-eagle-fixed-4-1-5-strict-budget8192-obs-v1-kvshare-l3file-v1"
      nearai.otel.thinking_budget_policy: "default8192-public-to-native"
      nearai.otel.request_logging: "disabled"
      nearai.otel.engine_image: "9c6ddd4319c4"
      nearai.otel.instance: "4"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  # Explicit operator-only semantic check; never starts with a normal stack apply.
  # Runs the candidate's synthetic fixture gate against each replica at concurrency 1.
  # No GPU allocation, host mounts, Docker socket, credentials, or published ports.
  glm53-perception-check:
    image: docker.io/nearaidev/sglang@sha256:e9d29a1cb1cd65284392c4d62d5f2a36669628057e15c60fe93ea40cfe4fc7e7
    container_name: glm53-perception-check
    profiles: ["verification"]
    runtime: runc
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 512m
    cpus: 1
    environment:
      - NVIDIA_VISIBLE_DEVICES=void
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: ["/usr/bin/python3", "-u", "-c"]
    command:
      - |
        import json, runpy, shutil, sys, urllib.request
        print(json.dumps({"event": "disk", "free_bytes": shutil.disk_usage("/").free}), flush=True)
        failed = False
        for replica in (1, 2, 3, 4):
            base = f"http://model-sg-glm53-w4afp8-tp2-r{replica}:8000"
            print(json.dumps({"event": "replica", "replica": replica}), flush=True)
            for path in ("/health", "/v1/models"):
                with urllib.request.urlopen(base + path, timeout=30) as response:
                    assert response.status == 200
                    if path == "/v1/models":
                        assert "z-ai/glm-5.3-flash" in [row["id"] for row in json.load(response)["data"]]
            sys.argv = ["perception", "--base-url", base, "--size", "512", "--concurrency", "1", "--timeout", "300"]
            try:
                runpy.run_path("/sgl-workspace/sglang/test/manual/test_glm5_next_perception.py", run_name="__main__")
            except SystemExit as result:
                failed = failed or bool(result.code)
        print(json.dumps({"event": "qualification_finished", "ok": not failed}), flush=True)
        raise SystemExit(1 if failed else 0)
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"glm53-perception-check","service":"glm53-perception-check","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-sgl-tp2x4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Explicit operator-only TLS access to each replica for paired qualification.
  # Never registered with the customer router; no model/proxy dependencies.
  glm53-soak-relay:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: glm53-soak-relay
    profiles: ["verification"]
    runtime: runc
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 5m
    ports:
      - "8008:8008"
      - "8009:8009"
      - "8010:8010"
      - "8011:8011"
    volumes:
      - certs:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=4m
    entrypoint: ["nginx", "-g", "daemon off;"]
    configs:
      - source: glm53_soak_nginx_conf
        target: /etc/nginx/nginx.conf
        mode: 0600
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-sgl-tp2x4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # --- Ghost prefix cache aggregator: one per CVM, CPU only ---
  # All four engines in this CVM send their sampled page digests (keyed hashes, never tokens)
  # to /ghost/aggregator.sock on the in-memory ghost volume. This process keeps one LRU across
  # them and exports sglang:ghost_pool_* on :9464: per replica, the reuse one pooled cache
  # would have served and the reuse seen only on another replica. It runs the engines' image so
  # both move together. Serving never depends on it: the engines do not wait for it, and an
  # image without ghost-prefix-cache.diff makes only this container exit and restart.
  glm53-ghost-aggregator:
    image: docker.io/nearaidev/sglang@sha256:9c6ddd4319c4ab00e351d8650459e68b8830e36ffcc029d67fa5e19d0ac3ed17
    container_name: glm53-ghost-aggregator
    runtime: runc
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 1
    environment:
      - NVIDIA_VISIBLE_DEVICES=void
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: ["python3", "-m", "sglang.srt.observability.ghost_aggregator"]
    command: ["--socket", "/ghost/aggregator.sock", "--port", "9464", "--sample", "16", "--model-name", "z-ai/glm-5.3-flash"]
    volumes:
      - ghost:/ghost
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang-ghost-aggregator","service":"sglang-ghost-aggregator","tags":["model:z-ai/glm-5.3-flash","served_model:z-ai/glm-5.3-flash","deployment:glm53-flash-sgl-tp2x4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "ghost-aggregator"
      nearai.otel.service: "sglang-ghost-aggregator"
      nearai.otel.source: "sglang-ghost-aggregator"
      nearai.otel.container_name: "glm53-ghost-aggregator"
      nearai.otel.port: "9464"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm53-flash-sgl-tp2x4"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  # --- Full-host GPU telemetry ---

  dcgm-glm53:
    <<: *dcgm-common
    container_name: dcgm-glm53
    deploy:
      resources:
        reservations:
          devices:
