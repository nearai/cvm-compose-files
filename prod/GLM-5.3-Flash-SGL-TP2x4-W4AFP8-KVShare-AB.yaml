# GLM-5.3-Flash on four independent H200 TP2/EP2 replicas. Each replica stays
# within one NVLink GPU pair; one inference-proxy uses its native
# least-connections backend pool for health-aware balancing and failover.
#
# The engine is published by the repository's GitHub Actions workflow and pinned here by
# its signed immutable registry digest. Its source is pinned to
# PierreLeGuen/sglang-upstream commit fc91d24, derived from official SGLang main plus
# the official GLM-5.3 branch. It contains upstream disconnect cleanup (#35255), the
# final-prefill abort fix (#34153), the strict thinking-budget adapter, and two narrow
# DSA import-cycle fixes. All four replicas pin the published split-capable
# docker/sglang-glm53-hicache-w4afp8 derivative the long tier runs (glm53-hicache-w4afp8-v6):
# the HCC-safe HiCache image (CUDA-owned host memory, carrying the opt-in chunked-prefill
# admission-reserve v10 patch, nearai/inference-optimizer@fb94472) plus the W4AFP8
# loader fix and the unconditional chunked-prefill pool clamp. The reserve is enabled
# below with SGLANG_CHUNKED_PREFILL_ADMISSION_RESERVE=4096,
# SGLANG_ADMISSION_RESERVE_MAX_FRACTION=0.75 and --prefill-decode-interval 1. The
# official CUDA 13 SGLang image is the pinned build base. The serving envelope is
# intentionally conservative: BF16 KV, 0.80 static memory, 32 running requests (an
# effective 32 per TP2 replica with 165 BF16 mamba state slots, see the file header), a
# bounded 8-request queue, 8192-token prefill chunks with --max-prefill-tokens 32768,
# decode graphs capped at batch 32, TileLang DSA, the CUTLASS W4A8 MoE path (hence no
# --moe-runner-backend and no FP8 --revision), and adaptive EAGLE 5/1/6. This retains
# the full 1,048,576-token model context.
# Priority scheduling (--enable-priority-scheduling, --disable-priority-preemption)
# relies on the pinned inference-proxy below (build 2834196, nearai/inference-proxy#241)
# overwriting the `priority` field of every forwarded request, so no client-chosen
# or missing priority ever reaches the scheduler. --default-priority-value is
# deliberately absent for the same reason. scripts/validate_glm53_prod_config.rb
# refuses the priority switches unless proxy-glm53 pins a priority-normalizing build.
#
# A small fail-closed adapter patch maps the public thinking_token_budget field
# to SGLang strict-thinking's custom_params.thinking_budget. Omitted values
# default to 8192; explicit null remains an opt-out; an explicit native
# custom_params.thinking_budget wins. Request/response payload logging is off.
#
# The vLLM GLM-5.3-Flash path is not used: its Hopper NVFP4/MLA path produced
# non-finite logits and repetitive output. This pack also retires the previous
# co-resident DeepSeek arm so both four-GPU islands serve GLM-5.3-Flash.

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:d61357da39918a57126864a451eaf054f06a6989c03fe9a1666f7e6374ba6907
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-sg-glm53-flash-common: &sg-glm53-flash-common
  <<: *nvidia
  init: true
  image: docker.io/nearaidev/sglang@sha256:9c6ddd4319c4ab00e351d8650459e68b8830e36ffcc029d67fa5e19d0ac3ed17
  command: >
      sglang serve
      --model-path /root/.cache/huggingface/hub/models--graphistry--GLM-5.3-Flash-W4AFP8/snapshots/99f1fa70408c52b007d4fd69e02e5a522422e755
      --served-model-name z-ai/glm-5.3-flash
      --tp-size 2
      --ep-size 2
      --mem-fraction-static 0.80
      --max-running-requests 32
      --max-queued-requests 8
      --enable-priority-scheduling
      --disable-priority-preemption
      --chunked-prefill-size 8192
      --max-prefill-tokens 32768
      --prefill-decode-interval 1
      --cuda-graph-max-bs-decode 32
      --dsa-prefill-backend tilelang
      --dsa-decode-backend tilelang
      --kv-cache-dtype bfloat16
      --speculative-algorithm EAGLE
      --speculative-num-steps 5
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 6
      --speculative-adaptive
      --reasoning-parser glm45
      --enable-strict-thinking
      --grammar-backend xgrammar
      --tool-call-parser glm47
      --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja
      --context-length 1048576
      --dist-init-addr 127.0.0.1:29510
      --watchdog-timeout 1800
      --host 0.0.0.0
      --port 8000
      --enable-metrics
      --enable-cache-report
      --log-requests-level 0
      --disable-fast-image-processor
      --limit-mm-data-per-request '{"image": 64}'
      --enable-hierarchical-cache
      --hicache-write-policy write_through_selective
      --hicache-io-backend direct
      --hicache-mem-layout page_first_direct
      --max-mamba-cache-size 165
      --mamba-ssm-dtype bfloat16
  volumes:
    - kernel_cache:/root/.cache
    - huggingface_cache:/root/.cache/huggingface
    - ghost:/ghost
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    # Local snapshot path; nothing is fetched at engine start.
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - HF_HUB_DISABLE_TELEMETRY=1
    - DO_NOT_TRACK=1
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
    - TRITON_CACHE_DIR=/root/.cache/triton
    # Persist tilelang's DSA kernel JIT cache: it defaults to /root/.tilelang, outside
    # the kernel_cache volume, so every restart re-paid ~22-24 compiles at 8-9 s each
    # with the whole engine frozen (2026-09-12..16 capacity campaign).
    - TILELANG_CACHE_DIR=/root/.cache/tilelang
    # /health must not run a generation: at this pin health_generate submits a real
    # 1-token request that queues behind any in-flight long prefill, so the CVM
    # proxy's 3 s probe times out, the replica flaps unhealthy, and the conversation
    # affinity pin is skipped (full re-prefill on the other replica). nearai/infra#234.
    - SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION=0
    # Admission-reserve v10 (carried by this image): reserve up to 4096 tokens of each
    # 8192-token prefill chunk for waiting requests, sized on their uncached extend length,
    # bounded so the in-flight long prefill keeps >=25% of the chunk, and refunded when no
    # waiter used it. Pairs with --prefill-decode-interval 1 so admitted requests also decode.
    # Measured (2026-09-12..16 campaign): <=2K prompts p95 TTFT 19.6 s -> 0.6 s; cost ITL p90
    # 30 -> ~240 ms, median unchanged. The patch is inert with the reserve unset (rollback).
    # NEVER set SGLANG_ADMISSION_RESERVE_MIN_WAIT_S (wall-clock gate desyncs the TP ranks; v10
    # raises) or SGLANG_ADMISSION_RESERVE_MIN_ITERS (unmeasured in production).
    - SGLANG_CHUNKED_PREFILL_ADMISSION_RESERVE=4096
    - SGLANG_ADMISSION_RESERVE_MAX_FRACTION=0.75
    - SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE=1
    # HiCache host tier: a fixed 325 GiB per replica across its two TP ranks, 1,300 GiB for
    # the four replicas (the lab arm's DRAM total per 8 GPUs; ~5.87M tokens per replica). A
    # percentage would resolve against MemAvailable at each start, so the replicas started
    # later would get less; startup fails if it exceeds available RAM minus 10 GiB.
    - SGLANG_HICACHE_RAM_BUDGET=${GLM53_HICACHE_RAM_BUDGET:-325GiB}
    # CUDA-owned host memory (cudaMallocHost). Must stay 1 on TEE hosts: 0 selects
    # cudaHostRegister, which fails with CUDA error 801 under HCC/PPCIe.
    - SGLANG_HICACHE_CUDA_HOST_MEMORY=${GLM53_HICACHE_CUDA_HOST_MEMORY:-1}
    - SGLANG_HICACHE_POOLED_TRANSFERS=1
    - SGLANG_HICACHE_STAGING_PAGES=64
    # DSA indexer query split. Each TP rank scores 1/TP of a prefill chunk's rows instead of
    # all of them, so the fp32 logits buffer -- sized new_tokens x total_context -- shrinks
    # by TP (halves at TP2). gpu02's long-tier r1 crashed on 2026-09-25 without it:
    # deep_gemm.fp8_mqa_logits asked for 11.96 GiB with 11.88 GiB free at ~392K context
    # (dsa_indexer_kpool.py:919). This is a MITIGATION, not the fix: it divides the buffer
    # by TP and does not bound it. The real fix is calling _should_chunk_mqa_logits
    # (defined, unused, at dsa_indexer_kpool.py:862) and chunking against free memory.
    - SGLANG_DSA_INDEXER_QSPLIT=1
    # Opt-in observability (docker/sglang-glm53-hicache-w4afp8 v6; older images ignore it).
    # TP rank 0 only, off the serving path. The ghost prefix cache hashes each finished
    # request's pages into keyed digests (a 1/16 sample; tokens never leave the engine)
    # on a background thread and exports sglang:ghost_*. Every engine in this CVM shares the
    # key on the in-memory ghost volume and sends its digests to glm53-ghost-aggregator,
    # without ever blocking: if the aggregator is down the sends are dropped and counted.
    # The KV tier metrics export sglang:kv_tier_* (VRAM/DRAM evictions, load-backs, tier sizes).
    - SGLANG_GHOST_CACHE=1
    - SGLANG_GHOST_CACHE_SAMPLE=16
    - SGLANG_GHOST_CACHE_KEY_FILE=/ghost/key
    - SGLANG_GHOST_CACHE_SOCKET=/ghost/aggregator.sock
    - SGLANG_GHOST_CACHE_REPLICA=r1
    - SGLANG_KV_TIER_METRICS=1
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

