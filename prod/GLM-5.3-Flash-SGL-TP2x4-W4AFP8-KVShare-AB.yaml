      # keep-alive connection after 5 s (SGLANG_TIMEOUT_KEEP_ALIVE default) while this proxy
      # keeps one for 60 s by default, so a health probe could reuse a connection the engine
      # had already closed: it fails at once and counts toward the 3 misses that mark a
      # replica unhealthy. It applies to every pooled connection of this proxy (engines,
      # cloud-api, compose-manager); each reconnects after 3 s idle.
      - VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS=3
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
      # Replica-state publishing (inference-proxy #274): off unless the host's deploy env sets
      # REPLICA_STATE_REDIS_URL; a bad value logs one error and disables only this feature.
      - REPLICA_STATE_REDIS_URL=${REPLICA_STATE_REDIS_URL:-}
      - REPLICA_STATE_REDIS_CA_CERT=${REPLICA_STATE_REDIS_CA_CERT:-}
      - REPLICA_STATE_HOST_ID=${CVM_HOST:-}
    labels:
