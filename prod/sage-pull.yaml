name: sage-pull

services:
  sage-pull:
    image: nearaidev/compose-manager-launcher@sha256:91fdff3cfa3543d72656b2368c7d8a0a83d95a0f1087378c897aa1537acdba56
    pull_policy: missing
    container_name: sage-pull
    restart: "no"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /dockercfg:rw,noexec,nosuid,size=1m,mode=0700
    environment:
      DOCKER_CONFIG: /dockercfg
      PULL_USER: ${SAGE_DOCKERHUB_USER}
      PULL_TOKEN: ${SAGE_DOCKERHUB_TOKEN}
      IMAGE: levantolabs/sage2-hopper-pod@sha256:b5268f0a1bddf96895baf7b38f28cf814eaecc79d832d5660f4155584506009e
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        trap 'docker logout docker.io >/dev/null 2>&1 || true' EXIT
        printf '%s' "$$PULL_TOKEN" | docker login -u "$$PULL_USER" --password-stdin docker.io >/dev/null
        docker pull --quiet "$$IMAGE" >/dev/null
        echo "sage-pull: ok $$(docker image inspect --format '{{.Id}}' "$$IMAGE")"
