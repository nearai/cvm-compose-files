name: sage-pull

services:
  sage-pull:
    image: nearaidev/compose-manager-launcher@sha256:91fdff3cfa3543d72656b2368c7d8a0a83d95a0f1087378c897aa1537acdba56
    pull_policy: missing
    container_name: sage-pull
    restart: "no"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /dockercfg:rw,noexec,nosuid,size=1m,mode=0700
    environment:
      DOCKER_CONFIG: /dockercfg
      PULL_USER: ${SAGE_DOCKERHUB_USER}
      PULL_TOKEN: ${SAGE_DOCKERHUB_TOKEN}
      IMAGE: ${SAGE_IMAGE:?SAGE_IMAGE is required}
    healthcheck:
      test: ["CMD", "test", "-f", "/dockercfg/ready"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 31m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ! printf '%s\n' "$$IMAGE" | grep -Eq '^levantolabs/sage2-hopper-pod@sha256:[0-9a-f]{64}$$'; then
          echo 'A pinned image is required' >&2
          exit 1
        fi
        trap 'docker logout docker.io >/dev/null 2>&1 || true' EXIT
        if ! printf '%s' "$$PULL_TOKEN" | timeout 30 docker login -u "$$PULL_USER" --password-stdin docker.io >/dev/null 2>&1; then
          echo 'Registry login failed' >&2
          exit 1
        fi
        if ! timeout 1800 docker pull --quiet -- "$$IMAGE" >/dev/null 2>&1; then
          echo 'Image pull failed' >&2
          exit 1
        fi
        docker logout docker.io >/dev/null 2>&1
        touch /dockercfg/ready
        exec sleep 60
