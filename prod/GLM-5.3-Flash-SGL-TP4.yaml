              - job_name: dcgm-dcgm-glm53
                scrape_interval: 15s
                scrape_timeout: 10s
                metrics_path: /metrics
                static_configs:
                  - targets: ['dcgm-glm53:9400']
                    labels:
                      service: "dcgm-exporter"
                      source: "dcgm-exporter"
                      container_name: "dcgm-glm53"
                      model: "z-ai/glm-5.3-flash"
                      model_path: "zai-org/GLM-5.3-Flash"
                      served_model: "z-ai/glm-5.3-flash"
                      deployment: "glm53-flash-hicache-gpu03"
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
