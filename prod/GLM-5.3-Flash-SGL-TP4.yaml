# gpu03 experiment tag only: one HiCache SGLang control and one official vLLM
# GLM-5.3-Flash TP4 candidate. The vLLM image is pinned to the upstream
# GLM-5.3-Flash build previously qualified with this exact model revision.
# Speculative decoding is disabled because this image's MTP rejection-sampler
# warmup asserts in ScatterGatherKernel on gpu03 before the API can start.
# Eager execution isolates the gpu03 CUDA-graph path, which otherwise starts
# but produces deterministic repetitive tokens with this image and model.
# The registrar is profile-gated below and must remain disabled for this test.
# Do not promote this file; it deliberately enables full synthetic request logs.
#
# Canonical GLM-5.3 Flash production deployment for 8x H200 hosts.
# Run the exact same committed tag and file on every matching host: two independent
# TP4/EP4 replicas, one per four-GPU NVLink island, behind one inference proxy.
x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

# Production GLM-5.3-Flash on two independent H200 TP4/EP4 replicas. Each
# replica stays within one four-GPU NVLink island; one inference-proxy uses its native
# least-connections backend pool for health-aware balancing and failover.
#
# The engine is published by the repository's GitHub Actions workflow and pinned
# here by its signed immutable registry digest. Its source is pinned to
# PierreLeGuen/sglang-upstream commit fc91d24, derived from official SGLang main
# plus the official GLM-5.3 branch. It contains
# upstream disconnect cleanup (#35255), the final-prefill abort fix (#34153),
# the strict thinking-budget adapter, and two narrow DSA import-cycle fixes. The
# official CUDA 13 SGLang image is the pinned build base. The serving envelope
# is intentionally conservative: BF16 KV, 0.80 static memory,
# 32 running requests, a bounded 32-request queue, 4096-token prefill chunks,
# decode graphs capped at batch 32, TileLang DSA, DeepGEMM, and adaptive EAGLE
# 5/1/6. This retains the full 1,048,576-token model context while avoiding the
# late K-pool workspace exhaustion observed with larger prefill chunks.
#
# A small fail-closed adapter patch maps the public thinking_token_budget field
# to SGLang strict-thinking's custom_params.thinking_budget. Omitted values
# default to 8192; explicit null remains an opt-out; an explicit native
# custom_params.thinking_budget wins. Request/response payload logging is off.
#
# The vLLM GLM-5.3-Flash path is not used: its Hopper NVFP4/MLA path produced
# non-finite logits and repetitive output. This pack also retires the previous
# co-resident DeepSeek arm so both four-GPU islands serve GLM-5.3-Flash.

name: glm53-hicache-gpu03

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:98b57ad7aa4f9afd8ffff3ac9f4773303997f667e1d221be076c2f064e4a1284
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-sg-glm53-flash-common: &sg-glm53-flash-common
  <<: *nvidia
  init: true
  image: docker.io/nearaidev/sglang@sha256:4a1a59791bcf752ef6f8bc898f6b81b681a524f3ae61064fff744a49d2cd4946
  command: >
      sglang serve
      --model-path /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/84c6a6aa9497188e15a635ba793b0f95a79b1033
      --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
      --served-model-name z-ai/glm-5.3-flash
      --tp-size 4
      --ep-size 4
      --mem-fraction-static 0.80
      --max-running-requests 32
      --max-queued-requests 32
      --chunked-prefill-size 4096
      --cuda-graph-max-bs-decode 32
      --dsa-prefill-backend tilelang
      --dsa-decode-backend tilelang
      --kv-cache-dtype bfloat16
      --moe-runner-backend deep_gemm
      --speculative-algorithm EAGLE
      --speculative-num-steps 5
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 6
      --speculative-adaptive
      --reasoning-parser glm45
      --enable-strict-thinking
      --grammar-backend xgrammar
      --tool-call-parser glm47
      --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja
      --context-length 1048576
      --dist-init-addr 127.0.0.1:29510
      --watchdog-timeout 1800
      --host 0.0.0.0
      --port 8000
      --enable-metrics
      --enable-cache-report
      --log-level info
      --log-requests
      --log-requests-level 3
      --disable-fast-image-processor
      --limit-mm-data-per-request '{"image": 64}'
      --enable-hierarchical-cache
      --hicache-write-policy write_through
      --hicache-io-backend direct
      --hicache-mem-layout page_first_direct
  volumes:
    - kernel_cache:/root/.cache
    - huggingface_cache:/root/.cache/huggingface
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    # Local snapshot path; nothing is fetched at engine start.
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - HF_HUB_DISABLE_TELEMETRY=1
    - DO_NOT_TRACK=1
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
    - TRITON_CACHE_DIR=/root/.cache/triton
    - SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE=1
    - SGLANG_HICACHE_RAM_BUDGET=${GLM53_HICACHE_RAM_BUDGET:-256GiB}
    - SGLANG_HICACHE_CUDA_HOST_MEMORY=1
    - SGLANG_HICACHE_CUDA_MANAGED_MEMORY=0
    - SGLANG_HICACHE_POOLED_TRANSFERS=1
    - SGLANG_HICACHE_STAGING_PAGES=64
    - PYTHONFAULTHANDLER=1
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-vllm-glm53-flash-common: &vllm-glm53-flash-common
  <<: *nvidia
  init: true
  image: docker.io/vllm/vllm-openai@sha256:2c6da6c6f16ed15c91e412d896dba13701f25fe1861eaec9ddaa4db34d1d21c4
  entrypoint: ["vllm", "serve"]
  # Match the retained, semantically qualified gpu31 vLLM runtime first:
  # TP4, 131072 context, default CUDA graphs, auto FP8 backends, and no MTP.
  # gpu03 rejects vLLM custom all-reduce during final CUDA-graph capture, while
  # NCCL reaches serving but produces invalid logits. Preserve the gpu31
  # custom collective and isolate graph capture by using eager execution.
  command: >
      /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/84c6a6aa9497188e15a635ba793b0f95a79b1033
      --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
      --served-model-name z-ai/glm-5.3-flash
      --tensor-parallel-size 4
      --enforce-eager
      --no-enable-flashinfer-autotune
      --tool-call-parser glm47
      --reasoning-parser glm45
      --enable-auto-tool-choice
      --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja
      --chat-template-content-format openai
      --default-chat-template-kwargs '{"clear_thinking":true}'
      --gpu-memory-utilization 0.82
      --max-model-len 131072
      --max-num-seqs 32
      --max-num-batched-tokens 8192
      --enable-prompt-tokens-details
      --host 0.0.0.0
      --port 8000
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - vllm_cache:/root/.cache/vllm
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - HF_HUB_DISABLE_TELEMETRY=1
    - DO_NOT_TRACK=1
    - VLLM_ENABLE_CUDA_COMPATIBILITY=0
    - VLLM_ENGINE_READY_TIMEOUT_S=3600
    - VLLM_CACHE_ROOT=/root/.cache/vllm/glm53-flash-official-487ecf187
    - VLLM_LOGGING_LEVEL=INFO
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    - TORCH_SHOW_CPP_STACKTRACES=1
    - TORCH_DISABLE_ADDR2LINE=1
    - NCCL_DEBUG=WARN
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  cap_add:
    - SYS_NICE
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:613ab03c11d442fd960ff515f547e9921537454a712d08160bc8f677f89f1c35
  command: ["-f", "/etc/dcgm-exporter/nearai-h200.csv"]
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  configs:
    - source: dcgm_h200_metrics
      target: /etc/dcgm-exporter/nearai-h200.csv
      mode: 0444
  restart: unless-stopped
  logging: *logging-conf

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Downloading zai-org/GLM-5.3-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
        echo "Downloading corrected GLM-5.3-Flash chat template..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash chat_template.jinja --revision 3f1971b7b5f7a528c9c4ef6212c8785298a8c24a
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:zai-org/GLM-5.3-Flash","served_model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Dormant during normal deploys. Target this service explicitly with the
  # maintenance profile when one model's shared HF cache must be evicted.
  # Inlined copy of the root cleanup-hf-model.yaml service: compose-manager's
  # compose/up fetches only the requested file, so cross-file `extends:` /
  # `include:` must not be used here (they fail at config load).
  hf-cleanup:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: hf-cleanup
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        : "$${MODEL_NAME:?MODEL_NAME env var is required (e.g. zai-org/GLM-5-FP8)}"

        echo "=== Disk usage ==="
        df -h /root/.cache 2>/dev/null || df -h /

        echo ""
        echo "=== Cached model weights ==="
        HUB=/root/.cache/huggingface/hub
        if ls "$$HUB"/models--* >/dev/null 2>&1; then
          du -sh "$$HUB"/models--* | sort -rh
        else
          echo "(none)"
        fi
        echo ""
        echo "Total HF cache: $$(du -sh $$HUB 2>/dev/null | cut -f1)"

        echo ""
        echo "=== Cleanup ==="
        SAFE=$$(printf '%s' "$$MODEL_NAME" | sed 's|/|--|g')
        TARGET="$$HUB/models--$$SAFE"
        echo "MODEL_NAME=$$MODEL_NAME"
        echo "TARGET=$$TARGET"
        if [ ! -d "$$TARGET" ]; then
          echo "Not found — nothing to remove."
          exit 0
        fi
        echo "Removing $$(du -sh "$$TARGET" | cut -f1) ..."
        rm -rf "$$TARGET"
        echo "Removed $$TARGET"
        echo "Disk after: $$(df -h /root/.cache 2>/dev/null | tail -1 || df -h / | tail -1)"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - MODEL_NAME=${MODEL_NAME}
    # Verbatim from cleanup-hf-model.yaml (not the file-wide *logging-conf) so the
    # rendered service is unchanged from the previous `extends` result.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "com.datadoghq.ad.logs"

  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-glm53
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8000:8000"
      - "8444:443"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000"]}]'

  model-proxy-registrar:
    profiles: ["never-register-gpu03-hicache-test"]
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    healthcheck:
      # Unhealthy if the registration loop hasn't ticked in 3m (e.g. wedged
      # before the loop, or the loop died). Surfaces silent registrar failures
      # in `docker ps` / Datadog. See cvm-compose-files#57.
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    environment:
      - HOST_IP=${HOST_IP}
      - HTTP_PORT=${HTTP_PORT:-8000}
      - TLS_PORT=${TLS_PORT:-8444}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # --- GLM-5.3-Flash proxy ---
  proxy-glm53:
    <<: *vllm-proxy-common
    container_name: proxy-glm53
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=z-ai/glm-5.3-flash
      - OHTTP_ENABLED=true
      - TOKEN=${PROXY_TOKEN}
      - FUSION_ENABLED=${FUSION_ENABLED}
      - FUSION_INTERNAL_BEARER_TOKEN=${FUSION_INTERNAL_BEARER_TOKEN}
      - VLLM_BACKEND_URLS=http://model-sg-glm53-fp8-tp4-r1:8000,http://model-vllm-glm53-fp8-tp4-r2:8000
      # Keep append-only conversations on the replica that already holds their prefix cache
      # (inference-proxy #227); new conversations still balance by least-connections.
      - VLLM_BACKEND_CONVERSATION_AFFINITY=1
      - VLLM_PROXY_MAX_REQUEST_SIZE=104857600
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-glm53"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm53-flash-hicache-gpu03"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  # --- GLM-5.3-Flash engine replica 1 (SGLang TP4, GPUs 0-3) ---
  model-sg-glm53-fp8-tp4-r1:
    <<: *sg-glm53-flash-common
    container_name: model-sg-glm53-fp8-tp4-r1
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0","1","2","3"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang","service":"sglang","tags":["model:z-ai/glm-5.3-flash","model_path:zai-org/GLM-5.3-Flash","served_model:z-ai/glm-5.3-flash","precision:fp8-weights-bf16-kv","deployment:glm53-flash-hicache-gpu03","config_variant:fc91d24-hicache-cuda-host-pooled-direct-hcc-tp4-ep4-eagle-adaptive-5-1-6","request_logging:full-synthetic","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000","instance:1"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "sglang"
      nearai.otel.service: "sglang"
      nearai.otel.source: "sglang"
      nearai.otel.container_name: "model-sg-glm53-fp8-tp4-r1"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.model_path: "zai-org/GLM-5.3-Flash"
      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm53-flash-hicache-gpu03"
      nearai.otel.config_variant: "fc91d24-hicache-cuda-host-pooled-direct-hcc-tp4-ep4-eagle-adaptive-5-1-6"
      nearai.otel.thinking_budget_policy: "default8192-public-to-native"
      nearai.otel.request_logging: "full-synthetic"
      nearai.otel.instance: "1"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  # --- GLM-5.3-Flash vLLM gpu31-derived NCCL control (TP4, GPUs 4-7) ---
  model-vllm-glm53-fp8-tp4-r2:
    <<: *vllm-glm53-flash-common
    container_name: model-vllm-glm53-fp8-tp4-r2
    stop_grace_period: 30s
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4","5","6","7"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:z-ai/glm-5.3-flash","model_path:zai-org/GLM-5.3-Flash","served_model:z-ai/glm-5.3-flash","precision:fp8-weights-bf16-kv","deployment:glm53-flash-hicache-gpu03","config_variant:vllm-487ecf187-tp4-131k-custom-ar-eager","request_logging:disabled","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000","instance:2"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-glm53-fp8-tp4-r2"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.model_path: "zai-org/GLM-5.3-Flash"
      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm53-flash-hicache-gpu03"
      nearai.otel.config_variant: "vllm-487ecf187-tp4-131k-custom-ar-eager"
      nearai.otel.request_logging: "disabled"
      nearai.otel.instance: "2"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  # Operator-only HCC capability probe. It verifies the exact CUDA memory
  # semantics needed by a host-cache fallback without loading model weights.
  hicache-hcc-probe:
    image: docker.io/nearaidev/sglang@sha256:4a1a59791bcf752ef6f8bc898f6b81b681a524f3ae61064fff744a49d2cd4946
    container_name: hicache-hcc-probe
    profiles: ["verification"]
    runtime: nvidia
    # PyTorch is installed in the image's /opt/sglang virtual environment.
    # Use its interpreter explicitly so the probe exercises the exact runtime
    # that the SGLang entry point uses.
    entrypoint: ["/opt/sglang/bin/python3", "-u", "-c"]
    command:
      - |
        import ctypes, json, torch
        class CudaMemLocation(ctypes.Structure):
            _fields_ = [("type", ctypes.c_int), ("id", ctypes.c_int)]
        cudart = ctypes.CDLL("libcudart.so")
        cudart.cudaDeviceGetAttribute.argtypes = [
            ctypes.POINTER(ctypes.c_int), ctypes.c_int, ctypes.c_int
        ]
        cudart.cudaDeviceGetAttribute.restype = ctypes.c_int
        cudart.cudaMallocManaged.argtypes = [
            ctypes.POINTER(ctypes.c_void_p), ctypes.c_size_t, ctypes.c_uint
        ]
        cudart.cudaMallocManaged.restype = ctypes.c_int
        cudart.cudaGetDevice.argtypes = [ctypes.POINTER(ctypes.c_int)]
        cudart.cudaGetDevice.restype = ctypes.c_int
        cudart.cudaMemAdvise.argtypes = [
            ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int, CudaMemLocation
        ]
        cudart.cudaMemAdvise.restype = ctypes.c_int
        cudart.cudaMemcpy.argtypes = [
            ctypes.c_void_p, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_int
        ]
        cudart.cudaMemcpy.restype = ctypes.c_int
        cudart.cudaFree.argtypes = [ctypes.c_void_p]
        cudart.cudaFree.restype = ctypes.c_int
        attrs = {}
        # Stable values from cudaDeviceAttr in the CUDA Runtime API.
        for name, attribute in (
            ("cudaDevAttrHostRegisterSupported", 99),
            ("cudaDevAttrPageableMemoryAccess", 88),
            ("cudaDevAttrPageableMemoryAccessUsesHostPageTables", 100),
            ("cudaDevAttrConcurrentManagedAccess", 89),
            ("cudaDevAttrManagedMemory", 83),
        ):
            value = ctypes.c_int()
            rc = cudart.cudaDeviceGetAttribute(ctypes.byref(value), attribute, 0)
            attrs[name] = {"rc": int(rc), "value": int(value.value)}
        result = {"device": torch.cuda.get_device_name(0), "attributes": attrs}
        source = torch.arange(4096, dtype=torch.uint8)
        target = torch.empty_like(source, device="cuda")
        rc = cudart.cudaMemcpy(
            ctypes.c_void_p(target.data_ptr()),
            ctypes.c_void_p(source.data_ptr()),
            source.nbytes,
            1,
        )
        result["pageable_memcpy"] = {
            "rc": int(rc),
            "matches": bool(torch.equal(source, target.cpu())) if int(rc) == 0 else False,
        }
        managed_ptr = ctypes.c_void_p()
        try:
            malloc_rc = cudart.cudaMallocManaged(ctypes.byref(managed_ptr), 4096, 1)
            managed = {
                "malloc_rc": int(malloc_rc),
                "ptr_nonzero": bool(managed_ptr.value),
            }
            if int(malloc_rc) == 0:
                current_device = ctypes.c_int()
                get_device_rc = cudart.cudaGetDevice(ctypes.byref(current_device))
                managed["get_device"] = {
                    "rc": int(get_device_rc),
                    "device": int(current_device.value),
                }
                host_location = CudaMemLocation(2, 0)
                gpu_location = CudaMemLocation(1, int(current_device.value))
                preferred_rc = cudart.cudaMemAdvise(
                    managed_ptr, 4096, 3, host_location
                )
                accessed_by_rc = cudart.cudaMemAdvise(
                    managed_ptr, 4096, 5, gpu_location
                )
                managed["memory_advice"] = {
                    "preferred_cpu_rc": int(preferred_rc),
                    "accessed_by_gpu_rc": int(accessed_by_rc),
                }
                raw = (ctypes.c_ubyte * 4096).from_address(managed_ptr.value)
                managed_cpu = torch.frombuffer(raw, dtype=torch.uint8, count=4096)
                managed_cpu.copy_(source)
                managed_target = torch.empty_like(source, device="cuda")
                h2d_rc = cudart.cudaMemcpy(
                    ctypes.c_void_p(managed_target.data_ptr()),
                    ctypes.c_void_p(managed_cpu.data_ptr()),
                    managed_cpu.nbytes,
                    1,
                )
                managed["h2d"] = {
                    "rc": int(h2d_rc),
                    "matches": bool(torch.equal(source, managed_target.cpu()))
                    if int(h2d_rc) == 0
                    else False,
                }
                managed_target.copy_(255 - managed_target)
                d2h_rc = cudart.cudaMemcpy(
                    ctypes.c_void_p(managed_cpu.data_ptr()),
                    ctypes.c_void_p(managed_target.data_ptr()),
                    managed_cpu.nbytes,
                    2,
                )
                managed["d2h"] = {
                    "rc": int(d2h_rc),
                    "matches": bool(torch.equal(managed_cpu, 255 - source))
                    if int(d2h_rc) == 0
                    else False,
                }
            result["managed_memory"] = managed
        except Exception as exc:
            result["managed_memory"] = type(exc).__name__ + ": " + str(exc)
        finally:
            if managed_ptr.value:
                free_rc = cudart.cudaFree(managed_ptr)
                result["managed_memory_free_rc"] = int(free_rc)
        try:
            torch.empty(4096, dtype=torch.uint8, pin_memory=True)
            result["torch_pin_memory"] = "succeeded"
        except Exception as exc:
            result["torch_pin_memory"] = type(exc).__name__ + ": " + str(exc)
        print(json.dumps(result, sort_keys=True), flush=True)
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONFAULTHANDLER=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: "no"
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"hicache-hcc-probe","service":"hicache-hcc-probe","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Explicit operator-only semantic check; never starts with a normal stack apply.
  # Runs the candidate's synthetic fixture gate against each replica at concurrency 1.
  # No GPU allocation, host mounts, Docker socket, credentials, or published ports.
  glm53-perception-check:
    image: docker.io/nearaidev/sglang@sha256:a7b7136abcf5e07522289d96e96fec9b42a1a30f9dfda57e957f142680d2d67b
    container_name: glm53-perception-check
    profiles: ["verification"]
    runtime: runc
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 512m
    cpus: 1
    environment:
      - NVIDIA_VISIBLE_DEVICES=void
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: ["/usr/bin/python3", "-u", "-c"]
    command:
      - |
        import json, runpy, shutil, sys, urllib.request
        print(json.dumps({"event": "disk", "free_bytes": shutil.disk_usage("/").free}), flush=True)
        failed = False
        for replica in (1, 2):
            base = f"http://model-sg-glm53-fp8-tp4-r{replica}:8000"
            print(json.dumps({"event": "replica", "replica": replica}), flush=True)
            for path in ("/health", "/v1/models"):
                with urllib.request.urlopen(base + path, timeout=30) as response:
                    assert response.status == 200
                    if path == "/v1/models":
                        assert "z-ai/glm-5.3-flash" in [row["id"] for row in json.load(response)["data"]]
            sys.argv = ["perception", "--base-url", base, "--size", "512", "--concurrency", "1", "--timeout", "300"]
            try:
                runpy.run_path("/sgl-workspace/sglang/test/manual/test_glm5_next_perception.py", run_name="__main__")
            except SystemExit as result:
                failed = failed or bool(result.code)
        print(json.dumps({"event": "qualification_finished", "ok": not failed}), flush=True)
        raise SystemExit(1 if failed else 0)
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"glm53-perception-check","service":"glm53-perception-check","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Explicit operator-only TLS access to each replica for paired qualification.
  # Never registered with the customer router; no model/proxy dependencies.
  glm53-soak-relay:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: glm53-soak-relay
    profiles: ["verification"]
    runtime: runc
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 5m
    ports:
      - "8008:8008"
      - "8009:8009"
    volumes:
      - certs:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=4m
    entrypoint: ["nginx", "-g", "daemon off;"]
    configs:
      - source: glm53_soak_nginx_conf
        target: /etc/nginx/nginx.conf
        mode: 0600
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # --- Full-host GPU telemetry ---

  dcgm-glm53:
    <<: *dcgm-common
    container_name: dcgm-glm53
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0","1","2","3","4","5","6","7"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"dcgm-exporter","service":"dcgm-exporter","tags":["model:z-ai/glm-5.3-flash","model_path:zai-org/GLM-5.3-Flash","served_model:z-ai/glm-5.3-flash","deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "dcgm"
      nearai.otel.service: "dcgm-exporter"
      nearai.otel.source: "dcgm-exporter"
      nearai.otel.container_name: "dcgm-glm53"
      nearai.otel.port: "9400"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.model_path: "zai-org/GLM-5.3-Flash"
      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm53-flash-hicache-gpu03"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  otelcol-contrib:
    image: otel/opentelemetry-collector-contrib@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    container_name: otelcol-contrib
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0:0"
    mem_limit: "768m"
    environment:
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      - CVM_NAME=${CVM_NAME:-unknown}
      - CVM_HOST=${CVM_HOST:-unknown}
      - DD_HOSTNAME=${DD_HOSTNAME:-unknown}
      - ENV=${ENV:-unknown}
      - HOST_IP=${HOST_IP:-unknown}
    expose:
      - "4317"
      - "4318"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol_app_storage:/var/lib/otelcol-contrib
    configs:
      - source: otelcol_app_config
        target: /etc/otelcol-contrib/config.yaml
        mode: 0444
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      com.datadoghq.ad.logs: '[{"source":"otelcol-contrib","service":"otelcol-contrib","tags":["deployment:glm53-flash-hicache-gpu03","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

networks:
  default:
    external: true
    name: dstack_default

volumes:
  otelcol_app_storage:
  # Reuse the isolated gpu03 pre-download volume when the engines are launched
  # under compose-manager's observable default `work` project.
  huggingface_cache:
    external: true
    name: glm53-hicache-gpu03_huggingface_cache
  kernel_cache:
  vllm_cache:
  certs:
    external: true
    name: certs

configs:
  glm53_soak_nginx_conf:
    content: |
      user nginx;
      worker_processes 1;
      pid /var/run/nginx.pid;
      error_log /dev/null;
      events { worker_connections 64; }
      http {
        # No request/response logging or disk buffering of qualification traffic.
        access_log off;
        client_max_body_size 100m;
        client_body_timeout 3600s;
        send_timeout 3600s;
        resolver 127.0.0.11 valid=5s ipv6=off;
        map_hash_bucket_size 256;
        map $$http_authorization $$soak_authorized {
          default 0;
          "Bearer ${PROXY_TOKEN:?PROXY_TOKEN required for authenticated soak access}" 1;
        }
        ssl_certificate /etc/letsencrypt/live/completions.near.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/completions.near.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_next_upstream off;
        server {
          listen 8008 ssl;
          server_name _;
          if ($$soak_authorized = 0) { return 401; }
          set $$backend http://model-sg-glm53-fp8-tp4-r1:8000;
          location ~ ^/(health|metrics|v1/models|v1/chat/completions|v1/completions|v1/responses)$$ {
            limit_except GET POST { deny all; }
            proxy_pass $$backend$$request_uri;
          }
          location / { return 404; }
        }
        server {
          listen 8009 ssl;
          server_name _;
          if ($$soak_authorized = 0) { return 401; }
          set $$backend http://model-vllm-glm53-fp8-tp4-r2:8000;
          location ~ ^/(health|metrics|v1/models|v1/chat/completions|v1/completions|v1/responses)$$ {
            limit_except GET POST { deny all; }
            proxy_pass $$backend$$request_uri;
          }
          location / { return 404; }
        }
      }

  dcgm_h200_metrics:
    content: |
      # NEAR AI H200 operational collector for DCGM 4.6.0 / exporter 4.8.3.
      # Format: DCGM field, Prometheus type, help message.

      # Clocks, temperature, power and cumulative GPU-board energy.
      DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency in MHz.
      DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency in MHz.
      DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature in C.
      DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature in C.
      DCGM_FI_DEV_POWER_USAGE, gauge, GPU board power draw in W.
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, GPU board energy consumed since boot in mJ.

      # Utilization, framebuffer and PCIe.
      DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization in percent.
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory copy utilization in percent.
      DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free in MiB.
      DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used in MiB.
      DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved in MiB.
      DCGM_FI_PROF_PCIE_TX_BYTES, gauge, PCIe transmit throughput in bytes per second.
      DCGM_FI_PROF_PCIE_RX_BYTES, gauge, PCIe receive throughput in bytes per second.
      DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total PCIe replay events.

      # Raw and exporter-owned incident signals. Windowed counts provide a
      # stable zero series; cumulative totals preserve observed event labels.
      DCGM_FI_DEV_XID_ERRORS, gauge, Last XID error encountered.
      DCGM_EXP_XID_ERRORS_COUNT, gauge, XID records observed in the configured window.
      DCGM_EXP_XID_ERRORS_TOTAL, counter, XID records observed since exporter start.
      DCGM_EXP_CLOCK_EVENTS_COUNT, gauge, Clock events observed in the configured window.
      DCGM_EXP_CLOCK_EVENTS_TOTAL, counter, Clock event transitions observed since exporter start.
      DCGM_EXP_GPU_HEALTH_STATUS, gauge, Current DCGM GPU health status by health watch.
      DCGM_EXP_P2P_STATUS, gauge, Current NVLink P2P status for each ordered GPU pair.

      # Throttling and reliability constraints.
      DCGM_FI_DEV_POWER_VIOLATION, counter, Throttling duration due to power constraints in ns.
      DCGM_FI_DEV_THERMAL_VIOLATION, counter, Throttling duration due to thermal constraints in ns.
      DCGM_FI_DEV_SYNC_BOOST_VIOLATION, counter, Throttling duration due to sync boost constraints in ns.
      DCGM_FI_DEV_BOARD_LIMIT_VIOLATION, counter, Throttling duration due to board constraints in ns.
      DCGM_FI_DEV_LOW_UTIL_VIOLATION, counter, Throttling duration due to low utilization in ns.
      DCGM_FI_DEV_RELIABILITY_VIOLATION, counter, Throttling duration due to reliability constraints in ns.

      # ECC, retired pages and row remapping.
      DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Total volatile single-bit ECC errors.
      DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Total volatile double-bit ECC errors.
      DCGM_FI_DEV_ECC_SBE_AGG_TOTAL, counter, Total aggregate single-bit ECC errors.
      DCGM_FI_DEV_ECC_DBE_AGG_TOTAL, counter, Total aggregate double-bit ECC errors.
      DCGM_FI_DEV_RETIRED_SBE, counter, Total pages retired due to single-bit errors.
      DCGM_FI_DEV_RETIRED_DBE, counter, Total pages retired due to double-bit errors.
      DCGM_FI_DEV_RETIRED_PENDING, counter, Pages pending retirement.
      DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Total uncorrectable remapped rows.
      DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Total correctable remapped rows.
      DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether row remapping has failed.

      # NVLink traffic and integrity.
      DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, Aggregate NVLink traffic rate across all lanes.
      DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL, counter, Total NVLink flow-control CRC errors.
      DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL, counter, Total NVLink data CRC errors.
      DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL, counter, Total NVLink replay errors.
      DCGM_FI_DEV_NVLINK_RECOVERY_ERROR_COUNT_TOTAL, counter, Total NVLink recovery errors.

      # Workload profiling. Unsupported fields are skipped by DCGM and must be
      # represented as unsupported in Grafana rather than coerced to zero.
      DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active.
      DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor pipe is active.
      DCGM_FI_PROF_DRAM_ACTIVE, gauge, Ratio of time the device memory interface is active.

      # Stable software identity labels attached to emitted GPU metrics.
      DCGM_FI_DRIVER_VERSION, label, NVIDIA driver version.
      DCGM_FI_NVML_VERSION, label, NVML version.
      DCGM_FI_DEV_BRAND, label, GPU product brand.
      DCGM_FI_DEV_VBIOS_VERSION, label, GPU VBIOS version.

  otelcol_app_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        filelog/docker_containers:
          include: [/var/lib/docker/containers/*/*-json.log]
          start_at: end
          storage: file_storage
          include_file_path: true
          operators:
            - type: json_parser
              parse_from: body
              parse_to: attributes
              timestamp:
                parse_from: attributes.time
                layout_type: gotime
                layout: '2006-01-02T15:04:05.999999999Z07:00'
              on_error: send_quiet
            - type: move
              from: attributes.log
              to: body
              if: 'attributes.log != nil'
            - type: move
              from: attributes.stream
              to: attributes["log.iostream"]
              if: 'attributes.stream != nil'
            - type: remove
              field: attributes.time
              if: 'attributes.time != nil'
            - type: regex_parser
              parse_from: attributes["log.file.path"]
              regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]{12})[a-f0-9]*/'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model:(?P<model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'served_model:(?P<served_model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model_path:(?P<model_path>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'precision:(?P<precision>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'deployment:(?P<deployment>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ip:(?P<ip>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'port:(?P<port>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'env:(?P<env>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'host:(?P<host>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'instance:(?P<instance>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'replica:(?P<replica>[^",\]]+)'
              on_error: send_quiet
            - type: add
              field: attributes["service.name"]
              value: cvm-docker

        prometheus/apps:
          config:
            scrape_configs:
              - job_name: sglang-model-sg-glm53-fp8-tp4-r1
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-sg-glm53-fp8-tp4-r1:8000']
                    labels:
                      service: "sglang"
                      source: "sglang"
                      container_name: "model-sg-glm53-fp8-tp4-r1"
                      model: "z-ai/glm-5.3-flash"
                      model_path: "zai-org/GLM-5.3-Flash"
                      served_model: "z-ai/glm-5.3-flash"
                      precision: "fp8-weights-bf16-kv"
                      deployment: "glm53-flash-hicache-gpu03"
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "8000"
                      instance: "1"
                      config_variant: "fc91d24-hicache-cuda-host-pooled-direct-hcc-tp4-ep4-eagle-adaptive-5-1-6"
                      thinking_budget_policy: "default8192-public-to-native"
                      request_logging: "full-synthetic"
              - job_name: vllm-model-vllm-glm53-fp8-tp4-r2
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-vllm-glm53-fp8-tp4-r2:8000']
                    labels:
                      service: "vllm"
                      source: "vllm"
                      container_name: "model-vllm-glm53-fp8-tp4-r2"
                      model: "z-ai/glm-5.3-flash"
                      model_path: "zai-org/GLM-5.3-Flash"
                      served_model: "z-ai/glm-5.3-flash"
                      precision: "fp8-weights-bf16-kv"
                      deployment: "glm53-flash-hicache-gpu03"
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "8000"
                      instance: "2"
                      config_variant: "vllm-487ecf187-tp4-131k-custom-ar-eager"
