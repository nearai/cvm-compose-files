# z-ai/glm-5.3-flash | vLLM | P/D disaggregation, 2 pairs per host
# Pair A prefill GPUs 0-1, decode 2-3. Pair B prefill 4-5, decode 6-7. Edit pairs together with router and scrape jobs.
x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:e3a4fbcacdf83f83212d4c6c0ad4d766d602b88c004dc82a2dd4ae147dccde94
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-glm53-engine-common: &glm53-engine-common
  <<: *nvidia
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  image: docker.io/nearaidev/vllm@sha256:1ed179af333e0bb2c5724858c7e68a6e268e0edd02ddb67f6105157287cd5c9a
  restart: unless-stopped
  stop_grace_period: 10m
  logging: *logging-conf

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Downloading zai-org/GLM-5.3-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
        echo "Downloading the GLM-5.3-Flash chat template..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash chat_template.jinja --revision 3f1971b7b5f7a528c9c4ef6212c8785298a8c24a
        echo "Downloading graphistry/GLM-5.3-Flash-W4AFP8..."
        uvx --from 'huggingface_hub[hf_xet]' hf download graphistry/GLM-5.3-Flash-W4AFP8 --revision 99f1fa70408c52b007d4fd69e02e5a522422e755
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:z-ai/glm-5.3-flash","deployment:glm-5.3-flash-vllm-pd2x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"]}]'

  nginx:
    image: nginx@sha256:9e596d26590907ed433eb53c83c4016038025d4e004b15922786ba85c8957264
    container_name: nginx
    depends_on:
      proxy-glm53:
        condition: service_started
    command: /bin/sh -c 'certs="/etc/letsencrypt/live/completions.near.ai/fullchain.pem"; last=$$(stat -L -c %Y $$certs 2>/dev/null); while :; do sleep 60; cur=$$(stat -L -c %Y $$certs 2>/dev/null); if [ -n "$$cur" ] && [ "$$cur" != "$$last" ]; then last=$$cur; echo "certs changed, reloading nginx"; nginx -s reload; fi; done & while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8000:8000"
      - "8444:443"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:z-ai/glm-5.3-flash","deployment:glm-5.3-flash-vllm-pd2x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"]}]'

  model-proxy-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1800s
    environment:
      - HOST_IP=${HOST_IP}
      - HTTP_PORT=${HTTP_PORT:-8000}
      - TLS_PORT=${TLS_PORT:-8444}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:z-ai/glm-5.3-flash","deployment:glm-5.3-flash-vllm-pd2x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"]}]'

  proxy-glm53:
    <<: *vllm-proxy-common
    container_name: proxy-glm53
    networks:
      - default
      - engine-glm53-a
      - engine-glm53-b
    depends_on:
      engine-egress-probe:
        condition: service_completed_successfully
      pd-router-glm53-a:
        condition: service_started
      pd-router-glm53-b:
        condition: service_started
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=z-ai/glm-5.3-flash
      - VLLM_PROXY_STRICT_REQUEST_MODEL=1
      - VLLM_PROXY_PRIORITY_LOWER_FIRST=1
      - OHTTP_ENABLED=true
      - TOKEN=${PROXY_TOKEN}${PROXY_TOKEN_NEXT:+,${PROXY_TOKEN_NEXT}}
      - VLLM_BACKEND_URLS=http://pd-router-glm53-a:9200,http://pd-router-glm53-b:9201
      - VLLM_BACKEND_CONVERSATION_AFFINITY=1
      - VLLM_BACKEND_AFFINITY_MAX_IMBALANCE=64
      # Per pair (one pd-router = one backend); keep at or below the engines' --max-num-seqs.
      - VLLM_BACKEND_MAX_INFLIGHT=64
      - VLLM_PROXY_MAX_REQUEST_SIZE=104857600
      - VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS=3
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
      - VLLM_PROXY_INLINE_MEDIA=${VLLM_PROXY_INLINE_MEDIA:-1}
      - VLLM_PROXY_REJECTED_CONTENT_PART_TYPES=${VLLM_PROXY_REJECTED_CONTENT_PART_TYPES:-video_url}
      - REPLICA_STATE_REDIS_URL=${REPLICA_STATE_REDIS_URL:-}
      - REPLICA_STATE_REDIS_CA_CERT=${REPLICA_STATE_REDIS_CA_CERT:-}
      - REPLICA_STATE_HOST_ID=${CVM_HOST:-}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:z-ai/glm-5.3-flash","port:8000","deployment:glm-5.3-flash-vllm-pd2x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-glm53"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm-5.3-flash-vllm-pd2x2"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.ppcie: "true"
      nearai.otel.config_variant: "vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"

  # Network namespace of the four engines of pair A: they reach each other on loopback, and the
  # router, the proxy and the collector reach them by name on one internal network.
  sidecar-glm53-netns-a:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: sidecar-glm53-netns-a
    entrypoint: ["sleep", "infinity"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "64m"
    networks:
      engine-glm53-a:
        aliases:
          - model-vllm-glm53-a-prefill0
          - model-vllm-glm53-a-prefill1
          - model-vllm-glm53-a-decode0
          - model-vllm-glm53-a-decode1
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"sidecar-glm53-netns-a","service":"sidecar-glm53-netns-a","tags":["model:z-ai/glm-5.3-flash","deployment:glm-5.3-flash-vllm-pd2x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  model-vllm-glm53-a-prefill0:
    <<: *glm53-engine-common
    # One /dev/shm per pair, shared by its four engines through the leader IPC namespace.
    shm_size: 64g
    volumes:
      - huggingface_cache:/root/.cache/huggingface:ro
      - glm53_kernel_cache_a:/root/.cache/vllm
      - humming_cache_a:/root/.cache/humming
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0","1","2","3"]
              capabilities: [gpu]
    # Pair leader, no host namespaces: the pair's four engines share this pair-private ipc/pid namespace for
    # CUDA IPC and NCCL; the other pair, proxy and host daemons stay invisible. The pair restarts as a unit.
    ipc: shareable
    container_name: model-vllm-glm53-a-prefill0
    network_mode: "service:sidecar-glm53-netns-a"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NCCL_DEBUG=WARN
      # Never set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True here: VMM allocations stop UCX from
      # using cuda_ipc for the KV handoff.
      - VLLM_NEAR_DISABLE_UVA=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - VLLM_CONFIDENTIAL_COMPUTE=1
      - VLLM_NEAR_KDA_FP8=1
      - VLLM_NEAR_KDA_SLICE=1
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - OMP_NUM_THREADS=4
      - HUMMING_COMPILER=nvcc
      - HUMMING_CACHE_DIR=/root/.cache/humming/a-prefill0
      - HUMMING_MAX_PARALLEL_BUILD_WORKERS=8
      - VLLM_ENGINE_READY_TIMEOUT_S=1800
      - VLLM_SSM_CONV_STATE_LAYOUT=DS
      - VLLM_TRUST_REMOTE_PREFILL_CACHED_TOKENS=1
      # KV moves over UCX cuda_ipc (zero-copy); protocol info at boot logs the selected transport.
      # tcp carries only UCX wireup (NIXL's peer error handling needs it); KV data uses cuda_ipc.
      - UCX_TLS=cuda_ipc,cuda_copy,tcp
      # NIXL notifications by copy: zero-copy pins host buffers (cuMemHostRegister), unsupported in CC.
      # KV reads stay cuda_ipc zero-copy.
      - UCX_ZCOPY_THRESH=inf
      - UCX_LOG_LEVEL=info
      - UCX_PROTO_INFO=y
      - VLLM_ADMIT_ROLE=prefill
      - VLLM_ADMIT_LONG_CUTOFF_TOKENS=65536
      - VLLM_ADMIT_SHORT_MAX_TOKENS=81920
      - VLLM_ADMIT_LONG_MAX_INFLIGHT=1
      - VLLM_ADMIT_LONG_YIELD_SHORT_TOKENS=20480
      - VLLM_ADMIT_RETRY_AFTER_SHORT_S=1
      - VLLM_ADMIT_RETRY_AFTER_LONG_S=10
      - VLLM_DP_MASTER_PORT=29700
      - VLLM_NIXL_SIDE_CHANNEL_PORT=5600
    command: >
      /root/.cache/huggingface/hub/models--graphistry--GLM-5.3-Flash-W4AFP8/snapshots/99f1fa70408c52b007d4fd69e02e5a522422e755
      --served-model-name z-ai/glm-5.3-flash
      --trust-remote-code
      --tensor-parallel-size 1
      --data-parallel-size 2
      --data-parallel-rank 0
      --enable-expert-parallel
      --data-parallel-address 127.0.0.1
      --data-parallel-rpc-port 13445
      --max-model-len 1048576
      --max-num-batched-tokens 8192
      --max-num-seqs 128
      --long-prefill-token-threshold 4736
      --max-num-queued-reqs 96
      --scheduling-policy priority
      --gpu-memory-utilization 0.92
      --enable-prompt-tokens-details
      --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja
      --reasoning-parser glm45
      --tool-call-parser glm47
      --enable-auto-tool-choice
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      --moe-backend humming
      --attention-backend FLASHINFER_MLA_SPARSE_SM90
      --kv-cache-dtype fp8_e4m3
      --mamba-ssm-cache-dtype bfloat16
      --no-disable-hybrid-kv-cache-manager
      --enable-prefix-caching
      --prefix-match-unit 64
      --limit-mm-per-prompt '{"image": 4}'
      --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"kv_lease_duration":30,"enable_prog_thread":false}}'
      --no-enable-log-requests
      --host 0.0.0.0
      --port 9100
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:z-ai/glm-5.3-flash","model_path:graphistry/GLM-5.3-Flash-W4AFP8","served_model:z-ai/glm-5.3-flash","replica:a","pd_role:prefill","dp_rank:0","gpu:0","deployment:glm-5.3-flash-vllm-pd2x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-glm53-a-prefill0"
      nearai.otel.port: "9100"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.model_path: "graphistry/GLM-5.3-Flash-W4AFP8"
      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm-5.3-flash-vllm-pd2x2"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.ppcie: "true"
      nearai.otel.config_variant: "vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"

  model-vllm-glm53-a-prefill1:
    <<: *glm53-engine-common
    volumes:
      - huggingface_cache:/root/.cache/huggingface:ro
      - glm53_kernel_cache_a:/root/.cache/vllm
      - humming_cache_a:/root/.cache/humming
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0","1","2","3"]
              capabilities: [gpu]
    # Shares the pair leader's ipc and pid namespaces (CUDA IPC for KV transfer); not the host's.
    ipc: "service:model-vllm-glm53-a-prefill0"
    pid: "service:model-vllm-glm53-a-prefill0"
    container_name: model-vllm-glm53-a-prefill1
    network_mode: "service:sidecar-glm53-netns-a"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
      model-vllm-glm53-a-prefill0:
        condition: service_started
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - HF_HUB_OFFLINE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NCCL_DEBUG=WARN
      # Never set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True here: VMM allocations stop UCX from
      # using cuda_ipc for the KV handoff.
      - VLLM_NEAR_DISABLE_UVA=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - VLLM_CONFIDENTIAL_COMPUTE=1
      - VLLM_NEAR_KDA_FP8=1
      - VLLM_NEAR_KDA_SLICE=1
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - OMP_NUM_THREADS=4
      - HUMMING_COMPILER=nvcc
      - HUMMING_CACHE_DIR=/root/.cache/humming/a-prefill1
      - HUMMING_MAX_PARALLEL_BUILD_WORKERS=8
      - VLLM_ENGINE_READY_TIMEOUT_S=1800
      - VLLM_SSM_CONV_STATE_LAYOUT=DS
      - VLLM_TRUST_REMOTE_PREFILL_CACHED_TOKENS=1
      # KV moves over UCX cuda_ipc (zero-copy); protocol info at boot logs the selected transport.
      # tcp carries only UCX wireup (NIXL's peer error handling needs it); KV data uses cuda_ipc.
      - UCX_TLS=cuda_ipc,cuda_copy,tcp
      # NIXL notifications by copy: zero-copy pins host buffers (cuMemHostRegister), unsupported in CC.
      # KV reads stay cuda_ipc zero-copy.
      - UCX_ZCOPY_THRESH=inf
      - UCX_LOG_LEVEL=info
      - UCX_PROTO_INFO=y
      - VLLM_ADMIT_ROLE=prefill
      - VLLM_ADMIT_LONG_CUTOFF_TOKENS=65536
      - VLLM_ADMIT_SHORT_MAX_TOKENS=81920
      - VLLM_ADMIT_LONG_MAX_INFLIGHT=1
      - VLLM_ADMIT_LONG_YIELD_SHORT_TOKENS=20480
      - VLLM_ADMIT_RETRY_AFTER_SHORT_S=1
      - VLLM_ADMIT_RETRY_AFTER_LONG_S=10
      - VLLM_DP_MASTER_PORT=29700
      - VLLM_NIXL_SIDE_CHANNEL_PORT=5600
    command: >
      /root/.cache/huggingface/hub/models--graphistry--GLM-5.3-Flash-W4AFP8/snapshots/99f1fa70408c52b007d4fd69e02e5a522422e755
      --served-model-name z-ai/glm-5.3-flash
      --trust-remote-code
      --tensor-parallel-size 1
      --data-parallel-size 2
      --data-parallel-rank 1
      --enable-expert-parallel
      --data-parallel-address 127.0.0.1
      --data-parallel-rpc-port 13445
      --max-model-len 1048576
      --max-num-batched-tokens 8192
      --max-num-seqs 128
      --long-prefill-token-threshold 4736
      --max-num-queued-reqs 96
      --scheduling-policy priority
      --gpu-memory-utilization 0.92
      --enable-prompt-tokens-details
      --chat-template /root/.cache/huggingface/hub/models--zai-org--GLM-5.3-Flash/snapshots/3f1971b7b5f7a528c9c4ef6212c8785298a8c24a/chat_template.jinja
      --reasoning-parser glm45
      --tool-call-parser glm47
      --enable-auto-tool-choice
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
      --moe-backend humming
      --attention-backend FLASHINFER_MLA_SPARSE_SM90
      --kv-cache-dtype fp8_e4m3
      --mamba-ssm-cache-dtype bfloat16
      --no-disable-hybrid-kv-cache-manager
      --enable-prefix-caching
      --prefix-match-unit 64
      --limit-mm-per-prompt '{"image": 4}'
      --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"kv_lease_duration":30,"enable_prog_thread":false}}'
      --no-enable-log-requests
      --host 0.0.0.0
      --port 9101
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:z-ai/glm-5.3-flash","model_path:graphistry/GLM-5.3-Flash-W4AFP8","served_model:z-ai/glm-5.3-flash","replica:a","pd_role:prefill","dp_rank:1","gpu:1","deployment:glm-5.3-flash-vllm-pd2x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340-w4afp8-2xpd-dp2ep2-nixl-mtp3-prefix-cc"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-glm53-a-prefill1"
      nearai.otel.port: "9101"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "z-ai/glm-5.3-flash"
      nearai.otel.model_path: "graphistry/GLM-5.3-Flash-W4AFP8"
      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm-5.3-flash-vllm-pd2x2"
