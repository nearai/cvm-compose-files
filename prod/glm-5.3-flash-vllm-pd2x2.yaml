    entrypoint: ["sleep", "infinity"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "64m"
    networks:
      engine-glm53-b:
        aliases:
          - model-vllm-glm53-b-prefill0
          - model-vllm-glm53-b-prefill1
          - model-vllm-glm53-b-decode0
          - model-vllm-glm53-b-decode1
