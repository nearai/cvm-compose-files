  pd-router-glm53-a:
    # One router per prefill/decode pair.
    image: docker.io/nearaidev/vllm@sha256:cc0066b599ab2d2c75a4b06ed7df4711cb181d110d5448dde894e17661e4c405
    container_name: pd-router-glm53-a
