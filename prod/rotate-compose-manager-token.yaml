# One-shot: rotate a running compose-manager's BEARER_TOKEN. Usage: docs/rotate-compose-manager-token.md.
name: cm-token-rotate

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "2"
    labels: "com.datadoghq.ad.logs"

services:
  rotate-token:
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    container_name: rotate-token
    profiles: [cm-token-rotate]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NEW_BEARER_TOKEN=${NEW_BEARER_TOKEN}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu

        # --- 1. Validate the new token without ever printing it. ---
        # Reads the value via awk's ENVIRON, never as a -v/argv literal, so
        # it cannot appear in this container's own process list either.
        if ! awk 'BEGIN {
              v = ENVIRON["NEW_BEARER_TOKEN"]
              if (v == "") { print "NEW_BEARER_TOKEN is required and must be non-empty" > "/dev/stderr"; exit 1 }
              n = length(v)
              if (n < 16 || n > 256) { print "NEW_BEARER_TOKEN length " n " is out of bounds [16,256]" > "/dev/stderr"; exit 1 }
              if (v ~ /[ \t\r\n,"'"'"']/) { print "NEW_BEARER_TOKEN contains a disallowed character (whitespace, comma or quote)" > "/dev/stderr"; exit 1 }
              exit 0
            }'; then
          exit 1
        fi
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) [rotate-token] validated NEW_BEARER_TOKEN format (value not shown)"

        # --- 2. Confirm the launcher sidecar is reachable before doing anything. ---
        if ! docker exec compose-manager-launcher sh -c 'true' >/dev/null 2>&1; then
          echo "[rotate-token] cannot exec into compose-manager-launcher -- aborting, nothing changed" >&2
          exit 1
        fi

        # --- 3. Decode the inner script (see docs/rotate-compose-manager-token.md#inner-script
        #        for the plaintext) and run it inside compose-manager-launcher,
        #        which already holds the work volume, /dstack-env, curl and
        #        docker-cli-compose, and whose own LAUNCHER_* env vars a
        #        `docker exec` automatically inherits (confirmed live: `docker
        #        exec <ctr> sh -c 'echo $$VAR'` sees that container's own
        #        `environment:` -- no separate lookup call needed).
        #        -e NEW_BEARER_TOKEN (bare, no "=value") forwards our own env
        #        var's CURRENT value without ever putting it in this docker
        #        exec command line; the decoded script arrives over the pipe
        #        (stdin), never as an argument either.
