name: cm-token-rotate

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "2"
    labels: "com.datadoghq.ad.logs"

services:
  rotate-token:
    image: docker@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    container_name: rotate-token
    profiles: [cm-token-rotate]
    restart: "no"
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NEW_BEARER_TOKEN=${NEW_BEARER_TOKEN}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu

        # --- 1. Validate the new token without ever printing it. ---
        # Reads the value via awk's ENVIRON, never as a -v/argv literal, so
        # it cannot appear in this container's own process list either.
        if ! awk 'BEGIN {
              v = ENVIRON["NEW_BEARER_TOKEN"]
              if (v == "") { print "NEW_BEARER_TOKEN is required and must be non-empty" > "/dev/stderr"; exit 1 }
              n = length(v)
              if (n < 16 || n > 256) { print "NEW_BEARER_TOKEN length " n " is out of bounds [16,256]" > "/dev/stderr"; exit 1 }
              if (v ~ /[ \t\r\n,"'"'"']/) { print "NEW_BEARER_TOKEN contains a disallowed character (whitespace, comma or quote)" > "/dev/stderr"; exit 1 }
              exit 0
            }'; then
          exit 1
        fi
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) [rotate-token] validated NEW_BEARER_TOKEN format (value not shown)"

        # --- 2. Confirm the launcher sidecar is reachable before doing anything. ---
        if ! docker exec compose-manager-launcher sh -c 'true' >/dev/null 2>&1; then
          echo "[rotate-token] cannot exec into compose-manager-launcher -- aborting, nothing changed" >&2
          exit 1
        fi

        # --- 3. Run the rotation inside compose-manager-launcher, which holds the compose files and
        #        env; -e NEW_BEARER_TOKEN forwards the value without putting it on a command line. ---
        if docker exec -i -e NEW_BEARER_TOKEN compose-manager-launcher sh -s <<'INNER'
        set -eu
        ENV_FILE="$${LAUNCHER_ENV_FILE:-/app/work/.env.launcher}"
        BASE_ENV_FILE="$${LAUNCHER_BASE_ENV_FILE:-/dstack-env}"
        COMPOSE_FILE="$${LAUNCHER_COMPOSE_FILE:-/app/work/compose-manager.yml}"
        PROJECT="$${LAUNCHER_COMPOSE_PROJECT:-dstack}"
        HEALTH_URL="$${LAUNCHER_HEALTH_URL:-http://127.0.0.1:8080/version}"
        AUTH_CHECK_URL="$${HEALTH_URL%/version}/docker/ps"
        TIMEOUT="$${LAUNCHER_HEALTH_TIMEOUT:-180}"
        TS="$$(date -u +%Y%m%dT%H%M%SZ)"
        BACKUP=""

        if [ ! -f "$$COMPOSE_FILE" ]; then
          echo "[rotate-token] $$COMPOSE_FILE is missing inside compose-manager-launcher -- aborting, nothing changed" >&2
          exit 1
        fi

        if [ -f "$$ENV_FILE" ]; then
          BACKUP="$${ENV_FILE}.bak.$${TS}"
          cp -p "$$ENV_FILE" "$$BACKUP"
        else
          : > "$$ENV_FILE"
        fi

        rewrite_token() {
          tmp="$${ENV_FILE}.tmp.$$$$"
          mode="0644"
          [ -f "$$ENV_FILE" ] && mode="$$(stat -c %a "$$ENV_FILE" 2>/dev/null || echo 0644)"
          awk -v k="BEARER_TOKEN" 'BEGIN{v=ENVIRON["NEW_BEARER_TOKEN"]; found=0}
            index($$0,k"=")==1{print k"="v; found=1; next}
            {print}
            END{if(!found) print k"="v}' "$$ENV_FILE" > "$$tmp"
          chmod "$$mode" "$$tmp"
          mv "$$tmp" "$$ENV_FILE"
        }

        recreate() {
          docker compose -p "$$PROJECT" -f "$$COMPOSE_FILE" \
            --env-file "$$BASE_ENV_FILE" --env-file "$$ENV_FILE" \
            up -d --no-deps compose-manager
        }

        wait_healthy() {
          i=0
          steps=$$(( TIMEOUT / 3 ))
          while [ "$$i" -lt "$$steps" ]; do
            if curl -fsSL --max-time 5 "$$HEALTH_URL" >/dev/null 2>&1; then
              return 0
            fi
            i=$$((i + 1))
            sleep 3
          done
          return 1
        }

        wait_new_token_accepted() {
          i=0
          steps=$$(( TIMEOUT / 3 ))
          while [ "$$i" -lt "$$steps" ]; do
            if printf 'header = "Authorization: Bearer %s"\n' "$$NEW_BEARER_TOKEN" \
                 | curl -fsSL -K - --max-time 5 -o /dev/null "$$AUTH_CHECK_URL" 2>/dev/null; then
              return 0
            fi
            i=$$((i + 1))
            sleep 3
          done
          return 1
        }

        rollback_and_exit() {
          reason="$$1"
          echo "[rotate-token] $$reason -- rolling back" >&2
          if [ -n "$$BACKUP" ] && [ -f "$$BACKUP" ]; then
            cp -p "$$BACKUP" "$$ENV_FILE"
          else
            echo "[rotate-token] no backup existed (file was newly created this run) -- leaving as-is" >&2
          fi
          recreate
          if wait_healthy; then
            echo "[rotate-token] rollback recreate succeeded -- compose-manager is healthy again on the OLD token" >&2
            exit 2
          fi
          echo "[rotate-token] CRITICAL: rollback recreate ALSO failed to become healthy -- manual intervention required on this host" >&2
          exit 3
        }

        echo "[rotate-token] rewriting BEARER_TOKEN in $$ENV_FILE (backup: $${BACKUP:-none created, file was missing})"
        rewrite_token

        echo "[rotate-token] recreating compose-manager (project $$PROJECT, --no-deps, no other service touched)"
        recreate

        echo "[rotate-token] waiting up to $${TIMEOUT}s for $$HEALTH_URL"
        if ! wait_healthy; then
          rollback_and_exit "compose-manager did NOT become healthy within $${TIMEOUT}s"
        fi

        echo "[rotate-token] compose-manager healthy; verifying the NEW token is accepted at $$AUTH_CHECK_URL"
        if ! wait_new_token_accepted; then
          rollback_and_exit "compose-manager is healthy but the NEW token was rejected at $$AUTH_CHECK_URL (override did not take effect)"
        fi

        echo "[rotate-token] compose-manager healthy AND the NEW token is accepted"
        exit 0
        INNER
        then
          status=0
        else
          status=$$?
        fi

        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) [rotate-token] exiting with status $${status}"
        exit "$$status"
    labels:
      com.datadoghq.ad.logs: '[{"source":"cm-token-rotate","service":"cm-token-rotate","tags":["deployment:cm-token-rotate"]}]'
    logging: *logging-conf
