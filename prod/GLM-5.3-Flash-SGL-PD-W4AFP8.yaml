networks:
  default:
    external: true
    name: dstack_default

volumes:
  otelcol_app_storage:
  huggingface_cache:
  kernel_cache:
  certs:
    external: true
    name: certs

configs:
  glm53_pd_relay_conf:
    content: |
      user nginx;
      worker_processes 1;
      pid /var/run/nginx.pid;
      error_log /dev/null;
      events { worker_connections 256; }
      http {
        # Qualification traffic only: no request/response logging or disk buffering.
        access_log off;
        client_max_body_size 100m;
        client_body_timeout 3600s;
        send_timeout 3600s;
        resolver 127.0.0.11 valid=5s ipv6=off;
        map_hash_bucket_size 256;
        map $$http_authorization $$pd_authorized {
          default 0;
          "Bearer ${PROXY_TOKEN:?PROXY_TOKEN required for authenticated qualification access}" 1;
        }
        ssl_certificate /etc/letsencrypt/live/completions.near.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/completions.near.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_next_upstream off;
      server {
        listen 8008 ssl;
        server_name _;
        if ($$pd_authorized = 0) { return 401; }
        set $$backend http://pd-front-1:8000;
        location ~ ^/(health|v1/models|v1/chat/completions|v1/completions)$$ {
          limit_except GET POST { deny all; }
          proxy_pass $$backend$$request_uri;
        }
        location / { return 404; }
      }
      server {
        listen 8009 ssl;
        server_name _;
        if ($$pd_authorized = 0) { return 401; }
        set $$backend http://pd-front-2:8000;
        location ~ ^/(health|v1/models|v1/chat/completions|v1/completions)$$ {
          limit_except GET POST { deny all; }
          proxy_pass $$backend$$request_uri;
        }
        location / { return 404; }
      }
      server {
        listen 8010 ssl;
        server_name _;
        if ($$pd_authorized = 0) { return 401; }
        set $$backend http://pd-front-3:8000;
        location ~ ^/(health|v1/models|v1/chat/completions|v1/completions)$$ {
          limit_except GET POST { deny all; }
          proxy_pass $$backend$$request_uri;
        }
        location / { return 404; }
      }
      server {
        listen 8011 ssl;
        server_name _;
        if ($$pd_authorized = 0) { return 401; }
        location ~ ^/m/(model-sg-glm53-w4afp8-tp2-(pf|dc)-r[1-4])/metrics$$ {
          limit_except GET { deny all; }
          proxy_pass http://$$1:8000/metrics;
        }
        location / { return 404; }
      }
      }

  glm53_pd_startup_patch:
    content: |
      # Start-up patches for stock SGLang v0.5.21 (lmsysorg/sglang:v0.5.21-cu130) serving GLM-5.3-Flash W4AFP8.
      # 1) W4AFP8 loader: from_config drops modules_to_not_convert, so narrow layers get FP8 block-quant and
      #    fail ("output_partition_size = 16 is not divisible by block_n = 128"). Same fix as
      #    docker/sglang-glm53-hicache-w4afp8/modules-to-not-convert.diff.
      # 2) Thinking budget: accept the public thinking_token_budget and default GLM5 (glm5_next) to 8192,
      #    the production policy (fork 1fea50d9f + e4d313ef0). Without it reasoning runs uncapped.
      # 3) P/D under CC: MetadataBuffers are pageable CPU tensors that NIXL registers as DRAM; UCX's
      #    cuda_copy MD then calls cuMemHostRegister, which HCC/PPCIe rejects (NIXL_ERR_BACKEND). Pinning
      #    them via cudaHostAlloc (torch pin_memory) makes UCX skip the register (gpu03, 2026-10-06).
      # 4) Decode TP-rank divergence guard: under overload with client aborts the decode transfer queue
      #    can differ by a request between TP ranks; the MIN all-reduce of poll states then mismatches
      #    in size and gloo aborts the engine ("op.preamble.length <= op.nbytes. 16 vs 15", gpu03
      #    2026-10-06, also seen in the lab). Poll only requests queued on every rank, in rid order;
      #    the rest stay Transferring until their peers catch up.
      # Each edit is an exact-anchor replacement; any missing anchor aborts the start (fail closed).
      import os, pathlib, sys
      ROOT = pathlib.Path(os.environ.get("PD_PATCH_ROOT", "/sgl-workspace/sglang/python/sglang/srt"))
      def sub(rel, old, new, label):
          p = ROOT / rel; s = p.read_text()
          if new in s:
              print(f"[pd-patch] {label}: already applied", flush=True); return
          n = s.count(old)
          if n != 1:
              sys.exit(f"[pd-patch] {label}: expected 1 anchor, found {n}")
          p.write_text(s.replace(old, new)); print(f"[pd-patch] {label}: applied", flush=True)
      sub("layers/quantization/w4afp8.py",
      """        weight_block_size = [128, 128]
              return cls(
                  is_checkpoint_fp8_serialized=is_checkpoint_fp8_serialized,
                  is_checkpoint_w4afp8_serialized=is_checkpoint_w4afp8_serialized,
                  linear_activation_scheme=linear_activation_scheme,
                  moe_activation_scheme=moe_activation_scheme,
                  weight_block_size=weight_block_size,
              )""",
      """        weight_block_size = [128, 128]
              ignored_layers = (
                  config.get("modules_to_not_convert")
                  or config.get("ignored_layers")
                  or config.get("ignore")
                  or []
              )
              return cls(
                  is_checkpoint_fp8_serialized=is_checkpoint_fp8_serialized,
                  is_checkpoint_w4afp8_serialized=is_checkpoint_w4afp8_serialized,
                  linear_activation_scheme=linear_activation_scheme,
                  moe_activation_scheme=moe_activation_scheme,
                  ignored_layers=ignored_layers,
                  weight_block_size=weight_block_size,
              )""", "w4afp8 modules_to_not_convert")
      sub("entrypoints/openai/protocol.py", "    StrictBool,\n    field_serializer,", "    StrictBool,\n    StrictInt,\n    field_serializer,", "protocol StrictInt import")
      sub("entrypoints/openai/protocol.py",
      """    custom_params: Optional[Dict] = None

          # Pre-computed prompt token IDs: when provided""",
      """    custom_params: Optional[Dict] = None
          thinking_token_budget: Optional[StrictInt] = Field(default=None, ge=0)

          # Pre-computed prompt token IDs: when provided""", "protocol thinking_token_budget field")
      sub("entrypoints/openai/protocol.py",
      """    @model_validator(mode="before")
          @classmethod
          def set_tool_choice_default(cls, values):""",
      """    @model_validator(mode="before")
          @classmethod
          def normalize_thinking_token_budget(cls, values):
              if not isinstance(values, dict):
                  return values
              custom_params = values.get("custom_params")
              if custom_params is None:
                  custom_params = {}
              if not isinstance(custom_params, dict) or "thinking_budget" in custom_params:
                  return values
              if "thinking_token_budget" in values:
                  budget = values.get("thinking_token_budget")
              else:
                  return values
              if isinstance(budget, int) and not isinstance(budget, bool) and budget >= 0:
                  values = dict(values)
                  custom_params = dict(custom_params)
                  custom_params["thinking_budget"] = budget
                  values["custom_params"] = custom_params
              return values

          @model_validator(mode="before")
          @classmethod
          def set_tool_choice_default(cls, values):""", "protocol thinking_token_budget normalizer")
      sub("entrypoints/openai/serving_chat.py",
      """        set_request_reasoning_end_token_ids(
                  sampling_params, processed_messages.reasoning_end_token_ids
              )""",
      """        if (
                  getattr(self.tokenizer_manager.model_config.hf_config, "model_type", None)
                  in ("glm5_next", "glm5_next_text")
                  and "thinking_token_budget" not in request.model_fields_set
              ):
                  custom_params = dict(sampling_params.get("custom_params") or {})
                  custom_params.setdefault("thinking_budget", 8192)
                  sampling_params["custom_params"] = custom_params
              set_request_reasoning_end_token_ids(
                  sampling_params, processed_messages.reasoning_end_token_ids
              )""", "serving_chat glm5 default thinking budget 8192")
      sub("disaggregation/utils.py",
      """                    device=self.bootstrap_room.device,
                      )

          def set_kv_checksum(""",
      """                    device=self.bootstrap_room.device,
                      )
              if torch.cuda.is_available():
                  for _name, _t in list(vars(self).items()):
                      if isinstance(_t, torch.Tensor) and _t.device.type == "cpu":
                          setattr(self, _name, _t.pin_memory())

          def set_kv_checksum(""", "disagg MetadataBuffers pinned host memory")
      sub("disaggregation/decode.py",
      """    def _poll_with_metadata_gate(self) -> List[int]:
              pollers = (""",
      """    def _poll_with_metadata_gate(self) -> List[int]:
              group = self.gloo_group
              if (
                  not self.scheduler.enable_decode_hicache
                  and torch.distributed.get_world_size(group) > 1
              ):
                  rids = [dr.req.rid for dr in self.queue]
                  gathered = [None] * torch.distributed.get_world_size(group)
                  torch.distributed.all_gather_object(gathered, rids, group=group)
                  common = set(rids).intersection(*(set(g) for g in gathered))
                  if any(len(g) != len(common) for g in gathered):
                      logger.warning(
                          f"[pd-patch] decode transfer queue diverged across TP ranks: "
                          f"{[len(g) for g in gathered]} queued, {len(common)} common"
                      )
                  subset = sorted(
                      (dr for dr in self.queue if dr.req.rid in common),
                      key=lambda dr: dr.req.rid,
                  )
                  sub_polls = poll_and_all_reduce(
                      [dr.kv_receiver for dr in subset],
                      group,
                      decode_reqs=subset,
                      metadata_buffers=self.metadata_buffers,
                  ) if subset else []
                  by_rid = {dr.req.rid: poll for dr, poll in zip(subset, sub_polls)}
                  return [by_rid.get(dr.req.rid, KVPoll.Transferring) for dr in self.queue]
              pollers = (""", "decode TP-rank divergence guard")

  dcgm_h200_metrics:
    content: |
      # NEAR AI H200 operational collector for DCGM 4.6.0 / exporter 4.8.3.
      # Format: DCGM field, Prometheus type, help message.

      # Clocks, temperature, power and cumulative GPU-board energy.
      DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency in MHz.
      DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency in MHz.
      DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature in C.
      DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature in C.
      DCGM_FI_DEV_POWER_USAGE, gauge, GPU board power draw in W.
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, GPU board energy consumed since boot in mJ.

      # Utilization, framebuffer and PCIe.
      DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization in percent.
      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory copy utilization in percent.
      DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free in MiB.
      DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used in MiB.
      DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved in MiB.
      DCGM_FI_PROF_PCIE_TX_BYTES, gauge, PCIe transmit throughput in bytes per second.
      DCGM_FI_PROF_PCIE_RX_BYTES, gauge, PCIe receive throughput in bytes per second.
      DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total PCIe replay events.

      # Raw and exporter-owned incident signals. Windowed counts provide a
      # stable zero series; cumulative totals preserve observed event labels.
      DCGM_FI_DEV_XID_ERRORS, gauge, Last XID error encountered.
      DCGM_EXP_XID_ERRORS_COUNT, gauge, XID records observed in the configured window.
      DCGM_EXP_XID_ERRORS_TOTAL, counter, XID records observed since exporter start.
      DCGM_EXP_CLOCK_EVENTS_COUNT, gauge, Clock events observed in the configured window.
      DCGM_EXP_CLOCK_EVENTS_TOTAL, counter, Clock event transitions observed since exporter start.
      DCGM_EXP_GPU_HEALTH_STATUS, gauge, Current DCGM GPU health status by health watch.
      DCGM_EXP_P2P_STATUS, gauge, Current NVLink P2P status for each ordered GPU pair.

      # Throttling and reliability constraints.
      DCGM_FI_DEV_POWER_VIOLATION, counter, Throttling duration due to power constraints in ns.
      DCGM_FI_DEV_THERMAL_VIOLATION, counter, Throttling duration due to thermal constraints in ns.
      DCGM_FI_DEV_SYNC_BOOST_VIOLATION, counter, Throttling duration due to sync boost constraints in ns.
      DCGM_FI_DEV_BOARD_LIMIT_VIOLATION, counter, Throttling duration due to board constraints in ns.
      DCGM_FI_DEV_LOW_UTIL_VIOLATION, counter, Throttling duration due to low utilization in ns.
      DCGM_FI_DEV_RELIABILITY_VIOLATION, counter, Throttling duration due to reliability constraints in ns.

      # ECC, retired pages and row remapping.
      DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Total volatile single-bit ECC errors.
      DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Total volatile double-bit ECC errors.
      DCGM_FI_DEV_ECC_SBE_AGG_TOTAL, counter, Total aggregate single-bit ECC errors.
      DCGM_FI_DEV_ECC_DBE_AGG_TOTAL, counter, Total aggregate double-bit ECC errors.
      DCGM_FI_DEV_RETIRED_SBE, counter, Total pages retired due to single-bit errors.
      DCGM_FI_DEV_RETIRED_DBE, counter, Total pages retired due to double-bit errors.
      DCGM_FI_DEV_RETIRED_PENDING, counter, Pages pending retirement.
      DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Total uncorrectable remapped rows.
      DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Total correctable remapped rows.
      DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether row remapping has failed.

      # NVLink traffic and integrity.
      DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, Aggregate NVLink traffic rate across all lanes.
      DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL, counter, Total NVLink flow-control CRC errors.
      DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL, counter, Total NVLink data CRC errors.
      DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL, counter, Total NVLink replay errors.
      DCGM_FI_DEV_NVLINK_RECOVERY_ERROR_COUNT_TOTAL, counter, Total NVLink recovery errors.

      # Workload profiling. Unsupported fields are skipped by DCGM and must be
      # represented as unsupported in Grafana rather than coerced to zero.
      DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active.
      DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor pipe is active.
      DCGM_FI_PROF_DRAM_ACTIVE, gauge, Ratio of time the device memory interface is active.

      # Stable software identity labels attached to emitted GPU metrics.
      DCGM_FI_DRIVER_VERSION, label, NVIDIA driver version.
      DCGM_FI_NVML_VERSION, label, NVML version.
      DCGM_FI_DEV_BRAND, label, GPU product brand.
      DCGM_FI_DEV_VBIOS_VERSION, label, GPU VBIOS version.

  otelcol_app_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        filelog/docker_containers:
          include: [/var/lib/docker/containers/*/*-json.log]
          start_at: end
          storage: file_storage
          include_file_path: true
          operators:
            - type: json_parser
              parse_from: body
              parse_to: attributes
              timestamp:
                parse_from: attributes.time
                layout_type: gotime
                layout: '2006-01-02T15:04:05.999999999Z07:00'
              on_error: send_quiet
            - type: move
              from: attributes.log
              to: body
              if: 'attributes.log != nil'
            - type: move
              from: attributes.stream
              to: attributes["log.iostream"]
              if: 'attributes.stream != nil'
            - type: remove
              field: attributes.time
              if: 'attributes.time != nil'
            - type: regex_parser
              parse_from: attributes["log.file.path"]
              regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]{12})[a-f0-9]*/'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model:(?P<model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'served_model:(?P<served_model>[^",\]]+)'
