# GLM-5.3 Flash prefill/decode (P/D) QUALIFICATION file for ONE DRAINED base-tier host, generated
# from prod/GLM-5.3-Flash-SGL-TP2x4-W4AFP8.yaml by scripts/prepare_glm53_pd_qualification.py.
# Do not hand-edit this file.
#
# NOT A SERVING CONFIG: no registrar, nginx or inference proxy, so the host never takes
# production traffic while this file runs. Load reaches it only through glm53-pd-relay
# (TLS, Bearer ${PROXY_TOKEN}, same scheme as glm53-soak-relay):
#   :8008/:8009/:8010 -> PD router 1/2/3 of the running layout (one router per prefill engine;
#   put a sticky-by-conversation front over them)   :8011 -> /m/<engine>/metrics
# Pick the layout with the compose/up service list (each GPU pair runs at most one engine):
#   3P:1D  model-sg-glm53-w4afp8-tp2-pf-r1,-pf-r2,-pf-r3, -dc-r4, pd-router-3p1d-1,-2,-3
#   1P:3D  model-sg-glm53-w4afp8-tp2-pf-r1, -dc-r2,-dc-r3,-dc-r4, pd-router-1p3d-1
#   2P:2D  model-sg-glm53-w4afp8-tp2-pf-r1,-pf-r3, -dc-r2,-dc-r4, pd-router-2p2d-1,-2
#   plus glm53-pd-relay, otelcol-contrib, dcgm-glm53 (model-downloader runs first).
#
# What makes P/D work (lab, gpu31/gpu32, 2026-10-03/04; docs/glm53-pd-qualification.md):
#   - GPU->GPU KV over NIXL/UCX CUDA IPC needs ALL THREE: every engine sees all 8 GPUs (each
#     pinned with --base-gpu-id), pid: host, and PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
#     (VMM memory cannot be CUDA-IPC exported without fabric handles -> silent host staging at
#     0.3 GB/s). With all three: 18 GB/s for SGLang's scattered 35K x 64 KB shape, cached 189K
#     turn 0.45 s vs 6-11 s.
#   - On H200 NVL lab hosts cross-NVLink-island CUDA IPC corrupted KV (GSM8K 0.0); prod hosts
#     report "NVIDIA H200" (SXM/HGX, NVSwitch), which this qualification verifies first.
#   - Fixed-step EAGLE (3/4) and decode mf 0.84: decode pool 1.64M tokens.
# Not carried vs the base file: HiCache (upstream v0.5.21 registers host memory with
# cudaHostRegister, CUDA error 801 under HCC/PPCIe), the admission reserve and the DSA indexer
# query split (fork patches). Startup patches (configs: glm53_pd_startup_patch) restore the
# W4AFP8 loader fix and the 8192 default thinking budget.
# ROLLBACK: compose/down this file's services, then prod/GLM-5.3-Flash-SGL-TP2x4-W4AFP8.yaml
# (full service list including model-proxy-registrar), per docs/glm53-tp2x4-base-canary.md.

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

# GLM-5.3-Flash on four independent H200 TP2/EP2 replicas. Each replica stays
# within one NVLink GPU pair; one inference-proxy uses its native
# least-connections backend pool for health-aware balancing and failover.
#
# The engine is published by the repository's GitHub Actions workflow and pinned here by
# its signed immutable registry digest. Its source is pinned to
# PierreLeGuen/sglang-upstream commit fc91d24, derived from official SGLang main plus
# the official GLM-5.3 branch. It contains upstream disconnect cleanup (#35255), the
# final-prefill abort fix (#34153), the strict thinking-budget adapter, and two narrow
# DSA import-cycle fixes. All four replicas pin the published split-capable
# docker/sglang-glm53-hicache-w4afp8 derivative the long tier runs (original #308 v3):
# the HCC-safe HiCache image (CUDA-owned host memory, carrying the opt-in chunked-prefill
# admission-reserve v10 patch, nearai/inference-optimizer@fb94472) plus the W4AFP8
# loader fix and the unconditional chunked-prefill pool clamp. The reserve is enabled
# below with SGLANG_CHUNKED_PREFILL_ADMISSION_RESERVE=4096,
# SGLANG_ADMISSION_RESERVE_MAX_FRACTION=0.75 and --prefill-decode-interval 1. The
# official CUDA 13 SGLang image is the pinned build base. The serving envelope is
# intentionally conservative: BF16 KV, 0.80 static memory, 32 running requests (an
# effective 32 per TP2 replica with 165 BF16 mamba state slots, see the file header), a
# bounded 8-request queue, 8192-token prefill chunks with --max-prefill-tokens 32768,
# decode graphs capped at batch 32, TileLang DSA, the CUTLASS W4A8 MoE path (hence no
# --moe-runner-backend and no FP8 --revision), and adaptive EAGLE 5/1/6. This retains
# the full 1,048,576-token model context.
# Priority scheduling (--enable-priority-scheduling, --disable-priority-preemption)
# relies on the pinned inference-proxy below (build 2834196, nearai/inference-proxy#241)
# overwriting the `priority` field of every forwarded request, so no client-chosen
# or missing priority ever reaches the scheduler. --default-priority-value is
# deliberately absent for the same reason. scripts/validate_glm53_prod_config.rb
# refuses the priority switches unless proxy-glm53 pins a priority-normalizing build.
#
# A small fail-closed adapter patch maps the public thinking_token_budget field
# to SGLang strict-thinking's custom_params.thinking_budget. Omitted values
# default to 8192; explicit null remains an opt-out; an explicit native
# custom_params.thinking_budget wins. Request/response payload logging is off.
#
# The vLLM GLM-5.3-Flash path is not used: its Hopper NVFP4/MLA path produced
# non-finite logits and repetitive output. This pack also retires the previous
# co-resident DeepSeek arm so both four-GPU islands serve GLM-5.3-Flash.

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-sg-glm53-pd-common: &sg-glm53-pd-common
  <<: *nvidia
  init: true
  image: docker.io/lmsysorg/sglang@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
  # The fast GPU->GPU KV path needs a shared PID namespace (UCX cuda_ipc) and all GPUs visible.
  pid: host
  entrypoint: ["bash", "-c"]
  volumes:
    - kernel_cache:/root/.cache
    - huggingface_cache:/root/.cache/huggingface
  configs:
    - source: glm53_pd_startup_patch
      target: /etc/glm53/pd_startup_patch.py
      mode: 0444
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - HF_HUB_DISABLE_TELEMETRY=1
    - DO_NOT_TRACK=1
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - CUDA_DEVICE_ORDER=PCI_BUS_ID
    - NCCL_DEBUG=WARN
    # MUST stay False: expandable segments put the KV pool in CUDA VMM memory, which UCX
    # cuda_ipc cannot export without fabric handles, so NIXL silently falls back to host
    # staging (0.28-0.39 GB/s). False gives 18-105 GB/s.
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
    # UCX transports; override per deploy with PD_UCX_TLS. NIXL rejects any value without
    # cuda_copy (or cuda). The CC host-register failure is fixed by the pinned-aux startup patch.
    - UCX_TLS=${PD_UCX_TLS:-all}
    - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
    - TRITON_CACHE_DIR=/root/.cache/triton
    - TILELANG_CACHE_DIR=/root/.cache/tilelang
    - SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION=0
    - SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE=1
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-dcgm-common: &dcgm-common
  image: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:613ab03c11d442fd960ff515f547e9921537454a712d08160bc8f677f89f1c35
  command: ["-f", "/etc/dcgm-exporter/nearai-h200.csv"]
  runtime: nvidia
  cap_add:
    - SYS_ADMIN
  configs:
    - source: dcgm_h200_metrics
      target: /etc/dcgm-exporter/nearai-h200.csv
      mode: 0444
  restart: unless-stopped
  logging: *logging-conf

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    # Every dedicated GLM-5.3 Flash TP4 file (not prod/small-models.yaml) also fetches the
    # W4AFP8 snapshot (~165 GiB; keep >=250 GiB free on the model-cache volume), so moving
    # a host between the FP8 and W4AFP8 files costs only the engine cold start:
    # compose-manager runs `up --remove-orphans`, so a new file's downloader cannot run
    # while engines it does not define are still serving.
    command:
      - |
        set -e
        echo "Downloading zai-org/GLM-5.3-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
        echo "Downloading corrected GLM-5.3-Flash chat template..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash chat_template.jinja --revision 3f1971b7b5f7a528c9c4ef6212c8785298a8c24a
        echo "Downloading graphistry/GLM-5.3-Flash-W4AFP8..."
        uvx --from 'huggingface_hub[hf_xet]' hf download graphistry/GLM-5.3-Flash-W4AFP8 --revision 99f1fa70408c52b007d4fd69e02e5a522422e755
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:zai-org/GLM-5.3-Flash","served_model:z-ai/glm-5.3-flash","deployment:glm53-flash-sgl-tp2x4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Dormant during normal deploys. Target this service explicitly with the
  # maintenance profile when one model's shared HF cache must be evicted.
  # Inlined copy of the root cleanup-hf-model.yaml service: compose-manager's
  # compose/up fetches only the requested file, so cross-file `extends:` /
  # `include:` must not be used here (they fail at config load).

