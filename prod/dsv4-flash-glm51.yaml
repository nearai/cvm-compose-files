            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ppcie:(?P<ppcie>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'config_variant:(?P<config_variant>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
