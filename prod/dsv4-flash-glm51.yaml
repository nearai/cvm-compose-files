# GPU02 DeepSeek-V4-Flash + GLM-5.1 capacity pack.
#
# Runtime topology:
# - one TDX CVM launched with PPCIe and all eight H200 GPUs/NVSwitches attached;
# - r1 uses guest GPUs 0-1 and r2 uses guest GPUs 2-3;
# - one GLM-5.1 AWQ TP4 engine uses guest GPUs 4-7;
# - all inference proxies collect NVIDIA attestation from the PPCIe-attached CVM.
#
# Both replicas clone the gpu30 r1 production control from v0.0.325:
# SGLang workflow revision 7de33ce8, EAGLE 3/1/4, 8192-token prefill chunks,
# 1800-second engine watchdog, and the 20-second inference-proxy stream-idle
# watchdog. EAGLE prefill fairness is deliberately disabled on both replicas.
#
# The GLM engine is the existing production QuantTrio/GLM-5.1-AWQ TP4 recipe
# from prod/GLM-5.1-SGL-AWQ-TP4.yaml, including the pinned checkpoint, EAGLE
# settings, persistent compile cache, and the sglang#28305 loader patch.

x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:b0c5cd0786b19dfa46144107be15e340b7a338b1c341d02ffa994c9f1ea77dfd
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-dsv4-flash-common: &dsv4-flash-common
  <<: *nvidia
  init: true
  # Official CUDA 13 nightly containing sglang#29883; same immutable image as
  # the gpu30 r1 control. Workflow head/tag:
  # 7de33ce8 / nightly-dev-cu13-20260711-7de33ce8.
  image: lmsysorg/sglang@sha256:6bb5fee34b6c4537c09a4775e2292ac40350d5ad1218fcc835b2692142f443b1
  command: >
      sglang serve
      --trust-remote-code
      --model-path deepseek-ai/DeepSeek-V4-Flash
      --revision 553034d7dd9e06c2eeaee68cf85a17d6d4754cf0
      --tp 2
      --moe-runner-backend marlin
      --cuda-graph-max-bs 64
      --mem-fraction-static 0.83
      --max-running-requests 64
      --max-queued-requests 16
      --schedule-conservativeness 1.3
      --enable-mixed-chunk
      --chunked-prefill-size 8192
      --watchdog-timeout 1800
      --disable-custom-all-reduce
      --speculative-algorithm EAGLE
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4
      --tool-call-parser deepseekv4
      --reasoning-parser deepseek-v4
      --port 8000
      --host 0.0.0.0
      --enable-cache-report
      --enable-metrics
      --log-requests-level 0
      --served-model-name deepseek-ai/DeepSeek-V4-Flash
      ${DSV4_RETURN_HIDDEN_STATES:+--enable-return-hidden-states}
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - kernel_cache:/root/.cache/deep_gemm
  environment:
    - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    - VLLM_LOGGING_LEVEL=INFO
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OPENBLAS_L2_SIZE=2097152
    - NCCL_DEBUG=WARN
    - SGLANG_ENABLE_SPEC_V2=1
    - SGLANG_DSV4_FP4_EXPERTS=1
    - SGLANG_ENABLE_UNIFIED_RADIX_TREE=1
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  restart: unless-stopped
  stop_grace_period: 5m
  logging: *logging-conf

x-downloader-common: &downloader-common
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
  entrypoint: ["sh", "-c"]
  restart: "no"
  logging: *logging-conf

# SGLang base + sglang#28305 fused-qkv cat_dim fix, copied byte-for-byte from
# the deployed GLM-5.1 recipe. The build fails loudly if the upstream loader
# changes and the patch anchor no longer matches.
x-glm51-awq-build: &glm51-awq-build
  dockerfile_inline: |
    FROM lmsysorg/sglang:dev-cu12@sha256:aac6b242680daeb74d2ab1d85f70575357552d7d165d2e5d30eb362797db54a1
    RUN python3 - <<'PYEOF'
    import re
    f = "/sgl-workspace/sglang/python/sglang/srt/models/deepseek_common/deepseek_weight_loader.py"
    s = open(f).read()
    pat = re.compile(r"(?P<i> +)cat_dim = 1\n\n(?P<j> +)fused_weight = torch\.cat\(")
    def repl(m):
        j = m.group("j")
        return (
            m.group("i") + "cat_dim = 1\n\n"
            + j + "if (\n"
            + j + "    q_a_proj_weight.dim() == 2\n"
            + j + "    and q_a_proj_weight.shape[1 - cat_dim]\n"
            + j + "    != kv_a_proj_weight.shape[1 - cat_dim]\n"
            + j + "):\n"
            + j + "    cat_dim = 1 - cat_dim\n\n"
            + j + "fused_weight = torch.cat("
        )
    s2, n = pat.subn(repl, s, count=1)
    assert n == 1, "sglang#28305 cat_dim patch anchor not found (loader changed)"
    open(f, "w").write(s2)
    print("[sglang#28305] fused qkv_a_proj cat_dim fix applied")
    PYEOF

