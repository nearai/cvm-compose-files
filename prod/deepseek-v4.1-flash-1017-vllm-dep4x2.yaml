  engine-egress-probe:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: engine-egress-probe
    restart: "no"
    networks:
      - engine-dsv41-a
      - engine-dsv41-b
    extra_hosts:
      - "compose-manager:host-gateway"
    entrypoint:
      - sh
      - -c
      - |
        fail=0
        reached() { echo "engine-egress-probe reached $$1"; fail=1; }
        if ip -4 route | grep -q '^default'; then echo "engine-egress-probe found a default route"; fail=1; fi
        subnets=$$(ip -4 route | awk '$$1 ~ "/" {print $$1}')
        if [ -z "$$subnets" ]; then echo "engine-egress-probe found no network to test"; fail=1; fi
        hosts=compose-manager
        for subnet in $$subnets; do
          base=$${subnet%/*}
          hosts="$$hosts $${base%.*}.$$(( $${base##*.} + 1 ))"
        done
        hits=$$(mktemp)
        for host in $$hosts; do
          ( for port in 22 80 8000 8001 8080 8444; do
              if nc -z -w 2 "$$host" "$$port" 2>/dev/null; then echo "$$host:$$port" >> "$$hits"; fi
            done ) &
        done
        wait
        while read -r hit; do reached "$$hit"; done < "$$hits"
        for target in "1.1.1.1 443" "1.1.1.1 53" "169.254.169.254 80"; do
          if nc -z -w 3 $$target 2>/dev/null; then reached "$$target"; fi
        done
        if curl -s -o /dev/null -m 5 https://huggingface.co; then reached https://huggingface.co; fi
        if nslookup huggingface.co >/dev/null 2>&1; then echo "engine-egress-probe resolved an outside name"; fail=1; fi
        count=$$(echo "$$subnets" | wc -w)
        if [ "$$fail" = 0 ]; then echo "engine-egress-probe PASS: no route out of $$count networks"; else echo "engine-egress-probe FAIL"; fi
        exit "$$fail"
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"engine-egress-probe","service":"engine-egress-probe","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

