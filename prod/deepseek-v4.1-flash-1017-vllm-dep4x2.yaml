# deepseek-ai/DeepSeek-V4.1-Flash-1017 | vLLM | dep4x2
x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:ed8537214f2c5cc5e3fba237c480162af9c298ee60a9b3cbdb68ba2c346d7bb4
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-dsv41-engine-common: &dsv41-engine-common
  <<: *nvidia
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  image: docker.io/nearaidev/vllm@sha256:79625e1f04c1bbdfdc98dca41e20de6e2a5f446c6b3ee7595956ec54ab64c0f4
  shm_size: 64g
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - dsv41_kernel_cache:/root/.cache/vllm
    - humming_cache:/root/.cache/humming
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 10m
  logging: *logging-conf

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "Downloading deepseek-ai/DeepSeek-V4.1-Flash-1017..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4.1-Flash-1017 --revision 1bae0e1088993b9b82de08f59de5be5a34e42170
        echo "Downloading UnderTides/DeepSeek-V4.1-Flash-1017-heretic-lora..."
        uvx --from 'huggingface_hub[hf_xet]' hf download UnderTides/DeepSeek-V4.1-Flash-1017-heretic-lora --revision 196c06e3c2aad43e9688d16fa993b4333f69358a
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:multi","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"]}]'

  nginx:
    image: nginx@sha256:9e596d26590907ed433eb53c83c4016038025d4e004b15922786ba85c8957264
    container_name: nginx
    depends_on:
      proxy-dsv41:
        condition: service_started
      proxy-dsv41-abliterated:
        condition: service_started
    command: /bin/sh -c 'certs="/etc/letsencrypt/live/completions.near.ai/fullchain.pem"; last=$$(stat -L -c %Y $$certs 2>/dev/null); while :; do sleep 60; cur=$$(stat -L -c %Y $$certs 2>/dev/null); if [ -n "$$cur" ] && [ "$$cur" != "$$last" ]; then last=$$cur; echo "certs changed, reloading nginx"; nginx -s reload; fi; done & while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:multi","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"]}]'

  model-proxy-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1800s
    environment:
      - HOST_IP=${HOST_IP}
      - TLS_PORT_DSV41=${TLS_PORT_DSV41:-8001}
      - TLS_PORT_DSV41_ABLITERATED=${TLS_PORT_DSV41_ABLITERATED:-8003}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:multi","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"]}]'

  proxy-dsv41:
    <<: *vllm-proxy-common
    container_name: proxy-dsv41
    networks:
      - default
      - engine-dsv41-a
      - engine-dsv41-b
    depends_on:
      engine-egress-probe:
        condition: service_completed_successfully
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=deepseek-ai/DeepSeek-V4.1-Flash-1017
      - VLLM_PROXY_STRICT_REQUEST_MODEL=1
      - VLLM_PROXY_PRIORITY_LOWER_FIRST=1
      - OHTTP_ENABLED=true
      - TOKEN=${PROXY_TOKEN}${PROXY_TOKEN_NEXT:+,${PROXY_TOKEN_NEXT}}
      - VLLM_BACKEND_URLS=http://model-vllm-dsv41-dp0:9100,http://model-vllm-dsv41-dp1:9101,http://model-vllm-dsv41-dp2:9102,http://model-vllm-dsv41-dp3:9103,http://model-vllm-dsv41-dp4:9104,http://model-vllm-dsv41-dp5:9105,http://model-vllm-dsv41-dp6:9106,http://model-vllm-dsv41-dp7:9107
      - VLLM_BACKEND_CONVERSATION_AFFINITY=1
      - VLLM_BACKEND_AFFINITY_MAX_IMBALANCE=64
      - VLLM_PROXY_MAX_REQUEST_SIZE=104857600
      - VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS=3
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
      - VLLM_PROXY_INLINE_MEDIA=${VLLM_PROXY_INLINE_MEDIA:-1}
      - VLLM_PROXY_REJECTED_CONTENT_PART_TYPES=${VLLM_PROXY_REJECTED_CONTENT_PART_TYPES:-video_url}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017","port:8000","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-dsv41"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
      nearai.otel.deployment: "deepseek-v4.1-flash-1017-vllm-dep4x2"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.ppcie: "true"
      nearai.otel.config_variant: "vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"

  proxy-dsv41-abliterated:
    <<: *vllm-proxy-common
    container_name: proxy-dsv41-abliterated
    networks:
      - default
      - engine-dsv41-a
      - engine-dsv41-b
    depends_on:
      engine-egress-probe:
        condition: service_completed_successfully
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated
      - VLLM_PROXY_STRICT_REQUEST_MODEL=1
      - VLLM_PROXY_PRIORITY_LOWER_FIRST=1
      - VLLM_PROXY_ALLOWED_ORG_IDS=${DSV41_ABLITERATED_ALLOWED_ORG_IDS:-__no_organizations__}
      - OHTTP_ENABLED=true
      - TOKEN=${PROXY_TOKEN}${PROXY_TOKEN_NEXT:+,${PROXY_TOKEN_NEXT}}
      - VLLM_BACKEND_URLS=http://model-vllm-dsv41-dp0:9100,http://model-vllm-dsv41-dp1:9101,http://model-vllm-dsv41-dp2:9102,http://model-vllm-dsv41-dp3:9103,http://model-vllm-dsv41-dp4:9104,http://model-vllm-dsv41-dp5:9105,http://model-vllm-dsv41-dp6:9106,http://model-vllm-dsv41-dp7:9107
      - VLLM_BACKEND_CONVERSATION_AFFINITY=1
      - VLLM_BACKEND_AFFINITY_MAX_IMBALANCE=64
      - VLLM_PROXY_MAX_REQUEST_SIZE=104857600
      - VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS=3
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
      - VLLM_PROXY_INLINE_MEDIA=${VLLM_PROXY_INLINE_MEDIA:-1}
      - VLLM_PROXY_REJECTED_CONTENT_PART_TYPES=${VLLM_PROXY_REJECTED_CONTENT_PART_TYPES:-video_url}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated","port:8002","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-dsv41-abliterated"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated"
      nearai.otel.deployment: "deepseek-v4.1-flash-1017-vllm-dep4x2"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.ppcie: "true"
      nearai.otel.config_variant: "vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"

  # Network namespace of dsv41-dp0 to dsv41-dp3: the ranks reach each other on loopback,
  # and the proxies and the collector reach them by name on one internal network.
  sidecar-dsv41-netns-a:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: sidecar-dsv41-netns-a
    entrypoint: ["sleep", "infinity"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "64m"
    networks:
      engine-dsv41-a:
        aliases:
          - model-vllm-dsv41-dp0
          - model-vllm-dsv41-dp1
          - model-vllm-dsv41-dp2
          - model-vllm-dsv41-dp3
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"sidecar-dsv41-netns-a","service":"sidecar-dsv41-netns-a","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Network namespace of dsv41-dp4 to dsv41-dp7: the ranks reach each other on loopback,
  # and the proxies and the collector reach them by name on one internal network.
  sidecar-dsv41-netns-b:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: sidecar-dsv41-netns-b
    entrypoint: ["sleep", "infinity"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "64m"
    networks:
      engine-dsv41-b:
        aliases:
          - model-vllm-dsv41-dp4
          - model-vllm-dsv41-dp5
          - model-vllm-dsv41-dp6
          - model-vllm-dsv41-dp7
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"sidecar-dsv41-netns-b","service":"sidecar-dsv41-netns-b","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  model-vllm-dsv41-dp0:
    <<: *dsv41-engine-common
    container_name: model-vllm-dsv41-dp0
    network_mode: "service:sidecar-dsv41-netns-a"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NCCL_DEBUG=WARN
      - 'VLLM_HUMMING_INPUT_QUANT_CONFIG={"dtype":"float8e4m3","quant_mode":"dynamic_token"}'
      - VLLM_NEAR_DISABLE_UVA=1
      - VLLM_NEAR_ENGRAM_CPU_GATHER=1
      - VLLM_NEAR_ENGRAM_FAST_GATHER=1
      - VLLM_NEAR_ENGRAM_PRESTAGE=1
      - VLLM_NEAR_LORA_DECODER_REPLAY=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - VLLM_CONFIDENTIAL_COMPUTE=1
      - VLLM_NEAR_ENGRAM_PEER_READS=0
      - OMP_NUM_THREADS=4
      - VLLM_NEAR_DP_GLOBAL_PREFILL_CADENCE=1
      - HUMMING_COMPILER=nvcc
      - HUMMING_CACHE_DIR=/root/.cache/humming/dp0
      - HUMMING_MAX_PARALLEL_BUILD_WORKERS=8
    command: >
      /root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4.1-Flash-1017/snapshots/1bae0e1088993b9b82de08f59de5be5a34e42170
      --served-model-name deepseek-ai/DeepSeek-V4.1-Flash-1017
      --trust-remote-code
      --tensor-parallel-size 1
      --data-parallel-size 4
      --data-parallel-rank 0
      --enable-expert-parallel
      --data-parallel-address 127.0.0.1
      --data-parallel-rpc-port 13345
      --max-model-len 1048576
      --max-num-batched-tokens 8192
      --max-num-seqs 64
      --max-num-queued-reqs 96
      --scheduling-policy priority
      --gpu-memory-utilization 0.90
      --enable-prompt-tokens-details
      --tokenizer-mode deepseek_v41
      --reasoning-parser deepseek_v41
      --tool-call-parser deepseek_v41
      --enable-auto-tool-choice
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}'
      --enable-lora --max-loras 1 --max-cpu-loras 1 --max-lora-rank 8 --lora-target-modules wo_b
      --lora-modules '{"name":"deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated","path":"/root/.cache/huggingface/hub/models--UnderTides--DeepSeek-V4.1-Flash-1017-heretic-lora/snapshots/196c06e3c2aad43e9688d16fa993b4333f69358a","base_model_name":"deepseek-ai/DeepSeek-V4.1-Flash-1017"}'
