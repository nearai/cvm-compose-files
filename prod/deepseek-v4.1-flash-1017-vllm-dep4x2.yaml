      --port 9100
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017","replica:r1","dp_rank:0","gpu:0","deployment:deepseek-v4.1-flash-1017-vllm-dep4x2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0340r2-lora3p-cc2-w4a8-2xdep4-c8192-dspark5pb-mr64-omp4-aff64-restricted-psi8-cc-engram-cpu-fg-prestage-fullgraph-lorareplay-dpcadence"]}]'
      nearai.otel.scrape: "true"
