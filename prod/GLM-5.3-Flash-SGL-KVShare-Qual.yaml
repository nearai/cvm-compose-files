  glm53_pd_startup_patch_a72482f0:
    content: |
      # Start-up patches for stock SGLang v0.5.21 (lmsysorg/sglang:v0.5.21-cu130) serving GLM-5.3-Flash W4AFP8.
      # 1) W4AFP8 loader: from_config drops modules_to_not_convert, so narrow layers get FP8 block-quant and
      #    fail ("output_partition_size = 16 is not divisible by block_n = 128"). Same fix as
      #    docker/sglang-glm53-hicache-w4afp8/modules-to-not-convert.diff.
      # 2) Thinking budget: accept the public thinking_token_budget and default GLM5 (glm5_next) to 8192,
      #    the production policy (fork 1fea50d9f + e4d313ef0). Without it reasoning runs uncapped.
      # 3) P/D under CC: MetadataBuffers are pageable CPU tensors that NIXL registers as DRAM; UCX's
      #    cuda_copy MD then calls cuMemHostRegister, which HCC/PPCIe rejects (NIXL_ERR_BACKEND). Pinning
      #    them via cudaHostAlloc (torch pin_memory) makes UCX skip the register (gpu03, 2026-10-06).
      # 4) Decode TP-rank divergence guard: under overload with client aborts the decode transfer queue
      #    can differ by a request between TP ranks; the MIN all-reduce of poll states then mismatches
      #    in size and gloo aborts the engine ("op.preamble.length <= op.nbytes. 16 vs 15", gpu03
      #    2026-10-06, also seen in the lab). Poll only requests queued on every rank, in rid order;
      #    the rest stay Transferring until their peers catch up.
      # Each edit is an exact-anchor replacement; any missing anchor aborts the start (fail closed).
      import os, pathlib, sys
      ROOT = pathlib.Path(os.environ.get("PD_PATCH_ROOT", "/sgl-workspace/sglang/python/sglang/srt"))
      def sub(rel, old, new, label):
          p = ROOT / rel; s = p.read_text()
          if new in s:
              print(f"[pd-patch] {label}: already applied", flush=True); return
          n = s.count(old)
          if n != 1:
              sys.exit(f"[pd-patch] {label}: expected 1 anchor, found {n}")
          p.write_text(s.replace(old, new)); print(f"[pd-patch] {label}: applied", flush=True)
      sub("layers/quantization/w4afp8.py",
      """        weight_block_size = [128, 128]
              return cls(
                  is_checkpoint_fp8_serialized=is_checkpoint_fp8_serialized,
                  is_checkpoint_w4afp8_serialized=is_checkpoint_w4afp8_serialized,
                  linear_activation_scheme=linear_activation_scheme,
                  moe_activation_scheme=moe_activation_scheme,
                  weight_block_size=weight_block_size,
              )""",
      """        weight_block_size = [128, 128]
              ignored_layers = (
                  config.get("modules_to_not_convert")
                  or config.get("ignored_layers")
                  or config.get("ignore")
                  or []
              )
              return cls(
                  is_checkpoint_fp8_serialized=is_checkpoint_fp8_serialized,
                  is_checkpoint_w4afp8_serialized=is_checkpoint_w4afp8_serialized,
                  linear_activation_scheme=linear_activation_scheme,
                  moe_activation_scheme=moe_activation_scheme,
                  ignored_layers=ignored_layers,
                  weight_block_size=weight_block_size,
              )""", "w4afp8 modules_to_not_convert")
      sub("entrypoints/openai/protocol.py", "    StrictBool,\n    field_serializer,", "    StrictBool,\n    StrictInt,\n    field_serializer,", "protocol StrictInt import")
      sub("entrypoints/openai/protocol.py",
      """    custom_params: Optional[Dict] = None

          # Pre-computed prompt token IDs: when provided""",
      """    custom_params: Optional[Dict] = None
          thinking_token_budget: Optional[StrictInt] = Field(default=None, ge=0)

          # Pre-computed prompt token IDs: when provided""", "protocol thinking_token_budget field")
      sub("entrypoints/openai/protocol.py",
      """    @model_validator(mode="before")
          @classmethod
          def set_tool_choice_default(cls, values):""",
      """    @model_validator(mode="before")
          @classmethod
          def normalize_thinking_token_budget(cls, values):
              if not isinstance(values, dict):
                  return values
              custom_params = values.get("custom_params")
              if custom_params is None:
                  custom_params = {}
              if not isinstance(custom_params, dict) or "thinking_budget" in custom_params:
                  return values
              if "thinking_token_budget" in values:
                  budget = values.get("thinking_token_budget")
              else:
                  return values
              if isinstance(budget, int) and not isinstance(budget, bool) and budget >= 0:
                  values = dict(values)
                  custom_params = dict(custom_params)
                  custom_params["thinking_budget"] = budget
                  values["custom_params"] = custom_params
              return values

          @model_validator(mode="before")
          @classmethod
          def set_tool_choice_default(cls, values):""", "protocol thinking_token_budget normalizer")
      sub("entrypoints/openai/serving_chat.py",
      """        set_request_reasoning_end_token_ids(
                  sampling_params, processed_messages.reasoning_end_token_ids
              )""",
      """        if (
                  getattr(self.tokenizer_manager.model_config.hf_config, "model_type", None)
                  in ("glm5_next", "glm5_next_text")
                  and "thinking_token_budget" not in request.model_fields_set
              ):
                  custom_params = dict(sampling_params.get("custom_params") or {})
                  custom_params.setdefault("thinking_budget", 8192)
                  sampling_params["custom_params"] = custom_params
              set_request_reasoning_end_token_ids(
                  sampling_params, processed_messages.reasoning_end_token_ids
              )""", "serving_chat glm5 default thinking budget 8192")
      sub("disaggregation/utils.py",
      """                    device=self.bootstrap_room.device,
                      )

          def set_kv_checksum(""",
      """                    device=self.bootstrap_room.device,
                      )
              if torch.cuda.is_available():
                  for _name, _t in list(vars(self).items()):
                      if isinstance(_t, torch.Tensor) and _t.device.type == "cpu":
                          setattr(self, _name, _t.pin_memory())

          def set_kv_checksum(""", "disagg MetadataBuffers pinned host memory")
      sub("disaggregation/decode.py",
      """    def _poll_with_metadata_gate(self) -> List[int]:
              pollers = (""",
      """    def _poll_with_metadata_gate(self) -> List[int]:
              group = self.gloo_group
              if (
                  not self.scheduler.enable_decode_hicache
                  and torch.distributed.get_world_size(group) > 1
              ):
                  rids = [dr.req.rid for dr in self.queue]
                  gathered = [None] * torch.distributed.get_world_size(group)
                  torch.distributed.all_gather_object(gathered, rids, group=group)
                  common = set(rids).intersection(*(set(g) for g in gathered))
                  if any(len(g) != len(common) for g in gathered):
                      logger.warning(
                          f"[pd-patch] decode transfer queue diverged across TP ranks: "
                          f"{[len(g) for g in gathered]} queued, {len(common)} common"
                      )
                  subset = sorted(
                      (dr for dr in self.queue if dr.req.rid in common),
                      key=lambda dr: dr.req.rid,
                  )
                  sub_polls = poll_and_all_reduce(
                      [dr.kv_receiver for dr in subset],
                      group,
                      decode_reqs=subset,
                      metadata_buffers=self.metadata_buffers,
                  ) if subset else []
                  by_rid = {dr.req.rid: poll for dr, poll in zip(subset, sub_polls)}
                  return [by_rid.get(dr.req.rid, KVPoll.Transferring) for dr in self.queue]
              pollers = (""", "decode TP-rank divergence guard")

  kvq_probe_py_40b671c4:
    content: |
      #!/usr/bin/env python3
      """In-host KV sharing primitives under NVIDIA CC (gpu13 GPUs 4-7 visible as cuda:0-3).

      Prints one `KVQ {json}` line per result, then `KVQ_DONE`. Checks:
        env        nvidia-smi topology, CC mode, host memory
        p2p        in-process peer copy cuda:a -> cuda:b (bulk 1 GiB + scattered 64 KiB pages), checksummed
        ipc        cross-process CUDA IPC (legacy cudaIpc handles, what NIXL/UCX cuda_ipc uses with
                   expandable_segments:False): a producer process on cuda:a exports, a consumer on
                   cuda:b imports and copies, checksummed
        host       pinned (cudaMallocHost) H2D/D2H, tmpfs file -> pinned -> GPU (the shared-tier
                   restore path) with 1 and 2 concurrent processes, and cudaHostRegister (801 expected)
      """
      import faulthandler, json, os, subprocess, sys, time, mmap, ctypes

      faulthandler.enable()  # a native crash in CUDA init still leaves a stack in the log
      print("KVQ " + json.dumps({"kind": "start", "pid": os.getpid()}), flush=True)
      import torch  # noqa: E402
      import torch.multiprocessing as mp

      PAGE = 64 * 1024
      GiB = 1 << 30


      def out(kind, **kw):
          print("KVQ " + json.dumps({"kind": kind, **kw}), flush=True)


      def sh(cmd):
          try:
              return subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=60).stdout
          except Exception as e:  # noqa: BLE001
              return f"ERR {e}"


      def checksum(t):
          """Order-sensitive checksum of a uint8 CUDA tensor, computed on its own device."""
          v = t.view(torch.int32).to(torch.int64)
          w = (torch.arange(v.numel(), device=v.device, dtype=torch.int64) % 65521) + 1
          return int((v * w).sum().item()) & ((1 << 62) - 1)


      def fill(n, dev, seed):
          g = torch.Generator(device=dev).manual_seed(seed)
          return torch.randint(0, 256, (n,), dtype=torch.uint8, device=dev, generator=g)


      def timed(fn, dev_list, reps=3):
          best = 1e9
          for _ in range(reps):
              for d in dev_list:
                  torch.cuda.synchronize(d)
              t0 = time.perf_counter()
              fn()
              for d in dev_list:
                  torch.cuda.synchronize(d)
              best = min(best, time.perf_counter() - t0)
          return best


      def p2p(a, b):
          da, db = f"cuda:{a}", f"cuda:{b}"
          res = {"src": a, "dst": b, "can_access_peer": torch.cuda.can_device_access_peer(a, b)}
          try:
              src = fill(GiB, da, 1234 + a)
              cs = checksum(src)
              dst = torch.empty_like(src, device=db)
              dt = timed(lambda: dst.copy_(src, non_blocking=True), [da, db])
              res.update(bulk_ok=checksum(dst) == cs, bulk_gbps=round(GiB / dt / 1e9, 1))
              # Scattered pages: 35K x 64 KiB is the shape of a ~189K-token GLM KV move.
              npg = 35000
              srcp = fill(npg * PAGE, da, 99 + a).view(npg, PAGE)
              dstp = torch.zeros(npg, PAGE, dtype=torch.uint8, device=db)
              perm_s = torch.randperm(npg, device=da)
              perm_d = torch.randperm(npg, device=db)
              def gather():
                  dstp[perm_d] = srcp[perm_s].to(db, non_blocking=True)
              dt2 = timed(gather, [da, db], reps=2)
              ok = checksum(dstp[perm_d].contiguous().view(-1)) == checksum(srcp[perm_s].contiguous().view(-1).to(db))
              res.update(scatter_ok=ok, scatter_gbps=round(npg * PAGE / dt2 / 1e9, 1))
          except Exception as e:  # noqa: BLE001
              res["error"] = repr(e)[:500]
          out("p2p", **res)


      def _ipc_producer(dev, q, done, seed):
          torch.cuda.set_device(dev)
          t = fill(GiB, f"cuda:{dev}", seed)
          q.put((t, checksum(t)))  # torch shares CUDA tensors via cudaIpcGetMemHandle
          done.wait(600)


      def ipc(a, b):
          res = {"src": a, "dst": b, "mode": "cross-process cudaIpc"}
          ctx = mp.get_context("spawn")
          q, done = ctx.Queue(), ctx.Event()
          p = ctx.Process(target=_ipc_producer, args=(a, q, done, 4321 + a))
          p.start()
          try:
              torch.cuda.set_device(b)
              remote, cs = q.get(timeout=300)
              res["remote_device"] = str(remote.device)
              dst = torch.empty(remote.numel(), dtype=torch.uint8, device=f"cuda:{b}")
              dt = timed(lambda: dst.copy_(remote, non_blocking=True), [remote.device.index, b])
              res.update(ok=checksum(dst) == cs, gbps=round(GiB / dt / 1e9, 1))
              del remote
          except Exception as e:  # noqa: BLE001
              res["error"] = repr(e)[:500]
          finally:
              done.set()
              p.join(60)
          out("ipc", **res)


      def _host_restore(dev, path, size, barrier, rq):
          torch.cuda.set_device(dev)
          pinned = torch.empty(size, dtype=torch.uint8, pin_memory=True)
          gpu = torch.empty(size, dtype=torch.uint8, device=f"cuda:{dev}")
          mv = memoryview(pinned.numpy())
          barrier.wait()
          t0 = time.perf_counter()
          with open(path, "rb", buffering=0) as f:
              n = 0
              while n < size:
                  r = f.readinto(mv[n:n + 64 * 1024 * 1024])
                  if not r:
                      break
                  n += r
          t1 = time.perf_counter()
          gpu.copy_(pinned, non_blocking=True)
          torch.cuda.synchronize()
          t2 = time.perf_counter()
          rq.put({"dev": dev, "read_gbps": round(size / (t1 - t0) / 1e9, 2), "h2d_gbps": round(size / (t2 - t1) / 1e9, 1),
                  "end_to_end_gbps": round(size / (t2 - t0) / 1e9, 2)})


      def host():
          res = {}
          size = 4 * GiB
          try:
              pinned = torch.empty(size, dtype=torch.uint8, pin_memory=True)  # cudaHostAlloc
              g = torch.empty(size, dtype=torch.uint8, device="cuda:0")
              res["h2d_gbps"] = round(size / timed(lambda: g.copy_(pinned, non_blocking=True), ["cuda:0"]) / 1e9, 1)
              res["d2h_gbps"] = round(size / timed(lambda: pinned.copy_(g, non_blocking=True), ["cuda:0"]) / 1e9, 1)
              res["pinned_alloc_ok"] = True
              del pinned, g
          except Exception as e:  # noqa: BLE001
              res["pinned_error"] = repr(e)[:300]
          # cudaHostRegister on shared memory: the upstream HiCache path. 801 = not supported under CC.
          try:
              buf = mmap.mmap(-1, 64 * 1024 * 1024)
              addr = ctypes.addressof(ctypes.c_char.from_buffer(buf))
              rc = torch.cuda.cudart().cudaHostRegister(addr, 64 * 1024 * 1024, 0)
              res["cudaHostRegister_rc"] = int(rc.value if hasattr(rc, "value") else rc)
              if res["cudaHostRegister_rc"] == 0:
                  torch.cuda.cudart().cudaHostUnregister(addr)
          except Exception as e:  # noqa: BLE001
              res["cudaHostRegister_error"] = repr(e)[:300]
          out("host", **res)
          # Shared-tier restore path: tmpfs file written by one replica, read by the other into pinned memory.
          d = "/dev/shm/kvq"
          os.makedirs(d, exist_ok=True)
          fsize = 2 * GiB
          paths = []
          for i in range(2):
              p = f"{d}/blob{i}"
              t0 = time.perf_counter()
              with open(p, "wb") as f:
                  chunk = os.urandom(64 * 1024 * 1024)
                  for _ in range(fsize // len(chunk)):
                      f.write(chunk)
              paths.append(p)
              out("tmpfs_write", file=i, gbps=round(fsize / (time.perf_counter() - t0) / 1e9, 2))
          ctx = mp.get_context("spawn")
          for nproc in (1, 2):
              barrier, rq = ctx.Barrier(nproc), ctx.Queue()
              procs = [ctx.Process(target=_host_restore, args=(2 * i, paths[i], fsize, barrier, rq)) for i in range(nproc)]
              [p.start() for p in procs]
              results = [rq.get(timeout=600) for _ in procs]
              [p.join(60) for p in procs]
              out("tmpfs_restore", concurrent=nproc, per_proc=results)
          for p in paths:
              os.remove(p)


      def main():
          print(sh("nvidia-smi -L; nvidia-smi conf-compute -f; nvidia-smi conf-compute -mgm"), flush=True)
          out("env", cuda_visible=os.environ.get("NVIDIA_VISIBLE_DEVICES"), devices=torch.cuda.device_count(),
              names=[torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())],
              torch=torch.__version__, cuda=torch.version.cuda,
              alloc_conf=os.environ.get("PYTORCH_CUDA_ALLOC_CONF"))
          print(sh("nvidia-smi -L; nvidia-smi topo -m; nvidia-smi conf-compute -f; nvidia-smi conf-compute -mgm; "
                   "nvidia-smi conf-compute -q 2>/dev/null | head -40; free -g; nproc; df -h /dev/shm"), flush=True)
          n = torch.cuda.device_count()
          if n < 4:
              out("fatal", msg=f"expected 4 visible GPUs, got {n}")
              return
          # Same-replica pairs (0,1)/(2,3) and cross-replica pairs (0,2)/(1,3)/(2,0).
          for a, b in [(0, 1), (0, 2), (1, 3), (2, 0), (3, 1)]:
              p2p(a, b)
              torch.cuda.empty_cache()
          for a, b in [(0, 2), (2, 0), (1, 3)]:
              ipc(a, b)
              torch.cuda.empty_cache()
          host()


      if __name__ == "__main__":
          mp.set_start_method("spawn", force=True)
          try:
              main()
          finally:
              print("KVQ_DONE", flush=True)

  kvq_driver_py_771e0740:
    content: |
      #!/usr/bin/env python3
      """In-CVM load driver for the KV-sharing qualification (stdlib only, no ports exposed).

      KVQ_TESTS (comma list, run in order):
        health    wait until every KVQ_TARGETS endpoint answers /v1/models
        gsm8k     KVQ_GSM8K_N GSM8K test questions via chat completions on the first target; accuracy
        longturn  a ~KVQ_LONG_TOKENS-token conversation with a hidden code: turn 1 cold on target A,
                  turn 2 (same prefix + question) on target B (A again if one target). Reports TTFT of
                  both turns, cached_tokens and whether turn 2 recalls the code (KV correctness).
                  With two targets this is the cross-replica restore test (shared tier / GPU fetch).
        metrics   print ghost/cache counters scraped from KVQ_METRICS_URLS (lab engines are not in Prometheus)
        hold      print one line and sleep KVQ_HOLD_S (log-path check)
        cold      the same turn-2 prompt with a fresh salt on target B: the recompute baseline.
      Results are printed as `KVQ {json}` lines; `KVQ_DONE` at the end.
      """
      import concurrent.futures as cf, json, os, random, re, time, urllib.request

      TARGETS = [t.strip() for t in os.environ.get("KVQ_TARGETS", "http://kvq-router:8000").split(",") if t.strip()]
      MODEL = os.environ.get("KVQ_MODEL", "z-ai/glm-5.3-flash")
      LAST_REASONING = []  # reasoning_content of the last chat() call (not thread-safe: diagnostics only)
      WRONG = []  # sample wrong GSM8K answers
      TESTS = os.environ.get("KVQ_TESTS", "health,gsm8k,longturn,cold").split(",")


      def out(kind, **kw):
          print("KVQ " + json.dumps({"kind": kind, **kw}), flush=True)


      def post(base, path, body, timeout=3600):
          req = urllib.request.Request(base + path, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"})
          return urllib.request.urlopen(req, timeout=timeout)


      def chat(base, messages, max_tokens, thinking=True, stream=True):
          """Returns (ttft_s, total_s, text, usage)."""
          body = {"model": MODEL, "messages": messages, "max_tokens": max_tokens, "temperature": 0.0, "stream": stream,
                  "stream_options": {"include_usage": True}, "chat_template_kwargs": {"enable_thinking": thinking}}
          t0 = time.perf_counter(); ttft = None; text = []; usage = None; LAST_REASONING.clear()
          with post(base, "/v1/chat/completions", body) as r:
              for raw in r:
                  line = raw.decode(errors="replace").strip()
                  if not line.startswith("data:") or line.endswith("[DONE]"):
                      continue
                  ev = json.loads(line[5:])
                  if ev.get("error"):  # e.g. queue-full rejections arrive inside a 200 stream
                      raise RuntimeError(f"stream error: {str(ev['error'])[:200]}")
                  if ev.get("usage"):
                      usage = ev["usage"]
                  for ch in ev.get("choices") or []:
                      d = ch.get("delta") or {}
                      piece = (d.get("content") or "") + (d.get("reasoning_content") or "")
                      if piece and ttft is None:
                          ttft = time.perf_counter() - t0
                      text.append(d.get("content") or "")
                      LAST_REASONING.append(d.get("reasoning_content") or "")
          return ttft, time.perf_counter() - t0, "".join(text), usage


      def health():
          # Ready = a tiny chat succeeds end to end (a router can answer /v1/models before its
          # engines are up); it also keeps first-request overheads out of later timings.
          for base in TARGETS:
              t0, last = time.time(), None
              while True:
                  try:
                      chat(base, [{"role": "user", "content": "Say ok."}], 8, thinking=False)
                      break
                  except Exception as e:  # noqa: BLE001
                      last = repr(e)[:200]
                  if time.time() - t0 > 3600:
                      out("health", target=base, ok=False, last_error=last); raise SystemExit(1)
                  time.sleep(15)
              out("health", target=base, ok=True, wait_s=round(time.time() - t0))


      def gsm8k():
          n = int(os.environ.get("KVQ_GSM8K_N", "150"))
          url = "https://raw.githubusercontent.com/openai/grade-school-math/master/grade_school_math/data/test.jsonl"
          rows = [json.loads(l) for l in urllib.request.urlopen(url, timeout=60).read().decode().splitlines() if l.strip()][:n]

          def one(row):
              q = row["question"] + "\nSolve it, then give the final answer as a plain number on the last line in the form '#### <number>'."
              try:
                  _, _, text, _ = chat(TARGETS[0], [{"role": "user", "content": q}], 8192, thinking=True, stream=True)
              except Exception as e:  # noqa: BLE001
                  return False, f"error {e!r}"[:200]
              gold = row["answer"].split("####")[-1].strip().replace(",", "")
              m = re.findall(r"####\s*\x24?(-?[\d,]*\.?\d+)", text) or re.findall(r"(-?[\d,]*\.?\d+)", text)
              pred = m[-1].replace(",", "").rstrip(".") if m else ""
              try:
                  ok = abs(float(pred) - float(gold)) < 1e-6
              except ValueError:
                  ok = False
              if not ok and len(WRONG) < int(os.environ.get("KVQ_GSM8K_SAMPLES", "3")):
                  WRONG.append({"gold": gold, "pred": pred, "content_head": text[:200], "content_tail": text[-200:],
                                "reasoning_tail": "".join(LAST_REASONING)[-200:], "content_len": len(text)})
              return ok, None

          t0 = time.time()
          with cf.ThreadPoolExecutor(int(os.environ.get("KVQ_GSM8K_CONC", "32"))) as ex:
              res = list(ex.map(one, rows))
          errs = [e for _, e in res if e]
          out("gsm8k", target=TARGETS[0], n=len(rows), accuracy=round(sum(ok for ok, _ in res) / len(rows), 4), errors=len(errs),
              first_error=errs[0] if errs else None, wall_s=round(time.time() - t0), wrong_samples=WRONG)


      def long_doc(tokens, seed):
          rnd = random.Random(seed)
          words = "alpha bravo charlie delta echo foxtrot golf hotel india juliet kilo lima mike november oscar papa".split()
          code = f"{rnd.randint(100000, 999999)}-{rnd.choice(words)}"
          lines, n_lines = [], tokens // 22  # ~22 tokens per line on GLM's tokenizer (calibrated by usage below)
          for i in range(n_lines):
              lines.append(f"Record {i:06d}: {' '.join(rnd.choice(words) for _ in range(8))} value={rnd.randint(0, 10**6)}.")
              if i == n_lines // 2:
                  lines.append(f"IMPORTANT: the vault access code is {code}. Remember it.")
          return "\n".join(lines), code


      def longturn(name="longturn", salt=None):
          tokens = int(os.environ.get("KVQ_LONG_TOKENS", "189000"))
          seed = salt if salt is not None else int(os.environ.get("KVQ_LONG_SEED", "7"))
          doc, code = long_doc(tokens, seed)
          a, b = TARGETS[0], TARGETS[-1]
          m1 = [{"role": "user", "content": f"[session {seed}]\n{doc}\n\nRead the log above. Reply with just 'ready'."}]
          res = {"seed": seed, "target_turn1": a, "target_turn2": b}
          if name == "longturn":
              ttft1, tot1, text1, u1 = chat(a, m1, 16, thinking=False)
              res.update(turn1_ttft_s=round(ttft1 or tot1, 2), turn1_prompt_tokens=(u1 or {}).get("prompt_tokens"),
                         turn1_cached=((u1 or {}).get("prompt_tokens_details") or {}).get("cached_tokens"))
              # write_through_selective (the base tier's policy) backs a node up to L2/L3 only on its
              # second hit, so repeat turn 1 on A to make the prefix shareable, as a multi-turn
              # conversation does on its home replica.
              for _ in range(int(os.environ.get("KVQ_TURN1_REPEAT", "1")) - 1):
                  r_ttft, _, _, r_u = chat(a, m1, 16, thinking=False)
                  res.setdefault("turn1_repeat_ttft_s", []).append(round(r_ttft or 0, 2))
                  res.setdefault("turn1_repeat_cached", []).append(((r_u or {}).get("prompt_tokens_details") or {}).get("cached_tokens"))
              m2 = m1 + [{"role": "assistant", "content": text1 or "ready"}]
              # The shared L3 tier is written asynchronously after turn 1; give it time before turn 2
              # lands on the other replica.
              time.sleep(float(os.environ.get("KVQ_TURN_GAP_S", "0")))
          else:
              m2 = m1 + [{"role": "assistant", "content": "ready"}]
          m2 = m2 + [{"role": "user", "content": "What is the vault access code? Reply with the code only."}]
          # 512: GLM often reasons a few dozen tokens before the code even with thinking off; 32 cut it off.
          ttft2, tot2, text2, u2 = chat(b, m2, int(os.environ.get("KVQ_TURN2_MAX_TOKENS", "512")), thinking=False)
          res.update(turn2_ttft_s=round(ttft2 or tot2, 2), turn2_total_s=round(tot2, 2),
                     turn2_prompt_tokens=(u2 or {}).get("prompt_tokens"),
                     turn2_cached=((u2 or {}).get("prompt_tokens_details") or {}).get("cached_tokens"),
                     recalled=code in ((text2 or "") + "".join(LAST_REASONING)), answer=(text2 or "")[:80],
                     reasoning="".join(LAST_REASONING)[-200:], code=code)
          out(name, **res)


      def metrics():
          """Print ghost / prefix-cache / HiCache counters from each KVQ_METRICS_URLS endpoint (summed per name)."""
          want = re.compile(r"^(sglang[:_](ghost_[a-z_]+|cache_hit_rate|prompt_tokens_total|cached_tokens_total|"
                            r"kv_tier_[a-z_]+|hicache_[a-z_]+|realtime_tokens_total))(\{[^}]*\})?\s+([0-9.eE+-]+)\Z")
          for url in [u.strip() for u in os.environ.get("KVQ_METRICS_URLS", "").split(",") if u.strip()]:
              try:
                  body = urllib.request.urlopen(url, timeout=20).read().decode(errors="replace")
              except Exception as e:  # noqa: BLE001
                  out("metrics", url=url, error=repr(e)[:200]); continue
              grep = os.environ.get("KVQ_METRICS_GREP", "")
              if grep:  # raw mode: print matching sample lines as-is (histograms included)
                  rx = re.compile(grep)
                  out("metrics_raw", url=url, lines=[l for l in body.splitlines() if rx.search(l) and not l.startswith("#")][:400])
                  continue
              agg = {}
              for line in body.splitlines():
                  m = want.match(line.strip())
                  if m:
                      key = m.group(1) + (m.group(3) or "")
                      agg[key] = agg.get(key, 0.0) + float(m.group(4))
              out("metrics", url=url, values=agg)


      def convo(salt):
          """A growing multi-turn conversation: KVQ_CONVO_TURNS_A turns on target A (each turn appends the
          reply and a short new question, as agent traffic does), then the next turn on target B. Under
          write_through_selective a prefix reaches L2/L3 once its nodes are hit twice, which growing
          turns do; B's turn then measures the cross-replica restore. Recall checks KV correctness."""
          tokens = int(os.environ.get("KVQ_LONG_TOKENS", "189000"))
          doc, code = long_doc(tokens, salt)
          a, b = TARGETS[0], TARGETS[-1]
          msgs = [{"role": "user", "content": f"[session {salt}]\n{doc}\n\nRead the log above. Reply with just 'ready'."}]
          res = {"seed": salt, "turns_on_a": [], "target_a": a, "target_b": b}
          for t in range(int(os.environ.get("KVQ_CONVO_TURNS_A", "3"))):
              ttft, _, text, u = chat(a, msgs, int(os.environ.get("KVQ_CONVO_A_MAX_TOKENS", "256")), thinking=False)
              res["turns_on_a"].append({"ttft_s": round(ttft or 0, 2), "prompt": (u or {}).get("prompt_tokens"),
                                        "cached": ((u or {}).get("prompt_tokens_details") or {}).get("cached_tokens")})
              msgs = msgs + [{"role": "assistant", "content": text or "ready"},
                             {"role": "user", "content": f"Noted {t}. Reply with just 'ok'."}]
          time.sleep(float(os.environ.get("KVQ_TURN_GAP_S", "0")))
          msgs[-1] = {"role": "user", "content": "What is the vault access code? Reply with the code only."}
          ttft, tot, text, u = chat(b, msgs, int(os.environ.get("KVQ_TURN2_MAX_TOKENS", "512")), thinking=False)
          res.update(b_ttft_s=round(ttft or tot, 2), b_prompt=(u or {}).get("prompt_tokens"),
                     b_cached=((u or {}).get("prompt_tokens_details") or {}).get("cached_tokens"),
                     recalled=code in ((text or "") + "".join(LAST_REASONING)), code=code)
          out("convo", **res)


      def main():
          for t in TESTS:
              t = t.strip()
              try:
                  if t == "hold":  # log-path check: print, then stay up so `docker ps`/logs can see it
                      out("hold", targets=TARGETS, tests=TESTS); time.sleep(int(os.environ.get("KVQ_HOLD_S", "600")))
                  elif t == "health": health()
                  elif t == "convo":
                      base = int(os.environ.get("KVQ_LONG_SEED", "7"))
                      for i in range(int(os.environ.get("KVQ_LONG_REPEAT", "1"))):
                          convo(base + i)
                  elif t == "gsm8k": gsm8k()
                  elif t == "metrics": metrics()
                  elif t == "longturn":
                      base = int(os.environ.get("KVQ_LONG_SEED", "7"))
                      for i in range(int(os.environ.get("KVQ_LONG_REPEAT", "1"))):
                          longturn(salt=base + i)
                  elif t == "cold": longturn("cold", salt=random.randint(10**6, 10**7))
              except SystemExit:
                  raise
              except Exception as e:  # noqa: BLE001
                  out("error", test=t, error=repr(e)[:500])


      if __name__ == "__main__":
          try:
              main()
          finally:
              print("KVQ_DONE", flush=True)

  kvq_shared_kv_patch_py_0410425f:
    content: |
      # Start-up patch: in-CVM shared KV host tier (cvm-compose-files PR #304, recipe
      # docker/sglang-glm53-v0520-shared-kv/shared-kv.diff) ported onto the production GLM-5.3 image v6
      # (docker.io/nearaidev/sglang@sha256:9c6ddd4319c4ab00e351d8650459e68b8830e36ffcc029d67fa5e19d0ac3ed17,
      # fork fc91d24 + sglang-glm53-hicache + admission-reserve v10 + sglang-glm53-hicache-w4afp8).
      # Replicas in one CVM share an L3 HiCacheFile store on a tmpfs directory they all mount.
      #  1) startup_ram_budget: SGLANG_HICACHE_RAM_BUDGET may run with the file backend; it reserves the
      #     store's remaining growth (SGLANG_HICACHE_SHARED_STORE_BUDGET minus bytes already in the store).
      #  2) lru_file_evictor: under a store cap, non-owner MLA ranks (TP rank > 0) write and bound their
      #     own rank-sharded sidecars (mamba state) at SGLANG_HICACHE_FILE_BACKEND_SIDECAR_MAX_FRACTION
      #     (default 0.25) of the cap instead of refusing every write. Port addition: a non-owner rank
      #     never adopts a file it only read (shared KV / indexer pages), so it can never evict one.
      #  3) unified_tree_core + unified_radix_cache: compressed DSA keeps 256-token tree pages but moves
      #     64-token transfer pages; the storage hash chain runs at the transfer page, storage hits are
      #     trimmed to the tree page, cache host-memory mode only. Port addition: refuse L3 storage on
      #     compressed DSA unless the Python tree core is selected (the Rust core ignores hash_page_size).
      #  4) hicache_storage (port addition): HiCacheFile keys MLA KV without a TP rank (replicated), and
      #     mamba sidecars inherited that key, so every TP rank read and wrote one shared mamba file
      #     although each rank holds a different head shard. Mamba sidecar keys now carry _tp<rank>_<size>.
      # Inert unless --hicache-storage-backend file is set. Each file is checked against the exact v6
      # sha256 before and the exact patched sha256 after; edits are exact-anchor replacements staged in
      # memory and written only when every file verifies (fail closed: any mismatch exits non-zero).
      import hashlib, os, pathlib, sys
      ROOT = pathlib.Path(os.environ.get("KVQ_SHARED_KV_PATCH_ROOT", "/sgl-workspace/sglang/python/sglang/srt"))
      TAG = "[shared-kv-patch]"
      # rel -> (v6 sha256, patched sha256)
      EXPECTED = {
          "mem_cache/startup_ram_budget.py": ("565ecfa113f46c5f1b7cfdf8e6799d3604eb1d86aae80505dcfbc7252ef79c5c",
              "d9f92e59e3ea5b75a573e97f7250b03eeba2f168754ceb2e87ade8a59fad281a"),
          "mem_cache/storage/file/lru_file_evictor.py": ("9e590e144c1169d463102e9aa147432cf5fa9108f1f8936de1184903c79a1330",
              "606894fcea4a5570180fc603d55c6dfbd8da6c1fc2c5358868057036e9ff1c05"),
          "mem_cache/unified_cache/unified_tree_core.py": ("0bbb0bb1a9581dc543dc4cc40cfe0b6f888e3b124c4739eac9635b86b176c168",
              "d9992a542941f6cf03af9459ef32e15d546f06a05ddd7ac2c58cd9317a285a50"),
          "mem_cache/unified_radix_cache.py": ("98f175f529614ebb33618a27c54248105eff3bf80c1365ffd3716bd346add278",
              "88263caaca4967d542a9f9e20af7230114d5c8ddcb5dfcd2d9c9cec1fee42c2d"),
          "managers/cache_controller.py": ("ffb53c980497d0a94f4ffea7c54efa86b3e97077a08d8b8a3282ccbf2531c779",
              "5a7c6a25d39de57be74ad094ff38e72de29c8b7a1629ba19892e77196dbbed60"),
          "mem_cache/hicache_storage.py": ("40d892d038557bbce41f3b35369c8a1bf2feeed56b907f709492f7e0f113d313",
              "7a370995a68a6fcabc96a840563deea077d4fd1a222881d6126c00090116fffc"),
      }
      staged = {}
      def sha(text):
          return hashlib.sha256(text.encode("utf-8")).hexdigest()
      def read(rel):
          # Bytes, not read_text(): no locale decoding and no newline translation.
          return (ROOT / rel).read_bytes().decode("utf-8")
      def load(rel):
          if rel not in staged:
              staged[rel] = read(rel)
          return staged[rel]
      def sub(rel, old, new, label):
          s = load(rel)
          if new in s:
              print(f"{TAG} {label}: already applied", flush=True); return
          n = s.count(old)
          if n != 1:
              sys.exit(f"{TAG} {label}: expected 1 anchor, found {n}")
          staged[rel] = s.replace(old, new); print(f"{TAG} {label}: staged", flush=True)

      # --- 1) startup_ram_budget.py (shared-kv.diff, verbatim) ---
      R = "mem_cache/startup_ram_budget.py"
      sub(R, '''ENV = "SGLANG_HICACHE_RAM_BUDGET"
      RESERVE_BYTES''', '''ENV = "SGLANG_HICACHE_RAM_BUDGET"
      STORE_ENV = "SGLANG_HICACHE_SHARED_STORE_BUDGET"
      RESERVE_BYTES''', "ram budget STORE_ENV")
      sub(R, '''    return re.sub(r"\\\\([0-7]{3})", lambda m: chr(int(m[1], 8)), value)


      def cgroup_headrooms(''', '''    return re.sub(r"\\\\([0-7]{3})", lambda m: chr(int(m[1], 8)), value)


      def shared_store_growth_reserve(backend: str) -> tuple[int, int, int]:
          """(store_budget, bytes_in_store, reserve) for an in-CVM shared `file` store.

          Replicas in one CVM share the store directory; each replica's LRU evictor must be capped
          (SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE) so that together they stay within the store budget.
          """
          if backend != "file":
              raise ValueError("RAM budget supports only the in-CVM `file` storage backend")
          raw = os.environ.get(STORE_ENV)
          store_dir = os.environ.get("SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR")
          cap_raw = os.environ.get("SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE")
          if not raw or not store_dir or not cap_raw:
              raise ValueError(
                  f"{ENV} with a storage backend needs {STORE_ENV}, "
                  "SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR and SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE"
              )
          unit, amount = parse_budget(raw)
          if unit == "%":
              raise ValueError(f"{STORE_ENV} must be GB or GiB, not a percentage")
          budget = int(amount * (1024**3 if unit == "GiB" else 10**9))
          from sglang.srt.mem_cache.storage.file.lru_file_evictor import _parse_size_to_bytes

          cap = _parse_size_to_bytes(cap_raw)
          if cap <= 0 or cap > budget:
              raise ValueError(
                  "SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE must be a size the file backend accepts "
                  f"(e.g. 200Gi or 200G) and at most {STORE_ENV}"
              )
          used = 0
          if os.path.isdir(store_dir):
              with os.scandir(store_dir) as entries:
                  for entry in entries:
                      if entry.is_file(follow_symlinks=False):
                          used += entry.stat(follow_symlinks=False).st_size
          return budget, used, max(0, budget - used)


      def cgroup_headrooms(''', "ram budget shared_store_growth_reserve")
      sub(R, '''        if get_memory().hicache_storage_backend is not None:
                  raise ValueError("RAM budget currently supports in-CVM host RAM only")
              record["available_bytes"] = available_ram_bytes()
      ''', '''        backend = get_memory().hicache_storage_backend
              store_reserve = 0
              if backend is not None:
                  store_budget, store_used, store_reserve = shared_store_growth_reserve(backend)
                  logger.info(
                      "HiCache shared store reserve: budget_bytes=%d used_bytes=%d reserved_bytes=%d",
                      store_budget,
                      store_used,
                      store_reserve,
                  )
              record["available_bytes"] = max(0, available_ram_bytes() - store_reserve)
      ''', "ram budget reserves store growth")

      # --- 2) lru_file_evictor.py (shared-kv.diff verbatim + non-owner touch fix) ---
      E = "mem_cache/storage/file/lru_file_evictor.py"
      sub(E, '''        self._eviction_enabled = self._eviction_configured and self._is_storage_owner
              if self._eviction_configured and not self._is_storage_owner:
                  logger.info(
                      f"HiCacheFile rank {self._tp_rank} (MLA): eviction handled by rank 0; "
                      f"this rank skips LRU bookkeeping and will not create new files."
                  )
      ''', '''        # Every rank bounds what it writes. Non-owner MLA ranks write only rank-sharded sidecars
              # (e.g. mamba state); they track and evict only their own files, never scan shared ones.
              self._eviction_enabled = self._eviction_configured
              if self._eviction_configured and not self._is_storage_owner:
                  fraction = float(os.environ.get("SGLANG_HICACHE_FILE_BACKEND_SIDECAR_MAX_FRACTION", "0.25"))
                  if not 0.0 < fraction <= 1.0:
                      raise ValueError("SGLANG_HICACHE_FILE_BACKEND_SIDECAR_MAX_FRACTION must be in (0, 1]")
                  if self.max_size_bytes > 0:
                      self.max_size_bytes = int(self.max_size_bytes * fraction)
                  logger.info(
                      f"HiCacheFile rank {self._tp_rank} (MLA): shared files are evicted by rank 0; "
                      f"this rank bounds only its own sidecar files, cap={self.max_size_bytes} B."
                  )
      ''', "evictor non-owner bounds own sidecars")
      sub(E, '''        self._scan_existing_files()
              with self._lock:
                  if self.max_size_bytes > 0 and self._total_bytes > self.max_size_bytes:''',
      '''        if self._is_storage_owner:
                  self._scan_existing_files()
              with self._lock:
                  if self.max_size_bytes > 0 and self._total_bytes > self.max_size_bytes:''', "evictor owner-only scan")
      sub(E, '''            return True  # unbounded storage: nothing to enforce
              if not self._is_storage_owner:
                  logger.warning(
                      f"HiCacheFile rank {self._tp_rank} is not the MLA storage owner; "
                      f"not caching new key {key} because file eviction is enabled."
                  )
                  return False
              if self.max_size_bytes > 0 and value_bytes > self.max_size_bytes:''',
      '''            return True  # unbounded storage: nothing to enforce
              if self.max_size_bytes > 0 and value_bytes > self.max_size_bytes:''', "evictor non-owner may reserve")
      sub(E, '''            if suffixed_key in self._lru:
                      self._lru.move_to_end(suffixed_key, last=True)
                      return
              # Untracked file: stat without holding the lock.''',
      '''            if suffixed_key in self._lru:
                      self._lru.move_to_end(suffixed_key, last=True)
                      return
