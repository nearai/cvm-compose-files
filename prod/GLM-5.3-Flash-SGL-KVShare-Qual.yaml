    configs:
      - source: kvq_probe_py_40b671c4
        target: /etc/kvq/probe.py
        mode: 0444
    environment:
      <<: *kvq-env
    restart: "no"
    labels:
      com.datadoghq.ad.logs: '[{"source":"kvq-probe","service":"kvq-probe","tags":["deployment:glm53-flash-sgl-kvshare-qual","env:${ENV}","host:${CVM_HOST}"]}]'

