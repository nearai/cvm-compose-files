      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.ppcie: "true"
      nearai.otel.config_variant: "vllm0320-lora3p-w4a8-dep4-c8192-dspark3-mr64-engram-hbm"

  model-vllm-dsv41-r1-dp0:
    <<: *dsv41-engine-common
    container_name: model-vllm-dsv41-r1-dp0
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    command: >
