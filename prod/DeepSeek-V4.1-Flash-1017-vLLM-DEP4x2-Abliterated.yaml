      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-dsv41-abliterated"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated"
      nearai.otel.deployment: "dsv41-flash-1017-vllm-dep4x2-abliterated"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
