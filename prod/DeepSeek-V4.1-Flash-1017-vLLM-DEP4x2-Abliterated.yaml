      - VLLM_BACKEND_URLS=http://model-vllm-dsv41-r1-dp0:8000,http://model-vllm-dsv41-r1-dp1:8000,http://model-vllm-dsv41-r1-dp2:8000,http://model-vllm-dsv41-r1-dp3:8000,http://model-vllm-dsv41-r2-dp0:8000,http://model-vllm-dsv41-r2-dp1:8000,http://model-vllm-dsv41-r2-dp2:8000,http://model-vllm-dsv41-r2-dp3:8000
      # Keep append-only conversations on the rank that already holds their prefix cache.
      - VLLM_BACKEND_CONVERSATION_AFFINITY=1
      - VLLM_PROXY_MAX_REQUEST_SIZE=104857600
      - VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS=3
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
