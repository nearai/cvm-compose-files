  model-sg-glm53-w4afp8-tp2-r3:
    <<: *sg-glm53-flash-candidate
    container_name: model-sg-glm53-w4afp8-tp2-r3
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      # Local snapshot path; nothing is fetched at engine start.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OPENBLAS_L2_SIZE=2097152
      - NCCL_DEBUG=WARN
      # A/B (both arms): False, so peerkv is the only arm difference. Expandable segments put
      # allocations in CUDA VMM memory, which legacy cudaIpc (peerkv) cannot export.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      # Persist tilelang's DSA kernel JIT cache: it defaults to /root/.tilelang, outside
      # the kernel_cache volume, so every restart re-paid ~22-24 compiles at 8-9 s each
      # with the whole engine frozen (2026-09-12..16 capacity campaign).
      - TILELANG_CACHE_DIR=/root/.cache/tilelang
      # /health must not run a generation: at this pin health_generate submits a real
      # 1-token request that queues behind any in-flight long prefill, so the CVM
      # proxy's 3 s probe times out, the replica flaps unhealthy, and the conversation
      # affinity pin is skipped (full re-prefill on the other replica). nearai/infra#234.
      - SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION=0
      # Admission-reserve v10 (carried by this image): reserve up to 4096 tokens of each
      # 8192-token prefill chunk for waiting requests, sized on their uncached extend length,
      # bounded so the in-flight long prefill keeps >=25% of the chunk, and refunded when no
      # waiter used it. Pairs with --prefill-decode-interval 1 so admitted requests also decode.
      # Measured (2026-09-12..16 campaign): <=2K prompts p95 TTFT 19.6 s -> 0.6 s; cost ITL p90
      # 30 -> ~240 ms, median unchanged. The patch is inert with the reserve unset (rollback).
      # NEVER set SGLANG_ADMISSION_RESERVE_MIN_WAIT_S (wall-clock gate desyncs the TP ranks; v10
      # raises) or SGLANG_ADMISSION_RESERVE_MIN_ITERS (unmeasured in production).
      - SGLANG_CHUNKED_PREFILL_ADMISSION_RESERVE=4096
      - SGLANG_ADMISSION_RESERVE_MAX_FRACTION=0.75
      - SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE=1
      # v7 fleet: HiCache is OFF (no --enable-hierarchical-cache in the argv), so the HiCache variables below are
      # unread, exactly as gpu03 r3 runs. They stay so re-enabling is an argv-only change.
      # HiCache host tier: a fixed 325 GiB per replica across its two TP ranks, 1,300 GiB for
      # the four replicas (the lab arm's DRAM total per 8 GPUs; ~5.87M tokens per replica). A
      # percentage would resolve against MemAvailable at each start, so the replicas started
      # later would get less; startup fails if it exceeds available RAM minus 10 GiB.
      - SGLANG_HICACHE_RAM_BUDGET=${GLM53_HICACHE_RAM_BUDGET:-325GiB}
      # CUDA-owned host memory (cudaMallocHost). Must stay 1 on TEE hosts: 0 selects
      # cudaHostRegister, which fails with CUDA error 801 under HCC/PPCIe.
      - SGLANG_HICACHE_CUDA_HOST_MEMORY=${GLM53_HICACHE_CUDA_HOST_MEMORY:-1}
      - SGLANG_HICACHE_POOLED_TRANSFERS=1
      - SGLANG_HICACHE_STAGING_PAGES=64
      # DSA indexer query split. Each TP rank scores 1/TP of a prefill chunk's rows instead of
      # all of them, so the fp32 logits buffer -- sized new_tokens x total_context -- shrinks
      # by TP (halves at TP2). gpu02's long-tier r1 crashed on 2026-09-25 without it:
      # deep_gemm.fp8_mqa_logits asked for 11.96 GiB with 11.88 GiB free at ~392K context
      # (dsa_indexer_kpool.py:919). This is a MITIGATION, not the fix: it divides the buffer
      # by TP and does not bound it. The real fix is calling _should_chunk_mqa_logits
      # (defined, unused, at dsa_indexer_kpool.py:862) and chunking against free memory.
      - SGLANG_DSA_INDEXER_QSPLIT=1
      # Opt-in observability (docker/sglang-glm53-hicache-w4afp8 v6; older images ignore it).
      # TP rank 0 only, off the serving path. The ghost prefix cache hashes each finished
      # request's pages into keyed digests (a 1/16 sample; tokens never leave the engine)
      # on a background thread and exports sglang:ghost_*. Every engine in this CVM shares the
      # key on the in-memory ghost volume and sends its digests to glm53-ghost-aggregator,
      # without ever blocking: if the aggregator is down the sends are dropped and counted.
      # The KV tier metrics export sglang:kv_tier_* (VRAM/DRAM evictions, load-backs, tier sizes).
      - SGLANG_GHOST_CACHE=1
      - SGLANG_GHOST_CACHE_SAMPLE=16
      - SGLANG_GHOST_CACHE_KEY_FILE=/ghost/key
      - SGLANG_GHOST_CACHE_SOCKET=/ghost/aggregator.sock
      - SGLANG_GHOST_CACHE_REPLICA=r3
      - SGLANG_KV_TIER_METRICS=1
      # v7 (opt-in in the image): the preprocess pool (SGLANG_PREPROCESS_WORKERS=0 is the old single-thread path)
      # and the tool-schema caps (0 = off). Profiling is off (no self-profile variables).
      - SGLANG_PREPROCESS_WORKERS=4
      - SGLANG_PREPROCESS_TIMEOUT_S=60
      - SGLANG_PREPROCESS_LOG_SLOW_S=5
      - SGLANG_TOOL_SCHEMA_MAX_DEPTH=32
      - SGLANG_TOOL_SCHEMA_MAX_NODES=25000
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4","5"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang","service":"sglang","tags":["model:z-ai/glm-5.3-flash","model_path:graphistry/GLM-5.3-Flash-W4AFP8","served_model:z-ai/glm-5.3-flash","precision:int4-weights-fp8-activations-fp8-kv","deployment:glm53-flash-sgl-tp2x4","config_variant:w4afp8-qsplit-hicacheoff-mamba380-fp8kv-memopt086-mr64-c8192-admission-reserve-v10-pdi2-h200-tp2-ep2-eagle-fixed-4-1-5-strict-budget8192-obs-v1-v7-expfalse-v1","request_logging:disabled","engine_image:fa730e6e62b2","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000","instance:3"]}]'
