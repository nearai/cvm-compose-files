      nearai.otel.served_model: "z-ai/glm-5.3-flash"
      nearai.otel.deployment: "glm53-flash-sgl-tp2x4"
      nearai.otel.config_variant: "w4afp8-qsplit-hicacheoff-mamba380-fp8kv-memopt086-mr64-c8192-admission-reserve-v10-pdi2-h200-tp2-ep2-eagle-fixed-4-1-5-strict-budget8192-obs-v1-v7-expfalse-v1"
