services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    # Every dedicated GLM-5.3 Flash TP4 file (not prod/small-models.yaml) also fetches the
    # W4AFP8 snapshot (~165 GiB; keep >=250 GiB free on the model-cache volume), so moving
    # a host between the FP8 and W4AFP8 files costs only the engine cold start:
    # compose-manager runs `up --remove-orphans`, so a new file's downloader cannot run
    # while engines it does not define are still serving.
    command:
      - |
        set -e
        echo "Downloading zai-org/GLM-5.3-Flash..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash --revision 84c6a6aa9497188e15a635ba793b0f95a79b1033
        echo "Downloading corrected GLM-5.3-Flash chat template..."
        uvx --from 'huggingface_hub[hf_xet]' hf download zai-org/GLM-5.3-Flash chat_template.jinja --revision 3f1971b7b5f7a528c9c4ef6212c8785298a8c24a
        echo "Downloading graphistry/GLM-5.3-Flash-W4AFP8..."
        uvx --from 'huggingface_hub[hf_xet]' hf download graphistry/GLM-5.3-Flash-W4AFP8 --revision 99f1fa70408c52b007d4fd69e02e5a522422e755
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:zai-org/GLM-5.3-Flash","served_model:z-ai/glm-5.3-flash","deployment:glm53-flash-sgl-tp2x4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  # Dormant during normal deploys. Target this service explicitly with the
  # maintenance profile when one model's shared HF cache must be evicted.
  # Inlined copy of the root cleanup-hf-model.yaml service: compose-manager's
  # compose/up fetches only the requested file, so cross-file `extends:` /
  # `include:` must not be used here (they fail at config load).
  hf-cleanup:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: hf-cleanup
    profiles: ["maintenance"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        : "$${MODEL_NAME:?MODEL_NAME env var is required (e.g. zai-org/GLM-5-FP8)}"

        echo "=== Disk usage ==="
        df -h /root/.cache 2>/dev/null || df -h /

        echo ""
        echo "=== Cached model weights ==="
        HUB=/root/.cache/huggingface/hub
        if ls "$$HUB"/models--* >/dev/null 2>&1; then
          du -sh "$$HUB"/models--* | sort -rh
        else
          echo "(none)"
        fi
        echo ""
        echo "Total HF cache: $$(du -sh $$HUB 2>/dev/null | cut -f1)"

        echo ""
        echo "=== Cleanup ==="
        SAFE=$$(printf '%s' "$$MODEL_NAME" | sed 's|/|--|g')
