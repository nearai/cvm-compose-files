# Empties one named volume, then exits | no engine
# Set VOLUME_NAME; run as its own project so other services are not orphans.
name: util-empty-volume

services:
  empty-volume:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: empty-volume
    restart: "no"
    network_mode: none
    # Root-level access to files that other users created, and nothing else.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        TARGET=/target
        if [ ! -d "$$TARGET" ]; then
          echo "$$TARGET is not a directory" >&2
          exit 1
        fi

        echo "=== Before ==="
        df -h "$$TARGET"
        echo "Top-level entries: $$(find "$$TARGET" -mindepth 1 -maxdepth 1 | wc -l)"

        echo ""
        echo "=== Emptying ==="
        find "$$TARGET" -mindepth 1 -delete

        echo ""
        echo "=== After ==="
        echo "Top-level entries: $$(find "$$TARGET" -mindepth 1 -maxdepth 1 | wc -l)"
        df -h "$$TARGET"
    volumes:
      - target:/target
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  target:
    external: true
    name: ${VOLUME_NAME:?set the volume to empty}
