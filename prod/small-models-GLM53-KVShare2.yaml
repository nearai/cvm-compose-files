        mode: 0444
    volumes:
      - kernel_cache:/root/.cache
      - hugginface_cache:/root/.cache/huggingface
      - ghost:/ghost
      - kvshare2:/kvshared
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OPENBLAS_L2_SIZE=2097152
      - NCCL_DEBUG=WARN
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      - TILELANG_CACHE_DIR=/root/.cache/tilelang
      - SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION=0
      # No admission reserve: it crashed gpu02's long r2 with a Prefill OOM on
      # 2026-09-18 (reserve v10 admitted a 292K-cached waiter beside an in-flight
      # chunked prefill at pool 0.99) and the qualified L2 arm runs without it.
      # Follow-up: canary the reserve on gpu13 once the pool-clamp guard is
      # confirmed for that admission path.
      - SGLANG_ENABLE_STRICT_MEM_CHECK_DURING_IDLE=1
      # HiCache host-memory budget per replica across its two TP ranks: a fixed 325 GiB (the
      # validated value; two replicas take 650 GiB). gpu13 had about 1038 GiB available to GLM
      # (Loki, 2026-10-05 21:30 UTC) at the previous 80% = 830 GiB, so 650 GiB leaves about
      # 380 GiB for the OS, page cache and other services. A fixed value does not resolve
      # against RAM at start, so the replica started second gets the same. Overridable per
      # deployment with GLM53_R1B_HICACHE_RAM_BUDGET (this replica only; r1a uses
      # GLM53_R1A_HICACHE_RAM_BUDGET); oversized values fail at startup by design.
      # Arm D: 250 GiB L2 + half of the 150 GiB shared L3 store = 325 GiB.
      - SGLANG_HICACHE_RAM_BUDGET=${GLM53_KVSHARE_RAM_BUDGET:-250GiB}
      # CUDA-owned host memory (cudaMallocHost). Must stay 1 on TEE hosts: 0
      # selects cudaHostRegister, which fails with CUDA error 801 under HCC/PPCIe.
      - SGLANG_HICACHE_CUDA_HOST_MEMORY=${GLM53_HICACHE_CUDA_HOST_MEMORY:-1}
      - SGLANG_HICACHE_POOLED_TRANSFERS=1
      - SGLANG_HICACHE_STAGING_PAGES=64
      # Split DSA indexer logits scratch across the TP2 ranks. This reduces each
      # rank's transient allocation but does not bound it at every context (at TP2 the
      # share is twice TP4's; see the rollout runbook's capacity check).
      - SGLANG_DSA_INDEXER_QSPLIT=1
      # Opt-in observability (docker/sglang-glm53-hicache-w4afp8 v6; older images ignore it).
      # TP rank 0 only, off the serving path. The ghost prefix cache hashes each finished
      # request's pages into keyed digests (a 1/16 sample; tokens never leave the engine)
      # on a background thread and exports sglang:ghost_*. Every engine in this CVM shares the
      # key on the in-memory ghost volume and sends its digests to glm53-ghost-aggregator,
      # without ever blocking: if the aggregator is down the sends are dropped and counted.
      # The KV tier metrics export sglang:kv_tier_* (VRAM/DRAM evictions, load-backs, tier sizes).
      - SGLANG_GHOST_CACHE=1
      - SGLANG_GHOST_CACHE_SAMPLE=16
      - SGLANG_GHOST_CACHE_KEY_FILE=/ghost/key
      - SGLANG_GHOST_CACHE_SOCKET=/ghost/aggregator.sock
      - SGLANG_GHOST_CACHE_REPLICA=r1b
      - SGLANG_KV_TIER_METRICS=1
      # Shared L3 tier (arm D). The store is the `kvshare2` tmpfs both GLM replicas mount; each
      # replica's evictor is capped at MAX_SIZE (non-owner TP ranks at 0.25x for their own mamba
      # shards), and 2 x 1.25 x 60Gi = 150Gi = the store budget.
      - SGLANG_HICACHE_FILE_BACKEND_STORAGE_DIR=/kvshared
      - SGLANG_HICACHE_FILE_BACKEND_ENABLE_METADATA_CACHE=1
      - SGLANG_HICACHE_FILE_BACKEND_MAX_SIZE=${GLM53_KVSHARE_FILE_MAX:-60Gi}
      - SGLANG_HICACHE_SHARED_STORE_BUDGET=${GLM53_KVSHARE_STORE_BUDGET:-150GiB}
      - SGLANG_KVSHARE_METRICS=1
      # One INFO line per storage restore (pages, MB, s, MB/s).
      - SGLANG_KVSHARE_LOG_READS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["6","7"]
              capabilities: [gpu]
