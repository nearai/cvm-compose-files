  # --- Ghost prefix cache aggregator: one per CVM, CPU only ---
  # Both GLM engines (r1a, r1b) in this CVM send their sampled page digests (keyed hashes, never tokens)
  # to /ghost/aggregator.sock on the in-memory ghost volume. This process keeps one LRU across
  # them and exports sglang:ghost_pool_* on :9464: per replica, the reuse one pooled cache
  # would have served and the reuse seen only on another replica. It runs the engines' image so
  # both move together. Serving never depends on it: the engines do not wait for it, and an
  # image without ghost-prefix-cache.diff makes only this container exit and restart.
  glm53-ghost-aggregator:
    image: docker.io/nearaidev/sglang@sha256:9c6ddd4319c4ab00e351d8650459e68b8830e36ffcc029d67fa5e19d0ac3ed17
    container_name: glm53-ghost-aggregator
    runtime: runc
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 1
    environment:
      - NVIDIA_VISIBLE_DEVICES=void
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: ["python3", "-m", "sglang.srt.observability.ghost_aggregator"]
    command: ["--socket", "/ghost/aggregator.sock", "--port", "9464", "--sample", "16", "--model-name", "z-ai/glm-5.3-flash"]
    volumes:
      - ghost:/ghost
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang-ghost-aggregator","service":"sglang-ghost-aggregator","tags":["model:z-ai/glm-5.3-flash","served_model:z-ai/glm-5.3-flash","deployment:glm53-flash-sgl-tp4","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
