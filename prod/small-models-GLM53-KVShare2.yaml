      }

  # ── TEMPORARY (gpu02 maintenance): single-endpoint registrar for Qwen3.8 ──
  qwen38_registrar_script:
    content: |
      #!/bin/sh
      PROXY_URL="https://completions.near.ai"
      TOKEN="$${MODEL_PROXY_TOKEN}"
      INFERENCE_TOKEN="$${PROXY_TOKEN}"

      if [ -z "$$TOKEN" ] || [ -z "$$INFERENCE_TOKEN" ]; then
        echo "ERROR: MODEL_PROXY_TOKEN and PROXY_TOKEN are required for model-proxy registration"
        exit 1
      fi

      HTTP_PORT="$${HTTP_PORT:-8000}"
      TLS_PORT="$${TLS_PORT_QWEN38:-8001}"
      ENDPOINT="$${HOST_IP}:$${HTTP_PORT}"
      MODEL="Qwen/Qwen3.8-27B"
      DOMAIN="qwen3-8-27b.completions.near.ai"
      MAX_RETRIES=3
      REGISTERED=false
      FAIL_COUNT=0

      register_endpoint() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/endpoint" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"endpoint\":\"$$1\",\"routing_port\":$$2}" || true
      }

      unregister_endpoint() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/unregister/endpoint" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"endpoint\":\"$$1\"}" || true
      }

      register_model() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/model" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$1\",\"domain\":\"$$2\"}" || true
      }

      cleanup() {
        echo "SIGTERM received, unregistering $$ENDPOINT"
        unregister_endpoint "$$ENDPOINT"
        exit 0
      }
      trap cleanup TERM INT

      check_chat() {
        status=$$(curl -sS --connect-timeout 10 --max-time 45 -o /dev/null -w "%{http_code}" \
          -X POST "http://$$1/v1/chat/completions" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$2\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}")
        curl_status=$$?

        if [ "$$curl_status" -ne 0 ]; then
          case "$$curl_status" in
            52|56)
              echo "Health probe hit connection-level backpressure (curl $$curl_status); treating as alive but saturated"
              return 0
              ;;
          esac
          echo "Health probe curl failed with status $$curl_status"
          return 1
        fi

        case "$$status" in
          2*) return 0 ;;
          503)
            echo "Backend returned 503; treating as alive but saturated"
            return 0
            ;;
          *)
            echo "Backend returned HTTP $$status"
            return 1
            ;;
        esac
      }

      check_tls_route() {
        tls_status=$$(curl -skS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" \
          --resolve "$$DOMAIN:$$TLS_PORT:$${HOST_IP}" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          "https://$$DOMAIN:$$TLS_PORT/v1/models")
        case "$$tls_status" in
          2*) return 0 ;;
          *)
            echo "TLS routing-port check failed (https :$$TLS_PORT -> HTTP $$tls_status)"
            return 1
            ;;
        esac
      }

      READY_URL="http://$${HOST_IP}:$${HTTP_PORT}/v1/models"
      echo "Waiting for Qwen3.8 replica to be ready (probing $$READY_URL)..."
      ready_attempts=0
      until curl --connect-timeout 5 --max-time 10 -sf \
        -H "Authorization: Bearer $$INFERENCE_TOKEN" \
        "$$READY_URL" > /dev/null 2>&1; do
        ready_attempts=$$((ready_attempts + 1))
        if [ "$$ready_attempts" -ge 30 ]; then
          echo "WARN: replica not reachable after $$ready_attempts attempts; entering the guarded registration loop"
          break
        fi
        echo "Replica not ready yet (attempt $$ready_attempts/30), retrying in 30s..."
        sleep 30
      done

      while true; do
        date +%s > /tmp/registrar_alive
        if check_chat "$$ENDPOINT" "$$MODEL" && check_tls_route; then
          FAIL_COUNT=0
          register_endpoint "$$ENDPOINT" "$$TLS_PORT"
          if [ "$$REGISTERED" = false ]; then
            echo "Registered $$ENDPOINT (routing port $$TLS_PORT)"
          fi
          REGISTERED=true
        else
          FAIL_COUNT=$$((FAIL_COUNT + 1))
          echo "Health check failed for $$ENDPOINT (fail count: $$FAIL_COUNT)"
          if [ "$$REGISTERED" = true ] && [ "$$FAIL_COUNT" -ge "$$MAX_RETRIES" ]; then
            unregister_endpoint "$$ENDPOINT"
            REGISTERED=false
          fi
        fi

        register_model "$$MODEL" "$$DOMAIN"
        date +%s > /tmp/registrar_alive
        sleep 60
      done
