# DeepSeek-V4.1-Flash-1017 + abliterated LoRA: ONE vLLM DEP8 replica on one 8x H200 TDX+PPCIe CVM (gpu02).
# Generated by scripts/prepare_dsv41_lora_dep8.py (do not hand-edit). Design, evidence and open gates:
# docs/dsv41-lora-dep4x2-design.md; CVM bring-up and the DEP8-vs-2xDEP4 A/B: tee-bench #16.
#
# STAGING ONLY, NOT LISTED. Register only the staging inferenceUrl
# (https://<sub>.completions-stg.near.ai) in cloud-stg-api; never PATCH prod cloud-api. Note that
# any active PATCH to cloud-stg-api fires validate_model_staging -> promote_model_prod; the
# promote's zone guard refuses a completions-stg URL, but the chain still auto-merges infra-tests
# PRs, so coordinate with Henry before that PATCH.
#
# Layout: eight `vllm serve` processes, one per GPU (DP8 attention + EP8 experts, TP1, external DP
# load balancing), Engram tables in HBM. In the gpu02 CVM A/B (10-28) this beat 2x DEP4 on
# throughput (+15-23% at rate x8) and TTFT. Two proxies, one per model id, both over all eight
# ranks; each refuses the other id (VLLM_PROXY_STRICT_REQUEST_MODEL=1).
# TDX+PPCIe requirements, all found on the gpu02 dev CVM (10-27):
#   - VLLM_NEAR_DISABLE_UVA=1 (image patch 04): the GPU reads stale pinned host memory, so vLLM's
#     UVA input buffers corrupt decode (NaN logits, garbage text).
#   - Host network and all GPUs visible per rank: in per-container namespaces NCCL ran over TCP sockets.
#   - Humming compiled with nvcc and cached on a volume: its nvrtc helper opens a CUDA context per
#     kernel, which queues for hours under CC.
# Engine argv = tee-bench exp 50 best stack (W4A8 Humming, 8K prefill chunk, DSpark 3, 64 running)
# plus the wo_b LoRA of exp 51 arm l9 (UnderTides/DeepSeek-V4.1-Flash-1017-heretic-lora rev 196c06e3).
#
x-logging-conf: &logging-conf
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"
    labels: "com.datadoghq.ad.logs,com.docker.compose.service"

x-nvidia: &nvidia
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    nofile:
      soft: 65535
      hard: 65535

x-vllm-proxy-common: &vllm-proxy-common
  image: nearaidev/vllm-proxy-rs@sha256:4937ad68d86dcc79871bd52341f2030a71e49bcafdf69d82ca287171aeb43c7b
  user: root
  privileged: true
  <<: *nvidia
  extra_hosts:
    - "compose-manager:host-gateway"
    - "model-vllm-dsv41-dp0:host-gateway"
    - "model-vllm-dsv41-dp1:host-gateway"
    - "model-vllm-dsv41-dp2:host-gateway"
    - "model-vllm-dsv41-dp3:host-gateway"
    - "model-vllm-dsv41-dp4:host-gateway"
    - "model-vllm-dsv41-dp5:host-gateway"
    - "model-vllm-dsv41-dp6:host-gateway"
    - "model-vllm-dsv41-dp7:host-gateway"
  volumes:
    - /var/run/dstack.sock:/var/run/dstack.sock
    - certs:/etc/letsencrypt:ro
  restart: unless-stopped
  logging: *logging-conf

x-dsv41-engine-common: &dsv41-engine-common
  <<: *nvidia
  init: true
  image: docker.io/nearaidev/vllm@sha256:5eaa0d4637080c10958b6cd8a371ae2ebb749b7a1e19c85bcb1abb89ee2540e4
  shm_size: 64g
  # One network namespace for all ranks: in per-container bridge namespaces NCCL treats each rank
  # as its own host and runs every collective over TCP sockets instead of NVLink.
  network_mode: host
  volumes:
    - huggingface_cache:/root/.cache/huggingface
    - dsv41_kernel_cache:/root/.cache/vllm
    - humming_cache:/root/.cache/humming
  # Every rank sees all GPUs (NCCL P2P needs its peers) and picks its own with CUDA_VISIBLE_DEVICES.
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: unless-stopped
  # Under CC, killing a rank mid-kernel can leave its GPU unusable until the VM is rebuilt.
  stop_grace_period: 10m
  logging: *logging-conf

services:
  model-downloader:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    container_name: model-downloader
    restart: "no"
    entrypoint: ["sh", "-c"]
    # ~475 GiB for the base checkpoint (incl. 186 GiB of Engram tables) plus a 4 MB adapter.
    command:
      - |
        set -e
        echo "Downloading deepseek-ai/DeepSeek-V4.1-Flash-1017..."
        uvx --from 'huggingface_hub[hf_xet]' hf download deepseek-ai/DeepSeek-V4.1-Flash-1017 --revision 1bae0e1088993b9b82de08f59de5be5a34e42170
        echo "Downloading UnderTides/DeepSeek-V4.1-Flash-1017-heretic-lora..."
        uvx --from 'huggingface_hub[hf_xet]' hf download UnderTides/DeepSeek-V4.1-Flash-1017-heretic-lora --revision 196c06e3c2aad43e9688d16fa993b4333f69358a
        echo "Download complete."
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:multi","deployment:dsv41-flash-1017-vllm-dep8-abliterated","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0320-lora3p-cc2-w4a8-dep8-c8192-dspark3-mr64-engram-hbm"]}]'

  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx
    depends_on:
      - proxy-dsv41
      - proxy-dsv41-abliterated
    command: /bin/sh -c 'cert=/etc/letsencrypt/live/completions.near.ai/fullchain.pem; last=$$(stat -L -c %Y "$$cert" 2>/dev/null); while :; do sleep 60; cur=$$(stat -L -c %Y "$$cert" 2>/dev/null); if [ -n "$$cur" ] && [ "$$cur" != "$$last" ]; then last=$$cur; echo "$$cert changed, reloading nginx"; nginx -s reload; fi; done & while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:multi","deployment:dsv41-flash-1017-vllm-dep8-abliterated","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0320-lora3p-cc2-w4a8-dep8-c8192-dspark3-mr64-engram-hbm"]}]'

  model-proxy-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: model-proxy-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1800s
    environment:
      - HOST_IP=${HOST_IP}
      - TLS_PORT_DSV41=${TLS_PORT_DSV41:-8001}
      - TLS_PORT_DSV41_ABLITERATED=${TLS_PORT_DSV41_ABLITERATED:-8003}
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:multi","deployment:dsv41-flash-1017-vllm-dep8-abliterated","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0320-lora3p-cc2-w4a8-dep8-c8192-dspark3-mr64-engram-hbm"]}]'

  proxy-dsv41:
    <<: *vllm-proxy-common
    container_name: proxy-dsv41
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=deepseek-ai/DeepSeek-V4.1-Flash-1017
      # Refuse the other model id: this proxy attests, bills and access-controls only deepseek-ai/DeepSeek-V4.1-Flash-1017.
      - VLLM_PROXY_STRICT_REQUEST_MODEL=1
      - OHTTP_ENABLED=true
      - TOKEN=${PROXY_TOKEN}
      - VLLM_BACKEND_URLS=http://model-vllm-dsv41-dp0:9100,http://model-vllm-dsv41-dp1:9101,http://model-vllm-dsv41-dp2:9102,http://model-vllm-dsv41-dp3:9103,http://model-vllm-dsv41-dp4:9104,http://model-vllm-dsv41-dp5:9105,http://model-vllm-dsv41-dp6:9106,http://model-vllm-dsv41-dp7:9107
      # Keep append-only conversations on the rank that already holds their prefix cache.
      - VLLM_BACKEND_CONVERSATION_AFFINITY=1
      - VLLM_PROXY_MAX_REQUEST_SIZE=104857600
      - VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS=3
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017","port:8000","deployment:dsv41-flash-1017-vllm-dep8-abliterated","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0320-lora3p-cc2-w4a8-dep8-c8192-dspark3-mr64-engram-hbm"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-dsv41"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
      nearai.otel.deployment: "dsv41-flash-1017-vllm-dep8-abliterated"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.ppcie: "true"
      nearai.otel.config_variant: "vllm0320-lora3p-cc2-w4a8-dep8-c8192-dspark3-mr64-engram-hbm"

  proxy-dsv41-abliterated:
    <<: *vllm-proxy-common
    container_name: proxy-dsv41-abliterated
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated
      # Refuse the other model id: this proxy attests, bills and access-controls only deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated.
      - VLLM_PROXY_STRICT_REQUEST_MODEL=1
      - OHTTP_ENABLED=true
      - TOKEN=${PROXY_TOKEN}
      - VLLM_BACKEND_URLS=http://model-vllm-dsv41-dp0:9100,http://model-vllm-dsv41-dp1:9101,http://model-vllm-dsv41-dp2:9102,http://model-vllm-dsv41-dp3:9103,http://model-vllm-dsv41-dp4:9104,http://model-vllm-dsv41-dp5:9105,http://model-vllm-dsv41-dp6:9106,http://model-vllm-dsv41-dp7:9107
      # Keep append-only conversations on the rank that already holds their prefix cache.
      - VLLM_BACKEND_CONVERSATION_AFFINITY=1
      - VLLM_PROXY_MAX_REQUEST_SIZE=104857600
      - VLLM_PROXY_POOL_IDLE_TIMEOUT_SECS=3
      - TLS_CERT_PATH=/etc/letsencrypt/live/completions.near.ai/fullchain.pem
      - USE_NV_ATTESTATION_SDK=true
      - WEB_CONTEXT_SEARCH_URL=${WEB_CONTEXT_SEARCH_URL}
      - WEB_CONTEXT_SEARCH_API_KEY=${WEB_CONTEXT_SEARCH_API_KEY}
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm-proxy","service":"vllm-proxy","tags":["model:deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated","port:8002","deployment:dsv41-flash-1017-vllm-dep8-abliterated","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","ppcie:true","config_variant:vllm0320-lora3p-cc2-w4a8-dep8-c8192-dspark3-mr64-engram-hbm"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "inference-proxy"
      nearai.otel.service: "vllm-proxy"
      nearai.otel.source: "vllm-proxy"
      nearai.otel.container_name: "proxy-dsv41-abliterated"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated"
      nearai.otel.deployment: "dsv41-flash-1017-vllm-dep8-abliterated"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.ppcie: "true"
      nearai.otel.config_variant: "vllm0320-lora3p-cc2-w4a8-dep8-c8192-dspark3-mr64-engram-hbm"

  model-vllm-dsv41-dp0:
    <<: *dsv41-engine-common
    container_name: model-vllm-dsv41-dp0
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
      - PYTHONUNBUFFERED=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NCCL_DEBUG=WARN
      # W4A8: MXFP4 expert weights with FP8 activations on Hopper FP8 tensor cores (exp 50).
      - 'VLLM_HUMMING_INPUT_QUANT_CONFIG={"dtype":"float8e4m3","quant_mode":"dynamic_token"}'
      # Image patch 04: copy per-step inputs to the GPU; under TDX+PPCIe the GPU reads stale host memory.
      - VLLM_NEAR_DISABLE_UVA=1
      # nvcc on the CPU instead of humming's nvrtc helper (a CUDA context per kernel, which queues under CC).
      - HUMMING_COMPILER=nvcc
      - HUMMING_CACHE_DIR=/root/.cache/humming/dp0
      - HUMMING_MAX_PARALLEL_BUILD_WORKERS=8
    command: >
      /root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4.1-Flash-1017/snapshots/1bae0e1088993b9b82de08f59de5be5a34e42170
      --served-model-name deepseek-ai/DeepSeek-V4.1-Flash-1017
      --trust-remote-code
      --tensor-parallel-size 1
      --data-parallel-size 8
      --data-parallel-rank 0
      --enable-expert-parallel
      --data-parallel-address 127.0.0.1
      --data-parallel-rpc-port 13345
      --max-model-len 1048576
      --max-num-batched-tokens 8192
      --max-num-seqs 64
      --gpu-memory-utilization 0.90
      --enable-prompt-tokens-details
      --tokenizer-mode deepseek_v41
      --reasoning-parser deepseek_v41
      --tool-call-parser deepseek_v41
      --enable-auto-tool-choice
      --speculative-config '{"method":"dspark","num_speculative_tokens":3}'
      --enable-lora --max-loras 1 --max-cpu-loras 1 --max-lora-rank 8 --lora-target-modules wo_b
      --lora-modules '{"name":"deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated","path":"/root/.cache/huggingface/hub/models--UnderTides--DeepSeek-V4.1-Flash-1017-heretic-lora/snapshots/196c06e3c2aad43e9688d16fa993b4333f69358a","base_model_name":"deepseek-ai/DeepSeek-V4.1-Flash-1017"}'
      --engram-config '{"cpu_offload":false,"embedding_across_dp":true}'
