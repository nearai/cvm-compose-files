        prometheus/self:
          config:
            scrape_configs:
              - job_name: otelcol-app
                scrape_interval: 30s
                static_configs:
                  - targets: ['localhost:8888']

      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 512
          spike_limit_mib: 128

        resource:
          attributes:
            - key: host.name
              value: $${env:DD_HOSTNAME}
              action: upsert
            - key: cvm.name
              value: $${env:CVM_NAME}
              action: upsert
            - key: host.machine
              value: $${env:CVM_HOST}
              action: insert
            - key: deployment.environment
              value: $${env:ENV}
              action: upsert
            - key: service.namespace
              value: near-ai
              action: insert

        transform/docker_metadata:
          error_mode: ignore
          log_statements:
            - context: log
              statements:
                - set(attributes["service.name"], attributes["attrs"]["com.docker.compose.service"]) where attributes["attrs"] != nil and attributes["attrs"]["com.docker.compose.service"] != nil
                - set(attributes["service.name"], ParseJSON(attributes["attrs"]["com.datadoghq.ad.logs"])[0]["service"]) where attributes["attrs"] != nil and attributes["attrs"]["com.datadoghq.ad.logs"] != nil
                - set(attributes["log.source"], ParseJSON(attributes["attrs"]["com.datadoghq.ad.logs"])[0]["source"]) where attributes["attrs"] != nil and attributes["attrs"]["com.datadoghq.ad.logs"] != nil
                - set(attributes["service"], attributes["service.name"]) where attributes["attrs"] != nil and attributes["attrs"]["com.datadoghq.ad.logs"] != nil and attributes["service.name"] != nil
                - set(attributes["source"], attributes["log.source"]) where attributes["attrs"] != nil and attributes["attrs"]["com.datadoghq.ad.logs"] != nil and attributes["log.source"] != nil
                - set(attributes["container.name"], attributes["attrs"]["com.docker.compose.service"]) where attributes["attrs"] != nil and attributes["attrs"]["com.docker.compose.service"] != nil

        filter/app_logs:
          error_mode: ignore
          logs:
            log_record:
              - 'attributes["model"] == nil and attributes["deployment"] == nil'
              - 'attributes["service.name"] == "compose-manager"'
              - 'attributes["service.name"] == "compose-manager-launcher"'
              - 'attributes["service.name"] == "otelcol-management"'
              - 'attributes["service.name"] == "otelcol-contrib"'
              - 'attributes["service.name"] == "datadog-agent"'

        groupbyattrs/docker_service:
          keys:
            - service.name
            - service
            - container.name
            - log.source
            - source
            - log.iostream
            - model
            - model_path
            - served_model
            - precision
            - deployment
            - env
            - host
            - ip
            - port
            - instance
            - replica

        batch:
          send_batch_size: 1024
          send_batch_max_size: 2048
          timeout: 5s

      exporters:
        otlphttp/gateway:
          endpoint: https://telemetry.infra.near.ai
          headers:
            Authorization: "Bearer $${env:MONITORING_INGEST_TOKEN}"
          sending_queue:
            num_consumers: 1
            queue_size: 128
            storage: file_storage

      extensions:
        file_storage:
          directory: /var/lib/otelcol-contrib/storage
          create_directory: true

      service:
        extensions: [file_storage]
        pipelines:
          logs/app:
            receivers: [filelog/docker_containers]
            processors: [memory_limiter, resource, transform/docker_metadata, filter/app_logs, groupbyattrs/docker_service, batch]
            exporters: [otlphttp/gateway]
          metrics/app:
            receivers: [prometheus/apps]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
          metrics/otlp:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
          metrics/self:
            receivers: [prometheus/self]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlphttp/gateway]
        telemetry:
          metrics:
            address: localhost:8888
          logs:
            level: info

  registrar_script:
    content: |
      #!/bin/sh
      PROXY_URL="https://completions.near.ai"
      TOKEN="$${MODEL_PROXY_TOKEN}"
      INFERENCE_TOKEN="$${PROXY_TOKEN}"

      if [ -z "$$TOKEN" ] || [ -z "$$INFERENCE_TOKEN" ]; then
        echo "ERROR: MODEL_PROXY_TOKEN and PROXY_TOKEN are required for model-proxy registration"
        exit 1
      fi

      TLS_PORT=8444

      # Track registration state per port
      for port in 8002 8003 8004 8005 8006 8007 8008 8009; do
        eval "REG_$$port=false"
        eval "FAIL_COUNT_$$port=0"
      done

      register_endpoint() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/endpoint" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"endpoint\":\"$$1\",\"routing_port\":$$TLS_PORT}" || true
      }

      unregister_endpoint() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/unregister/endpoint" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"endpoint\":\"$$1\"}" || true
      }

      register_model() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/model" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$1\",\"domain\":\"$$2\"}" || true
      }

      register_alias() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/alias" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"from_domain\":\"$$1\",\"to_domain\":\"$$2\"}" || true
      }

      cleanup() {
        echo "SIGTERM received, unregistering all endpoints"
        for port in 8002 8003 8004 8005 8006 8007 8008 8009; do
          unregister_endpoint "$${HOST_IP}:$$port"
        done
        exit 0
      }
      trap cleanup TERM INT

      # Health check via the host-published port (HOST_IP:<port>), NOT the
      # compose service DNS name. A service-name probe fails with curl (6)
      # "Could not resolve host" if the registrar loses compose-network DNS
      # (e.g. after a backend container is recreated independently), wedging
      # every port's health check so all 8 models silently drop to 0 backends.
      # HOST_IP:<port> is the endpoint model-proxy actually routes to and never
      # depends on inter-container DNS. See cvm-compose-files#57. ($1 = host:port)
      check_chat() {
        curl -sf --max-time 45 -X POST "http://$$1/v1/chat/completions" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$2\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}" \
          > /dev/null 2>&1
      }

      # A bounded vLLM queue can return 503 or close a connection under load.
      # Keep the DS4.1 endpoint registered in either case, as gpu02 does.
      check_chat_saturated() {
        endpoint=$$1
        model=$$2
        host_header=$${3:-}
        set --
        if [ -n "$$host_header" ]; then
          set -- -H "Host: $$host_header"
        fi
        status=$$(curl -sS --connect-timeout 10 --max-time 45 -o /dev/null -w "%{http_code}" \
          -X POST "http://$$endpoint/v1/chat/completions" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          -H "Content-Type: application/json" "$$@" \
          -d "{\"model\":\"$$model\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}")
        curl_status=$$?
        if [ "$$curl_status" -ne 0 ]; then
          case "$$curl_status" in
            52|56)
              echo "DS4.1 chat probe for $$model via $$endpoint hit connection-level backpressure (curl $$curl_status); treating as alive but saturated"
              return 0
              ;;
            *)
              echo "DS4.1 chat probe for $$model via $$endpoint failed (curl exit $$curl_status)"
              return 1
              ;;
          esac
        fi
        case "$$status" in
          2*) return 0 ;;
          503)
            echo "DS4.1 chat probe for $$model via $$endpoint returned HTTP 503; treating as alive but saturated"
            return 0
            ;;
          *)
            echo "DS4.1 chat probe for $$model via $$endpoint failed (HTTP $$status)"
            return 1
            ;;
        esac
      }

      check_tls_route() {
        domain=$$1
        tls_status=$$(curl -skS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" \
          --resolve "$$domain:$$TLS_PORT:$${HOST_IP}" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          "https://$$domain:$$TLS_PORT/v1/models")
        case "$$tls_status" in
          2*) return 0 ;;
          *)
            echo "TLS routing-port check failed for $$domain (https :$$TLS_PORT -> HTTP $$tls_status)"
            return 1
            ;;
        esac
      }

      # For non-chat backends (embeddings, reranker, flux, whisper, privacy-filter)
      check_models() {
        curl -sf --max-time 10 \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          "http://$$1/v1/models" > /dev/null 2>&1
      }

      check_port() {
        case $$1 in
          8002) check_models "$${HOST_IP}:8002" ;;
          8003) check_chat "$${HOST_IP}:8003" "Qwen/Qwen3-VL-30B-A3B-Instruct" ;;
          8004) check_models "$${HOST_IP}:8004" ;;
          8005) check_models "$${HOST_IP}:8005" ;;
          8006) check_models "$${HOST_IP}:8006" ;;
          8007) check_models "$${HOST_IP}:8007" ;;
          8008) check_chat "$${HOST_IP}:8008" "Qwen/Qwen3.6-35B-A3B-FP8" ;;
          8009) check_chat_saturated "$${HOST_IP}:8009" "deepseek-ai/DeepSeek-V4.1-Flash-1017" \
                  && check_chat_saturated "$${HOST_IP}:8009" "deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated" "deepseek-v4-1-flash-abliterated.completions.near.ai" \
                  && check_tls_route "deepseek-v4-1-flash.completions.near.ai" \
                  && check_tls_route "deepseek-v4-1-flash-abliterated.completions.near.ai" ;;
        esac
      }

      # Probe the host-published nginx port via HOST_IP instead of the
      # "nginx" compose DNS name. A stale/abandoned docker service-name
      # resolution (e.g. after nginx is recreated) otherwise wedges this
      # readiness gate forever and silently drops every model to 0 backends.
      # Bounded + loud so a persistent probe failure falls through to the
      # registration loop (which health-checks each backend directly) instead
      # of hanging here forever. See cvm-compose-files#57.
      READY_URL="http://$${HOST_IP}:8002/v1/models"
      echo "Waiting for first model to be ready (probing $$READY_URL)..."
      ready_attempts=0
      until curl --connect-timeout 5 --max-time 10 -sf \
        -H "Authorization: Bearer $$INFERENCE_TOKEN" \
        "$$READY_URL" > /dev/null 2>&1; do
        ready_attempts=$$((ready_attempts + 1))
        if [ "$$ready_attempts" -ge 30 ]; then
          echo "WARN: first model not reachable at $$READY_URL after $$ready_attempts attempts (~20m); entering registration loop anyway (each backend is health-checked directly before registering)"
          break
        fi
        echo "First model not ready yet (attempt $$ready_attempts/30), retrying in 30s..."
        sleep 30
      done
      echo "First model ready, starting registration loop"

      while true; do
        for port in 8002 8003 8004 8005 8006 8007 8008 8009; do
          # Liveness marker for the container healthcheck (see service def);
          # refreshed each port so a slow-but-progressing serial loop (these
          # probes can take minutes in aggregate) is not falsely marked
          # unhealthy. See cvm-compose-files#57.
          date +%s > /tmp/registrar_alive
          eval "was_reg=\$$REG_$$port"
          eval "fails=\$$FAIL_COUNT_$$port"
          if check_port $$port; then
            eval "FAIL_COUNT_$$port=0"
            register_endpoint "$${HOST_IP}:$$port" "$$TLS_PORT"
            if [ "$$was_reg" = false ]; then
              echo "Registered $${HOST_IP}:$$port"
            fi
            eval "REG_$$port=true"
          else
            fails=$$((fails + 1))
            eval "FAIL_COUNT_$$port=$$fails"
            echo "Health check failed for $${HOST_IP}:$$port (fail count: $$fails)"
            eval "REG_$$port=false"
          fi
        done

        # Model-to-domain mappings
        register_model "black-forest-labs/FLUX.2-klein-4B" "flux2-klein.completions.near.ai"
        register_model "Qwen/Qwen3-VL-30B-A3B-Instruct" "qwen3-vl-30b.completions.near.ai"
        register_model "Qwen/Qwen3-Embedding-0.6B" "qwen3-embedding.completions.near.ai"
        register_model "Qwen/Qwen3-Reranker-0.6B" "qwen3-reranker.completions.near.ai"
        register_model "openai/whisper-large-v3" "whisper-large-v3.completions.near.ai"
        register_model "openai/privacy-filter" "privacy-filter.completions.near.ai"
        register_model "Qwen/Qwen3.6-35B-A3B-FP8" "qwen3-6-35b.completions.near.ai"
        # Legacy hostname for the retired Qwen3-30B. model-proxy keeps aliases in memory only and loses them
        # when every replica restarts, so re-assert it each pass, like the model mappings above.
        register_alias "qwen3-30b.completions.near.ai" "qwen3-6-35b.completions.near.ai"
        # model-proxy discovers both ids on HOST_IP:8009 from nginx's gated stub.
        # Both domains route to :8444, where nginx selects the proxy by SNI.
        # These mappings are identical to gpu02's to avoid last-writer-wins drift.
        register_model "deepseek-ai/DeepSeek-V4.1-Flash-1017" "deepseek-v4-1-flash.completions.near.ai"
        register_model "deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated" "deepseek-v4-1-flash-abliterated.completions.near.ai"
        # Refresh liveness after the register_model calls, before the long sleep.
        date +%s > /tmp/registrar_alive
        sleep 60
      done
  nginx_conf:
    content: |
      log_format json_combined escape=json
        '{'  '"time":"$$time_iso8601"'
        ',"request_id":"$$http_x_request_id"'
        ',"org_id":"$$http_x_org_id"'
        ',"workspace_id":"$$http_x_workspace_id"'
        ',"http_host":"$$host"'
        ',"method":"$$request_method"'
        ',"uri":"$$uri"'
        ',"status":$$status'
        ',"request_length":$$request_length'
        ',"bytes_sent":$$bytes_sent'
        ',"request_time":$$request_time'
        ',"upstream_addr":"$$upstream_addr"'
        '}';

      access_log /var/log/nginx/access.log json_combined;

      # Common proxy settings
      proxy_http_version 1.1;
      proxy_set_header Host $$host;
      proxy_set_header X-Real-IP $$remote_addr;
      proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $$scheme;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      client_max_body_size 100m;
      client_body_buffer_size 1m;
      server_names_hash_bucket_size 128;

      # :8002 - FLUX (single proxy, 4 backends)
      server {
          listen 8002;
          location / { proxy_pass http://proxy-flux2-klein-4b:8000; }
      }

      # :8003 - Qwen3-VL
      server {
          listen 8003;
          location / { proxy_pass http://proxy-qwen3vl-30b-a3b:8000; }
      }

      # :8004 - Embeddings
      server {
          listen 8004;
          location / { proxy_pass http://proxy-qwen3-embedding-0.6b:8000; }
      }

      # :8005 - Reranker
      server {
          listen 8005;
          location / { proxy_pass http://proxy-qwen3-reranker-0.6b:8000; }
      }

      # :8006 - Whisper
      server {
          listen 8006;
          location / { proxy_pass http://proxy-whisper-large-v3:8000; }
      }

      # :8007 - Privacy-filter
      server {
          listen 8007;
          location / { proxy_pass http://proxy-privacy-filter:8000; }
      }

      # :8008 - Qwen3.6-35B-A3B-FP8
      server {
          listen 8008;
          location / { proxy_pass http://proxy-qwen36-35b-a3b:8000; }
      }

      # :8009 carries both DS4.1 ids because all host ports 8000-8010 and 8444
      # are already taken. Discovery is gated on the real base serving path.
      # A bare return runs in rewrite BEFORE auth_request's access phase; try_files
      # runs in precontent AFTER access, then the named location can return the stub.
      server {
          listen 8009;
          location = /v1/models {
              auth_request /_dsv41_health;
              try_files /__synthetic_models__ @dsv41_models;
          }
          location @dsv41_models {
              default_type application/json;
              return 200 '{"object":"list","data":[{"id":"deepseek-ai/DeepSeek-V4.1-Flash-1017","object":"model","owned_by":"vllm","max_model_len":1048576},{"id":"deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated","object":"model","owned_by":"vllm","max_model_len":1048576}]}';
          }
          location = /_dsv41_health {
              internal;
              proxy_pass http://proxy-dsv41:8000/v1/models;
              proxy_pass_request_body off;
              proxy_set_header Content-Length "";
              proxy_connect_timeout 2s;
              proxy_read_timeout 4s;
          }
          location / { proxy_pass http://proxy-dsv41:8000; }
      }

      server {
          listen 8009;
          server_name deepseek-v4-1-flash-abliterated.completions.near.ai;
          location / { proxy_pass http://proxy-dsv41-abliterated:8000; }
      }

      # ── TLS server blocks (port 443 = host 8444) ──

      ssl_certificate /etc/letsencrypt/live/completions.near.ai/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/completions.near.ai/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;

      # Each model accepts both its canonical SNI and the rotation-SNI form
      # `<canonical>-i<N>.completions.near.ai` used by cloud-api's discovery
      # (model-proxy's parse_indexed_sni), in both the prod `completions.near.ai`
      # and staging `completions-stg.near.ai` zones. Without the staging
      # server_names, `*.completions-stg.near.ai` SNIs fall through to the
      # default server (lexically first model) and return the wrong model's
      # signing pubkey, breaking E2EE on staging — see nearai/infra#143
      # (rotation-SNI variant) and nearai/infra#164 (staging-SNI variant),
      # plus the L4-SNI-rewrite analysis in nearai/model-proxy#30.

      server {
          listen 443 ssl http2;
          server_name flux2-klein.completions.near.ai
                      flux2-klein.completions-stg.near.ai
                      ~^flux2-klein-i\d+\.completions(-stg)?\.near\.ai$$;
          # Non-streaming endpoint; keep fleet-wide HTTP/2 connection handling uniform.
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-flux2-klein-4b:8000; }
      }

      server {
          listen 443 ssl http2;
          server_name qwen3-vl-30b.completions.near.ai
                      qwen3-vl-30b.completions-stg.near.ai
                      ~^qwen3-vl-30b-i\d+\.completions(-stg)?\.near\.ai$$;
          # cloud-api multiplexes unrelated H2 requests over one bucket-pinned connection.
          # Raise the request budget so nginx does not close it at 1000 requests and kill
          # every in-flight SSE stream. Keep it alive across idle gaps so a reconnect does
          # not open a new TCP through model-proxy's L4 LB, land on a different backend,
          # and make the signature lookup return 404.
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-qwen3vl-30b-a3b:8000; }
      }

      server {
          listen 443 ssl http2;
          server_name qwen3-embedding.completions.near.ai
                      qwen3-embedding.completions-stg.near.ai
                      ~^qwen3-embedding-i\d+\.completions(-stg)?\.near\.ai$$;
          # Non-streaming endpoint; keep fleet-wide HTTP/2 connection handling uniform.
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-qwen3-embedding-0.6b:8000; }
      }

      server {
          listen 443 ssl http2;
          server_name qwen3-reranker.completions.near.ai
                      qwen3-reranker.completions-stg.near.ai
                      ~^qwen3-reranker-i\d+\.completions(-stg)?\.near\.ai$$;
          # Non-streaming endpoint; keep fleet-wide HTTP/2 connection handling uniform.
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-qwen3-reranker-0.6b:8000; }
      }

      server {
          listen 443 ssl http2;
          server_name whisper-large-v3.completions.near.ai
                      whisper-large-v3.completions-stg.near.ai
                      ~^whisper-large-v3-i\d+\.completions(-stg)?\.near\.ai$$;
          # Non-streaming endpoint; keep fleet-wide HTTP/2 connection handling uniform.
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-whisper-large-v3:8000; }
      }

      server {
          listen 443 ssl http2;
          server_name privacy-filter.completions.near.ai
                      privacy-filter.completions-stg.near.ai
                      ~^privacy-filter-i\d+\.completions(-stg)?\.near\.ai$$;
          # Non-streaming endpoint; keep fleet-wide HTTP/2 connection handling uniform.
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-privacy-filter:8000; }
      }

      # qwen3-30b.* is a model-proxy domain alias for qwen3-6-35b (retired Qwen3-30B; the
      # registrar re-asserts it). model-proxy passes the ClientHello through unchanged, so the
      # legacy SNI must match here or it falls through to the default (flux2-klein) vhost.
      server {
          listen 443 ssl http2;
          server_name qwen3-6-35b.completions.near.ai
                      qwen3-6-35b.completions-stg.near.ai
                      qwen3-30b.completions.near.ai
                      qwen3-30b.completions-stg.near.ai
                      ~^qwen3-6-35b-i\d+\.completions(-stg)?\.near\.ai$$
                      ~^qwen3-30b-i\d+\.completions(-stg)?\.near\.ai$$;
          # cloud-api multiplexes unrelated H2 requests over one bucket-pinned connection.
          # Raise the request budget so nginx does not close it at 1000 requests and kill
          # every in-flight SSE stream. Keep it alive across idle gaps so a reconnect does
          # not open a new TCP through model-proxy's L4 LB, land on a different backend,
          # and make the signature lookup return 404.
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-qwen36-35b-a3b:8000; }
      }

      server {
          listen 443 ssl http2;
          # These base names cannot match the abliterated -iN or -b<hex12> names.
          # gpu13.hosts.near.ai is no longer used by the OpenRouter lane and falls through.
          server_name deepseek-v4-1-flash.completions.near.ai
                      deepseek-v4-1-flash.completions-stg.near.ai
                      ~^deepseek-v4-1-flash-i\d+\.completions(-stg)?\.near\.ai$$
                      "~^deepseek-v4-1-flash-b[0-9a-f]{12}\.completions(-stg)?\.near\.ai$$";
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location = /v1/models { default_type application/json; return 200 '{"object":"list","data":[{"id":"deepseek-ai/DeepSeek-V4.1-Flash-1017","object":"model","owned_by":"vllm","max_model_len":1048576}]}'; }
          location / { proxy_pass http://proxy-dsv41:8000; }
      }

      server {
          listen 443 ssl http2;
          server_name deepseek-v4-1-flash-abliterated.completions.near.ai
                      deepseek-v4-1-flash-abliterated.completions-stg.near.ai
                      ~^deepseek-v4-1-flash-abliterated-i\d+\.completions(-stg)?\.near\.ai$$
                      "~^deepseek-v4-1-flash-abliterated-b[0-9a-f]{12}\.completions(-stg)?\.near\.ai$$";
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location = /v1/models { default_type application/json; return 200 '{"object":"list","data":[{"id":"deepseek-ai/DeepSeek-V4.1-Flash-1017-abliterated","object":"model","owned_by":"vllm","max_model_len":1048576}]}'; }
          location / { proxy_pass http://proxy-dsv41-abliterated:8000; }
      }

  # ── TEMPORARY (gpu02 maintenance): dedicated ingress for Qwen3.8 on :8000/:8001 ──
  nginx_qwen38_conf:
    content: |
      log_format json_combined escape=json
        '{'  '"time":"$$time_iso8601"'
        ',"request_id":"$$http_x_request_id"'
        ',"org_id":"$$http_x_org_id"'
        ',"workspace_id":"$$http_x_workspace_id"'
        ',"http_host":"$$host"'
        ',"method":"$$request_method"'
        ',"uri":"$$uri"'
        ',"status":$$status'
        ',"request_length":$$request_length'
        ',"bytes_sent":$$bytes_sent'
        ',"request_time":$$request_time'
        ',"upstream_addr":"$$upstream_addr"'
        '}';

      access_log /var/log/nginx/access.log json_combined;

      proxy_http_version 1.1;
      proxy_set_header Host $$host;
      proxy_set_header X-Real-IP $$remote_addr;
      proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $$scheme;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      client_max_body_size 100m;
      client_body_buffer_size 1m;

      # :8000 - Qwen3.8-27B (registrar probe + health)
      server {
          listen 8000;
          location / { proxy_pass http://proxy-qwen38-27b:8000; }
      }

      # :8000 with Host qwen3-8-27b-abliterated - the abliterated registrar's health
      # checks. The block above stays the default server, so model-proxy's probe
      # (no Host match) keeps reaching the base proxy, whose engine list also
      # carries the adapter. The upstream resolves per request, so this nginx
      # starts and reloads without the abliterated proxy.
      server {
          listen 8000;
          server_name qwen3-8-27b-abliterated.completions.near.ai;
          location / {
              resolver 127.0.0.11 valid=5s ipv6=off;
              set $$proxy_qwen38_abliterated http://proxy-qwen38-27b-abliterated:8000;
              proxy_pass $$proxy_qwen38_abliterated;
          }
      }

      # The abliterated server names outgrow the default 64-byte bucket.
      server_names_hash_bucket_size 128;
      ssl_certificate /etc/letsencrypt/live/completions.near.ai/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/completions.near.ai/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;

      # :8001 - Qwen3.8-27B TLS routing port (registered with routing_port 8001).
      # Same SNI forms as the shared nginx: canonical, rotation-SNI (-i<N>) and
      # the staging zone.
      server {
          listen 8001 ssl http2;
          server_name qwen3-8-27b.completions.near.ai
                      qwen3-8-27b.completions-stg.near.ai
                      ~^qwen3-8-27b-i\d+\.completions(-stg)?\.near\.ai$$;
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / { proxy_pass http://proxy-qwen38-27b:8000; }
      }

      # :8001 - Qwen3.8-27B abliterated, selected by SNI on the base routing port:
      # model-proxy maps the adapter id (listed by the base probe) to HOST_IP:8001.
      server {
          listen 8001 ssl http2;
          server_name qwen3-8-27b-abliterated.completions.near.ai
                      qwen3-8-27b-abliterated.completions-stg.near.ai
                      ~^qwen3-8-27b-abliterated-i\d+\.completions(-stg)?\.near\.ai$$;
          keepalive_timeout 1h;
          keepalive_requests 1000000;
          location ^~ /metrics { return 404; }
          location ^~ /v1/metrics { return 404; }
          location / {
              resolver 127.0.0.11 valid=5s ipv6=off;
              set $$proxy_qwen38_abliterated http://proxy-qwen38-27b-abliterated:8000;
              proxy_pass $$proxy_qwen38_abliterated;
          }
      }

  # ── TEMPORARY (gpu02 maintenance): single-endpoint registrar for Qwen3.8 ──
  qwen38_registrar_script:
    content: |
      #!/bin/sh
      PROXY_URL="https://completions.near.ai"
      TOKEN="$${MODEL_PROXY_TOKEN}"
      INFERENCE_TOKEN="$${PROXY_TOKEN}"

      if [ -z "$$TOKEN" ] || [ -z "$$INFERENCE_TOKEN" ]; then
        echo "ERROR: MODEL_PROXY_TOKEN and PROXY_TOKEN are required for model-proxy registration"
        exit 1
      fi

      HTTP_PORT="$${HTTP_PORT:-8000}"
      TLS_PORT="$${TLS_PORT_QWEN38:-8001}"
      ENDPOINT="$${HOST_IP}:$${HTTP_PORT}"
      MODEL="Qwen/Qwen3.8-27B"
      DOMAIN="qwen3-8-27b.completions.near.ai"
      MAX_RETRIES=3
      REGISTERED=false
      FAIL_COUNT=0

      register_endpoint() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/endpoint" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"endpoint\":\"$$1\",\"routing_port\":$$2}" || true
      }

      unregister_endpoint() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/unregister/endpoint" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"endpoint\":\"$$1\"}" || true
      }

      register_model() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/model" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$1\",\"domain\":\"$$2\"}" || true
      }

      cleanup() {
        echo "SIGTERM received, unregistering $$ENDPOINT"
        unregister_endpoint "$$ENDPOINT"
        exit 0
      }
      trap cleanup TERM INT

      check_chat() {
        status=$$(curl -sS --connect-timeout 10 --max-time 45 -o /dev/null -w "%{http_code}" \
          -X POST "http://$$1/v1/chat/completions" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$2\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}")
        curl_status=$$?

        if [ "$$curl_status" -ne 0 ]; then
          case "$$curl_status" in
            52|56)
              echo "Health probe hit connection-level backpressure (curl $$curl_status); treating as alive but saturated"
              return 0
              ;;
            28)
              # A 1-token probe queues behind long prefills and can pass 45 s on a healthy
              # engine: on 2026-11-02 ~250K-token prompts withdrew both Qwen3.8 replicas
              # this way. /v1/models answers from the HTTP layer, so 2xx means busy, not
              # dead. Same rule as the GLM-5.3 registrars (#277).
              if curl -sf --connect-timeout 5 --max-time 10 \
                -H "Authorization: Bearer $$INFERENCE_TOKEN" \
                "http://$$1/v1/models" > /dev/null 2>&1; then
                echo "Health probe timed out but /v1/models is live; treating as alive but saturated"
                return 0
              fi
              echo "Health probe timed out and /v1/models is unreachable"
              return 1
              ;;
          esac
          echo "Health probe curl failed with status $$curl_status"
          return 1
        fi

        case "$$status" in
          2*) return 0 ;;
          503)
            echo "Backend returned 503; treating as alive but saturated"
            return 0
            ;;
          *)
            echo "Backend returned HTTP $$status"
            return 1
            ;;
        esac
      }

      check_tls_route() {
        tls_status=$$(curl -skS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" \
          --resolve "$$DOMAIN:$$TLS_PORT:$${HOST_IP}" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          "https://$$DOMAIN:$$TLS_PORT/v1/models")
        case "$$tls_status" in
          2*) return 0 ;;
          *)
            echo "TLS routing-port check failed (https :$$TLS_PORT -> HTTP $$tls_status)"
            return 1
            ;;
        esac
      }

      READY_URL="http://$${HOST_IP}:$${HTTP_PORT}/v1/models"
      echo "Waiting for Qwen3.8 replica to be ready (probing $$READY_URL)..."
      ready_attempts=0
      until curl --connect-timeout 5 --max-time 10 -sf \
        -H "Authorization: Bearer $$INFERENCE_TOKEN" \
        "$$READY_URL" > /dev/null 2>&1; do
        ready_attempts=$$((ready_attempts + 1))
        if [ "$$ready_attempts" -ge 30 ]; then
          echo "WARN: replica not reachable after $$ready_attempts attempts; entering the guarded registration loop"
          break
        fi
        echo "Replica not ready yet (attempt $$ready_attempts/30), retrying in 30s..."
        sleep 30
      done

      while true; do
        date +%s > /tmp/registrar_alive
        if check_chat "$$ENDPOINT" "$$MODEL" && check_tls_route; then
          FAIL_COUNT=0
          register_endpoint "$$ENDPOINT" "$$TLS_PORT"
          if [ "$$REGISTERED" = false ]; then
            echo "Registered $$ENDPOINT (routing port $$TLS_PORT)"
          fi
          REGISTERED=true
        else
          FAIL_COUNT=$$((FAIL_COUNT + 1))
          echo "Health check failed for $$ENDPOINT (fail count: $$FAIL_COUNT)"
          if [ "$$REGISTERED" = true ] && [ "$$FAIL_COUNT" -ge "$$MAX_RETRIES" ]; then
            unregister_endpoint "$$ENDPOINT"
            REGISTERED=false
          fi
        fi

        register_model "$$MODEL" "$$DOMAIN"
        date +%s > /tmp/registrar_alive
        sleep 60
      done

  qwen38_abliterated_registrar_script:
    content: |
      #!/bin/sh
      # Maps the adapter id to its domain; never registers or unregisters an endpoint.
      # model-proxy keys probes by ip:port, so /unregister/endpoint for HOST_IP:8000 would
      # drop base Qwen3.8 (and propagate to peers). Discovery already probes base's
      # HOST_IP:8000, whose /v1/models (the engine list) carries the adapter id, and routes
      # its domain to HOST_IP:8001, where nginx-qwen38 selects the abliterated proxy by SNI.
      PROXY_URL="https://completions.near.ai"
      TOKEN="$${MODEL_PROXY_TOKEN}"
      INFERENCE_TOKEN="$${PROXY_TOKEN}"

      if [ -z "$$TOKEN" ] || [ -z "$$INFERENCE_TOKEN" ]; then
        echo "ERROR: MODEL_PROXY_TOKEN and PROXY_TOKEN are required for model-proxy registration"
        exit 1
      fi

      HTTP_PORT="$${HTTP_PORT:-8000}"
      TLS_PORT="$${TLS_PORT_QWEN38:-8001}"
      BASE_PROBE="$${HOST_IP}:$${HTTP_PORT}"
      MODEL="Qwen/Qwen3.8-27B-abliterated"
      DOMAIN="qwen3-8-27b-abliterated.completions.near.ai"
      REGISTERED=false
      FAIL_COUNT=0

      register_model() {
        curl -sS --max-time 10 -X POST "$$PROXY_URL/register/model" \
          -H "Authorization: Bearer $$TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$1\",\"domain\":\"$$2\"}" || true
      }

      # Nothing to withdraw: /unregister/model is not propagated and peer sync restores
      # the mapping, so stopping proxy-qwen38-27b-abliterated is the off switch.
      cleanup() {
        echo "SIGTERM received; leaving model-proxy untouched (no endpoint is owned here)"
        exit 0
      }
      trap cleanup TERM INT

      check_chat() {
        status=$$(curl -sS --connect-timeout 10 --max-time 45 -o /dev/null -w "%{http_code}" \
          -X POST "http://$$BASE_PROBE/v1/chat/completions" \
          -H "Host: $$DOMAIN" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":1}")
        curl_status=$$?

        if [ "$$curl_status" -ne 0 ]; then
          case "$$curl_status" in
            52|56)
              echo "Health probe hit connection-level backpressure (curl $$curl_status); treating as alive but saturated"
              return 0
              ;;
          esac
          echo "Health probe curl failed with status $$curl_status"
          return 1
        fi

        case "$$status" in
          2*) return 0 ;;
          503)
            echo "Backend returned 503; treating as alive but saturated"
            return 0
            ;;
          *)
            echo "Backend returned HTTP $$status"
            return 1
            ;;
        esac
      }

      check_tls_route() {
        tls_status=$$(curl -skS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" \
          --resolve "$$DOMAIN:$$TLS_PORT:$${HOST_IP}" \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          "https://$$DOMAIN:$$TLS_PORT/v1/models")
        case "$$tls_status" in
          2*) return 0 ;;
          *)
            echo "TLS routing-port check failed (https :$$TLS_PORT -> HTTP $$tls_status)"
            return 1
            ;;
        esac
      }

      # The list model-proxy discovery reads: base's probe, no Host override.
      check_probe_lists_adapter() {
        if curl -sS --connect-timeout 10 --max-time 20 \
          -H "Authorization: Bearer $$INFERENCE_TOKEN" \
          "http://$$BASE_PROBE/v1/models" | grep -qF "\"$$MODEL\""; then
          return 0
        fi
        echo "Base probe http://$$BASE_PROBE/v1/models does not list $$MODEL"
        return 1
      }

      READY_URL="http://$${BASE_PROBE}/v1/models"
      echo "Waiting for Qwen3.8 abliterated route to be ready (probing $$READY_URL with Host $$DOMAIN)..."
      ready_attempts=0
      until curl --connect-timeout 5 --max-time 10 -sf \
        -H "Host: $$DOMAIN" \
        -H "Authorization: Bearer $$INFERENCE_TOKEN" \
        "$$READY_URL" > /dev/null 2>&1; do
        ready_attempts=$$((ready_attempts + 1))
        if [ "$$ready_attempts" -ge 30 ]; then
          echo "WARN: route not reachable after $$ready_attempts attempts; entering the guarded registration loop"
          break
        fi
        echo "Route not ready yet (attempt $$ready_attempts/30), retrying in 30s..."
        sleep 30
      done

      # The mapping is written only while the route answers, so it is never advertised
      # before the abliterated proxy serves on both ports.
      while true; do
        date +%s > /tmp/registrar_alive
        if check_chat && check_tls_route && check_probe_lists_adapter; then
          FAIL_COUNT=0
          register_model "$$MODEL" "$$DOMAIN"
          if [ "$$REGISTERED" = false ]; then
            echo "Registered $$MODEL -> $$DOMAIN (served by base probe $$BASE_PROBE, routing port $$TLS_PORT)"
          fi
          REGISTERED=true
        else
          FAIL_COUNT=$$((FAIL_COUNT + 1))
          echo "Health check failed for $$DOMAIN via $$BASE_PROBE (fail count: $$FAIL_COUNT)"
        fi
        date +%s > /tmp/registrar_alive
        sleep 60
      done
