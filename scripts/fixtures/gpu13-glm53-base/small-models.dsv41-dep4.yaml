  # Start them on gpu13 by name, with the SAGE_* values in the env:
  #   POST /compose/up {"tag":"v0.0.N","file":"prod/small-models.yaml","services":["sage-dstack","sage"],"env":{...}}
  # prod/sage-pull.yaml must have put the image in the VM's image store before: compose-manager has no registry
  # login, and this file never pulls the private image (pull_policy: never), so a missing image fails closed.
  #
  # Sage runs with SAGE_CONFIDENTIAL=required: it refuses to start unless the env, the TDX quote, the GPU CC state
  # (Protected PCIe on this board) and the weights all check out, ends TLS itself on 8443 with a key made in the CVM
  # (VM port 8010; the host maps 443 to 8010) and serves /v1/attestation/report.
  # Sage never gets the CVM's dstack socket: sage-dstack exposes only GET /Info and GET /GetQuote to it. Key
  # derivation and event calls (GetKey, EmitEvent, ...) are refused, since our own services use them.
  # Values come from SAGE_-prefixed variables our own env never sets. They are not marked required (${VAR:?}) so
  # that compose/logs, which takes no env, can still read this project's logs; Sage itself refuses to start
  # without them.
  sage-dstack:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: sage-dstack
    restart: unless-stopped
    network_mode: none
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - /var/run/sage-dstack:/sock
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/nginx.conf <<'EOF'
        user root;
        worker_processes 1;
        events { worker_connections 64; }
        http {
          access_log /dev/stdout;
          server {
            listen unix:/sock/dstack.sock;
            location = /Info {
              limit_except GET { deny all; }
              proxy_pass http://unix:/var/run/dstack.sock;
            }
            location = /GetQuote {
              limit_except GET { deny all; }
              proxy_pass http://unix:/var/run/dstack.sock;
            }
            location / {
              return 403;
            }
          }
        }
        EOF
        rm -rf /sock/dstack.sock
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "test", "-S", "/sock/dstack.sock"]
      interval: 5s
      timeout: 3s
      retries: 30

  sage:
    # Sage 2 (tag 20261109-rc16-2, model levanto-sage-2), reviewed before deploy like 1.4.
    image: levantolabs/sage2-hopper-pod@sha256:b5268f0a1bddf96895baf7b38f28cf814eaecc79d832d5660f4155584506009e
    container_name: sage
    pull_policy: never
    restart: unless-stopped
    depends_on:
      sage-dstack:
        condition: service_healthy
    # Only keys on Sage's confidential allowlist; the image's own profile sets everything else.
    environment:
      SAGE_CONFIDENTIAL: required
      HF_TOKEN: ${SAGE_HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${SAGE_HF_TOKEN}
      SERVING_HMAC_SECRET: ${SAGE_SERVING_HMAC_SECRET}
      SAGE_ACME_AWS_ACCESS_KEY_ID: ${SAGE_ACME_AWS_ACCESS_KEY_ID}
      SAGE_ACME_AWS_SECRET_ACCESS_KEY: ${SAGE_ACME_AWS_SECRET_ACCESS_KEY}
      SAGE_ACME_ROUTE53_ZONE_ID: ${SAGE_ACME_ROUTE53_ZONE_ID}
      # Sage ships its own log to Levanto's CloudWatch (write-only key for one log group).
      SAGE_LOG_AWS_ACCESS_KEY_ID: ${SAGE_LOG_AWS_ACCESS_KEY_ID}
      SAGE_LOG_AWS_SECRET_ACCESS_KEY: ${SAGE_LOG_AWS_SECRET_ACCESS_KEY}
      # Enables Sage's content-free /internal/diagnostics endpoint.
      SAGE_ADMIN_TOKEN: ${SAGE_ADMIN_TOKEN}
      # Web search key for Sage's grounding (Levanto's key). Empty or unset turns grounding off.
      BRAVE_API_KEY: ${SAGE_SEARCH_API_KEY}
      # Same GPU as device_ids below (exactly one GPU, as the image requires).
      NVIDIA_VISIBLE_DEVICES: GPU-9ec3a20b-6169-7fdc-a19a-6058228132c1
    volumes:
      - sage-data:/workspace
      - /var/run/sage-dstack/dstack.sock:/var/run/dstack.sock
    ports:
      # Host 8010 is QEMU-forwarded to VM 8010. TLS ends inside Sage.
      - "8010:8443"
    networks:
      - sage
    shm_size: 32gb
    ipc: private
    security_opt:
      - no-new-privileges:true
    mem_limit: 256g
    memswap_limit: 256g
    pids_limit: 8192
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # gpu13 index 0 (PCI 01:00.0); gpu13's small models moved to gpu23.
              device_ids: ["GPU-9ec3a20b-6169-7fdc-a19a-6058228132c1"]
              capabilities: [gpu]

  dcgm-sage:
    # GPU counters for Sage's GPU (memory, utilization, XIDs), pinned to the same UUID as sage. It reads the GPU
    # through NVML: no CUDA context, no GPU memory, nothing from Sage's container. It has no SAGE_* values, so it
    # can be started by name without sage or sage-dstack:
    #   POST /compose/up {"tag":"v0.0.N","file":"prod/small-models.yaml","services":["dcgm-sage","otelcol-contrib"],
    #                     "force_recreate":true,"env":{<gpu13's stored env>}}
    # otelcol-contrib must be in the same call, since only a recreate loads the dcgm-dcgm-sage scrape job.
    <<: *dcgm-common
    container_name: dcgm-sage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-9ec3a20b-6169-7fdc-a19a-6058228132c1"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"dcgm-exporter","service":"dcgm-exporter","tags":["model:levanto/sage","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "dcgm"
      nearai.otel.service: "dcgm-exporter"
      nearai.otel.source: "dcgm-exporter"
      nearai.otel.container_name: "dcgm-sage"
      nearai.otel.port: "9400"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "levanto/sage"
      nearai.otel.deployment: "small-models"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  otelcol-contrib:
    image: otel/opentelemetry-collector-contrib@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    container_name: otelcol-contrib
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0:0"
    mem_limit: "768m"
    environment:
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      - CVM_NAME=${CVM_NAME:-unknown}
      - CVM_HOST=${CVM_HOST:-unknown}
      - DD_HOSTNAME=${DD_HOSTNAME:-unknown}
      - ENV=${ENV:-unknown}
      - HOST_IP=${HOST_IP:-unknown}
    extra_hosts:
      - "model-vllm-dsv41-dp4:host-gateway"
      - "model-vllm-dsv41-dp5:host-gateway"
      - "model-vllm-dsv41-dp6:host-gateway"
      - "model-vllm-dsv41-dp7:host-gateway"
    expose:
      - "4317"
      - "4318"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol_app_storage:/var/lib/otelcol-contrib
    configs:
      - source: otelcol_app_config
        target: /etc/otelcol-contrib/config.yaml
        mode: 0444
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      com.datadoghq.ad.logs: '[{"source":"otelcol-contrib","service":"otelcol-contrib","tags":["deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

