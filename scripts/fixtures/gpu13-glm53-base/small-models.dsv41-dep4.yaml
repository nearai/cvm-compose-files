  # Served through nginx-qwen38 (gpu13 forwards only host ports 8000-8009 and 8444, all taken):
  # Host/SNI qwen3-8-27b-abliterated selects the abliterated proxy on :8000/:8001.
  # The registrar only maps the adapter id to its domain; it never registers or
  # unregisters an endpoint, so it cannot touch base Qwen3.8's HOST_IP:8000 probe.
  # No depends_on: an up of this service must never recreate nginx-qwen38.
  qwen38-abliterated-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: qwen38-abliterated-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    profiles: [register-abliterated]
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    environment:
      - HOST_IP=${HOST_IP}
      - HTTP_PORT=8000
      - TLS_PORT_QWEN38=8001
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${QWEN38_ABLITERATED_PROXY_TOKEN}
    configs:
      - source: qwen38_abliterated_registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:Qwen/Qwen3.8-27B-abliterated","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","config_variant:qwen38-lora-canary","lora:abliterated-r1"]}]'

