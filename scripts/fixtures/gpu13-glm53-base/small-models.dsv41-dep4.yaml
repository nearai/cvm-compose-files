  model-vllm-whisper-large-v3-tp1:
    <<: *vllm-common
    # New local tag, so compose cannot reuse the vllm-with-audio image already built on the host from the old base.
    image: vllm-with-audio-v0330
    build:
      context: .
      dockerfile_inline: |
        FROM vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        # vLLM v0.33.0 decodes audio with av, scipy, soundfile and soxr (its `audio` extra; mistral_common is
        # already in the image). None of them is in the image. openai-whisper, librosa and torchaudio are not
        # imported by v0.33. `pip install vllm[audio]` would also downgrade the image's nvidia-nccl-cu13
        # 2.31.2 to 2.30.7 while re-resolving vllm's own pins, so the four wheels go in alone, hash-pinned.
        RUN printf '%s\n' \
              'av==19.0.2 --hash=sha256:9c1da7aad0fa6c13b4a5c1e7985be0d13f8526a96284573acaf3d55ead6d3fe8' \
              'scipy==1.18.1 --hash=sha256:f55fa87b6c612ecd6b058f167c53231b1d14e412efe361d3d6e38b3631c73218' \
              'soundfile==0.14.0 --hash=sha256:1e38bac1853412871318e82a1ba69a8be677619b56025bbfcccdb41b6cafe82d' \
              'soxr==1.1.0 --hash=sha256:3b033078e86f3c4a658e5697fac8995764fad9e799563616b630136b613167f1' \
              > /tmp/audio-requirements.txt \
            && python3 -m pip install --no-cache-dir --no-deps --require-hashes -r /tmp/audio-requirements.txt \
            && rm /tmp/audio-requirements.txt \
            && python3 -c 'import av, scipy.signal, soundfile, soxr'
    container_name: model-vllm-whisper-large-v3-tp1
    # 0.20 (~28 GiB, ~24 GiB KV): at 0.06 the 4.2 GiB KV cache capped whisper at
    # 17 concurrent 30 s segments and preempted under sustained load. GPU 3 had
    # ~53 GiB unallocated, so this takes free memory from no other tenant.
    # Restart this service alone: a cold start alongside its GPU 3 neighbours
    # can profile negative KV memory and crash-loop until they finish loading.
    command: >
        openai/whisper-large-v3
        --revision 06f233fe06e710322aca913c1bc4249a0d71fce1
        --gpu-memory-utilization 0.20
    volumes:
      - hugginface_cache:/root/.cache/huggingface
      - vllm_cache:/root/.cache/vllm
    environment: *vllm-env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"vllm","service":"vllm","tags":["model:openai/whisper-large-v3","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8006"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "vllm"
      nearai.otel.service: "vllm"
      nearai.otel.source: "vllm"
      nearai.otel.container_name: "model-vllm-whisper-large-v3-tp1"
      nearai.otel.port: "8000"
