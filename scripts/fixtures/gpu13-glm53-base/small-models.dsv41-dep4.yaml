  proxy-qwen38-27b:
    <<: *vllm-proxy-common
    # inference-proxy 5faff1b (#329): strict request-model match and LoRA selector
    # refusal. The coloc engine serves the abliterated adapter too, so this proxy
    # must keep VLLM_PROXY_STRICT_REQUEST_MODEL on.
    # This image is inference-proxy 53d79441 (#337). It includes #336's opt-in size tiers below.
    image: nearaidev/vllm-proxy-rs@sha256:e2893ff46404d112bc39c9e77de6c20f6a889227f99a49f7190bff5b2063d441
    container_name: proxy-qwen38-27b
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
