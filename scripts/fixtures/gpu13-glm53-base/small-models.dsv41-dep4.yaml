  # qwen3_coder forced-tool grammar regression (sgl-project/sglang#27336). Runtime defaults
  # changed after v0.5.12, so the existing behavior is kept explicit below.
  # --enable-mixed-chunk is dropped. v0.5.16 turned it off under EAGLE ("Mixed chunked prefill is disabled
  # because of using eagle speculative decoding"), so it never ran here. v0.5.23 keeps it on with EAGLE, and
  # mixed chunk + extra_buffer on a hybrid GDN model is what returned empty answers on prefix hits for
  # Qwen3.8 (sglang#39342). Dropping the flag keeps today's behavior.
  # https://lmsysorg.mintlify.app/cookbook/autoregressive/Qwen/Qwen3.6
