      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.gpu_pair: "2"
      nearai.otel.config_variant: "qwen38-gpu2-coloc-only"

  # Production co-location trial: this GPU 2 engine, beside the production privacy filter (both moved
  # together from gpu23 GPU 0 in #390; Sage runs on gpu13 GPU 0; r2 was removed earlier), is the only private Qwen3.8
  # replica on this host; if the abort rule fires, compose/down of this engine takes it off this host entirely.
  model-sg-qwen38-27b-fp8-tp1-coloc:
    <<: *qwen3-8-27b-dedicated
    container_name: model-sg-qwen38-27b-fp8-tp1-coloc
    # No --enable-mixed-chunk: with extra_buffer it caches stale GDN state and prefix hits return empty answers (sglang#39342).
    # 2026-11-02 engine tuning: --attention-backend flashinfer -> fa3 and --max-mamba-cache-size 128 -> 96;
    # config_variant qwen38-gpu2-coloc-fa3-m96 (was qwen38-gpu13-gpu0-coloc-test). Mem 0.50, chunk 4096,
    # 32 running and --cuda-graph-max-bs 32 are unchanged. Measured on bare metal gpu31 (NOT under CC, NOT beside
    # the privacy filter), same image, this shape, tee-bench evidence/gpu31-exp55-qwen38-lora-mix r7:
    #   flashinfer/mamba 128: KV 343,654 tokens, 3.5% cache hit, TTFT(<64k) p50 121 s
    #   fa3 only:             15% hit, 40 s
    #   fa3 + mamba 96:       KV 418,822 tokens, 55% hit, 0.50 s
    # FB peak was 73.2-73.5 GiB in every cell, so FA3 added no memory over flashinfer there; on this shared GPU it
    # is still unmeasured: watch GPU 2 FB used against the 134 GiB abort rule in
    # docs/gpu13-gpu0-privacy-filter-qwen38-coloc-test.md. exp55 r8 probes (thinking-on split, tool calls, refusal,
    # CJK echo, 64-96 concurrent bursts: 0 errors, 0 empty) passed on the gpu32 shape, not on this one.
    # Effective concurrency: mamba slots cap admission at about 3 slots/request, so mamba 96 admits ~19 running
    # requests (gpu13 running p99 17, max 25); the rest queue. Exhaustion queues, it does not error.
    # Canary on gpu13 only after gpu32 holds. Roll back to the previous tag (flashinfer, mamba 128) on: GPU 2 FB used
    # > 134 GiB, engine restart or OOM, TTFT/ITL regression vs the pre-deploy baseline, queue growth, or
    # mamba_usage >= 0.95 sustained.
    # 2026-11-03: --enable-priority-scheduling --disable-priority-preemption, paired with the size tiers on both
    # Qwen3.8 proxies (inference-proxy #336); config_variant qwen38-gpu2-coloc-fa3-m96-prio. exp55 R10 basis.
    # A later --mamba-ssm-dtype bfloat16 is a one-line addition here.
    # 2026-11-11 move to the v0.5.23 secure image: --cuda-graph-max-bs is now --cuda-graph-max-bs-decode (same
    # meaning: febfb971 already treated the old name as a deprecated alias of it; v0.5.23 dropped the alias, and
    # the old name fails as ambiguous with -decode/-prefill). The LoRA flags are unchanged in v0.5.23.
    # config_variant qwen38-gpu2-coloc-fa3-m96-prio-v0523.
    command: >
      sglang serve
      --trust-remote-code
      --model-path Qwen/Qwen3.8-27B-FP8
      --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
      --served-model-name Qwen/Qwen3.8-27B
      --tp 1
      --mem-fraction-static 0.50
      --attention-backend fa3
      --mm-attention-backend fa3
      --chunked-prefill-size 4096
      --max-prefill-tokens 4096
      --max-mamba-cache-size 96
      --enable-priority-scheduling
      --disable-priority-preemption
      --max-running-requests 32
      --max-queued-requests 64
      --cuda-graph-max-bs-decode 32
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --enable-lora
      --lora-paths Qwen/Qwen3.8-27B-abliterated=/adapters/abliterated
      --max-loras-per-batch 2
      --max-lora-rank 1
      --port 8000
      --host 0.0.0.0
      --enable-cache-report
      --enable-metrics
      --log-requests-level 0
    # No PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True here. SGLang hands
    # tensors between its processes over CUDA IPC, which under expandable
    # segments needs pidfd_getfd; the container may not call it, and the engine
    # crashed on its first request on gpu23 (2026-10-23).
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - VLLM_LOGGING_LEVEL=INFO
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OPENBLAS_L2_SIZE=2097152
      - NCCL_DEBUG=WARN
      # /health answers without a 1-token generation. That generation queues behind
      # long prefills and fails the proxy's 3 s probe on a busy engine (as GLM-5.3, #274).
      - SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION=0
    volumes:
      - hugginface_cache:/root/.cache/huggingface
      - qwen38_coloc_kernel_cache:/root/.cache/sglang
      - lora_adapter:/adapters:ro
    depends_on:
      model-downloader-qwen38:
        condition: service_completed_successfully
      qwen38-lora-adapter-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang","service":"sglang","tags":["model:Qwen/Qwen3.8-27B-FP8","served_model:Qwen/Qwen3.8-27B","model_revision:017b9c7af6b5689d5dd426a76e0bc077eb5ca20a","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000","instance:0","gpu_pair:2","config_variant:qwen38-gpu2-coloc-fa3-m96-prio-v0523","quantization:fp8","lora:abliterated-r1","sglang_revision:0.5.23-near-secure","engine_image:6de632a5e942"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "sglang"
      nearai.otel.service: "sglang"
      nearai.otel.source: "sglang"
      nearai.otel.container_name: "model-sg-qwen38-27b-fp8-tp1-coloc"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "Qwen/Qwen3.8-27B-FP8"
      nearai.otel.served_model: "Qwen/Qwen3.8-27B"
      nearai.otel.model_revision: "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
      nearai.otel.deployment: "small-models"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"
      nearai.otel.instance: "0"
      nearai.otel.gpu_pair: "2"
      nearai.otel.config_variant: "qwen38-gpu2-coloc-fa3-m96-prio-v0523"
      nearai.otel.quantization: "fp8"
      nearai.otel.chunk_size: "4096"
      nearai.otel.max_prefill_tokens: "4096"
      nearai.otel.mixed_chunk: "0"
      nearai.otel.mem_fraction_static: "0.50"
      nearai.otel.max_mamba_cache_size: "96"
      nearai.otel.max_running_requests: "32"
      nearai.otel.max_queued_requests: "64"
      nearai.otel.sglang_revision: "0.5.23-near-secure"
      nearai.otel.engine_image: "6de632a5e942"

  nginx-qwen38:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: nginx-qwen38
    depends_on:
      - proxy-qwen38-27b
    command: /bin/sh -c 'cert=/etc/letsencrypt/live/completions.near.ai/fullchain.pem; last=$$(stat -L -c %Y "$$cert" 2>/dev/null); while :; do sleep 60; cur=$$(stat -L -c %Y "$$cert" 2>/dev/null); if [ -n "$$cur" ] && [ "$$cur" != "$$last" ]; then last=$$cur; echo "$$cert changed, reloading nginx"; nginx -s reload; fi; done & while :; do sleep 6h; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - certs:/etc/letsencrypt:ro
    configs:
      - source: nginx_qwen38_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0644
    restart: unless-stopped
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"nginx","tags":["model:Qwen/Qwen3.8-27B","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8000"]}]'

  # Started only when explicitly selected (compose/up services=[qwen38-registrar])
  # so the replica can be qualified on its host route before it is advertised.
  # Its TERM handler withdraws only HOST_IP:8000.
  qwen38-registrar:
    image: curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
    container_name: qwen38-registrar
    entrypoint: ["sh", "/register.sh"]
    restart: unless-stopped
    profiles: [register-qwen38]
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(cat /tmp/registrar_alive 2>/dev/null || echo 0) )) -lt 180 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1200s
    environment:
      - HOST_IP=${HOST_IP}
      - HTTP_PORT=8000
      - TLS_PORT_QWEN38=8001
      - MODEL_PROXY_TOKEN=${MODEL_PROXY_TOKEN}
      - PROXY_TOKEN=${PROXY_TOKEN}
    configs:
      - source: qwen38_registrar_script
        target: /register.sh
        mode: 0755
    logging: *logging-conf
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-proxy-registrar","service":"model-proxy-registrar","tags":["model:Qwen/Qwen3.8-27B","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  qwen38-lora-adapter-downloader:
    <<: *downloader-common
    container_name: qwen38-lora-adapter-downloader
    command:
      - |
        set -eu
        python3 - <<'PY'
        import hashlib
        import os
        from pathlib import Path
        from urllib.request import urlopen

        base = 'https://raw.githubusercontent.com/nearai/cvm-compose-files/main/adapters/qwen38-27b-abliterated-r1'
        files = {
            'adapter_model.safetensors': '3dd325373e6ad720196ce6d30a5d7302d245da87ec45362c95ffcc60a36eb934',
            'adapter_config.json': 'c2f78fe464c7c24d742e20d0fab6477647f848525736d2e5661f5bb4c66d0faf',
        }
        target = Path('/adapters/abliterated')
        target.mkdir(parents=True, exist_ok=True)
        for name, expected in files.items():
            with urlopen(f'{base}/{name}', timeout=60) as response:
                content = response.read()
            actual = hashlib.sha256(content).hexdigest()
            if actual != expected:
                raise SystemExit(f'{name}: SHA-256 mismatch')
            temporary = target / f'{name}.tmp'
            temporary.write_bytes(content)
            os.replace(temporary, target / name)
        PY
    volumes:
      - lora_adapter:/adapters
    labels:
